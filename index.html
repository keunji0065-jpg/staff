<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202124">
    <title>엠버 직원용 시스템</title>

    <script>
        window.addEventListener('error', function(e) {
            if (!e.message || e.message === 'Script error.' || (e.filename && e.filename.includes('google.com'))) {
                e.preventDefault();
                return true;
            }
        }, true);
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo/nanumsquareneo.css");
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'NanumSquareNeo', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        #root { height: 100%; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // 🛡️ 타 업체 및 직원의 무단 소스코드 열람/저장 방지 가드 (우클릭, F12, Ctrl+Shift+I/J/C, Ctrl+U)
        if (typeof window !== 'undefined') {
            window.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
            window.addEventListener('keydown', (e) => {
                const key = String(e.key || '').toLowerCase();
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) ||
                    (e.ctrlKey && key === 'u') ||
                    (e.metaKey && e.altKey && (key === 'i' || key === 'j' || key === 'u'))
                ) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }, true);
        }

        // 버전 관리 규칙: 소수점 뒷자리가 99를 넘으면 앞자리가 +1 증가 (예: v2.99 -> v3.00)
        const VERSION_STEP = 334; // 334 => v3.34
        const APP_VERSION = `v${Math.floor(VERSION_STEP / 100)}.${String(VERSION_STEP % 100).padStart(2, '0')}`;
        const LAST_MODIFIED_DATE = "2026.10.24";
        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbx_kCIKu48TAyTmxSv0lu_DUk-rPeth_v0dDf9QCDC03cHEX43Zd3inDJ3Q6cFv87Q/exec';
        const DEFAULT_STAFF_SHEET_ID = '1sM5bkDqEjD6Kpxu2yoJe2aiMuqpcWLMAIGpY3iL5_x8';
        const DEFAULT_MASTER_SHEET_ID = '1B8SBMX18_Px1CpRHuDTxqodqudiTrf6NfVoptjHtnGQ';
        const DEFAULT_DEP_SHEET_ID = '14bx2HMd_NID3zQN-Hb0x0At2Qmti7-p1Zfx1ZadNScY';
        const STAFF_LOCAL_STORE_KEY = 'ember_staff_independent_store_v1';
        const STAFF_LOCAL_DIRTY_TIME_KEY = 'ember_staff_dirty_ts_v1';
        const STAFF_CS_DIRTY_TIME_KEY = 'ember_staff_cs_dirty_ts_v1';
        const STAFF_PASSCODE_CACHE_KEY = 'ember_staff_verified_pass_v1';

        const Icon = ({ name, className = "", weight = "regular", size = 15 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        const normalizeString = (str) => String(str || '').replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, '').toLowerCase();

        const normalizeHandleNick = (str) => {
            if (!str) return '';
            let s = String(str).trim();
            s = s.replace(/-[a-zA-Z0-9_]{1,10}$/, '');
            return normalizeString(s);
        };

        const stripZipcode = (str) => String(str || '').replace(/^\(\d{5}\)\s*/, '').trim();

        const fixPhoneNumber = (numStr) => {
            if (!numStr) return '';
            let cleaned = String(numStr).replace(/[^0-9]/g, '');
            if (cleaned.length === 10 && !cleaned.startsWith('0')) cleaned = '0' + cleaned;
            return cleaned;
        };

        const normalizePin4 = (val) => {
            if (val === undefined || val === null) return '';
            const digits = String(val).replace(/[^0-9]/g, '');
            if (!digits) return '';
            return digits.length < 4 ? digits.padStart(4, '0') : digits.slice(-4);
        };

        const copyToClipboard = (text) => {
            if (!text) return;
            const ta = document.createElement('textarea');
            ta.value = String(text);
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
        };

        const extractBroadcastDateScore = (tabName) => {
            const s = String(tabName || '').replace(/^주문_/, '').trim();
            if (!s) return 0;
            const fullMatch = s.match(/(?:20)?(\d{2})[./\-\s년]+(\d{1,2})[./\-\s월]+(\d{1,2})/);
            if (fullMatch) {
                const yy = parseInt(fullMatch[1], 10);
                const mm = parseInt(fullMatch[2], 10);
                const dd = parseInt(fullMatch[3], 10);
                if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
                    return (2000 + yy) * 10000 + mm * 100 + dd;
                }
            }
            const mdMatch = s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])[./\-\s월]+([0-2]?\d|3[01])(?:일|\b|\s|[^0-9])/);
            if (mdMatch) {
                const mm = parseInt(mdMatch[1], 10);
                const dd = parseInt(mdMatch[2], 10);
                return 2026 * 10000 + mm * 100 + dd;
            }
            return 0;
        };

        const pickRowField = (row, keys, fallbackIdx = -1) => {
            if (!row || typeof row !== 'object') return '';
            for (let i = 0; i < keys.length; i++) {
                const k = keys[i];
                if (row[k] !== undefined && row[k] !== null && row[k] !== '') {
                    return row[k];
                }
            }
            const rowKeys = Object.keys(row).filter(rk => !/^col_\d+$/.test(rk));
            for (let i = 0; i < keys.length; i++) {
                const targetNorm = normalizeString(keys[i]);
                const foundKey = rowKeys.find(rk => normalizeString(rk) === targetNorm || normalizeString(rk).includes(targetNorm));
                if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null && row[foundKey] !== '') {
                    return row[foundKey];
                }
            }
            if (fallbackIdx >= 0 && row[`col_${fallbackIdx}`] !== undefined && row[`col_${fallbackIdx}`] !== null && row[`col_${fallbackIdx}`] !== '') {
                return row[`col_${fallbackIdx}`];
            }
            return '';
        };

        const cleanMemoText = (memoVal, addrVal) => {
            const m = String(memoVal || '').trim();
            const a = String(addrVal || '').trim();
            if (!m) return '';
            if (a && (m === a || normalizeString(m) === normalizeString(a))) return '';
            if (a && a.length >= 6 && (a.includes(m) || m.includes(a))) return '';
            if (/^\(\d{5}\)/.test(m)) return '';
            return m;
        };

        const getCleanSheetId = (idOrUrl) => {
            if (!idOrUrl) return '';
            const m = String(idOrUrl).match(/\/d\/([a-zA-Z0-9-_]+)/);
            return m ? m[1] : String(idOrUrl).trim();
        };

        // 구글 시트 탭 이름에서 '의 사본', '사본' 등을 깔끔하게 제거한 표시용 방송명 반환
        const cleanDisplayTabName = (tabName) => {
            return String(tabName || '')
                .replace(/^주문_/, '')
                .replace(/\s*의\s*사본(\s*\d*)?$/i, '')
                .replace(/^사본\s*-\s*/i, '')
                .trim();
        };

        // 구글 시트 공개/공유 문서에서 앱스 스크립트가 막혀도 브라우저가 직접 시트 탭(또는 첫 번째 통합 시트 gid=0)을 읽어오는 직통 함수 (JSONP)
        const fetchGoogleSheetDirect = (sheetId, sheetName = null) => {
            return new Promise((resolve) => {
                let settled = false;
                const cbName = `gviz_cb_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
                const timer = setTimeout(() => {
                    if (!settled) {
                        settled = true;
                        window[cbName] = () => {};
                        resolve(null);
                    }
                }, 6000);

                window[cbName] = (res) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    window[cbName] = () => {};
                    if (!res || res.status === 'error' || !res.table) {
                        resolve(null);
                        return;
                    }
                    const cols = (res.table.cols || []).map((c, idx) => String(c?.label || '').trim() || `col_${idx}`);
                    const rows = (res.table.rows || []).map(r => {
                        const obj = {};
                        (r.c || []).forEach((cell, idx) => {
                            const val = cell ? (cell.f !== undefined && cell.f !== null ? String(cell.f) : (cell.v !== undefined && cell.v !== null ? String(cell.v) : '')) : '';
                            const colKey = cols[idx] || `col_${idx}`;
                            obj[colKey] = val;
                            obj[`col_${idx}`] = val;
                        });
                        return obj;
                    });
                    resolve(rows);
                };

                try {
                    const script = document.createElement('script');
                    const sheetParam = sheetName ? `&sheet=${encodeURIComponent(sheetName)}` : `&gid=0`;
                    script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${cbName}${sheetParam}&headers=1&t=${Date.now()}`;
                    script.onerror = () => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            window[cbName] = () => {};
                            resolve(null);
                        }
                    };
                    document.body.appendChild(script);
                    setTimeout(() => { try { if (script.parentNode) script.parentNode.removeChild(script); } catch (e) {} }, 7000);
                } catch (err) {
                    if (!settled) {
                        settled = true;
                        clearTimeout(timer);
                        resolve(null);
                    }
                }
            });
        };

        // ✨ 한 시트 안에 아래쪽으로 쭉 쌓여있는 여러 방송 주문들(___WORKSPACE___ 구분 행 기준)을 방송일+이름별로 자동 분리하는 함수!
        const parseRowsIntoBroadcastBlocks = (rowsArray, defaultTabName = '') => {
            const blocks = {};
            let curBName = cleanDisplayTabName(defaultTabName) || '기본방송';
            let curMeta = { fThresh: 70000, dShip: 4000, cRate: 10 };

            const ensureBlock = (bName, meta) => {
                const cleanB = cleanDisplayTabName(bName) || '기본방송';
                if (!blocks[cleanB]) {
                    blocks[cleanB] = {
                        broadcastName: cleanB,
                        freeShipThreshold: meta.fThresh,
                        defaultShipping: meta.dShip,
                        cardFeeRate: meta.cRate,
                        groupsMap: {}
                    };
                }
                return blocks[cleanB];
            };

            (rowsArray || []).forEach((row, idx) => {
                let nick = '', prod = '', qtyVal = 1, priceVal = 0, shipVal = '', depVal = 0;
                let cardRaw = '', realname = '', phone = '', address = '', memo = '';
                let vipRaw = '', noShowRaw = '', waitStr = '', pinRaw = '', confirmRaw = '', depJsonRaw = '', trkRaw = '';

                if (Array.isArray(row)) {
                    const col9Str = String(row[9] || '').trim();
                    const isCol9Zip = /^\(\d{5}\)$/.test(col9Str) || /^\d{5}$/.test(col9Str);
                    const hasZipCol = row.length >= 19 || isCol9Zip;
                    nick = String(row[0] || '').trim();
                    prod = String(row[1] || '').trim();
                    qtyVal = row[2];
                    priceVal = row[3];
                    shipVal = row[4];
                    depVal = row[5];
                    cardRaw = String(row[6] || '').trim();
                    realname = String(row[7] || '').trim();
                    phone = String(row[8] || '').trim();
                    address = stripZipcode(row[hasZipCol ? 10 : 9] || '');
                    memo = String(row[hasZipCol ? 11 : 10] || '').trim();
                    vipRaw = String(row[hasZipCol ? 12 : 11] || '').trim();
                    noShowRaw = String(row[hasZipCol ? 13 : 12] || '').trim();
                    waitStr = String(row[hasZipCol ? 14 : 13] || '').trim();
                    pinRaw = String(row[hasZipCol ? 15 : 14] || '').trim();
                    confirmRaw = String(row[hasZipCol ? 16 : 15] || '').trim();
                    depJsonRaw = String(row[hasZipCol ? 17 : 16] || '').trim();
                    trkRaw = String(row[hasZipCol ? 18 : 17] || '').trim();
                } else if (row && typeof row === 'object') {
                    nick = String(pickRowField(row, ['닉네임', '주문자', '고객명', 'nickname', 'customer'], 0)).trim();
                    prod = String(pickRowField(row, ['상품명', '품목', '제품명', 'product', 'name'], 1)).trim();
                    qtyVal = pickRowField(row, ['수량', '개수', 'qty', 'quantity'], 2);
                    priceVal = pickRowField(row, ['단가(제품금액)', '제품금액', '단가', '금액', '가격', 'price'], 3);
                    shipVal = pickRowField(row, ['배송비', '택배비', 'shipping'], 4);
                    depVal = pickRowField(row, ['입금액', '입금', 'deposit'], 5);
                    cardRaw = String(pickRowField(row, ['카드결제', '카드', 'card'], 6)).trim();
                    realname = String(pickRowField(row, ['수령인명', '수령인', '이름', '성명', 'realname'], 7)).trim();
                    phone = String(pickRowField(row, ['연락처', '전화번호', '핸드폰번호', 'phone'], 8)).trim();

                    // J열이 '우편번호'이고 K열이 '주소'인 시트와 J열이 바로 '주소'인 시트를 모두 완벽하게 자동 판별!
                    let rawAddrCandidate = String(pickRowField(row, ['주소', '배송지', 'address'], -1)).trim();
                    const col9Val = String(row.col_9 || '').trim();
                    const col10Val = String(row.col_10 || '').trim();
                    const isCol9Zip = /^\(\d{5}\)$/.test(col9Val) || /^\d{5}$/.test(col9Val);
                    if (!rawAddrCandidate || /^\(\d{5}\)$/.test(rawAddrCandidate) || /^\d{5}$/.test(rawAddrCandidate)) {
                        rawAddrCandidate = isCol9Zip ? col10Val : (col9Val || col10Val);
                    }
                    address = stripZipcode(rawAddrCandidate);

                    const shifted = isCol9Zip ? 1 : 0;
                    memo = String(pickRowField(row, ['요청사항', '배송메모', '메모', 'memo'], 10 + shifted)).trim();
                    vipRaw = String(pickRowField(row, ['VIP여부', 'VIP'], 11 + shifted)).trim();
                    noShowRaw = String(pickRowField(row, ['노쇼여부', '노쇼'], 12 + shifted)).trim();
                    waitStr = String(pickRowField(row, ['대기여부', '대기'], 13 + shifted)).trim();
                    pinRaw = String(pickRowField(row, ['비밀번호', '비번', 'pin'], 14 + shifted)).trim();
                    confirmRaw = String(pickRowField(row, ['주문확인', '확인'], 15 + shifted)).trim();
                    depJsonRaw = String(pickRowField(row, ['입금내역JSON', '입금내역'], 16 + shifted)).trim();
                    trkRaw = String(pickRowField(row, ['송장번호', '운송장번호', '송장'], 17 + shifted)).trim();
                }

                memo = cleanMemoText(memo, address);

                // ✨ 시트 중간이나 제일 하단(몇 번째 줄이든 상관없이!)에 붙여넣은 방송 구분선 줄을 100% 인식!
                // 1) A열에 ___WORKSPACE_META___ 가 있거나,
                // 2) A열이 비어있더라도 B열에 방송명이 있고 수령인/연락처/주소가 모두 비어있는 메타 행이면 무조건 새 방송 블록 시작점으로 인식!
                const isImplicitWorkspaceMeta = (
                    !nick &&
                    prod &&
                    prod !== '상품명' &&
                    prod !== '품목' &&
                    !realname &&
                    !phone &&
                    !address &&
                    (Number(qtyVal) >= 10000 || Number(priceVal) === 4000 || Number(priceVal) === 3000 || Number(shipVal) === 10 || Number(depVal) === 0)
                );
                if (nick.startsWith('___WORKSPACE') || isImplicitWorkspaceMeta) {
                    if (prod) {
                        curBName = cleanDisplayTabName(prod);
                    } else if (defaultTabName && !['메인주문', '주문', '주문통합', '시트1', 'Sheet1'].includes(cleanDisplayTabName(defaultTabName))) {
                        curBName = cleanDisplayTabName(defaultTabName);
                    }
                    curMeta = {
                        fThresh: Number(qtyVal) > 0 ? Number(qtyVal) : 70000,
                        dShip: (priceVal !== '' && Number(priceVal) >= 0) ? Number(priceVal) : 4000,
                        cRate: Number(shipVal) > 0 ? Number(shipVal) : 10
                    };
                    ensureBlock(curBName, curMeta);
                    return;
                }

                if (!nick || nick === '닉네임' || nick === '주문자') return;

                const blk = ensureBlock(curBName, curMeta);
                const gMap = blk.groupsMap;

                if (!gMap[nick]) {
                    let cardMode = 'none';
                    const cardOnlyStr = cardRaw.replace(/현영완료|현영요청|현영/g, '').replace(/\//g, '').trim();
                    if (cardOnlyStr.includes('완료')) cardMode = 'completed';
                    else if (cardOnlyStr.startsWith('O') || cardOnlyStr.includes('카드') || cardOnlyStr === 'true') cardMode = 'requested';

                    let cashReceiptMode = 'none';
                    if (cardRaw.includes('현영완료')) cashReceiptMode = 'completed';
                    else if (cardRaw.includes('현영')) cashReceiptMode = 'requested';

                    let parsedDeposits = [];
                    if (depJsonRaw) {
                        try {
                            const p = JSON.parse(depJsonRaw);
                            if (Array.isArray(p)) parsedDeposits = p;
                        } catch (e) {}
                    }

                    const cleanShipNum = shipVal !== '' && shipVal !== undefined ? Number(String(shipVal).replace(/[^0-9.-]/g, '')) : blk.defaultShipping;

                    gMap[nick] = {
                        nick: nick,
                        realname: realname,
                        phone: fixPhoneNumber(phone),
                        address: address,
                        memo: memo,
                        shipping: isNaN(cleanShipNum) ? blk.defaultShipping : cleanShipNum,
                        deposit: 0,
                        cardMode: cardMode,
                        cashReceiptMode: cashReceiptMode,
                        isVip: vipRaw === 'O' || vipRaw === 'true',
                        isNoShow: noShowRaw === 'O' || noShowRaw === 'true',
                        isConfirmed: confirmRaw === 'O' || confirmRaw === 'true',
                        pin: normalizePin4(pinRaw),
                        trackingNumber: String(trkRaw || '').replace(/^'+/, '').trim(),
                        deposits: parsedDeposits,
                        showDeposits: false,
                        items: []
                    };
                } else {
                    if (!gMap[nick].realname && realname) gMap[nick].realname = realname;
                    if (!gMap[nick].phone && phone) gMap[nick].phone = fixPhoneNumber(phone);
                    if (!gMap[nick].address && address) gMap[nick].address = address;
                    if (!gMap[nick].memo && memo) gMap[nick].memo = memo.replace(/\[현영완료\]|\[현영요청\]|\[현영\]/g, '').trim();
                    if (!gMap[nick].trackingNumber && trkRaw) gMap[nick].trackingNumber = String(trkRaw).replace(/^'+/, '').trim();
                    if ((!gMap[nick].cashReceiptMode || gMap[nick].cashReceiptMode === 'none') && (cardRaw.includes('현영') || memo.includes('[현영'))) {
                        gMap[nick].cashReceiptMode = (cardRaw.includes('현영완료') || memo.includes('[현영완료]')) ? 'completed' : 'requested';
                    }
                }

                const depNum = Number(String(depVal || '0').replace(/[^0-9.-]/g, '')) || 0;
                if (depNum > 0) gMap[nick].deposit += depNum;

                const isWait = waitStr === 'O' || waitStr.includes('대기');
                const waitMatch = waitStr.match(/(\d+)/);
                const waitlistOrder = waitMatch ? Number(waitMatch[1]) : (isWait ? 1 : 0);

                if (prod) {
                    gMap[nick].items.push({
                        id: `item_${Date.now()}_${idx}_${Math.random()}`,
                        product: prod,
                        qty: Number(String(qtyVal || '1').replace(/[^0-9.-]/g, '')) || 1,
                        price: Number(String(priceVal || '0').replace(/[^0-9.-]/g, '')) || 0,
                        isWaitlist: isWait,
                        waitlistOrder: waitlistOrder
                    });
                }
            });

            const finalBlocks = {};
            Object.entries(blocks).forEach(([bName, bVal]) => {
                const groupsArr = Object.values(bVal.groupsMap);
                if (groupsArr.length > 0) {
                    finalBlocks['주문_' + bName] = {
                        broadcastName: bName,
                        freeShipThreshold: bVal.freeShipThreshold,
                        defaultShipping: bVal.defaultShipping,
                        cardFeeRate: bVal.cardFeeRate,
                        updatedAt: Date.now(),
                        groups: groupsArr
                    };
                }
            });
            return finalBlocks;
        };

        let staffFbDb = null;
        try {
            const fbConfig = {
                apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",
                authDomain: "my-live-shop.firebaseapp.com",
                databaseURL: "https://my-live-shop-default-rtdb.firebaseio.com",
                projectId: "my-live-shop",
                storageBucket: "my-live-shop.firebasestorage.app",
                messagingSenderId: "598748133843",

        const syncBroadcastGroupsToFirebase = (bNameRaw, groupsList, fThresh = 70000, cRate = 10, creditsMap = {}, sourceRole = 'staff') => {
            if (!staffFbDb || !bNameRaw || !Array.isArray(groupsList)) return;
            try {
                const cleanB = String(bNameRaw).replace(/^주문_/, '').trim();
                const safeBKey = cleanB.replace(/[.#$\[\]\/]/g, '_');
                const portalCustomers = groupsList.map(g => {
                    const cleanPh = fixPhoneNumber(g.phone || '');
                    const pin4 = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                    const cleanAddr = stripZipcode(g.address || '');
                    const baseCardStr = g.cardMode === 'completed' ? `카드완료(${cRate}%)` : (g.cardMode === 'requested' ? `O(${cRate}%)` : '');
                    const cashStr = g.cashReceiptMode === 'completed' ? '현영완료' : (g.cashReceiptMode === 'requested' ? '현영요청' : '');
                    const cardStr = [baseCardStr, cashStr].filter(Boolean).join(' / ');
                    const custCred = Number(creditsMap?.[g.nick] ?? g.credit ?? 0) || 0;
                    const activeItems = (g.items || []).filter(i => !i.isWaitlist);
                    const prodForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);
                    let computedShip = 0;
                    if (activeItems.length > 0 && prodForShip > 0 && !g.isVip) {
                        if (g.shipping !== undefined && g.shipping !== null && g.shipping !== '' && !isNaN(Number(g.shipping))) {
                            // 시트 E열(배송비)에 기록된 값(4000, 7000, 0 등)을 최우선으로 그대로 유지!
                            computedShip = Number(g.shipping);
                        } else {
                            const isJeju = Boolean(cleanAddr && cleanAddr.includes('제주'));
                            const isFreeShip = Number(fThresh) > 0 && prodForShip >= Number(fThresh);
                            computedShip = (isFreeShip ? 0 : 4000) + (isJeju ? 3000 : 0);
                        }
                    }
                    return {
                        sheetTabName: '주문_' + cleanB,
                        nickname: g.nick,
                        phoneLast4: pin4,
                        broadcastName: cleanB,
                        isVip: Boolean(g.isVip),
                        isNoShow: Boolean(g.isNoShow),
                        credit: custCred,
                        freeShippingThreshold: Number(fThresh) || 70000,
                        cardFeeRate: Number(cRate) || 10,
                        isCard: cardStr,
                        cashReceipt: g.cashReceiptMode || 'none',
                        shipping: computedShip,
                        depositTotal: Number(g.deposit) || 0,
                        deposits: Array.isArray(g.deposits) ? g.deposits : [],
                        items: (g.items || []).map((it, idx) => ({
                            id: idx + 1,
                            product: it.product || '',
                            qty: Number(it.qty) || 1,
                            price: Number(it.price) || 0,
                            isWaitlist: Boolean(it.isWaitlist),
                            waitlistOrder: Number(it.waitlistOrder) || 0
                        })),
                        address: (cleanAddr || g.realname) ? {
                            realname: g.realname || '',
                            phone: cleanPh,
                            zipcode: '',
                            baseAddress: cleanAddr,
                            detailAddress: '',
                            memo: g.memo || '',
                            updatedAt: ''
                        } : null,
                        trackingNumbers: g.trackingNumber ? [g.trackingNumber] : [],
                        isConfirmed: Boolean(g.isConfirmed)
                    };
                });
                staffFbDb.ref(`ember_live_data/_portal_orders/${safeBKey}`).set({
                    broadcastName: cleanB,
                    updatedAt: Date.now(),
                    updatedBy: sourceRole,
                    staffPriority: true,

                }).catch(() => {});
            } catch (e) {}
        };

        const fetchGas = async (url, payload = null, timeoutMs = 25000) => {
            const attemptFetch = async () => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                const options = { method: payload ? 'POST' : 'GET', redirect: "follow", signal: controller.signal };
                if (payload) {
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                    options.body = JSON.stringify(payload);
                }
                try {
                    const res = await fetch(url, options);
                    clearTimeout(timer);
                    const text = await res.text();
                    return JSON.parse(text);
                } catch (err) {
                    clearTimeout(timer);
                    throw err;
                }
            };
            try {
                return await attemptFetch();
            } catch (firstErr) {
                try {
                    await new Promise(r => setTimeout(r, 400));
                    return await attemptFetch();
                } catch (secondErr) {
                    // POST 저장 시 CORS 리다이렉트로 응답 읽기만 실패한 경우 no-cors 폴백으로 시트 기록 보장!
                    if (payload) {
                        try {
                            await fetch(url, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify(payload)
                            });
                            return { status: 'success', success: true, fallbackNoCors: true };
                        } catch (noCorsErr) {}
                    }
                    return { status: 'error', message: secondErr.message || '통신 실패' };
                }
            }
        };

                                            className={`px-2 py-2 rounded-lg font-extrabold text-[11px] shrink-0 border transition ${
                                                convertedToCredit
                                                    ? 'bg-teal-600 text-white border-teal-700'
                                                    : 'bg-teal-50 text-teal-700 border-teal-300 hover:bg-teal-100'

                                            title="환불금을 고객의 보유 적립금으로 전환합니다"

            );
        };

        // CS 메모 문자열에서 [계좌: ...], [환불액: ...], [환불완료], [적립금전환완료] 태그나 '/ 은행명 계좌번호' 형태를 깔끔하게 분리/병합하는 헬퍼
        const splitCsMemoAndAccount = (rawMemoStr) => {
            let raw = String(rawMemoStr || '').trim();
            if (!raw) return { memoOnly: '', accountOnly: '', refundAmount: 0, refundCompleted: false, convertedToCredit: false };

            let refundCompleted = false;
            let convertedToCredit = false;
            if (raw.includes('[적립금전환완료]')) {
                refundCompleted = true;
                convertedToCredit = true;
                raw = raw.replace(/\[적립금전환완료\]/g, '').trim();
            }
            if (raw.includes('[환불완료]')) {
                refundCompleted = true;
                raw = raw.replace(/\[환불완료\]/g, '').trim();
            }

            let refundAmount = 0;
            const amtMatch = raw.match(/\[환불액:\s*([0-9,]+)\]/);
            if (amtMatch) {
                refundAmount = Number(amtMatch[1].replace(/[^0-9]/g, '')) || 0;
                raw = raw.replace(amtMatch[0], '').trim();
            }

            const tagMatch = raw.match(/\[계좌:\s*([^\]]+)\]/);
            if (tagMatch) {
                const accountOnly = tagMatch[1].trim();
                const memoOnly = raw.replace(tagMatch[0], '').trim();
                return { memoOnly, accountOnly, refundAmount, refundCompleted, convertedToCredit };
            }
            const slashBankMatch = raw.match(/^(.*?)\s*\/\s*((?:카카오|카뱅|농협|국민|신한|우리|하나|기업|토스|우체국|새마을|신협|수협|부산|대구|경남|광주|전북|제주|케이|씨티|SC).*)$/);
            if (slashBankMatch) {
                return { memoOnly: slashBankMatch[1].trim(), accountOnly: slashBankMatch[2].trim(), refundAmount, refundCompleted, convertedToCredit };
            }
            return { memoOnly: raw, accountOnly: '', refundAmount, refundCompleted, convertedToCredit };
        };

        const combineCsMemoAndAccount = (memoOnly, accountOnly, refundAmount = 0, refundCompleted = false, convertedToCredit = false) => {
            const parts = [];
            const m = String(memoOnly || '').trim();
            const a = String(accountOnly || '').trim();
            const rAmt = Number(String(refundAmount || '0').replace(/[^0-9]/g, '')) || 0;
            if (m) parts.push(m);
            if (a) parts.push(`[계좌: ${a}]`);
            if (rAmt > 0) parts.push(`[환불액: ${rAmt}]`);
            if (convertedToCredit) parts.push(`[적립금전환완료]`);
            else if (refundCompleted) parts.push(`[환불완료]`);
            return parts.join(' ');
        };

        // ✨ 고객용 포털에 미송/교환/반품 내역을 실시간 동기화하는 함수 (보안: 직원용 csMemo는 절대 전송하지 않음!)
        const syncCsGroupsToFirebase = (csList) => {
            if (!staffFbDb || !Array.isArray(csList)) return;
            try {
                const publicCsList = csList.map(c => {
                    const parsedMemo = splitCsMemoAndAccount(c.csMemo);
                    const accOnly = c.refundAccount !== undefined ? c.refundAccount : parsedMemo.accountOnly;
                    const autoRetSum = (c.items || []).filter(x => x.csTag === '반품').reduce((s, x) => s + (Number(x.price) || 0), 0);
                    const finalRefAmt = (c.refundAmount !== undefined && c.refundAmount !== '')
                        ? Number(c.refundAmount)
                        : (parsedMemo.refundAmount > 0 ? parsedMemo.refundAmount : autoRetSum);
                    const finalRefDone = c.refundCompleted !== undefined ? Boolean(c.refundCompleted) : Boolean(parsedMemo.refundCompleted);
                    const finalCredConv = c.convertedToCredit !== undefined ? Boolean(c.convertedToCredit) : Boolean(parsedMemo.convertedToCredit);
                    const shipFee = Number(c.shipping) || 0;
                    const feePaid = c.csFeePaid !== undefined ? Boolean(c.csFeePaid) : (Number(c.deposit) > 0 && Number(c.deposit) >= shipFee);

                    // 고객에게 보여줄 대상 품목만 필터링 (미송/교환/반품 등 지정된 품목 위주, 만약 전체 정상으로 복사된 경우 전체 표시)
                    const taggedOnly = (c.items || []).filter(it => it.csTag && it.csTag !== '정상');
                    const displayItems = taggedOnly.length > 0 ? taggedOnly : (c.items || []);

                    return {
                        id: c.id,
                        createdAt: c.createdAt || '',
                        sourceBroadcast: cleanDisplayTabName(c.sourceBroadcast || ''),
                        csStatus: c.csStatus === '처리완료' ? '처리완료' : '미처리',
                        nick: c.nick || '',
                        realname: c.realname || '',
                        phone: fixPhoneNumber(c.phone || ''),
                        origTracking: c.origTracking || '',
                        csTracking: c.csTracking || '',
                        refundAccount: String(accOnly || '').trim(),
                        refundAmount: Number(finalRefAmt) || 0,
                        refundCompleted: finalRefDone || finalCredConv,
                        convertedToCredit: finalCredConv,
                        csFee: shipFee,
                        csFeePaid: feePaid,
                        items: displayItems.map(it => ({
                            product: it.product || '',
                            qty: Number(it.qty) || 1,
                            price: Number(it.price) || 0,
                            csTag: it.csTag || '정상'
                        }))
                        // ⚠️ csMemo(직원용 메모)는 의도적으로 제외하여 고객에게 절대 노출되지 않도록 완벽 차단!
                    };
                });

                staffFbDb.ref('ember_live_data/_portal_cs').set({
                    updatedAt: Date.now(),
                    items: publicCsList
                }).catch(() => {});
            } catch (e) {}
        };

        const StaffTrackingApp = () => {
            // 🔒 직원 전용 시트 ID로 완전 고정 (사장님 라이브 주문서 시트는 절대 열람하지 않음!)
            const activeGasUrl = DEFAULT_GAS_URL;
            const activeStaffSheetId = DEFAULT_STAFF_SHEET_ID;
            const activeDictSheetId = DEFAULT_MASTER_SHEET_ID; // 찐고객사전(주소록/적립금) 연동용

            // 🔒 직원 접속 비밀번호 상태 (새로고침할 때마다 무조건 다시 입력하도록 세션 캐시 제거!)
            const [requiredPasscode, setRequiredPasscode] = useState('1234');
            const [verifiedPasscode, setVerifiedPasscode] = useState('');
            const [passcodeInput, setPasscodeInput] = useState('');
            const [passcodeError, setPasscodeError] = useState('');

            useEffect(() => {
                if (!staffFbDb) return;
                const passRef = staffFbDb.ref('ember_live_data/_global_config/staffAccessPasscode');
                const handlePassChange = (snap) => {
                    const val = snap.val();
                    if (val !== undefined && val !== null && String(val).trim() !== '') {
                        setRequiredPasscode(String(val).trim());
                    }
                };
                passRef.on('value', handlePassChange);
                return () => passRef.off('value', handlePassChange);
            }, []);

            const isAuthenticated = Boolean(verifiedPasscode && verifiedPasscode === requiredPasscode);

            const handlePasscodeSubmit = (e) => {
                e.preventDefault();
                const cleanIn = passcodeInput.trim();
                if (cleanIn === requiredPasscode) {
                    setVerifiedPasscode(cleanIn);
                    setPasscodeError('');
                } else {
                    setPasscodeError('비밀번호가 일치하지 않습니다. 사장님께 문의해 주세요.');
                }
            };

            const handleLockScreen = () => {
                setVerifiedPasscode('');
                setPasscodeInput('');
            };

            // 로컬 브라우저에 영구 보존되는 방송별 주문서 데이터 창고 (통신 렉 ZERO)
            const [localBroadcastStore, setLocalBroadcastStore] = useState(() => {
                try {
                    const saved = localStorage.getItem(STAFF_LOCAL_STORE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && typeof parsed === 'object') {
                            delete parsed['주문_10/24 라이브'];
                            delete parsed['10/24 라이브'];
                            return parsed;
                        }

                } catch (e) {}
                return {};
            });

            useEffect(() => {
                try { localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(localBroadcastStore)); } catch (e) {}
            }, [localBroadcastStore]);

            const [orderTabs, setOrderTabs] = useState([]);
            const [selectedTab, setSelectedTab] = useState('');
            const [broadcastName, setBroadcastName] = useState('');
            const [freeShipThreshold, setFreeShipThreshold] = useState(70000);

            const [cardFeeRate, setCardFeeRate] = useState(10);

            const [customerGroups, setCustomerGroups] = useState([]);
            const [csGroups, setCsGroups] = useState(() => {

            const [masterAddresses, setMasterAddresses] = useState(() => {

            const [customerCredits, setCustomerCredits] = useState({});

            const [globalKeyword, setGlobalKeyword] = useState('');

            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null, defaultValue: '' });
            const [addrEditTarget, setAddrEditTarget] = useState(null);
            const [csCopyTarget, setCsCopyTarget] = useState(null);
            const [cleanupModalOpen, setCleanupModalOpen] = useState(false);

            const [newNick, setNewNick] = useState('');
            const [showNewNickSuggest, setShowNewNickSuggest] = useState(false);
            const [newProd, setNewProd] = useState('');
            const [newQty, setNewQty] = useState(1);
            const [newPrice, setNewPrice] = useState('');

            // 🎥 직원용 라이브 주문서 전용 상태 (로컬 자동저장 적용으로 새로고침/탭 이동 시에도 절대 증발하지 않음!)
            const [sharedYtApiKey, setSharedYtApiKey] = useState(() => {

            const [liveOrderRows, setLiveOrderRows] = useState(() => {

            const [liveSortConfig, setLiveSortConfig] = useState({ field: 'time', dir: 'desc' }); // field: 'time' | 'nick' | 'product' | 'paid'
            const [liveAddrEditNick, setLiveAddrEditNick] = useState(null);

            const [activeSuggestRowId, setActiveSuggestRowId] = useState(null);
            const liveNextPageTokenRef = useRef('');
            const unsavedLiveChatsRef = useRef([]);

            // 라이브 주문서 작성 데이터 실시간 자동 로컬 백업 (창이 닫히거나 탭을 이동해도 100% 보존)
            useEffect(() => {
                try { localStorage.setItem('ember_staff_live_rows_v1', JSON.stringify(liveOrderRows)); } catch (e) {}
            }, [liveOrderRows]);
            useEffect(() => {
                try { localStorage.setItem('ember_staff_live_title_v1', liveBroadcastTitle); } catch (e) {}
            }, [liveBroadcastTitle]);
            useEffect(() => {
                try { localStorage.setItem('ember_staff_live_def_ship_v1', String(liveDefaultShip)); } catch (e) {}
            }, [liveDefaultShip]);
            useEffect(() => {
                try { localStorage.setItem('ember_staff_live_active_v1', String(isStaffLiveActive)); } catch (e) {}
            }, [isStaffLiveActive]);
            useEffect(() => {
                try { localStorage.setItem('ember_staff_live_yt_url_v1', liveYoutubeUrl); } catch (e) {}
            }, [liveYoutubeUrl]);

            const [trackingExcelRef] = [useRef(null)];
            const currentBroadcastRef = useRef('');
            const autoSaveOrdersTimerRef = useRef(null);
            const autoSaveCsTimerRef = useRef(null);
            const isOrdersSavingQueueRef = useRef(false);
            const pendingOrdersRowsRef = useRef(null);
            const isCsSavingQueueRef = useRef(false);
            const pendingCsListRef = useRef(null);
            const csGroupsRef = useRef(csGroups);
            const customerGroupsRef = useRef(customerGroups);
            const localBroadcastStoreRef = useRef(localBroadcastStore);

            useEffect(() => { csGroupsRef.current = csGroups; }, [csGroups]);
            useEffect(() => { customerGroupsRef.current = customerGroups; }, [customerGroups]);
            useEffect(() => { localBroadcastStoreRef.current = localBroadcastStore; }, [localBroadcastStore]);

            useEffect(() => {
                currentBroadcastRef.current = cleanDisplayTabName(broadcastName || selectedTab || '');
            }, [broadcastName, selectedTab]);

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2800);
            }, []);

            const openModal = useCallback((message, type = 'alert', onConfirm = null, defaultValue = '', title = '확인') => {
                setModal({ isOpen: true, title, message, type, onConfirm, defaultValue });
            }, []);

            // ✨ CS 내역(미송/교환/반품)을 절대 유실되지 않는 순차 대기열(Queue)을 통해 직원용 구글 시트('교환반품CS' 탭)와 고객 포털(Firebase)에 즉시 저장하는 전용 함수
            const flushCsQueueToSheet = useCallback(async () => {
                if (isCsSavingQueueRef.current) return;
                isCsSavingQueueRef.current = true;
                try {
                    while (pendingCsListRef.current !== null) {
                        const listToPush = pendingCsListRef.current;
                        pendingCsListRef.current = null;
                        const serializedCs = listToPush.map(c => ({
                            ...c,
                            csMemo: combineCsMemoAndAccount(c.csMemo, c.refundAccount, c.refundAmount, c.refundCompleted, c.convertedToCredit),
                            shipping: Number(c.shipping) || 0,
                            deposit: c.csFeePaid ? (Number(c.shipping) || Number(c.deposit) || 0) : 0
                        }));
                        await fetchGas(activeGasUrl, {
                            action: 'save_cs_orders',
                            masterId: activeStaffSheetId,
                            items: serializedCs
                        }, 15000);
                    }
                } catch (e) {} finally {
                    isCsSavingQueueRef.current = false;
                }
            }, [activeGasUrl, activeStaffSheetId]);

            const saveCsOrdersToSheetImmediate = useCallback((targetCsList, toastMessage = '') => {
                const listToSave = Array.isArray(targetCsList) ? targetCsList : csGroupsRef.current;
                csGroupsRef.current = listToSave;
                try {
                    localStorage.setItem('ember_staff_cs_groups_v1', JSON.stringify(listToSave));
                    localStorage.setItem(STAFF_CS_DIRTY_TIME_KEY, String(Date.now()));
                } catch (e) {}

                // 1) 고객 포털 클라우드(_portal_cs)에 0.01초 만에 즉시 동기화 및 알림 표시 (화면 멈춤 ZERO)
                syncCsGroupsToFirebase(listToSave);
                setHasUnsavedChanges(false);
                if (toastMessage) showToast(toastMessage);

                // 2) 직원용 구글 시트('교환반품CS' 탭) 대기열에 최신 리스트를 넣고 끝까지 순차 저장 보장!
                pendingCsListRef.current = listToSave;
                flushCsQueueToSheet();
            }, [flushCsQueueToSheet, showToast]);

            // CS 데이터(메모, 계좌번호, 송장 등) 타이핑 수정 시 0.5초 디바운스로 자동 시트 저장 예약
            const scheduleAutoSaveCs = useCallback((nextCsList, msg = '') => {
                csGroupsRef.current = nextCsList;
                try {
                    localStorage.setItem('ember_staff_cs_groups_v1', JSON.stringify(nextCsList));
                    localStorage.setItem(STAFF_CS_DIRTY_TIME_KEY, String(Date.now()));
                } catch (e) {}
                syncCsGroupsToFirebase(nextCsList);
                if (autoSaveCsTimerRef.current) clearTimeout(autoSaveCsTimerRef.current);
                autoSaveCsTimerRef.current = setTimeout(() => {
                    saveCsOrdersToSheetImmediate(nextCsList, msg);
                }, 500);
            }, [saveCsOrdersToSheetImmediate]);

            // 현재 화면에서 수정된 customerGroups를 로컬 방송 창고에도 자동 백업 (새로고침해도 절대 날아가지 않음)
            useEffect(() => {
                const cleanCur = cleanDisplayTabName(broadcastName || selectedTab || '');
                if (!cleanCur || customerGroups.length === 0) return;
                const tabKey = selectedTab || ('주문_' + cleanCur);
                setLocalBroadcastStore(prev => ({
                    ...prev,
                    [tabKey]: {
                        broadcastName: cleanCur,
                        freeShipThreshold,
                        defaultShipping,
                        cardFeeRate,
                        updatedAt: Date.now(),
                        groups: customerGroups
                    }
                }));
            }, [customerGroups, broadcastName, selectedTab, freeShipThreshold, defaultShipping, cardFeeRate]);

            const loadSheetOrders = useCallback(async (tabNameToLoad, forceFromServer = false) => {
                if (!tabNameToLoad) {
                    setIsLoading(false);
                    return;
                }
                const rawTabStr = String(tabNameToLoad).trim();
                const cleanBase = cleanDisplayTabName(rawTabStr);
                const canonicalTab = rawTabStr.startsWith('주문_') ? rawTabStr : ('주문_' + cleanBase);

                // 1순위: 로컬 창고에 이미 불러온 데이터가 있고 강제 서버 새로고침이 아니면 0.01초 만에 즉시 전환! (통신 렉 ZERO)
                if (!forceFromServer && localBroadcastStore[canonicalTab] && Array.isArray(localBroadcastStore[canonicalTab].groups) && localBroadcastStore[canonicalTab].groups.length > 0) {
                    const cached = localBroadcastStore[canonicalTab];
                    setBroadcastName(cleanBase);
                    setFreeShipThreshold(cached.freeShipThreshold || 70000);
                    setDefaultShipping(cached.defaultShipping || 4000);
                    setCardFeeRate(cached.cardFeeRate || 10);
                    setCustomerGroups(cached.groups);
                    setHasUnsavedChanges(false);
                    setIsLoading(false);
                    return;
                }

                setIsLoading(true);
                try {
                    // 1순위: 캐시 지연이 전혀 없는 실시간 앱스 스크립트(get_orders)로 '메인주문' 시트 원본을 즉시 읽기!
                    let parsedBlocks = {};
                    const res = await fetchGas(`${activeGasUrl}?action=get_orders&masterId=${activeStaffSheetId}&tabName=${encodeURIComponent('메인주문')}&t=${Date.now()}`, null, 12000);
                    const fetched = Array.isArray(res?.data) ? res.data : (Array.isArray(res?.orders) ? res.orders : []);
                    if (fetched.length > 0) {
                        parsedBlocks = parseRowsIntoBroadcastBlocks(fetched, '메인주문');
                    }

                    // 2순위 폴백: GAS 통신 실패 시에만 직통 리더 사용
                    if (Object.keys(parsedBlocks).length === 0) {
                        const directRows = await fetchGoogleSheetDirect(activeStaffSheetId, '메인주문');
                        if (Array.isArray(directRows) && directRows.length > 0) {
                            parsedBlocks = parseRowsIntoBroadcastBlocks(directRows, '메인주문');
                        }
                    }

                    const blockKeys = Object.keys(parsedBlocks);
                    if (blockKeys.length > 0) {
                        setLocalBroadcastStore(prev => ({ ...prev, ...parsedBlocks }));
                        const targetBlk = parsedBlocks[canonicalTab] || parsedBlocks[blockKeys[0]];
                        setBroadcastName(targetBlk.broadcastName);
                        setFreeShipThreshold(targetBlk.freeShipThreshold);
                        setDefaultShipping(targetBlk.defaultShipping);
                        setCardFeeRate(targetBlk.cardFeeRate);
                        setCustomerGroups(targetBlk.groups);
                    } else {
                        setBroadcastName(cleanBase);
                        setCustomerGroups([]);
                    }
                    setHasUnsavedChanges(false);
                } catch (e) {
                    showToast('주문서 로드 중 오류가 발생했습니다.');
                } finally {
                    setIsLoading(false);
                }
            }, [activeGasUrl, activeStaffSheetId, localBroadcastStore, showToast]);

            const loadCsOrders = useCallback(async () => {
                try {
                    const res = await fetchGas(`${activeGasUrl}?action=get_cs_orders&masterId=${activeStaffSheetId}&t=${Date.now()}`);
                    let rawList = Array.isArray(res?.data) ? res.data : [];

                    // 만약 '교환반품CS의 사본'으로 복사되어 있어서 기본 조회가 비어있다면 사본 시트 및 직통 리더까지 확인!
                    if (rawList.length === 0) {
                        for (const csTabName of ['교환반품CS', '교환반품CS의 사본', '교환반품CS 의 사본']) {
                            const resCopy = await fetchGas(`${activeGasUrl}?action=get_orders&masterId=${activeStaffSheetId}&tabName=${encodeURIComponent(csTabName)}&t=${Date.now()}`, null, 10000);
                            if (Array.isArray(resCopy?.data) && resCopy.data.length > 0) {
                                rawList = resCopy.data;
                                break;
                            }
                            const directCs = await fetchGoogleSheetDirect(activeStaffSheetId, csTabName);
                            if (Array.isArray(directCs) && directCs.length > 0) {
                                rawList = directCs;
                                break;
                            }
                        }
                    }

                    // 🛡️ 직원이 방금 CS를 등록/수정한 지 25초 이내라면 구글 시트의 느린 캐시가 최신 로컬 CS 목록을 덮어쓰지 못하도록 완벽 보호!
                    const lastCsDirtyTs = Number(localStorage.getItem(STAFF_CS_DIRTY_TIME_KEY) || '0');
                    if (Date.now() - lastCsDirtyTs < 25000 && csGroupsRef.current && csGroupsRef.current.length > 0) {
                        syncCsGroupsToFirebase(csGroupsRef.current);
                        return;
                    }

                    if (rawList.length === 0) {
                        // 서버 시트가 비어있는데 로컬에 기존 CS 내역이 있다면 시트로 즉시 백업 푸시!
                        if (csGroupsRef.current && csGroupsRef.current.length > 0) {
                            saveCsOrdersToSheetImmediate(csGroupsRef.current);
                        }
                        return;
                    }
                    const parsed = rawList.map((r, i) => {
                        let items = [];
                        const jsonRaw = pickRowField(r, ['전체품목JSON', 'itemsJson'], 15);
                        if (jsonRaw) {
                            try {
                                const p = JSON.parse(jsonRaw);
                                if (Array.isArray(p)) items = p;
                            } catch (e) {}
                        }
                        const cardStr = String(pickRowField(r, ['카드결제', 'card'], 13)).trim();
                        const cardMode = cardStr.includes('완료') ? 'completed' : (cardStr ? 'requested' : 'none');
                        const rawMemoCell = String(pickRowField(r, ['CS메모', 'csMemo'], 10) || '');
                        const { memoOnly, accountOnly, refundAmount, refundCompleted, convertedToCredit } = splitCsMemoAndAccount(rawMemoCell);
                        const shipNum = Number(String(pickRowField(r, ['배송비', 'shipping'], 11) || '0').replace(/[^0-9.-]/g, '')) || 0;
                        const depNum = Number(String(pickRowField(r, ['입금액', 'deposit'], 12) || '0').replace(/[^0-9.-]/g, '')) || 0;
                        const parsedItems = Array.isArray(items) ? items : [];
                        const autoRetSum = parsedItems.filter(x => x.csTag === '반품').reduce((s, x) => s + (Number(x.price) || 0), 0);
                        return {
                            id: String(pickRowField(r, ['CS_ID', 'id'], 0) || `cs_${Date.now()}_${i}`),
                            createdAt: String(pickRowField(r, ['등록일시', 'createdAt'], 1) || ''),
                            sourceBroadcast: String(pickRowField(r, ['원본방송', 'sourceBroadcast'], 2) || '').replace(/^주문_/, ''),
                            csStatus: String(pickRowField(r, ['처리상태', 'csStatus'], 3) || '접수'),
                            nick: String(pickRowField(r, ['닉네임', 'nick'], 4) || ''),
                            realname: String(pickRowField(r, ['수령인명', 'realname'], 5) || ''),
                            phone: fixPhoneNumber(pickRowField(r, ['연락처', 'phone'], 6)),
                            address: stripZipcode(pickRowField(r, ['주소', 'address'], 7) || ''),
                            origTracking: String(pickRowField(r, ['원송장번호', 'origTracking'], 8) || '').replace(/^'+/, ''),
                            csTracking: String(pickRowField(r, ['교반송장번호', 'csTracking'], 9) || '').replace(/^'+/, ''),
                            csMemo: memoOnly,
                            refundAccount: accountOnly,
                            refundAmount: refundAmount > 0 ? refundAmount : autoRetSum,
                            refundCompleted: Boolean(refundCompleted || convertedToCredit),
                            convertedToCredit: Boolean(convertedToCredit),
                            shipping: shipNum,
                            deposit: depNum,
                            csFeePaid: depNum > 0 && depNum >= shipNum,
                            cardMode: cardMode,
                            items: parsedItems
                        };
                    }).filter(c => c.nick);
                    setCsGroups(parsed);
                    syncCsGroupsToFirebase(parsed);
                } catch (e) {}
            }, [activeGasUrl, activeStaffSheetId]);

            const loadMasterAddresses = useCallback(async () => {
                try {
                    const res = await fetchGas(`${activeGasUrl}?action=get_all&depId=${DEFAULT_DEP_SHEET_ID}&masterId=${activeDictSheetId}&skipHeavy=false&t=${Date.now()}`);
                    const incoming = [];
                    if (res && (res.status === 'success' || res.success) && Array.isArray(res.masterAddresses)) {
                        res.masterAddresses.forEach(a => {
                            let nick = '', realname = '', phone = '', address = '', memo = '';
                            if (Array.isArray(a)) {
                                nick = String(a[0] || '').trim();
                                realname = String(a[1] || '').trim();
                                phone = fixPhoneNumber(a[2] || '');
                                address = stripZipcode(a[3] || '');
                                const c4 = String(a[4] || '').trim();
                                memo = cleanMemoText(/^\d{5}$/.test(c4) ? (a[5] || '') : c4, address);
                            } else if (a && typeof a === 'object') {
                                nick = String(pickRowField(a, ['닉네임', 'nickname', '주문자', '고객명'], 0)).trim();
                                realname = String(pickRowField(a, ['수령인명', 'realname', '수령인', '이름', '성명'], 1)).trim();
                                phone = fixPhoneNumber(pickRowField(a, ['연락처', 'phone', '전화번호', '핸드폰번호'], 2));
                                address = stripZipcode(pickRowField(a, ['주소', 'address', '배송지'], 3));
                                const rawMemo = String(pickRowField(a, ['배송메모', 'memo', '요청사항', '메모'], 4)).trim();
                                memo = cleanMemoText(/^\d{5}$/.test(rawMemo) ? pickRowField(a, ['col_5'], 5) : rawMemo, address);
                            }
                            if (nick.toLowerCase() === 'nickname' || realname.toLowerCase() === 'realname') return;
                            if ((nick || realname) && address) {
                                incoming.push({ nickname: nick || realname, realname, phone, address, memo });
                            }
                        });
                    }

                    if (res && Array.isArray(res.customerDb)) {
                        const sheetCredits = {};
                        const sheetVips = {};
                        res.customerDb.forEach(c => {
                            const n = String(c['닉네임'] || c.col_0 || '').trim();
                            // 사장님 시트('고객상태관리' 탭)에 백업된 유튜브 API 키 자동 추출 및 로컬 캐시 저장
                            if (n === '___SYSTEM_YT_API_KEY___') {
                                const savedKey = String(c['고객상태'] || c['비밀번호'] || c.col_1 || c.col_2 || '').trim();
                                if (savedKey) {
                                    setSharedYtApiKey(savedKey);
                                    try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(savedKey)); } catch (e) {}
                                }
                                return;
                            }
                            const st = String(c['고객상태'] || '').trim().toLowerCase();
                            const cred = Number(String(c['적립금'] || '0').replace(/[^0-9.-]/g, '')) || 0;
                            if (n && (st === 'vip' || st === 'manager' || st === '관리자')) {
                                sheetVips[normalizeString(n)] = true;
                                const hKey = normalizeHandleNick(n);
                                if (hKey) sheetVips[hKey] = true;
                            }
                            if (n && cred >= 0 && c['적립금'] !== '' && c['적립금'] !== undefined) {
                                sheetCredits[n] = cred;
                            }
                        });
                        if (Object.keys(sheetVips).length > 0) {
                            setVipNickMap(prev => ({ ...prev, ...sheetVips }));
                        }
                        if (Object.keys(sheetCredits).length > 0) {
                            setCustomerCredits(prev => ({ ...sheetCredits, ...prev }));
                        }
                    }

                    if (incoming.length > 0) {
                        setMasterAddresses(prev => {
                            const map = new Map();
                            prev.forEach(item => {
                                const k = normalizeString(item.nickname || item.realname);
                                if (k && item.address) map.set(k, item);
                            });
                            incoming.forEach(item => {
                                const k = normalizeString(item.nickname || item.realname);
                                if (k && item.address) map.set(k, item);
                            });
                            const finalArr = Array.from(map.values());
                            try { localStorage.setItem('ember_staff_master_addrs_v1', JSON.stringify(finalArr)); } catch (e) {}
                            return finalArr;
                        });
                    }
                } catch (e) {}
            }, [activeGasUrl, activeDictSheetId]);

            // ✨ 찐고객사전(masterAddresses)뿐만 아니라 파이어베이스(_portal_master_addrs) 및 이전 모든 마감 방송 주문서(localBroadcastStore)에 기록된 고객 배송지까지 통합하여 기존 고객 주소를 100% 찾아내는 만능 매칭 함수!
            const findMasterAddressMatch = useCallback((nick) => {
                if (!nick) return null;
                const targetNorm = normalizeString(nick);
                const targetHandle = normalizeHandleNick(nick);
                if (!targetNorm) return null;

                // 1순위: 찐고객사전(masterAddresses)에서 검색
                if (masterAddresses.length > 0) {
                    const m1 = masterAddresses.find(a => normalizeString(a.nickname) === targetNorm)
                        || (targetHandle && targetHandle.length >= 2 ? masterAddresses.find(a => normalizeHandleNick(a.nickname) === targetHandle) : null);
                    if (m1 && m1.address) return m1;
                }

                // 2순위: 현재 열려있는 방송 및 이전 모든 마감 방송 주문서(localBroadcastStore)에서 주소 검색
                const allBlocks = Object.values(localBroadcastStoreRef.current || {});
                for (let i = 0; i < allBlocks.length; i++) {
                    const groups = allBlocks[i]?.groups || [];
                    const gMatch = groups.find(g =>
                        g && g.address && (
                            normalizeString(g.nick) === targetNorm ||
                            (targetHandle && targetHandle.length >= 2 && normalizeHandleNick(g.nick) === targetHandle)
                        )
                    );
                    if (gMatch) {
                        return {
                            nickname: gMatch.nick,
                            realname: gMatch.realname || '',
                            phone: fixPhoneNumber(gMatch.phone || ''),
                            address: stripZipcode(gMatch.address || ''),
                            memo: gMatch.memo || ''
                        };
                    }
                }
                return null;
            }, [masterAddresses]);

            // 파이어베이스에 백업된 찐고객사전(_portal_master_addrs)도 함께 불러와 masterAddresses에 병합 (연동 누락 원천 차단)
            useEffect(() => {
                if (!staffFbDb) return;
                staffFbDb.ref('ember_live_data/_portal_master_addrs').once('value').then(snap => {
                    const val = snap.val();
                    if (!val || typeof val !== 'object') return;
                    const fbAddrs = Object.values(val).filter(a => a && a.nickname && a.address).map(a => ({
                        nickname: String(a.nickname).trim(),
                        realname: String(a.realname || '').trim(),
                        phone: fixPhoneNumber(a.phone || ''),
                        address: stripZipcode(a.address || ''),
                        memo: cleanMemoText(a.memo || '', a.address || '')
                    }));
                    if (fbAddrs.length > 0) {
                        setMasterAddresses(prev => {
                            const map = new Map();
                            fbAddrs.forEach(item => map.set(normalizeString(item.nickname), item));
                            prev.forEach(item => map.set(normalizeString(item.nickname), item));
                            const merged = Array.from(map.values());
                            try { localStorage.setItem('ember_staff_master_addrs_v1', JSON.stringify(merged)); } catch (e) {}
                            return merged;
                        });
                    }
                }).catch(() => {});
            }, []);

            const loadInitialTabs = useCallback(async (forceRefreshFromSheet = false) => {
                setIsLoading(true);
                try {
                    const discoveredBlocks = {};

                    // 1순위: 구글 5분 캐시 때문에 시트에서 지운 '10/24 라이브'가 부활하지 않도록, 실시간 앱스 스크립트(get_orders)를 최우선으로 사용!
                    const gasMainRes = await fetchGas(`${activeGasUrl}?action=get_orders&masterId=${activeStaffSheetId}&tabName=${encodeURIComponent('메인주문')}&t=${Date.now()}`, null, 12000).catch(() => null);
                    const gasOrderRows = Array.isArray(gasMainRes?.data) ? gasMainRes.data : (Array.isArray(gasMainRes?.orders) ? gasMainRes.orders : []);

                    if (gasOrderRows.length > 0) {
                        Object.assign(discoveredBlocks, parseRowsIntoBroadcastBlocks(gasOrderRows, '메인주문'));
                    } else {
                        const directMainRows = await fetchGoogleSheetDirect(activeStaffSheetId, '메인주문');
                        if (Array.isArray(directMainRows) && directMainRows.length > 0) {
                            Object.assign(discoveredBlocks, parseRowsIntoBroadcastBlocks(directMainRows, '메인주문'));
                        }
                    }

                    // 테스트 더미 방송('10/24 라이브')이나 '222222' 테스트 품목이 캐시에 남아있다면 원천 제거!
                    delete discoveredBlocks['주문_10/24 라이브'];
                    delete discoveredBlocks['10/24 라이브'];

                    // 🧹 시트에서 삭제된 방송(예: 테스트로 만든 10/24 라이브 등)이 파이어베이스(_portal_orders)에 남아있다면 되살리지 않고 클라우드에서도 즉시 자동 삭제!
                    if (staffFbDb) {
                        try {
                            const fbOrdersSnap = await staffFbDb.ref('ember_live_data/_portal_orders').once('value');
                            const fbOrdersVal = fbOrdersSnap.val() || {};
                            Object.keys(fbOrdersVal).forEach(safeKey => {
                                if (safeKey === '__MAIN_LIVE__') {
                                    if (!isStaffLiveActive) {
                                        staffFbDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').remove().catch(() => {});
                                    }
                                    return;
                                }
                                const node = fbOrdersVal[safeKey];
                                const cleanB = cleanDisplayTabName(node?.broadcastName || safeKey);
                                const tabKey = '주문_' + cleanB;
                                if (!discoveredBlocks[tabKey]) {
                                    staffFbDb.ref(`ember_live_data/_portal_orders/${safeKey}`).remove().catch(() => {});
                                }
                            });
                        } catch (cleanErr) {}
                    }

                    // ✨ 고객이 셀프 포털에서 방금 입력한 배송지(_portal_broadcast_addresses)와 주문확정(_portal_confirmed) 내역을 모든 방송 블록에 즉시 병합!
                    if (staffFbDb && Object.keys(discoveredBlocks).length > 0) {
                        try {
                            const [bcastAddrSnap, confSnap] = await Promise.all([
                                staffFbDb.ref('ember_live_data/_portal_broadcast_addresses').once('value'),
                                staffFbDb.ref('ember_live_data/_portal_confirmed').once('value')
                            ]);
                            const allBcastAddrs = bcastAddrSnap.val() || {};
                            const allConfMap = confSnap.val() || {};
                            const confList = Object.values(allConfMap).filter(c => c && c.nickname);

                            Object.values(discoveredBlocks).forEach(blk => {
                                if (!blk || !Array.isArray(blk.groups)) return;
                                const cleanB = cleanDisplayTabName(blk.broadcastName || '');
                                const safeBKey = cleanB.replace(/[.#$\[\]\/]/g, '_');
                                const addrMapForB = allBcastAddrs[safeBKey] || {};
                                const addrEntries = Object.values(addrMapForB).filter(a => a && a.nickname && (a.address || a.baseAddress));

                                blk.groups = blk.groups.map(g => {
                                    let updatedG = { ...g };
                                    if (addrEntries.length > 0) {
                                        const matchedAddr = addrEntries.find(a =>
                                            normalizeString(a.nickname) === normalizeString(g.nick) ||
                                            (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                                        );
                                        if (matchedAddr) {
                                            const newAddrStr = stripZipcode(matchedAddr.address || `${matchedAddr.baseAddress || ''} ${matchedAddr.detailAddress || ''}`.trim());
                                            const newReal = matchedAddr.realname || g.realname;
                                            const newPh = fixPhoneNumber(matchedAddr.phone || g.phone);
                                            const newMemo = cleanMemoText(matchedAddr.memo ?? g.memo, newAddrStr);
                                            if (newAddrStr) {
                                                updatedG = {
                                                    ...updatedG,
                                                    realname: newReal,
                                                    phone: newPh,
                                                    address: newAddrStr,
                                                    memo: newMemo,
                                                    pin: newPh.length >= 4 ? newPh.slice(-4) : updatedG.pin
                                                };
                                            }
                                        }
                                    }
                                    if (!updatedG.isConfirmed && confList.length > 0) {
                                        const isConf = confList.some(c => {
                                            const cBName = cleanDisplayTabName(c.broadcastName || '');
                                            if (cBName && normalizeString(cBName) !== normalizeString(cleanB)) return false;
                                            return normalizeString(c.nickname) === normalizeString(g.nick);
                                        });
                                        if (isConf) updatedG.isConfirmed = true;
                                    }
                                    return updatedG;
                                });
                            });
                        } catch (fbErr) {}
                    }

                    // 시트에서 정상적으로 읽어왔다면 옛날 로컬 캐시(시트에서 지운 방송들)를 버리고 시트 원본(discoveredBlocks)으로 100% 일치시킵니다!
                    const hasSheetData = Array.isArray(gasOrderRows) || Object.keys(discoveredBlocks).length > 0;
                    const finalBlocksMap = hasSheetData ? discoveredBlocks : {};
                    setLocalBroadcastStore(finalBlocksMap);
                    localBroadcastStoreRef.current = finalBlocksMap;
                    try {
                        localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(finalBlocksMap));
                    } catch (e) {}

                    // 이전 마감 방송들에 들어있는 모든 고객 배송지도 masterAddresses 사전에 자동 흡수하여 라이브 주문 시 100% 자동 매칭되도록 강화!
                    const extractedPastAddrs = [];
                    Object.values(finalBlocksMap).forEach(blk => {
                        (blk?.groups || []).forEach(g => {
                            if (g && g.nick && g.address) {
                                extractedPastAddrs.push({
                                    nickname: g.nick,
                                    realname: g.realname || '',
                                    phone: fixPhoneNumber(g.phone || ''),
                                    address: stripZipcode(g.address),
                                    memo: cleanMemoText(g.memo || '', g.address)
                                });
                            }
                        });
                    });
                    if (extractedPastAddrs.length > 0) {
                        setMasterAddresses(prev => {
                            const map = new Map();
                            extractedPastAddrs.forEach(item => map.set(normalizeString(item.nickname), item));
                            prev.forEach(item => map.set(normalizeString(item.nickname), item));
                            const merged = Array.from(map.values());
                            try { localStorage.setItem('ember_staff_master_addrs_v1', JSON.stringify(merged)); } catch (e) {}
                            return merged;
                        });
                    }

                    // 클라우드(_portal_orders)에도 직원 시트의 방송들을 동기화 (단, 실수로 시트 일부만 읽혔을 때 기존 백업 방을 지워버리지 않도록 자동 삭제 로직 제거!)
                    if (hasSheetData && staffFbDb) {
                        Object.values(finalBlocksMap).forEach(blk => {
                            if (blk && blk.broadcastName && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                syncBroadcastGroupsToFirebase(
                                    blk.broadcastName,
                                    blk.groups,
                                    blk.freeShipThreshold || 70000,
                                    blk.cardFeeRate || 10,
                                    customerCredits,
                                    'staff_init'
                                );
                            }
                        });
                    }

                    const validSortedTabs = Object.keys(finalBlocksMap)
                        .filter(t => t && t.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(t))
                        .sort((a, b) => {
                            const scoreA = extractBroadcastDateScore(a);
                            const scoreB = extractBroadcastDateScore(b);
                            if (scoreA !== scoreB) return scoreB - scoreA;
                            return b.localeCompare(a, 'ko');
                        });

                    setOrderTabs(validSortedTabs);

                    if (validSortedTabs.length > 0) {
                        const targetTab = (selectedTab && validSortedTabs.includes(selectedTab)) ? selectedTab : validSortedTabs[0];
                        setSelectedTab(targetTab);
                        const targetBlk = finalBlocksMap[targetTab];
                        if (targetBlk) {
                            setBroadcastName(targetBlk.broadcastName || cleanDisplayTabName(targetTab));
                            setFreeShipThreshold(targetBlk.freeShipThreshold || 70000);
                            setDefaultShipping(targetBlk.defaultShipping || 4000);
                            setCardFeeRate(targetBlk.cardFeeRate || 10);
                            setCustomerGroups(targetBlk.groups || []);
                        }
                    } else {
                        setSelectedTab('');
                        setCustomerGroups([]);
                    }
                    setHasUnsavedChanges(false);
                } catch (e) {
                    setIsLoading(false);
                } finally {
                    setIsLoading(false);
                }
            }, [activeGasUrl, activeStaffSheetId, localBroadcastStore, selectedTab, customerCredits]);

            useEffect(() => {
                loadInitialTabs(false);
                loadCsOrders();
                loadMasterAddresses();
            }, []);

            // ✨ [핵심] 고객이 포털에서 주소를 입력하거나 주문확정을 눌렀을 때 현재 보고 있는 방송뿐만 아니라 모든 방송 창고(localBroadcastStore)에 실시간으로 자동 반영!
            useEffect(() => {
                if (!staffFbDb) return;
                const cleanCurB = String(broadcastName || selectedTab || '').replace(/^주문_/, '').trim();

                const allAddrRef = staffFbDb.ref('ember_live_data/_portal_broadcast_addresses');
                const confRef = staffFbDb.ref('ember_live_data/_portal_confirmed');

                const handlePortalAllAddrChange = (snap) => {
                    const allVal = snap.val();
                    if (!allVal || typeof allVal !== 'object') return;

                    // 1) 현재 화면에 열려있는 방송(customerGroups) 즉시 업데이트
                    if (cleanCurB) {
                        const safeCurBKey = cleanCurB.replace(/[.#$\[\]\/]/g, '_');
                        const curBMap = allVal[safeCurBKey];
                        if (curBMap && typeof curBMap === 'object') {
                            const addrEntries = Object.values(curBMap).filter(a => a && a.nickname && (a.address || a.baseAddress));
                            if (addrEntries.length > 0) {
                                setCustomerGroups(prev => {
                                    let changed = false;
                                    const next = prev.map(g => {
                                        const matched = addrEntries.find(a =>
                                            normalizeString(a.nickname) === normalizeString(g.nick) ||
                                            (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                                        );
                                        if (!matched) return g;
                                        const newAddrStr = stripZipcode(matched.address || `${matched.baseAddress || ''} ${matched.detailAddress || ''}`.trim());
                                        const newReal = matched.realname || g.realname;
                                        const newPh = fixPhoneNumber(matched.phone || g.phone);
                                        const newMemo = cleanMemoText(matched.memo ?? g.memo, newAddrStr);
                                        if (newAddrStr && (g.address !== newAddrStr || g.realname !== newReal || g.phone !== newPh || g.memo !== newMemo)) {
                                            changed = true;
                                            return {
                                                ...g,
                                                realname: newReal,
                                                phone: newPh,
                                                address: newAddrStr,
                                                memo: newMemo,
                                                pin: newPh.length >= 4 ? newPh.slice(-4) : g.pin
                                            };
                                        }
                                        return g;
                                    });
                                    return changed ? next : prev;
                                });
                            }
                        }
                    }

                    // 2) 백그라운드의 다른 방송들(localBroadcastStore)도 고객이 입력한 주소로 동시 업데이트하여 저장 시 절대 누락되지 않도록 보호!
                    setLocalBroadcastStore(prevStore => {
                        let storeChanged = false;
