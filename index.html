<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202124">
    <title>엠버 직원용 시스템(v2.67)</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js" crossorigin="anonymous"></script>

    <style>
        @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo/nanumsquareneo.css");
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'NanumSquareNeo', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        #root { height: 100%; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const APP_VERSION = "v2.67";
        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyhxXCbOzunsyHbCi5Slk2JDUemYfzduDYKzkU9zm-oaWv_cY0rTdWr0vItJBXKLh4O/exec';
        const DEFAULT_MASTER_SHEET_ID = '1B8SBMX18_Px1CpRHuDTxqodqudiTrf6NfVoptjHtnGQ';
        const DEFAULT_DEP_SHEET_ID = '14bx2HMd_NID3zQN-Hb0x0At2Qmti7-p1Zfx1ZadNScY';

        let staffFbDb = null;
        try {
            const fbConfig = {
                apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",
                authDomain: "my-live-shop.firebaseapp.com",
                databaseURL: "https://my-live-shop-default-rtdb.firebaseio.com",
                projectId: "my-live-shop",
                storageBucket: "my-live-shop.firebasestorage.app",
                messagingSenderId: "598748133843",
                appId: "1:598748133843:web:17c7d83321fc191f85d726"
            };
            if (window.firebase) {
                if (!window.firebase.apps.length) window.firebase.initializeApp(fbConfig);
                staffFbDb = window.firebase.database();
            }
        } catch (e) {}

        const syncBroadcastGroupsToFirebase = (bNameRaw, groupsList, fThresh = 70000, cRate = 10, creditsMap = {}, sourceRole = 'staff') => {
            if (!staffFbDb || !bNameRaw || !Array.isArray(groupsList)) return;
            try {
                const cleanB = String(bNameRaw).replace(/^주문_/, '').trim();
                const safeBKey = cleanB.replace(/[.#$\[\]\/]/g, '_');
                const portalCustomers = groupsList.map(g => {
                    const cleanPh = fixPhoneNumber(g.phone || '');
                    const pin4 = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                    const zipM = String(g.address || '').match(/^\((\d{5})\)\s*(.*)$/);
                    const cardStr = g.cardMode === 'completed' ? `카드완료(${cRate}%)` : (g.cardMode === 'requested' ? `O(${cRate}%)` : '');
                    const custCred = Number(creditsMap?.[g.nick] ?? g.credit ?? 0) || 0;
                    return {
                        sheetTabName: '주문_' + cleanB,
                        nickname: g.nick,
                        phoneLast4: pin4,
                        broadcastName: cleanB,
                        isVip: Boolean(g.isVip),
                        isNoShow: Boolean(g.isNoShow),
                        credit: custCred,
                        freeShippingThreshold: Number(fThresh) || 70000,
                        cardFeeRate: Number(cRate) || 10,
                        isCard: cardStr,
                        shipping: Number(g.shipping) || 0,
                        depositTotal: Number(g.deposit) || 0,
                        deposits: Array.isArray(g.deposits) ? g.deposits : [],
                        items: (g.items || []).map((it, idx) => ({
                            id: idx + 1,
                            product: it.product || '',
                            qty: Number(it.qty) || 1,
                            price: Number(it.price) || 0,
                            isWaitlist: Boolean(it.isWaitlist),
                            waitlistOrder: Number(it.waitlistOrder) || 0
                        })),
                        address: (g.address || g.realname) ? {
                            realname: g.realname || '',
                            phone: cleanPh,
                            zipcode: zipM ? zipM[1] : '',
                            baseAddress: zipM ? zipM[2] : (g.address || ''),
                            detailAddress: '',
                            memo: g.memo || '',
                            updatedAt: ''
                        } : null,
                        trackingNumbers: g.trackingNumber ? [g.trackingNumber] : [],
                        isConfirmed: Boolean(g.isConfirmed)
                    };
                });
                staffFbDb.ref(`ember_live_data/_portal_orders/${safeBKey}`).set({
                    broadcastName: cleanB,
                    updatedAt: Date.now(),
                    updatedBy: sourceRole,
                    customers: portalCustomers
                }).catch(() => {});
            } catch (e) {}
        };

        const Icon = ({ name, className = "", weight = "regular", size = 15 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        const normalizeString = (str) => String(str || '').replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, '').toLowerCase();

        const normalizeHandleNick = (str) => {
            if (!str) return '';
            let s = String(str).trim();
            s = s.replace(/-[a-zA-Z0-9]{2,8}$/, '');
            return normalizeString(s);
        };

        const fixPhoneNumber = (numStr) => {
            if (!numStr) return '';
            let cleaned = String(numStr).replace(/[^0-9]/g, '');
            if (cleaned.length === 10 && !cleaned.startsWith('0')) cleaned = '0' + cleaned;
            return cleaned;
        };

        const normalizePin4 = (val) => {
            if (val === undefined || val === null) return '';
            const digits = String(val).replace(/[^0-9]/g, '');
            if (!digits) return '';
            return digits.length < 4 ? digits.padStart(4, '0') : digits.slice(-4);
        };

        const SYSTEM_EXCLUDE_TABS = new Set([
            '찐고객사전', '실시간재고', '고객상태관리', '방송별상품보관함',
            '채팅기록', '교환반품CS', '재고단가', '닉네임', '메인주문',
            '주문_오늘의방송', '오늘의방송', '10/18 여성복',
            '시트1', '시트2', '시트3', '시트4', '시트5', 'Sheet1', 'Sheet2'
        ]);

        // '주문_10/20 악세사리'처럼 슬래시('/')가 포함된 신규 방송 시트도 정상적으로 불러오도록 허용 (단, 옛날 별도 시트 '10/18 여성복'만 제외)
        const toCanonicalOrderTab = (name) => {
            const s = String(name || '').trim();
            if (!s) return null;
            const withoutPrefix = s.replace(/^주문_/, '').trim();
            if (!withoutPrefix || SYSTEM_EXCLUDE_TABS.has(s) || SYSTEM_EXCLUDE_TABS.has(withoutPrefix)) return null;
            if (/^(시트|sheet)\d*$/i.test(withoutPrefix)) return null;
            return '주문_' + withoutPrefix;
        };

        // 방송 탭 이름에서 날짜(예: "10/20", "10 18", "10 16")를 추출해 최신 날짜가 무조건 맨 앞(1번)에 오도록 계산하는 함수
        const extractBroadcastDateScore = (tabName) => {
            const s = String(tabName || '').replace(/^주문_/, '').trim();
            if (!s) return 0;
            const fullMatch = s.match(/(?:20)?(\d{2})[./\-\s년]+(\d{1,2})[./\-\s월]+(\d{1,2})/);
            if (fullMatch) {
                const yy = parseInt(fullMatch[1], 10);
                const mm = parseInt(fullMatch[2], 10);
                const dd = parseInt(fullMatch[3], 10);
                if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
                    return (2000 + yy) * 10000 + mm * 100 + dd;
                }
            }
            const mdMatch = s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])[./\-\s월]+([0-2]?\d|3[01])(?:일|\b|\s|[^0-9])/);
            if (mdMatch) {
                const mm = parseInt(mdMatch[1], 10);
                const dd = parseInt(mdMatch[2], 10);
                return 2026 * 10000 + mm * 100 + dd;
            }
            return 0;
        };

        const pickRowField = (row, keys, fallbackIdx = -1) => {
            if (!row || typeof row !== 'object') return '';
            for (let i = 0; i < keys.length; i++) {
                const k = keys[i];
                if (row[k] !== undefined && row[k] !== null && row[k] !== '') {
                    return row[k];
                }
            }
            const rowKeys = Object.keys(row).filter(rk => !/^col_\d+$/.test(rk));
            for (let i = 0; i < keys.length; i++) {
                const targetNorm = normalizeString(keys[i]);
                const foundKey = rowKeys.find(rk => normalizeString(rk) === targetNorm || normalizeString(rk).includes(targetNorm));
                if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null && row[foundKey] !== '') {
                    return row[foundKey];
                }
            }
            if (fallbackIdx >= 0 && row[`col_${fallbackIdx}`] !== undefined && row[`col_${fallbackIdx}`] !== null && row[`col_${fallbackIdx}`] !== '') {
                return row[`col_${fallbackIdx}`];
            }
            return '';
        };

        const cleanMemoText = (memoVal, addrVal) => {
            const m = String(memoVal || '').trim();
            const a = String(addrVal || '').trim();
            if (!m) return '';
            if (a && (m === a || normalizeString(m) === normalizeString(a))) return '';
            if (a && a.length >= 6 && (a.includes(m) || m.includes(a))) return '';
            if (/^\(\d{5}\)/.test(m)) return '';
            return m;
        };

        // 구글 앱스 스크립트 Cold Start(8~12초) 동안 절대 도중에 끊기지 않도록 타임아웃을 25초로 복원하고 자동 재시도 지원
        const fetchGas = async (url, payload = null, timeoutMs = 25000) => {
            const attemptFetch = async () => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                const options = { method: payload ? 'POST' : 'GET', redirect: "follow", signal: controller.signal };
                if (payload) {
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                    options.body = JSON.stringify(payload);
                }
                try {
                    const res = await fetch(url, options);
                    clearTimeout(timer);
                    const text = await res.text();
                    return JSON.parse(text);
                } catch (err) {
                    clearTimeout(timer);
                    throw err;
                }
            };
            try {
                return await attemptFetch();
            } catch (firstErr) {
                // 1차 통신 실패 시 0.5초 후 즉시 1회 자동 재시도
                try {
                    await new Promise(r => setTimeout(r, 500));
                    return await attemptFetch();
                } catch (secondErr) {
                    return { status: 'error', message: secondErr.message || '통신 실패' };
                }
            }
        };

        const downloadExcel = (data, fileName) => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `${fileName}_${new Date().toLocaleDateString('ko-KR')}.xlsx`);
        };

        const CustomModal = ({ modal, onClose }) => {
            const [val, setVal] = useState(modal.defaultValue || '');
            useEffect(() => { setVal(modal.defaultValue || ''); }, [modal]);
            if (!modal.isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-sm mx-4 border border-slate-200" onClick={e => e.stopPropagation()}>
                        <h3 className="text-base font-extrabold text-slate-800 mb-2">{modal.title || '알림'}</h3>
                        <p className="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed mb-4">{modal.message}</p>
                        {modal.type === 'prompt' && (
                            <input
                                type="text"
                                value={val}
                                onChange={e => setVal(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Enter') { modal.onConfirm && modal.onConfirm(val); onClose(); } }}
                                autoFocus
                                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold mb-4 outline-none focus:border-blue-600"
                            />
                        )}
                        <div className="flex gap-2">
                            {modal.type !== 'alert' && (
                                <button onClick={onClose} className="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">취소</button>
                            )}
                            <button
                                onClick={() => { modal.onConfirm && modal.onConfirm(modal.type === 'prompt' ? val : true); onClose(); }}
                                className="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-800 text-white hover:bg-slate-900"
                            >
                                확인
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AddressEditModal = ({ isOpen, group, masterAddresses = [], onClose, onSave }) => {
            const [realname, setRealname] = useState('');
            const [phone, setPhone] = useState('');
            const [zipcode, setZipcode] = useState('');
            const [baseAddr, setBaseAddr] = useState('');
            const [detailAddr, setDetailAddr] = useState('');
            const [memo, setMemo] = useState('');
            const [dictSearch, setDictSearch] = useState('');

            const applyMasterEntry = useCallback((entry) => {
                if (!entry) return;
                setRealname(entry.realname || '');
                setPhone(fixPhoneNumber(entry.phone || ''));
                const rawAddr = String(entry.address || '').trim();
                const zipMatch = rawAddr.match(/^\((\d{5})\)\s*(.*)$/);
                setZipcode(zipMatch ? zipMatch[1] : '');
                setBaseAddr(zipMatch ? zipMatch[2] : rawAddr);
                setDetailAddr('');
                setMemo(cleanMemoText(entry.memo || '', rawAddr));
            }, []);

            useEffect(() => {
                if (isOpen && group) {
                    setDictSearch('');
                    if (group.address || group.realname || group.phone) {
                        setRealname(group.realname || '');
                        setPhone(group.phone || '');
                        const rawAddr = String(group.address || '').trim();
                        const zipMatch = rawAddr.match(/^\((\d{5})\)\s*(.*)$/);
                        setZipcode(zipMatch ? zipMatch[1] : '');
                        setBaseAddr(zipMatch ? zipMatch[2] : rawAddr);
                        setDetailAddr('');
                        setMemo(group.memo || '');
                    } else {
                        // 현재 주문서에 배송지가 비어있다면 찐고객사전에서 동일 닉네임이 있는지 찾아서 자동으로 먼저 채워줌!
                        const exactMatch = masterAddresses.find(a => normalizeString(a.nickname) === normalizeString(group.nick));
                        if (exactMatch) {
                            applyMasterEntry(exactMatch);
                        } else {
                            setRealname('');
                            setPhone('');
                            setZipcode('');
                            setBaseAddr('');
                            setDetailAddr('');
                            setMemo('');
                        }
                    }
                }
            }, [isOpen, group, masterAddresses, applyMasterEntry]);

            const dictSuggestions = useMemo(() => {
                if (!isOpen || !group) return [];
                const rawSearch = dictSearch.trim();
                // 검색창에 직접 검색어를 입력했을 때만 부분 검색을 허용하고, 기본 상태에서는 정확히 닉네임이 일치하는 경우만 표시 (엉뚱한 사람 주소 오연결 방지!)
                if (!rawSearch) {
                    const exactNorm = normalizeString(group.nick);
                    return masterAddresses.filter(a => normalizeString(a.nickname) === exactNorm).slice(0, 6);
                }
                const kw = normalizeString(rawSearch);
                if (!kw) return [];
                return masterAddresses.filter(a => {
                    const nNorm = normalizeString(a.nickname);
                    const rNorm = normalizeString(a.realname);
                    const pNorm = fixPhoneNumber(a.phone);
                    return nNorm.includes(kw) || (rNorm && rNorm.includes(kw)) || (pNorm && pNorm.includes(kw));
                }).slice(0, 6);
            }, [isOpen, group, dictSearch, masterAddresses]);

            if (!isOpen || !group) return null;

            const handleSearchPostcode = () => {
                if (!window.daum || !window.daum.Postcode) return;
                new window.daum.Postcode({
                    oncomplete: function(data) {
                        let full = data.address;
                        let extra = '';
                        if (data.addressType === 'R') {
                            if (data.bname !== '') extra += data.bname;
                            if (data.buildingName !== '') extra += (extra !== '' ? ', ' + data.buildingName : data.buildingName);
                            if (extra !== '') full += ` (${extra})`;
                        }
                        setZipcode(data.zonecode);
                        setBaseAddr(full);
                    }
                }).open();
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const zipPrefix = zipcode ? `(${zipcode}) ` : '';
                const combinedAddr = `${zipPrefix}${baseAddr} ${detailAddr}`.trim();
                onSave({
                    realname: realname.trim(),
                    phone: fixPhoneNumber(phone),
                    address: combinedAddr,
                    memo: memo.trim()
                });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center pb-3 mb-3 border-b border-slate-200">
                            <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
                                <Icon name="house-line" weight="fill" className="text-blue-600" />
                                <span>'{group.nick}' 배송지 수정 / 찐고객사전 연동</span>
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" weight="bold" size={18}/></button>
                        </div>

                        {/* 찐고객사전 주소록 검색 및 원클릭 불러오기 영역 */}
                        <div className="mb-3.5 p-3 bg-emerald-50/70 border border-emerald-200 rounded-xl text-xs">
                            <div className="flex items-center justify-between mb-1.5">
                                <span className="font-extrabold text-emerald-800 flex items-center gap-1">
                                    <Icon name="address-book" weight="fill" className="text-emerald-600" size={15} />
                                    <span>찐고객사전 주소록에서 검색하여 채우기 ({masterAddresses.length}명)</span>
                                </span>
                            </div>
                            <div className="relative mb-2">
                                <Icon name="magnifying-glass" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-emerald-600" size={13} />
                                <input
                                    type="text"
                                    value={dictSearch}
                                    onChange={e => setDictSearch(e.target.value)}
                                    placeholder="찐고객사전 닉네임 · 수령인 실명 · 연락처 검색..."
                                    className="w-full pl-8 pr-7 py-1.5 bg-white border border-emerald-300 rounded-lg text-xs font-bold outline-none focus:border-emerald-600"
                                />
                                {dictSearch && (
                                    <button type="button" onClick={() => setDictSearch('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                        <Icon name="x-circle" weight="fill" size={13} />
                                    </button>
                                )}
                            </div>
                            {dictSuggestions.length > 0 ? (
                                <div className="space-y-1 max-h-32 overflow-y-auto pr-0.5">
                                    {dictSuggestions.map((item, idx) => (
                                        <button
                                            key={idx}
                                            type="button"
                                            onClick={() => applyMasterEntry(item)}
                                            className="w-full text-left px-2.5 py-1.5 bg-white hover:bg-emerald-100/80 border border-emerald-200 rounded-lg flex flex-col gap-0.5 transition"
                                        >
                                            <div className="flex items-center justify-between">
                                                <span className="font-extrabold text-slate-800">
                                                    {item.nickname} <span className="text-emerald-700">({item.realname || '이름없음'} · {fixPhoneNumber(item.phone)})</span>
                                                </span>
                                                <span className="text-[10px] font-extrabold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded shrink-0">클릭시 자동입력</span>
                                            </div>
                                            <span className="text-[11px] text-slate-500 truncate">{item.address}</span>
                                        </button>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-[11px] text-slate-400 text-center py-1">
                                    일치하는 찐고객사전 주소가 없습니다. 위 검색창에 다른 닉네임이나 실명을 입력해 보세요.
                                </div>
                            )}
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="block font-bold text-slate-600 mb-1">수령인명</label>
                                    <input type="text" value={realname} onChange={e => setRealname(e.target.value)} className="w-full border rounded px-2.5 py-2 font-bold outline-none focus:border-blue-600" />
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-600 mb-1">연락처</label>
                                    <input type="text" value={phone} onChange={e => setPhone(e.target.value.replace(/[^0-9]/g, ''))} className="w-full border rounded px-2.5 py-2 font-bold outline-none focus:border-blue-600" />
                                </div>
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 mb-1">주소</label>
                                <div className="flex gap-1.5 mb-1.5">

        const StaffTrackingApp = () => {
            const [orderTabs, setOrderTabs] = useState([]);
            const [selectedTab, setSelectedTab] = useState('');
            const [broadcastName, setBroadcastName] = useState('');
            const [freeShipThreshold, setFreeShipThreshold] = useState(70000);
            const [defaultShipping, setDefaultShipping] = useState(4000);
            const [cardFeeRate, setCardFeeRate] = useState(10);

            const [customerGroups, setCustomerGroups] = useState([]);
            const [csGroups, setCsGroups] = useState([]);
            const [masterAddresses, setMasterAddresses] = useState([]);
            const [customerCredits, setCustomerCredits] = useState({});
            const [showNewNickSuggest, setShowNewNickSuggest] = useState(false);
            const [activeMainTab, setActiveMainTab] = useState('orders');
            const [statusFilter, setStatusFilter] = useState('all');
            const [csStatusFilter, setCsStatusFilter] = useState('all');

            // 1) 현재 선택된 방송 안에서 즉시 필터링하는 검색어
            const [localSearchTerm, setLocalSearchTerm] = useState('');
            // 2) 교환/반품 CS 누적 목록 안에서 즉시 필터링하는 검색어
            const [csSearchTerm, setCsSearchTerm] = useState('');
            // 3) 전체 방송 + 교환반품CS 전체를 뒤지는 통합검색어
            const [globalKeyword, setGlobalKeyword] = useState('');
            const [globalSearchResults, setGlobalSearchResults] = useState(null);
            const [isSearchingGlobal, setIsSearchingGlobal] = useState(false);

            const [newNick, setNewNick] = useState('');
            const [newProd, setNewProd] = useState('');
            const [newQty, setNewQty] = useState(1);
            const [newPrice, setNewPrice] = useState('');

            const [isLoading, setIsLoading] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [toastMsg, setToastMsg] = useState('');

            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null, defaultValue: '' });
            const [addrEditTarget, setAddrEditTarget] = useState(null);
            const [csCopyTarget, setCsCopyTarget] = useState(null);
            const [cleanupModalOpen, setCleanupModalOpen] = useState(false);
            const [selectedOldTabs, setSelectedOldTabs] = useState({});

            const trackingExcelRef = useRef(null);

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            }, []);

            const openModal = useCallback((message, type = 'alert', onConfirm = null, defaultValue = '', title = '확인') => {
                setModal({ isOpen: true, title, message, type, onConfirm, defaultValue });
            }, []);

            const loadSheetOrders = useCallback(async (tabNameToLoad) => {
                if (!tabNameToLoad) {
                    setIsLoading(false);
                    return;
                }
                setIsLoading(true);
                try {
                    const cleanBase = String(tabNameToLoad).replace(/^주문_/, '').trim();
                    const canonicalTab = '주문_' + cleanBase;

                    // 1차: '주문_10 16 여성복' 및 '10 16 여성복' 동시 전달
                    let res = await fetchGas(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&tabName=${encodeURIComponent(canonicalTab)}&broadcastName=${encodeURIComponent(cleanBase)}&t=${Date.now()}`);
                    let rowsArray = Array.isArray(res?.data) ? res.data : (Array.isArray(res?.orders) ? res.orders : (Array.isArray(res?.rows) ? res.rows : []));

                    // 만약 구버전 스크립트여서 tabName='주문_...'으로 못 찾았을 경우 즉시 cleanBase('10 16 여성복')로 재시도
                    if (rowsArray.length === 0) {
                        const resRetry = await fetchGas(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&tabName=${encodeURIComponent(cleanBase)}&broadcastName=${encodeURIComponent(cleanBase)}&t=${Date.now()}`);
                        const retryRows = Array.isArray(resRetry?.data) ? resRetry.data : (Array.isArray(resRetry?.orders) ? resRetry.orders : []);
                        if (retryRows.length > 0) {
                            rowsArray = retryRows;
                        }
                    }

                    let bName = cleanBase;
                    let fThresh = 70000;
                    let dShip = 4000;
                    let cRate = 10;

                    const groupsMap = {};
                    rowsArray.forEach((row, idx) => {
                        let nick = '';
                        let prod = '';
                        let qtyVal = 1;
                        let priceVal = 0;
                        let shipVal = '';
                        let depVal = 0;
                        let cardRaw = '';
                        let realname = '';
                        let phone = '';
                        let zipcode = '';
                        let address = '';
                        let memo = '';
                        let vipRaw = '';
                        let noShowRaw = '';
                        let waitStr = '';
                        let pinRaw = '';
                        let confirmRaw = '';
                        let depJsonRaw = '';
                        let trkRaw = '';

                        if (Array.isArray(row)) {
                            // 배열 형태로 내려온 경우 (18열 vs 19열 우편번호 포함 자동 판별)
                            const hasZipCol = row.length >= 19;
                            nick = String(row[0] || '').trim();
                            prod = String(row[1] || '').trim();
                            qtyVal = row[2];
                            priceVal = row[3];
                            shipVal = row[4];
                            depVal = row[5];
                            cardRaw = String(row[6] || '').trim();
                            realname = String(row[7] || '').trim();
                            phone = String(row[8] || '').trim();
                            zipcode = hasZipCol ? String(row[9] || '').trim() : '';
                            address = String(row[hasZipCol ? 10 : 9] || '').trim();
                            memo = String(row[hasZipCol ? 11 : 10] || '').trim();
                            vipRaw = String(row[hasZipCol ? 12 : 11] || '').trim();
                            noShowRaw = String(row[hasZipCol ? 13 : 12] || '').trim();
                            waitStr = String(row[hasZipCol ? 14 : 13] || '').trim();
                            pinRaw = String(row[hasZipCol ? 15 : 14] || '').trim();
                            confirmRaw = String(row[hasZipCol ? 16 : 15] || '').trim();
                            depJsonRaw = String(row[hasZipCol ? 17 : 16] || '').trim();
                            trkRaw = String(row[hasZipCol ? 18 : 17] || '').trim();
                        } else if (row && typeof row === 'object') {
                            nick = String(pickRowField(row, ['닉네임', '주문자', '고객명', 'nickname', 'customer'], 0)).trim();
                            prod = String(pickRowField(row, ['상품명', '품목', '제품명', 'product', 'name'], 1)).trim();
                            qtyVal = pickRowField(row, ['수량', '개수', 'qty', 'quantity'], 2);
                            priceVal = pickRowField(row, ['단가(제품금액)', '제품금액', '단가', '금액', '가격', 'price'], 3);
                            shipVal = pickRowField(row, ['배송비', '택배비', 'shipping'], 4);
                            depVal = pickRowField(row, ['입금액', '입금', 'deposit'], 5);
                            cardRaw = String(pickRowField(row, ['카드결제', '카드', 'card'], 6)).trim();
                            realname = String(pickRowField(row, ['수령인명', '수령인', '이름', '성명', 'realname'], 7)).trim();
                            phone = String(pickRowField(row, ['연락처', '전화번호', '핸드폰번호', 'phone'], 8)).trim();
                            zipcode = String(pickRowField(row, ['우편번호', 'zipcode'])).trim();
                            address = String(pickRowField(row, ['주소', '배송지', 'address'], 9)).trim();
                            memo = String(pickRowField(row, ['요청사항', '배송메모', '메모', 'memo'], 10)).trim();
                            vipRaw = String(pickRowField(row, ['VIP여부', 'VIP'], 11)).trim();
                            noShowRaw = String(pickRowField(row, ['노쇼여부', '노쇼'], 12)).trim();
                            waitStr = String(pickRowField(row, ['대기여부', '대기'], 13)).trim();
                            pinRaw = String(pickRowField(row, ['비밀번호', '비번', 'pin'], 14)).trim();
                            confirmRaw = String(pickRowField(row, ['주문확인', '확인'], 15)).trim();
                            depJsonRaw = String(pickRowField(row, ['입금내역JSON', '입금내역'], 16)).trim();
                            trkRaw = String(pickRowField(row, ['송장번호', '운송장번호', '송장'], 17)).trim();
                        }

                        if (zipcode && address && !address.startsWith('(')) {
                            address = `(${zipcode}) ${address}`;
                        }
                        memo = cleanMemoText(memo, address);

                        if (!nick || nick === '닉네임' || nick === '주문자') return;
                        if (nick.startsWith('___WORKSPACE')) {
                            if (prod) bName = prod;
                            if (Number(qtyVal) > 0) fThresh = Number(qtyVal);
                            if (Number(priceVal) >= 0 && priceVal !== '') dShip = Number(priceVal);
                            if (Number(shipVal) > 0) cRate = Number(shipVal);
                            return;
                        }

                        if (!groupsMap[nick]) {
                            let cardMode = 'none';
                            if (cardRaw.includes('완료')) cardMode = 'completed';
                            else if (cardRaw.startsWith('O') || cardRaw.includes('카드') || cardRaw === 'true') cardMode = 'requested';

                            let parsedDeposits = [];
                            if (depJsonRaw) {
                                try {
                                    const p = JSON.parse(depJsonRaw);
                                    if (Array.isArray(p)) parsedDeposits = p;
                                } catch (e) {}
                            }

                            const cleanShipNum = shipVal !== '' && shipVal !== undefined ? Number(String(shipVal).replace(/[^0-9.-]/g, '')) : dShip;

                            groupsMap[nick] = {
                                nick: nick,
                                realname: realname,
                                phone: fixPhoneNumber(phone),
                                address: address,
                                memo: memo,
                                shipping: isNaN(cleanShipNum) ? dShip : cleanShipNum,
                                deposit: 0,
                                cardMode: cardMode,
                                isVip: vipRaw === 'O' || vipRaw === 'true',
                                isNoShow: noShowRaw === 'O' || noShowRaw === 'true',
                                isConfirmed: confirmRaw === 'O' || confirmRaw === 'true',
                                pin: normalizePin4(pinRaw),
                                trackingNumber: String(trkRaw || '').replace(/^'+/, '').trim(),
                                deposits: parsedDeposits,
                                showDeposits: false,
                                items: []
                            };
                        } else {
                            // 동일 고객의 다른 행에 수령인/주소/송장 정보가 들어있는 경우 보완
                            if (!groupsMap[nick].realname && realname) groupsMap[nick].realname = realname;
                            if (!groupsMap[nick].phone && phone) groupsMap[nick].phone = fixPhoneNumber(phone);
                            if (!groupsMap[nick].address && address) groupsMap[nick].address = address;
                            if (!groupsMap[nick].memo && memo) groupsMap[nick].memo = memo;
                            if (!groupsMap[nick].trackingNumber && trkRaw) groupsMap[nick].trackingNumber = String(trkRaw).replace(/^'+/, '').trim();
                        }

                        const depNum = Number(String(depVal || '0').replace(/[^0-9.-]/g, '')) || 0;
                        if (depNum > 0) groupsMap[nick].deposit += depNum;

                        const isWait = waitStr === 'O' || waitStr.includes('대기');
                        const waitMatch = waitStr.match(/(\d+)/);
                        const waitlistOrder = waitMatch ? Number(waitMatch[1]) : (isWait ? 1 : 0);

                        if (prod) {
                            groupsMap[nick].items.push({
                                id: `item_${Date.now()}_${idx}_${Math.random()}`,
                                product: prod,
                                qty: Number(String(qtyVal || '1').replace(/[^0-9.-]/g, '')) || 1,
                                price: Number(String(priceVal || '0').replace(/[^0-9.-]/g, '')) || 0,
                                isWaitlist: isWait,
                                waitlistOrder: waitlistOrder
                            });
                        }
                    });

                    setBroadcastName(bName);
                    setFreeShipThreshold(fThresh);
                    setDefaultShipping(dShip);
                    setCardFeeRate(cRate);
                    const loadedGroups = Object.values(groupsMap);
                    setCustomerGroups(loadedGroups);
                    syncBroadcastGroupsToFirebase(bName, loadedGroups, fThresh, cRate, customerCredits, 'init');

                    // Firebase에 이 방송 전용으로 고객이 방금 변경한 주소가 있다면 즉시 덮어쓰기 반영
                    if (staffFbDb && bName) {
                        const safeBKey = String(bName).replace(/^주문_/, '').trim().replace(/[.#$\[\]\/]/g, '_');
                        staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}`).once('value').then(snap => {
                            const bAddrs = snap.val();
                            if (!bAddrs || typeof bAddrs !== 'object') return;
                            const list = Object.values(bAddrs).filter(a => a && a.nickname && a.address);
                            if (list.length === 0) return;
                            setCustomerGroups(prev => prev.map(g => {
                                const matched = list.find(a =>
                                    normalizeString(a.nickname) === normalizeString(g.nick) ||
                                    (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                                );
                                if (!matched) return g;
                                const cleanPh = fixPhoneNumber(matched.phone || '');
                                return {
                                    ...g,
                                    realname: matched.realname || g.realname,
                                    phone: cleanPh || g.phone,
                                    address: matched.address || g.address,
                                    memo: cleanMemoText(matched.memo || '', matched.address) || g.memo,
                                    pin: cleanPh.length >= 4 ? cleanPh.slice(-4) : g.pin
                                };
                            }));
                        }).catch(() => {});
                    }
                } catch (e) {
                    showToast('주문서 로드 중 오류가 발생했습니다.');
                } finally {
                    setIsLoading(false);
                }
            }, [showToast, customerCredits]);

            const loadCsOrders = useCallback(async () => {
                try {
                    const res = await fetchGas(`${DEFAULT_GAS_URL}?action=get_cs_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&t=${Date.now()}`);
                    const rawList = Array.isArray(res?.data) ? res.data : [];
                    const parsed = rawList.map((r, i) => {
                        let items = [];
                        const jsonRaw = pickRowField(r, ['전체품목JSON', 'itemsJson'], 15);
                        if (jsonRaw) {
                            try {
                                const p = JSON.parse(jsonRaw);
                                if (Array.isArray(p)) items = p;
                            } catch (e) {}
                        }
                        const cardStr = String(pickRowField(r, ['카드결제', 'card'], 13)).trim();
                        const cardMode = cardStr.includes('완료') ? 'completed' : (cardStr ? 'requested' : 'none');
                        return {
                            id: String(pickRowField(r, ['CS_ID', 'id'], 0) || `cs_${Date.now()}_${i}`),
                            createdAt: String(pickRowField(r, ['등록일시', 'createdAt'], 1) || ''),
                            sourceBroadcast: String(pickRowField(r, ['원본방송', 'sourceBroadcast'], 2) || '').replace(/^주문_/, ''),
                            csStatus: String(pickRowField(r, ['처리상태', 'csStatus'], 3) || '접수'),
                            nick: String(pickRowField(r, ['닉네임', 'nick'], 4) || ''),
                            realname: String(pickRowField(r, ['수령인명', 'realname'], 5) || ''),
                            phone: fixPhoneNumber(pickRowField(r, ['연락처', 'phone'], 6)),
                            address: String(pickRowField(r, ['주소', 'address'], 7) || ''),
                            origTracking: String(pickRowField(r, ['원송장번호', 'origTracking'], 8) || '').replace(/^'+/, ''),
                            csTracking: String(pickRowField(r, ['교반송장번호', 'csTracking'], 9) || '').replace(/^'+/, ''),
                            csMemo: String(pickRowField(r, ['CS메모', 'csMemo'], 10) || ''),
                            shipping: Number(String(pickRowField(r, ['배송비', 'shipping'], 11) || '0').replace(/[^0-9.-]/g, '')) || 0,
                            deposit: Number(String(pickRowField(r, ['입금액', 'deposit'], 12) || '0').replace(/[^0-9.-]/g, '')) || 0,
                            cardMode: cardMode,
                            items: items
                        };
                    }).filter(c => c.nick);
                    setCsGroups(parsed);
                } catch (e) {}
            }, []);

            // 찐고객사전 주소록(700명+) 로드 — 영문 헤더(nickname, realname, phone, address, zipcode, memo) 및 col_0~col_5 완벽 파싱
            const loadMasterAddresses = useCallback(async (tabsList = []) => {
                try {
                    const res = await fetchGas(`${DEFAULT_GAS_URL}?action=get_all&depId=${DEFAULT_DEP_SHEET_ID}&masterId=${DEFAULT_MASTER_SHEET_ID}&skipHeavy=false&t=${Date.now()}`);
                    const incoming = [];
                    if (res && (res.status === 'success' || res.success) && Array.isArray(res.masterAddresses)) {
                        res.masterAddresses.forEach(a => {
                            let nick = '', realname = '', phone = '', address = '', zip = '', memo = '';
                            if (Array.isArray(a)) {
                                nick = String(a[0] || '').trim();
                                realname = String(a[1] || '').trim();
                                phone = fixPhoneNumber(a[2] || '');
                                address = String(a[3] || '').trim();
                                zip = String(a[4] || '').trim();
                                memo = cleanMemoText(a[5] || a[4] || '', address);
                            } else if (a && typeof a === 'object') {
                                nick = String(pickRowField(a, ['nickname', '닉네임', '주문자', '고객명'], 0)).trim();
                                realname = String(pickRowField(a, ['realname', '수령인명', '수령인', '이름', '성명'], 1)).trim();
                                phone = fixPhoneNumber(pickRowField(a, ['phone', '연락처', '전화번호', '핸드폰번호'], 2));
                                address = String(pickRowField(a, ['address', '주소', '배송지'], 3)).trim();
                                zip = String(pickRowField(a, ['zipcode', '우편번호'], 4)).trim();
                                const rawMemo = pickRowField(a, ['memo', '배송메모', '요청사항', '메모'], 5);
                                memo = cleanMemoText(rawMemo, address);
                            }
                            // 1행 헤더 줄('nickname', 'realname') 자체는 건너뜀
                            if (nick.toLowerCase() === 'nickname' || realname.toLowerCase() === 'realname') return;
                            if (zip && /^\d{5}$/.test(zip) && address && !address.startsWith('(')) {
                                address = `(${zip}) ${address}`;
                            }
                            if ((nick || realname) && address) {
                                incoming.push({ nickname: nick || realname, realname, phone, address, memo });
                            }
                        });
                    }

                    if (res && Array.isArray(res.customerDb)) {
                        const sheetCredits = {};
                        res.customerDb.forEach(c => {
                            const n = String(c['닉네임'] || '').trim();
                            const cred = Number(String(c['적립금'] || '0').replace(/[^0-9.-]/g, '')) || 0;
                            if (n && cred > 0) sheetCredits[n] = cred;
                        });
                        if (Object.keys(sheetCredits).length > 0) {
                            setCustomerCredits(prev => ({ ...sheetCredits, ...prev }));
                        }
                    }

                    if (incoming.length > 0) {
                        setMasterAddresses(prev => {
                            const map = new Map();
                            prev.forEach(item => {
                                const k = normalizeString(item.nickname || item.realname);
                                if (k && item.address) map.set(k, item);
                            });
                            // 찐고객사전 시트의 주소를 최우선으로 등록
                            incoming.forEach(item => {
                                const k = normalizeString(item.nickname || item.realname);
                                if (k && item.address) map.set(k, item);
                            });
                            return Array.from(map.values());
                        });

                        // 현재 화면에 열려있는 고객 중 주소가 비어있고 찐고객사전에 일치하는 닉네임(또는 핸들 꼬리표 제외 일치)이 있으면 즉시 자동 반영!
                        const exactMap = new Map();
                        const handleMap = new Map();
                        incoming.forEach(item => {
                            if (item.nickname && item.address) {
                                exactMap.set(normalizeString(item.nickname), item);
                                const hKey = normalizeHandleNick(item.nickname);
                                if (hKey) handleMap.set(hKey, item);
                            }
                        });
                        setCustomerGroups(prevGroups => prevGroups.map(g => {
                            if (g.address) return g;
                            const matched = exactMap.get(normalizeString(g.nick)) || handleMap.get(normalizeHandleNick(g.nick));
                            if (!matched) return g;
                            const cleanPh = fixPhoneNumber(matched.phone);
                            return {
                                ...g,
                                realname: matched.realname || g.realname,
                                phone: cleanPh || g.phone,
                                address: matched.address,
                                memo: matched.memo || g.memo,
                                pin: cleanPh.length >= 4 ? cleanPh.slice(-4) : g.pin
                            };
                        }));
                    }
                } catch (e) {}
            }, []);

            const findMasterAddressMatch = useCallback((nick) => {
                if (!nick || masterAddresses.length === 0) return null;
                const targetNorm = normalizeString(nick);
                const targetHandle = normalizeHandleNick(nick);
                if (!targetNorm) return null;
                // 1순위: 100% 완전 일치, 2순위: 유튜브 핸들 꼬리표(-e4g 등) 제거 후 100% 일치
                return masterAddresses.find(a => normalizeString(a.nickname) === targetNorm)
                    || (targetHandle && targetHandle.length >= 2 ? masterAddresses.find(a => normalizeHandleNick(a.nickname) === targetHandle) : null)
                    || null;
            }, [masterAddresses]);

            const handleApplyMasterAddressToGroup = useCallback(async (targetNick, addrEntry) => {
                if (!targetNick || !addrEntry) return;
                const cleanBName = (broadcastName || selectedTab).replace(/^주문_/, '').trim();
                const canonicalTab = '주문_' + cleanBName;
                const cleanPh = fixPhoneNumber(addrEntry.phone);

                        memo: addrEntry.memo || g.memo,

                    } : g);

                    return nextGroups;

                if (staffFbDb) {

                    staffFbDb.ref(`ember_live_data/_portal_addresses/${safeNickKey}`).set({
                        nickname: targetNick,
                        realname: addrEntry.realname || '',
                        phone: cleanPh,
                        address: addrEntry.address || '',
                        memo: addrEntry.memo || '',
                        updatedAt: new Date().toISOString()
                    }).catch(() => {});
                }

                await fetchGas(DEFAULT_GAS_URL, {
                    action: 'save_master_address',
                    masterId: DEFAULT_MASTER_SHEET_ID,
                    data: {
                        nickname: targetNick,
                        realname: addrEntry.realname || '',
                        phone: cleanPh,
                        address: addrEntry.address || '',
                        memo: addrEntry.memo || '',
                        sheetTabName: canonicalTab,

                    }
                });
                showToast(`📗 '${targetNick}' 님께 찐고객사전 배송지(${addrEntry.realname})가 즉시 연동·저장되었습니다!`);
            }, [broadcastName, selectedTab, freeShipThreshold, cardFeeRate, customerCredits, showToast]);

            const loadInitialTabs = useCallback(async () => {
                setIsLoading(true);
                try {
                    const res = await fetchGas(`${DEFAULT_GAS_URL}?action=get_order_tabs&masterId=${DEFAULT_MASTER_SHEET_ID}&t=${Date.now()}`);
                    const rawTabs = (res && Array.isArray(res.tabs)) ? res.tabs : [];

                    const uniqueOrderTabs = Array.from(new Set(
                        rawTabs.map(toCanonicalOrderTab).filter(Boolean)
                    ));

                    // 시트 탭 위치와 무관하게 날짜 숫자가 가장 늦은(최신) 방송이 무조건 맨 앞(0번)에 오도록 정렬!
                    const sortedByNewest = [...uniqueOrderTabs].sort((a, b) => {
                        const scoreA = extractBroadcastDateScore(a);
                        const scoreB = extractBroadcastDateScore(b);
                        if (scoreA !== scoreB) return scoreB - scoreA;
                        return 0;
                    });

                    setOrderTabs(sortedByNewest);
                    const firstTab = sortedByNewest[0] || '';
                    setSelectedTab(firstTab);
                    if (firstTab) {
                        await loadSheetOrders(firstTab);
                    } else {
                        setIsLoading(false);
                    }
                    loadCsOrders();
                    loadMasterAddresses(sortedByNewest);
                } catch (e) {
                    setIsLoading(false);
                }
            }, [loadSheetOrders, loadCsOrders, loadMasterAddresses]);

            useEffect(() => {
                loadInitialTabs();
                if (staffFbDb) {
                    const credRef = staffFbDb.ref('ember_live_data/_portal_credits');
                    const portalAddrRef = staffFbDb.ref('ember_live_data/_portal_addresses');
                    const portalConfRef = staffFbDb.ref('ember_live_data/_portal_confirmed');
                    const cleanCurBForRef = String(broadcastName || selectedTab || '').replace(/^주문_/, '').trim();
                    const safeCurBKey = cleanCurBForRef ? cleanCurBForRef.replace(/[.#$\[\]\/]/g, '_') : '';
                    const portalBcastAddrRef = safeCurBKey ? staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeCurBKey}`) : null;

                    const onCred = (snap) => {
                        const val = snap.val();
                        if (!val || typeof val !== 'object') return;
                        const next = {};
                        Object.values(val).forEach(c => {
                            if (c && c.nickname && Number(c.credit) >= 0) {
                                next[c.nickname] = Number(c.credit);
                            }
                        });
                        setCustomerCredits(next);
                    };

                    const onPortalAddr = (snap) => {
                        const val = snap.val();
                        if (!val || typeof val !== 'object') return;
                        const cleanCurB = String(broadcastName || selectedTab || '').replace(/^주문_/, '').trim();
                        // 현재 직원 화면에 선택된 방송과 일치하는 배송지 변경 건만 현재 방송 주문서에 반영! (다른 방송 배송지는 건드리지 않음)
                        const incoming = Object.values(val).filter(a => {
                            if (!a || !a.nickname || !a.address) return false;
                            if (!a.broadcastName || !cleanCurB) return true;
                            const aBName = String(a.broadcastName).replace(/^주문_/, '').trim();
                            return normalizeString(aBName) === normalizeString(cleanCurB);
                        });
                        if (incoming.length === 0) return;
                        setCustomerGroups(prev => prev.map(g => {
                            const matched = incoming.find(a =>
                                normalizeString(a.nickname) === normalizeString(g.nick) ||
                                (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                            );
                            if (!matched) return g;
                            const cleanPh = fixPhoneNumber(matched.phone || '');
                            return {
                                ...g,
                                realname: matched.realname || g.realname,
                                phone: cleanPh || g.phone,
                                address: matched.address || g.address,
                                memo: cleanMemoText(matched.memo || '', matched.address) || g.memo,
                                pin: cleanPh.length >= 4 ? cleanPh.slice(-4) : g.pin
                            };
                        }));
                    };

                    const onPortalBcastAddr = (snap) => {
                        const val = snap.val();
                        if (!val || typeof val !== 'object') return;
                        const incoming = Object.values(val).filter(a => a && a.nickname && a.address);
                        if (incoming.length === 0) return;
                        setCustomerGroups(prev => prev.map(g => {
                            const matched = incoming.find(a =>
                                normalizeString(a.nickname) === normalizeString(g.nick) ||
                                (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                            );
                            if (!matched) return g;
                            const cleanPh = fixPhoneNumber(matched.phone || '');
                            return {
                                ...g,
                                realname: matched.realname || g.realname,
                                phone: cleanPh || g.phone,
                                address: matched.address || g.address,
                                memo: cleanMemoText(matched.memo || '', matched.address) || g.memo,
                                pin: cleanPh.length >= 4 ? cleanPh.slice(-4) : g.pin
                            };
                        }));
                    };

                    const onPortalConf = (snap) => {
                        const val = snap.val();
                        if (!val || typeof val !== 'object') return;
                        const confList = Object.values(val).filter(c => c && c.nickname);
                        if (confList.length === 0) return;
                        setCustomerGroups(prev => prev.map(g => {
                            const isConf = confList.some(c =>
                                normalizeString(c.nickname) === normalizeString(g.nick) ||
                                (normalizeHandleNick(c.nickname) && normalizeHandleNick(c.nickname) === normalizeHandleNick(g.nick))
                            );
                            return isConf && !g.isConfirmed ? { ...g, isConfirmed: true } : g;
                        }));
                    };

                    credRef.on('value', onCred);
                    portalAddrRef.on('value', onPortalAddr);
                    if (portalBcastAddrRef) portalBcastAddrRef.on('value', onPortalBcastAddr);
                    portalConfRef.on('value', onPortalConf);
                    return () => {
                        credRef.off('value', onCred);
                        portalAddrRef.off('value', onPortalAddr);
                        if (portalBcastAddrRef) portalBcastAddrRef.off('value', onPortalBcastAddr);
                        portalConfRef.off('value', onPortalConf);
                    };
                }
            }, [loadInitialTabs, broadcastName, selectedTab]);

            const handleUpdateCustomerCredit = useCallback(async (nick, nextCreditAmt) => {
                const cleanAmt = Math.max(0, Number(nextCreditAmt) || 0);
                setCustomerCredits(prev => ({ ...prev, [nick]: cleanAmt }));
                if (staffFbDb) {
                    const safeKey = String(nick || '').replace(/[.#$\[\]\/]/g, '_').trim();
                    if (safeKey) {
                        staffFbDb.ref(`ember_live_data/_portal_credits/${safeKey}`).set({
                            nickname: nick,
                            credit: cleanAmt,
                            updatedAt: Date.now()
                        }).catch(() => {});
                    }
                }
                await fetchGas(DEFAULT_GAS_URL, {
                    action: 'save_customer_credit',
                    masterId: DEFAULT_MASTER_SHEET_ID,
                    data: { nickname: nick, credit: cleanAmt }
                });
                showToast(`💰 '${nick}' 님의 보유 적립금이 ${cleanAmt.toLocaleString()}원으로 저장되었습니다!`);
            }, [showToast]);

            const handleGlobalSearch = async () => {
                const kw = globalKeyword.trim();
                if (!kw) {
                    setGlobalSearchResults(null);
                    return;
                }
                setIsSearchingGlobal(true);
                try {
                    const res = await fetchGas(`${DEFAULT_GAS_URL}?action=search_all_broadcasts&masterId=${DEFAULT_MASTER_SHEET_ID}&keyword=${encodeURIComponent(kw)}&t=${Date.now()}`);
                    if (res && res.success && Array.isArray(res.results)) {
                        setGlobalSearchResults(res.results);
                    } else {
                        setGlobalSearchResults([]);
                    }
                } catch (e) {
                    setGlobalSearchResults([]);
                } finally {
                    setIsSearchingGlobal(false);
                }
            };

            const getGroupSummary = useCallback((g) => {
                const activeItems = (g.items || []).filter(i => !i.isWaitlist);
                const waitItems = (g.items || []).filter(i => i.isWaitlist);
                const prodTotal = activeItems.reduce((s, i) => s + (Number(i.price) || 0), 0);
                const prodForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);

                let ship = 0;
                if (activeItems.length > 0 && !g.isVip) {
                    if (g.shipping !== undefined && g.shipping !== '') {
                        ship = Number(g.shipping);
                    } else {
                        ship = (freeShipThreshold > 0 && prodForShip >= freeShipThreshold) ? 0 : defaultShipping;
                    }
                }
                const baseGrand = prodTotal + ship;
                const dep = Number(g.deposit) || 0;
                const baseBal = baseGrand - dep;
                const feeRate = Number(cardFeeRate) > 0 ? Number(cardFeeRate) / 100 : 0.1;
                const cardFee = (g.cardMode !== 'none' && baseBal > 0) ? Math.round(baseBal * feeRate) : 0;
                const finalGrand = baseGrand + cardFee;
                const finalBal = baseBal + cardFee;
                const isPaid = activeItems.length > 0 && baseBal <= 0 && g.cardMode === 'none';

                return { activeItems, waitItems, prodTotal, ship, baseGrand, dep, baseBal, cardFee, finalGrand, finalBal, isPaid };
            }, [freeShipThreshold, defaultShipping, cardFeeRate]);

            const handleSaveAll = useCallback(async () => {
                if (isSaving) return;
                setIsSaving(true);
                try {
                    if (activeMainTab === 'cs') {
                        const res = await fetchGas(DEFAULT_GAS_URL, {
                            action: 'save_cs_orders',
                            masterId: DEFAULT_MASTER_SHEET_ID,
                            items: csGroups
                        });
                        if (res && res.success) showToast('✅ 교환/반품 CS 시트 저장 완료!');
                        else showToast('🚨 CS 시트 저장 실패');
                    } else {
                        const cleanBName = (broadcastName || selectedTab).replace(/^주문_/, '').trim();
                        const canonicalTab = '주문_' + cleanBName;
                        const rowsToSave = [{
                            '닉네임': '___WORKSPACE_META___',
                            '상품명': cleanBName,
                            '수량': Number(freeShipThreshold) || 70000,
                            '단가(제품금액)': Number(defaultShipping) || 4000,
                            '배송비': Number(cardFeeRate) || 10,
                            '입금액': 0,
                            '카드결제': '', '수령인명': '', '연락처': '', '주소': '', '요청사항': '',
                            'VIP여부': '', '노쇼여부': '', '대기여부': '', '비밀번호': '', '주문확인': '', '입금내역JSON': '', '송장번호': ''
                        }];

                        customerGroups.forEach(g => {
                            const sum = getGroupSummary(g);
                            const cardStr = g.cardMode === 'completed' ? `카드완료(${cardFeeRate}%)` : (g.cardMode === 'requested' ? `O(${cardFeeRate}%)` : '');
                            const cleanPh = fixPhoneNumber(g.phone);
                            const pinStr = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                            const depJson = Array.isArray(g.deposits) && g.deposits.length > 0 ? JSON.stringify(g.deposits) : '';
                            const itemsList = (g.items && g.items.length > 0) ? g.items : [{ product: '', qty: 1, price: 0, isWaitlist: false, waitlistOrder: 0 }];

                            itemsList.forEach((it, idx) => {
                                const waitCell = it.isWaitlist ? `대기${it.waitlistOrder || 1}번` : '';
                                rowsToSave.push({
                                    '닉네임': g.nick,
                                    '상품명': it.product || '',
                                    '수량': Number(it.qty) || 1,
                                    '단가(제품금액)': Number(it.price) || 0,
                                    '배송비': sum.ship,
                                    '입금액': idx === 0 ? sum.dep : 0,
                                    '카드결제': cardStr,
                                    '수령인명': g.realname || '',
                                    '연락처': cleanPh ? "'" + cleanPh : '',
                                    '주소': g.address || '',
                                    '요청사항': cleanMemoText(g.memo, g.address),
                                    'VIP여부': g.isVip ? 'O' : '',
                                    '노쇼여부': g.isNoShow ? 'O' : '',
                                    '대기여부': waitCell,
                                    '비밀번호': pinStr ? "'" + pinStr : '',
                                    '주문확인': g.isConfirmed ? 'O' : '',
                                    '입금내역JSON': idx === 0 ? depJson : '',
                                    '송장번호': g.trackingNumber ? "'" + String(g.trackingNumber).replace(/^'+/, '') : ''
                                });
                            });
                        });

                        const res = await fetchGas(DEFAULT_GAS_URL, {
                            action: 'save_staff_sheet_orders',
                            masterId: DEFAULT_MASTER_SHEET_ID,
                            tabName: canonicalTab,
                            broadcastName: cleanBName,
                            rows: rowsToSave
                        });
