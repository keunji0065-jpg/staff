                            </div>

                            {isCsLoading ? (
                                <div className="bg-white rounded-lg p-12 text-center text-xs font-bold text-slate-400 flex items-center justify-center gap-2">
                                    <Icon name="spinner" className="animate-spin" size={18} /> 교환/반품 CS 데이터를 불러오는 중...
                                </div>
                            ) : groupedCsCards.length === 0 ? (
                                <div className="bg-white rounded-lg p-12 text-center text-xs font-bold text-slate-400 border border-slate-200">
                                    등록된 교환/반품 CS 주문서가 없습니다.<br/>
                                    <span className="text-[11px] font-normal text-slate-400 mt-1 block">주문 조회 탭에서 고객 카드의 [교환/반품 CS복사] 버튼을 누르면 해당 고객의 주문서가 그대로 이곳에 복사됩니다.</span>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {groupedCsCards.map(card => {
                                        const isDone = card.csStatus === '처리완료';
                                        const targetCsCount = card.items.filter(i => i.csType && i.csType !== '정상').length;
                                        const returnSum = card.items
                                            .filter(i => i.csType === '반품' || i.csType === '부분반품')
                                            .reduce((s, i) => s + (Number(i.price) || 0), 0);

                                        return (
                                            <div key={card.groupKey} className={`bg-white rounded-lg border shadow-sm overflow-hidden transition-all ${isDone ? 'border-slate-200 opacity-75' : 'border-slate-300'}`}>
                                                <div className={`px-4 py-2.5 border-b flex flex-wrap items-center justify-between gap-2 ${isDone ? 'bg-slate-100' : 'bg-amber-50/70 border-amber-200'}`}>
                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                        <select
                                                            value={card.csStatus}
                                                            onChange={e => handleUpdateCsGroupField(card.broadcast, card.customer, 'csStatus', e.target.value)}
                                                            className={`text-xs font-extrabold px-2.5 py-1 rounded border outline-none ${
                                                                card.csStatus === '처리완료'
                                                                    ? 'bg-emerald-600 text-white border-emerald-700'
                                                                    : card.csStatus === '접수'
                                                                        ? 'bg-red-600 text-white border-red-700'
                                                                        : 'bg-blue-600 text-white border-blue-700'
                                                            }`}
                                                        >
                                                            <option value="접수" className="bg-white text-slate-800">📌 접수</option>
                                                            <option value="회수중" className="bg-white text-slate-800">🚚 회수중</option>
                                                            <option value="입고확인" className="bg-white text-slate-800">📦 입고확인</option>
                                                            <option value="재발송완료" className="bg-white text-slate-800">🚀 재발송완료</option>
                                                            <option value="환불대기" className="bg-white text-slate-800">💰 환불대기</option>
                                                            <option value="처리완료" className="bg-white text-slate-800">✅ 처리완료</option>
                                                        </select>

                                                        <span className="text-[11px] font-extrabold bg-slate-800 text-white px-2 py-0.5 rounded">
                                                            📅 원본: {card.broadcast}
                                                        </span>

                                                        <span
                                                            onClick={() => handleCopyText(card.customer, `cs_nick_${card.groupKey}`)}
                                                            className={`font-extrabold text-sm cursor-pointer px-1.5 py-0.5 rounded flex items-center gap-1 ${
                                                                copiedKey === `cs_nick_${card.groupKey}` ? 'bg-emerald-500 text-white' : 'text-slate-900 hover:bg-blue-50'
                                                            }`}
                                                        >
                                                            <span>{card.customer}</span>
                                                            <Icon name="copy" size={12} className="text-slate-400" />
                                                        </span>

                                                        <button
                                                            type="button"
                                                            onClick={() => handleAddCsItemToGroup(card)}
                                                            className="bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 text-[11px] font-extrabold px-2 py-0.5 rounded"
                                                        >
                                                            + 품목추가
                                                        </button>

                                                        <span className="text-[11px] font-extrabold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded">
                                                            전체 {card.items.length}품목 중 교반지정 {targetCsCount}건
                                                        </span>
                                                        {returnSum > 0 && (
                                                            <span className="text-[11px] font-extrabold text-purple-700 bg-purple-50 border border-purple-200 px-2 py-0.5 rounded">
                                                                반품합계 {returnSum.toLocaleString()}원
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="flex items-center gap-2">
                                                        {card.createdAt && <span className="text-[11px] text-slate-500 font-bold">{card.createdAt}</span>}
                                                        <button
                                                            type="button"
                                                            onClick={() => handleDeleteCsGroup(card.broadcast, card.customer)}
                                                            className="text-xs font-bold text-red-600 hover:bg-red-50 px-2 py-1 rounded border border-red-200 flex items-center gap-1"
                                                        >
                                                            <Icon name="trash" weight="bold" size={13} />
                                                            <span>카드삭제</span>
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="px-4 py-2 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center gap-2 text-xs">
                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                        <span className="text-[11px] font-bold text-slate-500">수하인:</span>
                                                        <input
                                                            type="text"
                                                            value={card.realname}
                                                            onChange={e => handleUpdateCsGroupField(card.broadcast, card.customer, 'realname', e.target.value)}
                                                            placeholder="수하인명"
                                                            className="w-20 font-extrabold text-emerald-700 bg-white border border-slate-300 rounded px-2 py-1 outline-none"
                                                        />
                                                    </div>
                                                    <div className="flex items-center gap-1 shrink-0">
                                                        <input
                                                            type="text"
                                                            value={card.phone}
                                                            onChange={e => handleUpdateCsGroupField(card.broadcast, card.customer, 'phone', e.target.value.replace(/[^0-9]/g, ''))}
                                                            placeholder="연락처"
                                                            className="w-28 font-extrabold text-slate-700 bg-white border border-slate-300 rounded px-2 py-1 outline-none"
                                                        />
                                                        {card.phone && (
                                                            <button
                                                                type="button"
                                                                onClick={() => handleCopyText(card.phone, `cs_phone_${card.groupKey}`)}
                                                                className={`px-1.5 py-1 rounded border text-[11px] font-bold ${
                                                                    copiedKey === `cs_phone_${card.groupKey}` ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-white text-slate-600 border-slate-300'
                                                                }`}
                                                            >
                                                                복사
                                                            </button>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-1.5 flex-1 min-w-[200px]">
                                                        <span className="text-[11px] font-bold text-slate-500 shrink-0">주소:</span>
                                                        <input
                                                            type="text"
                                                            value={card.address}
                                                            onChange={e => handleUpdateCsGroupField(card.broadcast, card.customer, 'address', e.target.value)}
                                                            placeholder="회수/재발송 배송지 주소"
                                                            className="w-full font-medium text-slate-700 bg-white border border-slate-300 rounded px-2.5 py-1 outline-none focus:border-blue-600"
                                                        />
                                                    </div>
                                                </div>

                                                <div className="p-2.5 divide-y divide-slate-100">
                                                    <div className="pb-1.5 px-1 flex items-center justify-between text-[11px] font-extrabold text-slate-500">
                                                        <span>👇 아래 주문 품목 중 교환/반품할 품목을 클릭해 지정하세요</span>
                                                        <span>구분 클릭 시 상태 변경</span>
                                                    </div>
                                                    {card.items.map(item => {
                                                        const isTargetCs = item.csType && item.csType !== '정상';
                                                        const rowBgClass = !isTargetCs
                                                            ? 'bg-white opacity-65 hover:opacity-100'
                                                            : item.csType === '교환'
                                                                ? 'bg-amber-50/80 border-l-4 border-l-amber-500 pl-2'
                                                                : 'bg-purple-50/80 border-l-4 border-l-purple-600 pl-2';

                                                        return (
                                                            <div key={item.csId} className={`py-2 flex flex-wrap sm:flex-nowrap items-center gap-2 text-xs transition-all ${rowBgClass}`}>
                                                                <div className="flex items-center gap-1 shrink-0">
                                                                    {[
                                                                        { type: '정상', label: '정상유지', activeCls: 'bg-slate-600 text-white border-slate-700' },
                                                                        { type: '교환', label: '🔄 교환', activeCls: 'bg-amber-500 text-white border-amber-600 shadow-sm' },
                                                                        { type: '반품', label: '↩️ 반품', activeCls: 'bg-purple-600 text-white border-purple-700 shadow-sm' },
                                                                        { type: '불량CS', label: '⚠️ 불량/오배송', activeCls: 'bg-red-600 text-white border-red-700 shadow-sm' }
                                                                    ].map(btn => (
                                                                        <button
                                                                            key={btn.type}
                                                                            type="button"
                                                                            onClick={() => handleUpdateCsField(item.csId, 'csType', btn.type)}
                                                                            className={`px-2 py-1 rounded text-[11px] font-extrabold border transition-all ${
                                                                                (item.csType || '정상') === btn.type
                                                                                    ? btn.activeCls
                                                                                    : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100'
                                                                            }`}
                                                                        >
                                                                            {btn.label}
                                                                        </button>
                                                                    ))}
                                                                </div>

                                                                <input
                                                                    type="text"
                                                                    value={item.product}
                                                                    onChange={e => handleUpdateCsField(item.csId, 'product', e.target.value)}
                                                                    placeholder="상품명 입력"
                                                                    className={`flex-1 min-w-[160px] font-extrabold px-2 py-1 rounded border outline-none ${
                                                                        isTargetCs ? 'text-slate-900 bg-white border-slate-300 focus:border-blue-600' : 'text-slate-500 bg-transparent border-transparent hover:border-slate-200'
                                                                    }`}
                                                                />

                                                                <div className="flex items-center gap-1 shrink-0">
                                                                    <input
                                                                        type="number"
                                                                        min="1"
                                                                        value={item.quantity}
                                                                        onChange={e => handleUpdateCsField(item.csId, 'quantity', Number(e.target.value) || 1)}
                                                                        className="w-12 text-right font-extrabold bg-white border border-slate-200 rounded px-1.5 py-1 outline-none"
                                                                    />
                                                                    <span className="text-[11px] text-slate-400">개</span>
                                                                </div>

                                                                <div className="flex items-center gap-1 shrink-0">
                                                                    <input
                                                                        type="text"
                                                                        value={Number(item.price || 0).toLocaleString()}
                                                                        onChange={e => {
                                                                            const raw = e.target.value.replace(/[^0-9-]/g, '');
                                                                            handleUpdateCsField(item.csId, 'price', Number(raw) || 0);
                                                                        }}
                                                                        className="w-24 text-right font-extrabold bg-white border border-slate-200 rounded px-2 py-1 outline-none"
                                                                    />
                                                                    <span className="text-[11px] text-slate-400">원</span>
                                                                </div>

                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleDeleteCsItem(item.csId, card.customer, item.product)}
                                                                    className="text-slate-300 hover:text-red-600 p-1 shrink-0"
                                                                >
                                                                    <Icon name="x" weight="bold" size={14} />
                                                                </button>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                <div className="px-3.5 py-2.5 bg-slate-50 border-t border-slate-200 grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs">
                                                    <div className="sm:col-span-3 flex items-center gap-1.5">
                                                        <span className="text-[11px] font-bold text-slate-500 shrink-0">원송장:</span>
                                                        <input
                                                            type="text"
                                                            value={card.origTracking}
                                                            onChange={e => handleUpdateCsGroupField(card.broadcast, card.customer, 'origTracking', e.target.value)}
                                                            placeholder="기존 출고 송장번호"
                                                            className="flex-1 font-mono font-bold text-slate-700 bg-white border border-slate-300 rounded px-2 py-1.5 outline-none"
                                                        />
                                                    </div>
                                                    <div className="sm:col-span-4 flex items-center gap-1.5">
                                                        <span className="text-[11px] font-extrabold text-red-600 shrink-0">📦 교반송장:</span>
                                                        <input
                                                            type="text"
                                                            value={card.csTracking}
                                                            onChange={e => handleUpdateCsGroupField(card.broadcast, card.customer, 'csTracking', e.target.value)}
                                                            placeholder="회수/재발송 운송장번호 입력"
                                                            className="flex-1 font-mono font-extrabold text-red-600 bg-white border-2 border-red-300 rounded px-2 py-1.5 focus:border-red-600 outline-none"
                                                        />
                                                    </div>
                                                    <div className="sm:col-span-5 flex items-center gap-1.5">
                                                        <span className="text-[11px] font-extrabold text-blue-700 shrink-0">📝 CS내용:</span>
                                                        <input
                                                            type="text"
                                                            value={card.csMemo}
                                                            onChange={e => handleUpdateCsGroupField(card.broadcast, card.customer, 'csMemo', e.target.value)}
                                                            placeholder="교환사이즈, 불량사유, 환불계좌 등 CS 상세내용 입력"
                                                            className="flex-1 font-bold text-slate-800 bg-white border-2 border-blue-200 rounded px-2.5 py-1.5 focus:border-blue-600 outline-none"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {}
                    {activeSubTab === 'tracking' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white rounded-lg p-5 border border-slate-300 shadow-sm space-y-4">
                                <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                                    <Icon name="microsoft-excel-logo" weight="fill" className="text-emerald-600" size={18} />
                                    <span>방법 A. 롯데택배 출고 엑셀 파일 업로드</span>
                                </h2>
                                <p className="text-xs text-slate-500">엑셀 내 <strong>[수하인명]</strong>과 <strong>[운송장번호]</strong> 열을 자동 인식하여 현재 선택된 <strong>[{broadcastTitle}]</strong> 주문서에 매칭합니다.</p>
                                <input type="file" accept=".xlsx,.xls,.csv" ref={fileInputRef} onChange={handleExcelUploadForTracking} className="hidden" />
                                <button
                                    onClick={() => fileInputRef.current?.click()}
                                    className="w-full py-6 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-lg bg-slate-50 hover:bg-blue-50/40 font-extrabold text-xs text-slate-700 flex flex-col items-center justify-center gap-2 transition-all"
                                >
                                    <Icon name="upload-simple" weight="bold" size={24} className="text-blue-600" />
                                    <span>클릭하여 롯데택배 엑셀 파일 선택 (.xlsx, .xls, .csv)</span>
                                </button>
                            </div>

                            <div className="bg-white rounded-lg p-5 border border-slate-300 shadow-sm space-y-3">
                                <h2 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                                    <Icon name="clipboard-text" weight="fill" className="text-blue-600" size={18} />
                                    <span>방법 B. 엑셀 영역 복사 & 붙여넣기</span>
                                </h2>
                                <textarea
                                    value={pasteText}
                                    onChange={e => handleParsePasteText(e.target.value)}
                                    placeholder={"예시:\n김은지\t2548-1920-3841\n박선영\t2548-3381-9920"}
                                    className="w-full h-32 p-3 bg-slate-50 border border-slate-300 rounded text-xs font-bold outline-none focus:bg-white focus:border-slate-500 resize-none"
                                />
                            </div>

                            {parsedRows.length > 0 && (
                                <div className="md:col-span-2 bg-white rounded-lg p-5 border border-slate-300 shadow-sm space-y-3">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-extrabold text-slate-800">인식된 운송장 목록 ({parsedRows.length}건)</span>
                                        <button
                                            onClick={() => submitTrackingBatch(parsedRows)}
                                            disabled={isSaving}
                                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-extrabold text-xs shadow-sm"
                                        >
                                            {isSaving ? "매칭 등록 중..." : `🚀 [${broadcastTitle}] 주문서에 일괄 등록하기`}
                                        </button>
                                    </div>
                                    <div className="max-h-48 overflow-y-auto border border-slate-200 rounded divide-y divide-slate-100 text-xs">
                                        {parsedRows.map((r, i) => (
                                            <div key={i} className="px-3 py-1.5 flex justify-between items-center">
                                                <span className="font-bold text-slate-800">{r.realname}</span>
                                                <span className="font-mono font-bold text-blue-600">{r.trackingNumber}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {trackingResultMsg && (
                                <div className="md:col-span-2 bg-emerald-600 text-white p-4 rounded-lg font-extrabold text-xs flex items-center gap-2">
                                    <Icon name="check-circle" weight="fill" size={18} />
                                    <span>{trackingResultMsg}</span>
                                </div>
                            )}

                            {duplicates.length > 0 && (
                                <div className="md:col-span-2 bg-amber-50 border-2 border-amber-300 rounded-lg p-4 space-y-3">
                                    <div className="text-xs font-black text-amber-900">
                                        ⚠️ 동명이인 고객이 감지되었습니다 ({duplicates.length}건) — 주소를 확인하고 선택해 주세요!
                                    </div>
                                    {duplicates.map((d, idx) => (
                                        <div key={idx} className="bg-white p-3 rounded border border-amber-200 space-y-2">
                                            <div className="flex justify-between text-xs font-extrabold">
                                                <span>수하인명: {d.realname}</span>
                                                <span className="text-red-600 font-mono">운송장: {d.trackingNumber}</span>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                {(d.candidates || d.nicknames.map(n => ({ nickname: n }))).map((c, cIdx) => (
                                                    <button
                                                        key={cIdx}
                                                        onClick={() => handleResolveDuplicate(d, c.nickname)}
                                                        className="p-2.5 rounded border border-slate-300 hover:border-blue-600 hover:bg-blue-50 text-left text-xs"
                                                    >
                                                        <div className="font-black text-slate-900">닉네임: {c.nickname}</div>
                                                        {c.address && <div className="text-[11px] text-slate-500 mt-0.5">{c.address}</div>}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {activeSubTab === 'print' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white rounded-lg p-6 border border-slate-300 shadow-sm text-center space-y-4">
                                <div className="w-12 h-12 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center mx-auto">
                                    <Icon name="clipboard-text" weight="fill" size={26} />
                                </div>
                                <div>
                                    <h3 className="text-base font-black text-slate-900">발주용 품목 집계 엑셀</h3>
                                    <p className="text-xs text-slate-500 mt-1">[{broadcastTitle}] 방송의 상품별 입금완료 수량 / 미입금 수량 요약</p>
                                </div>
                                <button
                                    onClick={handleExportProductOrderExcel}
                                    className="w-full py-3 bg-slate-700 hover:bg-slate-800 text-white font-extrabold rounded text-xs shadow-sm flex items-center justify-center gap-2"
                                >
                                    <Icon name="download-simple" weight="bold" size={16} />
                                    <span>발주용 품목 집계 엑셀 다운로드</span>
                                </button>
                            </div>

                            <div className="bg-white rounded-lg p-6 border border-slate-300 shadow-sm text-center space-y-4">
                                <div className="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center mx-auto">
                                    <Icon name="users" weight="fill" size={26} />
                                </div>
                                <div>
                                    <h3 className="text-base font-black text-slate-900">배송용 고객 리스트 엑셀</h3>
                                    <p className="text-xs text-slate-500 mt-1">[{broadcastTitle}] 방송의 완납/미수/주소/운송장번호 전체 출력</p>
                                </div>
                                <button
                                    onClick={handleExportDeliveryExcel}
                                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded text-xs shadow-sm flex items-center justify-center gap-2"
                                >
                                    <Icon name="download-simple" weight="bold" size={16} />
                                    <span>배송용 고객 리스트 엑셀 다운로드</span>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StaffSystemApp />);
    </script>
</body>
</html>
