                        const nextStore = { ...prevStore };
                        Object.keys(nextStore).forEach(tabKey => {
                            const blk = nextStore[tabKey];
                            if (!blk || !Array.isArray(blk.groups)) return;
                            const bTitle = cleanDisplayTabName(blk.broadcastName || tabKey);
                            const safeBKey = bTitle.replace(/[.#$\[\]\/]/g, '_');
                            const bAddrMap = allVal[safeBKey];
                            if (!bAddrMap || typeof bAddrMap !== 'object') return;
                            const addrEntries = Object.values(bAddrMap).filter(a => a && a.nickname && (a.address || a.baseAddress));
                            if (addrEntries.length === 0) return;

                            let blkChanged = false;
                            const nextGroups = blk.groups.map(g => {
                                const matched = addrEntries.find(a =>
                                    normalizeString(a.nickname) === normalizeString(g.nick) ||
                                    (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                                );
                                if (!matched) return g;
                                const newAddrStr = stripZipcode(matched.address || `${matched.baseAddress || ''} ${matched.detailAddress || ''}`.trim());
                                const newReal = matched.realname || g.realname;
                                const newPh = fixPhoneNumber(matched.phone || g.phone);
                                const newMemo = cleanMemoText(matched.memo ?? g.memo, newAddrStr);
                                if (newAddrStr && (g.address !== newAddrStr || g.realname !== newReal || g.phone !== newPh || g.memo !== newMemo)) {
                                    blkChanged = true;
                                    return {
                                        ...g,
                                        realname: newReal,
                                        phone: newPh,
                                        address: newAddrStr,
                                        memo: newMemo,
                                        pin: newPh.length >= 4 ? newPh.slice(-4) : g.pin
                                    };
                                }
                                return g;
                            });
                            if (blkChanged) {
                                storeChanged = true;
                                nextStore[tabKey] = { ...blk, groups: nextGroups };
                            }
                        });
                        return storeChanged ? nextStore : prevStore;
                    });
                };

                const handlePortalConfirmChange = (snap) => {
                    const val = snap.val();
                    if (!val || typeof val !== 'object') return;
                    const confList = Object.values(val).filter(c => c && c.nickname);
                    if (confList.length === 0) return;

                    setCustomerGroups(prev => {
                        let changed = false;
                        const next = prev.map(g => {
                            if (g.isConfirmed) return g;
                            const isConf = confList.some(c => {
                                const cBName = String(c.broadcastName || '').replace(/^주문_/, '').trim();
                                if (cBName && cleanCurB && normalizeString(cBName) !== normalizeString(cleanCurB)) return false;
                                return normalizeString(c.nickname) === normalizeString(g.nick);
                            });
                            if (isConf) {
                                changed = true;
                                return { ...g, isConfirmed: true };
                            }
                            return g;
                        });
                        return changed ? next : prev;
                    });
                };

                allAddrRef.on('value', handlePortalAllAddrChange);
                confRef.on('value', handlePortalConfirmChange);
                return () => {
                    allAddrRef.off('value', handlePortalAllAddrChange);
                    confRef.off('value', handlePortalConfirmChange);
                };
            }, [broadcastName, selectedTab]);

            // ✨ 고객이 포털에서 본인의 환불 계좌번호를 직접 입력하거나 수정했을 때 직원용 CS 화면에도 실시간으로 자동 반영!
            useEffect(() => {
                if (!staffFbDb) return;
                const refAccRef = staffFbDb.ref('ember_live_data/_portal_cs_accounts');
                const handleAccountUpdate = (snap) => {
                    const val = snap.val();
                    if (!val || typeof val !== 'object') return;
                    setCsGroups(prev => {
                        let changed = false;
                        const next = prev.map(c => {
                            const entry = val[c.id];
                            if (entry && entry.refundAccount !== undefined && String(entry.refundAccount).trim() !== String(c.refundAccount || '').trim()) {
                                changed = true;
                                return { ...c, refundAccount: String(entry.refundAccount).trim() };
                            }
                            return c;
                        });
                        return changed ? next : prev;
                    });
                };
                refAccRef.on('value', handleAccountUpdate);
                return () => refAccRef.off('value', handleAccountUpdate);
            }, []);

            // 🎥 직원용 라이브 주문서: 사장님 시트 공유 API 키 및 실시간재고 동기화
            useEffect(() => {
                if (!staffFbDb) return;
                const keyRef = staffFbDb.ref('ember_live_data/_global_config/sharedYtApiKey');
                const handleKey = (snap) => {
                    const v = snap.val();
                    if (v && String(v).trim()) {
                        setSharedYtApiKey(String(v).trim());
                    }
                };
                keyRef.on('value', handleKey);
                return () => keyRef.off('value', handleKey);
            }, []);

            const loadLiveInventoryFromMaster = useCallback(async () => {
                try {
                    const rows = await fetchGoogleSheetDirect(activeDictSheetId, '실시간재고');
                    if (Array.isArray(rows)) {
                        const parsed = rows.map((r, i) => ({
                            id: `linv_${i}`,
                            name: String(pickRowField(r, ['name', '상품명'], 0)).trim(),
                            price: Number(String(pickRowField(r, ['price', '단가'], 1) || '0').replace(/[^0-9.-]/g, '')) || 0,
                            isSoldOut: String(pickRowField(r, ['status', '상태'], 3)).trim() === '품절'
                        })).filter(it => it.name && it.name.toLowerCase() !== 'name' && it.name !== '__EMPTY__');
                        setLiveInventory(parsed);
                    }
                } catch (e) {}
            }, [activeDictSheetId]);

            const handleClearLiveInventory = useCallback(() => {
                if (liveInventory.length === 0) return showToast('이미 방송 라인업이 비어 있습니다.');
                openModal(
                    '현재 등록된 방송 라인업(상품 목록)을 모두 비우시겠습니까?\n(비우는 즉시 구글 시트 실시간재고와 고객용 라인업에서도 모두 지워집니다)',
                    'confirm',
                    async () => {
                        setLiveInventory([]);
                        if (staffFbDb) {
                            staffFbDb.ref('ember_live_data').update({
                                '_global_config/currentPinnedId': null,
                                '_live_catalog': {
                                    items: [],
                                    rawCount: 0,
                                    explicitClear: true,
                                    updatedAt: Date.now()
                                }
                            }).catch(() => {});
                        }
                        try {
                            await fetchGas(activeGasUrl, {
                                action: 'save_inventory',
                                masterId: activeDictSheetId,
                                forceClear: true,
                                data: [{ name: '__EMPTY__', price: 0, stock: '', status: '품절', isLocked: false }]
                            });
                        } catch (e) {}
                        showToast('🧹 방송 라인업 상품 목록이 모두 비워졌습니다!');
                    }
                );
            }, [liveInventory.length, openModal, showToast, activeGasUrl, activeDictSheetId]);

            useEffect(() => {
                if (activeMainTab === 'live_order') {
                    loadLiveInventoryFromMaster();
                }
            }, [activeMainTab, loadLiveInventoryFromMaster]);

            const extractYtId = (url) => {
                if (!url) return '';
                const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([\w-]{11})/);
                return m ? m[1] : String(url).trim();
            };

            const handleConnectYoutubeLive = async (e) => {
                if (e) e.preventDefault();
                const vid = extractYtId(liveYoutubeUrl);
                if (!vid || vid.length !== 11) {
                    return openModal('유튜브 라이브 영상 주소(URL)를 정확히 입력해 주세요.');
                }
                // 1) 파이어베이스 + 로컬스토리지 + 사장님 마스터 시트(GAS get_all)에서 사용 가능한 모든 API 키 수집
                let rawKeyStr = sharedYtApiKey || '';
                if (staffFbDb) {
                    try {
                        const snap = await staffFbDb.ref('ember_live_data/_global_config/sharedYtApiKey').once('value');
                        if (snap.val()) rawKeyStr = `${rawKeyStr}\n${snap.val()}`;
                    } catch (err) {}
                }
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && k.endsWith('youtubeApiKey')) {
                            const val = localStorage.getItem(k);
                            if (val) {
                                try {
                                    const parsed = JSON.parse(val);
                                    if (parsed) rawKeyStr = `${rawKeyStr}\n${parsed}`;
                                } catch (e) {
                                    rawKeyStr = `${rawKeyStr}\n${val}`;
                                }
                            }
                        }
                    }
                } catch (err) {}

                // 만약 아직 키가 없다면 사장님 마스터 시트('고객상태관리' 탭)에서 앱스 스크립트(get_all)로 즉시 조회!
                if (!rawKeyStr || !rawKeyStr.includes('AIza')) {
                    try {
                        const gasRes = await fetchGas(`${activeGasUrl}?action=get_all&masterId=${activeDictSheetId}&skipHeavy=true&t=${Date.now()}`, null, 10000);
                        if (gasRes && Array.isArray(gasRes.customerDb)) {
                            const keyRow = gasRes.customerDb.find(c => String(c['닉네임'] || c.col_0 || '').trim() === '___SYSTEM_YT_API_KEY___');
                            if (keyRow) {
                                const sheetKey = String(keyRow['고객상태'] || keyRow['비밀번호'] || keyRow.col_1 || keyRow.col_2 || '').trim();
                                if (sheetKey) {
                                    rawKeyStr = `${rawKeyStr}\n${sheetKey}`;
                                    setSharedYtApiKey(sheetKey);
                                    try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(sheetKey)); } catch (e) {}
                                }
                            }
                        }
                    } catch (err) {}
                }

                // 정규식으로 문자열 안에 들어있는 모든 구글 API 키(AIza... 39자리)를 빠짐없이 추출
                const matchedKeys = String(rawKeyStr || '').match(/AIza[0-9A-Za-z\-_]{35}/g) || [];
                const apiKeys = Array.from(new Set(matchedKeys));

                if (apiKeys.length === 0) {
                    return openModal('유튜브 API 키를 불러오지 못했습니다.\n우측 [강은지 주문서]를 한 번 열어두시거나, 아래 입력창에 유튜브 API 키(AIza...)를 붙여넣어 주세요.', 'prompt', (inputKey) => {
                        if (inputKey && inputKey.includes('AIza')) {
                            const cleanK = inputKey.trim();
                            setSharedYtApiKey(cleanK);
                            try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(cleanK)); } catch (e) {}
                            if (staffFbDb) staffFbDb.ref('ember_live_data/_global_config/sharedYtApiKey').set(cleanK).catch(() => {});
                            fetchGas(activeGasUrl, {
                                action: 'save_customer_management',
                                masterId: activeDictSheetId,
                                data: { nickname: '___SYSTEM_YT_API_KEY___', type: cleanK }
                            }).catch(() => {});
                            showToast('✅ API 키가 저장되었습니다! 다시 [연결] 버튼을 눌러주세요.');
                        }
                    }, '', '유튜브 API 키 등록');
                }

                // 여러 개의 키가 함께 공유될 수 있도록 전체 키 문자열을 상태에 보존
                const joinedKeys = apiKeys.join('\n');
                if (joinedKeys !== sharedYtApiKey) {
                    setSharedYtApiKey(joinedKeys);
                    try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(joinedKeys)); } catch (e) {}
                }

                let lastErrorMsg = '';
                let videoFoundButNoActiveChat = false;
                let endedStreamTitle = '';

                for (let i = 0; i < apiKeys.length; i++) {
                    const curKey = apiKeys[i];
                    try {
                        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails,snippet&id=${vid}&key=${curKey}`);
                        const data = await res.json();

                        if (!res.ok || data?.error) {
                            lastErrorMsg = data?.error?.message || `HTTP ${res.status}`;
                            continue; // 현재 키가 할당량 초과(403) 또는 키 오류면 즉시 다음 키로 넘어감!
                        }

                        if (!data.items || data.items.length === 0) {
                            return openModal('해당 유튜브 영상을 찾을 수 없습니다.\n(비공개 영상이거나 주소가 잘못되었는지 확인해 주세요)');
                        }

                        const videoItem = data.items[0];
                        const liveDetails = videoItem.liveStreamingDetails;
                        const chatId = liveDetails?.activeLiveChatId;

                        if (chatId) {
                            liveNextPageTokenRef.current = '';
                            setIsLiveChatPaused(false);
                            setLiveChatId(chatId);
                            setIsStaffLiveActive(true);
                            if (staffFbDb) {
                                staffFbDb.ref('ember_live_data/_global_config').update({
                                    catalogClosedLock: false,
                                    isStoreClosed: false
                                }).catch(() => {});
                            }
                            syncStaffLiveRowsToPortal(liveOrderRows, liveBroadcastTitle, true);
                            showToast(`🟢 유튜브 라이브 연결 완료! (${i + 1}번째 API 키 사용중)`);
                            return;
                        } else {
                            videoFoundButNoActiveChat = true;
                            endedStreamTitle = videoItem.snippet?.title || '';
                            break;
                        }
                    } catch (err) {
                        lastErrorMsg = err.message || '네트워크 오류';
                    }
                }

                if (videoFoundButNoActiveChat) {
                    openModal(
                        `선택하신 영상${endedStreamTitle ? ` [${endedStreamTitle}]` : ''}은 현재 '실시간 스트리밍 중'이 아니거나 이미 종료된 다시보기 영상입니다.\n\n💡 유튜브 정책상 실시간 채팅 수집은 현재 생방송(LIVE)이 켜져 있는 영상에서만 작동합니다.`
                    );
                } else {
                    openModal(`등록된 유튜브 API 키(${apiKeys.length}개)가 모두 일일 할당량을 초과했거나 호출에 실패했습니다.\n사유: ${lastErrorMsg || '할당량 초과'}`);
                }
            };

            // 유튜브 라이브 채팅 폴링 (할당량 소진된 키는 즉시 다음 키로 자동 전환!)
            useEffect(() => {
                if (activeMainTab !== 'live_order' || !liveChatId || !sharedYtApiKey || isLiveChatPaused) return;
                let timer = null;
                let cancelled = false;
                const keys = Array.from(new Set(String(sharedYtApiKey).match(/AIza[0-9A-Za-z\-_]{35}/g) || []));
                const deadKeySet = new Set();
                let keyIdx = 0;

                const pollChat = async () => {
                    if (cancelled || keys.length === 0) return;
                    const aliveKeys = keys.filter(k => !deadKeySet.has(k));
                    if (aliveKeys.length === 0) return;
                    const curKey = aliveKeys[keyIdx % aliveKeys.length];

                    try {
                        let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${liveChatId}&part=snippet,authorDetails&maxResults=200&key=${curKey}`;
                        if (liveNextPageTokenRef.current) url += `&pageToken=${liveNextPageTokenRef.current}`;
                        const res = await fetch(url);
                        const data = await res.json();
                        if (!res.ok || data?.error) {
                            if (res.status === 403 || res.status === 400 || data?.error?.code === 403) {
                                deadKeySet.add(curKey);
                                keyIdx++;
                                if (!cancelled && keys.filter(k => !deadKeySet.has(k)).length > 0) {
                                    timer = setTimeout(pollChat, 300); // 막힌 즉시 0.3초 만에 다음 키로 재시도!
                                    return;
                                }
                            }
                        } else if (Array.isArray(data.items) && data.items.length > 0) {
                            if (data.nextPageToken) liveNextPageTokenRef.current = data.nextPageToken;
                            const incoming = data.items.map(item => ({
                                id: item.id,
                                time: new Date(item.snippet.publishedAt).toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' }),
                                nickname: String(item.authorDetails.displayName || '').replace(/@/g, '').trim(),
                                content: item.snippet.displayMessage
                            }));
                            unsavedLiveChatsRef.current.push(...incoming);
                            setLiveChats(prev => {
                                const map = new Map();
                                [...prev, ...incoming].forEach(c => map.set(c.id, c));
                                const arr = Array.from(map.values());
                                return arr.slice(-500);
                            });
                        }
                    } catch (e) {}
                    if (!cancelled) timer = setTimeout(pollChat, 4500);
                };
                pollChat();

                const backupInterval = setInterval(() => {
                    if (unsavedLiveChatsRef.current.length > 0) {
                        const batch = [...unsavedLiveChatsRef.current];
                        unsavedLiveChatsRef.current = [];
                        fetchGas(activeGasUrl, {
                            action: 'save_chats',
                            masterId: activeDictSheetId,
                            broadcastName: liveBroadcastTitle,
                            data: batch.map(c => [c.time, c.nickname, c.content])
                        }).catch(() => {});
                    }
                }, 15000);

                return () => {
                    cancelled = true;
                    if (timer) clearTimeout(timer);
                    clearInterval(backupInterval);
                };
            }, [activeMainTab, liveChatId, sharedYtApiKey, isLiveChatPaused, activeGasUrl, activeDictSheetId, liveBroadcastTitle]);

            // 직원이 라이브 주문표를 수정할 때마다 고객용 셀프 포털(__MAIN_LIVE__)에 실시간 미러링
            const syncStaffLiveRowsToPortal = useCallback((rowsToSync, bTitle, isLiveOn) => {
                if (!staffFbDb) return;
                const cleanB = cleanDisplayTabName(bTitle || '오늘의방송');
                if (!isLiveOn) {
                    staffFbDb.ref('ember_live_data/_portal_live_mode').set({
                        isLive: false,
                        lastClosedBroadcastName: cleanB,
                        updatedAt: Date.now()
                    }).catch(() => {});
                    staffFbDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').remove().catch(() => {});
                    return;
                }
                const byNick = {};
                (rowsToSync || []).forEach(r => {
                    const nick = String(r.nick || '').trim();
                    if (!nick) return;
                    const normN = normalizeString(nick);
                    if (!byNick[normN]) {
                        const matchedFallback = (!r.address) ? findMasterAddressMatch(nick) : null;
                        const finalReal = r.realname || matchedFallback?.realname || '';
                        const finalPh = fixPhoneNumber(r.phone || matchedFallback?.phone || '');
                        const finalAddr = stripZipcode(r.address || matchedFallback?.address || '');
                        const finalMemo = r.memo || matchedFallback?.memo || '';
                        const pin4 = normalizePin4(r.pin) || (finalPh.length >= 4 ? finalPh.slice(-4) : '');
                        const custRows = (rowsToSync || []).filter(x => normalizeString(x.nick) === normN);
                        const repShipRow = custRows.find(x => Number(x.shipping) > 0) || custRows[0] || r;
                        const singleShipFee = r.isVip ? 0 : (Number(repShipRow.shipping ?? liveDefaultShip) || 0);
                        byNick[normN] = {
                            sheetTabName: '메인주문',
                            nickname: nick,
                            phoneLast4: pin4,
                            broadcastName: cleanB,
                            isVip: Boolean(r.isVip),
                            credit: getCustomerCreditAmount(nick),
                            freeShippingThreshold: 70000,
                            cardFeeRate: 10,
                            isCard: '',
                            cashReceipt: 'none',
                            shipping: singleShipFee,
                            depositTotal: 0,
                            deposits: [],
                            items: [],
                            address: finalAddr ? {
                                realname: finalReal,
                                phone: finalPh,
                                zipcode: '',
                                baseAddress: finalAddr,
                                detailAddress: '',
                                memo: finalMemo,
                                updatedAt: ''
                            } : null,
                            trackingNumbers: [],
                            isConfirmed: false
                        };
                    }
                    const priceTotal = (Number(r.price) || 0) * (Number(r.qty) || 1);
                    if (r.product) {
                        byNick[normN].items.push({
                            id: byNick[normN].items.length + 1,
                            product: r.product,
                            qty: Number(r.qty) || 1,
                            price: priceTotal,
                            isWaitlist: false,
                            waitlistOrder: 0
                        });
                    }
                    if (r.isPaid) {
                        byNick[normN].depositTotal += priceTotal;
                    }
                });
                Object.values(byNick).forEach(cust => {
                    const normN = normalizeString(cust.nickname);
                    const allRowsForCust = (rowsToSync || []).filter(r => normalizeString(r.nick) === normN);
                    const isShipPaidForCust = allRowsForCust.some(r => Boolean(r.isShipPaid));
                    if (isShipPaidForCust) {
                        cust.depositTotal += (Number(cust.shipping) || 0);
                    }
                });
                staffFbDb.ref('ember_live_data/_portal_live_mode').set({
                    isLive: true,
                    activeBroadcastName: cleanB,
                    updatedAt: Date.now()
                }).catch(() => {});
                staffFbDb.ref('ember_live_data/_global_config').update({
                    catalogClosedLock: false,
                    isStoreClosed: false
                }).catch(() => {});
                staffFbDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').set({
                    broadcastName: cleanB,
                    updatedAt: Date.now(),
                    updatedBy: 'boss',
                    customers: Object.values(byNick)
                }).catch(() => {});

                // 생방송 활성화 상태에서는 입력·변경 시마다 직원용 시트('메인주문')와 고객 포털에도 즉시 자동 저장!
                const validRows = (rowsToSync || []).filter(r => r.nick && r.product);
                if (validRows.length > 0 && cleanB && !['오늘의방송', '기본방송'].includes(cleanB)) {
                    const tabKey = '주문_' + cleanB;
                    const tempGroups = Object.values(byNick).map(c => ({
                        nick: c.nickname,
                        realname: c.address?.realname || '',
                        phone: c.address?.phone || '',
                        address: c.address?.baseAddress || '',
                        memo: c.address?.memo || '',
                        shipping: Number(c.shipping) || 0,
                        deposit: Number(c.depositTotal) || 0,
                        cardMode: 'none',
                        cashReceiptMode: 'none',
                        isVip: Boolean(c.isVip),
                        isNoShow: false,
                        isConfirmed: false,
                        pin: c.phoneLast4 || '',
                        trackingNumber: '',
                        deposits: [],
                        showDeposits: false,
                        items: (c.items || []).map((it, idx) => ({
                            id: `item_${Date.now()}_${idx}`,
                            product: it.product,
                            qty: it.qty,
                            price: it.price,
                            isWaitlist: false,
                            waitlistOrder: 0
                        }))
                    }));
                    setOrderTabs(prev => Array.from(new Set([tabKey, ...prev])));
                    saveUpdatedGroupsImmediately(tempGroups, '', cleanB);
                }
            }, [liveDefaultShip, findMasterAddressMatch]);

            // 라이브 작성 중인 줄에 아직 주소가 비어있는데 찐고객사전/이전방송 주소록이 로드되면 자동으로 채워넣기!
            useEffect(() => {
                if (masterAddresses.length === 0 || liveOrderRows.length === 0) return;
                setLiveOrderRows(prev => {
                    let changed = false;
                    const next = prev.map(r => {
                        if (!r.nick || r.address) return r;
                        const m = findMasterAddressMatch(r.nick);
                        if (!m || !m.address) return r;
                        changed = true;
                        const cleanPh = fixPhoneNumber(m.phone || '');
                        return {
                            ...r,
                            realname: r.realname || m.realname || '',
                            phone: r.phone || cleanPh,
                            address: stripZipcode(m.address),
                            memo: r.memo || m.memo || '',
                            pin: r.pin || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '')
                        };
                    });
                    return changed ? next : prev;
                });
            }, [masterAddresses, findMasterAddressMatch]);

            // 채팅 클릭 시 닉네임 복사 + 빈 주문서 줄 생성 후 상품명 칸에 포커스
            const handleLiveChatNickClick = (chat) => {
                const cleanN = String(chat.nickname || '').trim();
                if (!cleanN) return;
                copyToClipboard(cleanN);
                setClickedLiveChatIds(prev => ({ ...prev, [chat.id]: true }));
                const matchedAddr = findMasterAddressMatch(cleanN);
                const isVipCust = Boolean(vipNickMap[normalizeString(cleanN)] || (normalizeHandleNick(cleanN) && vipNickMap[normalizeHandleNick(cleanN)]));
                const cleanPh = matchedAddr ? fixPhoneNumber(matchedAddr.phone) : '';
                const existingRow = liveOrderRows.find(r => normalizeString(r.nick) === normalizeString(cleanN));
                const nowTs = Date.now();
                const rowId = `lrow_${nowTs}_${Math.random().toString(36).slice(2, 6)}`;
                const newRow = {
                    id: rowId,
                    createdAt: nowTs,
                    nick: cleanN,
                    pin: existingRow?.pin || (cleanPh.length >= 4 ? cleanPh.slice(-4) : ''),
                    product: '',
                    qty: 1,
                    price: 0,
                    shipping: existingRow !== undefined ? existingRow.shipping : (isVipCust ? 0 : liveDefaultShip),
                    isPaid: false,
                    isShipPaid: existingRow ? Boolean(existingRow.isShipPaid) : false,
                    isVip: isVipCust,
                    realname: existingRow?.realname || matchedAddr?.realname || '',
                    phone: existingRow?.phone || cleanPh,
                    address: existingRow?.address || stripZipcode(matchedAddr?.address || ''),
                    memo: existingRow?.memo || matchedAddr?.memo || ''
                };
                const nextRows = [newRow, ...liveOrderRows];
                setLiveOrderRows(nextRows);
                if (!isStaffLiveActive) setIsStaffLiveActive(true);
                syncStaffLiveRowsToPortal(nextRows, liveBroadcastTitle, true);
                setTimeout(() => {
                    const el = document.getElementById(`live-prod-${rowId}`);
                    if (el) el.focus();
                }, 40);
            };

            const updateLiveOrderRow = (rowId, updater) => {
                setLiveOrderRows(prev => {
                    const target = prev.find(r => r.id === rowId);
                    const updatedTarget = target ? updater(target) : null;
                    const next = prev.map(r => {
                        if (r.id === rowId) return updatedTarget;
                        // 동일 고객의 비번/배송비/배송비입금여부/배송지는 함께 동기화
                        if (updatedTarget && updatedTarget.nick && normalizeString(r.nick) === normalizeString(updatedTarget.nick)) {
                            return {
                                ...r,
                                pin: updatedTarget.pin,
                                shipping: updatedTarget.shipping,
                                isShipPaid: Boolean(updatedTarget.isShipPaid),
                                realname: updatedTarget.realname,
                                phone: updatedTarget.phone,
                                address: updatedTarget.address,
                                memo: updatedTarget.memo
                            };
                        }
                        return r;
                    });
                    syncStaffLiveRowsToPortal(next, liveBroadcastTitle, isStaffLiveActive || next.some(x => x.product));
                    return next;
                });
            };

            // 라이브 주문표 정렬 토글 핸들러 (닉네임 / 주문상품명 / 입금확인)
            const handleToggleLiveSort = (field) => {
                setLiveSortConfig(prev => {
                    if (prev.field !== field) {
                        return { field, dir: 'asc' };
                    }
                    if (prev.dir === 'asc') {
                        return { field, dir: 'desc' };
                    }
                    return { field: 'time', dir: 'desc' }; // 3번째 클릭 시 원래 입력시간순 복귀
                });
            };

            const sortedLiveOrderRows = useMemo(() => {
                const list = [...liveOrderRows];
                const { field, dir } = liveSortConfig;
                if (field === 'time') {
                    return list.sort((a, b) => {
                        const tA = Number(a.createdAt || String(a.id).replace(/[^0-9]/g, '').slice(0, 13)) || 0;
                        const tB = Number(b.createdAt || String(b.id).replace(/[^0-9]/g, '').slice(0, 13)) || 0;
                        return dir === 'asc' ? tA - tB : tB - tA;
                    });
                }
                if (field === 'nick') {
                    return list.sort((a, b) => {
                        const cmp = String(a.nick || '').localeCompare(String(b.nick || ''), 'ko', { numeric: true });
                        return dir === 'asc' ? cmp : -cmp;
                    });
                }
                if (field === 'product') {
                    return list.sort((a, b) => {
                        const cmp = String(a.product || '').localeCompare(String(b.product || ''), 'ko', { numeric: true });
                        return dir === 'asc' ? cmp : -cmp;
                    });
                }
                if (field === 'paid') {
                    return list.sort((a, b) => {
                        const pA = (a.isPaid ? 2 : 0) + (a.isShipPaid ? 1 : 0);
                        const pB = (b.isPaid ? 2 : 0) + (b.isShipPaid ? 1 : 0);
                        // asc: 미납(0) 먼저, desc: 완납(3) 먼저
                        if (pA !== pB) return dir === 'asc' ? pA - pB : pB - pA;
                        return String(a.nick || '').localeCompare(String(b.nick || ''), 'ko');
                    });
                }
                return list;
            }, [liveOrderRows, liveSortConfig]);

            const handleSaveLiveInventoryToSheet = async (nextInv) => {
                setLiveInventory(nextInv);
                if (staffFbDb && nextInv.length > 0) {
                    staffFbDb.ref('ember_live_data/_global_config').update({
                        catalogClosedLock: false,
                        isStoreClosed: false
                    }).catch(() => {});
                }
                try {
                    await fetchGas(activeGasUrl, {
                        action: 'save_inventory',
                        masterId: activeDictSheetId,
                        forceClear: true,
                        data: nextInv.length > 0
                            ? nextInv.map(i => ({ name: i.name, price: i.price, stock: '', status: i.isSoldOut ? '품절' : '', isLocked: false }))
                            : [{ name: '__EMPTY__', price: 0, stock: '', status: '품절', isLocked: false }]
                    });
                } catch (e) {}
            };

            // 주문 작성표에 방송 라인업에 없는 새 상품명을 입력하면 우측 방송 라인업 리스트에 자동으로 추가/단가 동기화하는 함수
            const syncNewProductFromOrderRowToLineup = useCallback((rawProdName, rawUnitPrice) => {
                const cleanName = String(rawProdName || '').trim();
                if (!cleanName || cleanName === '적립금') return;
                const unitPrice = Math.max(0, Number(rawUnitPrice) || 0);

                setLiveInventory(prev => {
                    const existIdx = prev.findIndex(item => normalizeString(item.name) === normalizeString(cleanName));
                    let nextInv = null;
                    if (existIdx === -1) {
                        nextInv = [{ id: `linv_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`, name: cleanName, price: unitPrice, isSoldOut: false }, ...prev];
                    } else if (unitPrice > 0 && Number(prev[existIdx].price || 0) !== unitPrice) {
                        nextInv = prev.map((item, idx) => idx === existIdx ? { ...item, price: unitPrice } : item);
                    }
                    if (nextInv) {
                        if (staffFbDb) {
                            staffFbDb.ref('ember_live_data/_global_config').update({
                                catalogClosedLock: false,
                                isStoreClosed: false
                            }).catch(() => {});
                        }
                        fetchGas(activeGasUrl, {
                            action: 'save_inventory',
                            masterId: activeDictSheetId,
                            forceClear: true,
                            data: nextInv.map(i => ({ name: i.name, price: i.price, stock: '', status: i.isSoldOut ? '품절' : '', isLocked: false }))
                        }).catch(() => {});
                        return nextInv;
                    }
                    return prev;
                });
            }, [activeGasUrl, activeDictSheetId]);

            // 라이브 작성 중 마감하지 않고도 현재까지 받은 주문을 직원용 시트('메인주문')와 로컬 방송 목록에 안전하게 중간 저장하는 함수!
            const buildGroupsFromLiveRows = useCallback((validRows) => {
                const gMap = {};
                validRows.forEach(r => {
                    const n = r.nick.trim();
                    const normN = normalizeString(n);
                    if (!gMap[normN]) {
                        const fallbackAddr = (!r.address) ? findMasterAddressMatch(n) : null;
                        const finalPh = fixPhoneNumber(r.phone || fallbackAddr?.phone || '');
                        const custRows = validRows.filter(x => normalizeString(x.nick) === normN);
                        const repShipRow = custRows.find(x => Number(x.shipping) > 0) || custRows[0] || r;
                        const singleShipFee = r.isVip ? 0 : (Number(repShipRow.shipping ?? liveDefaultShip) || 0);
                        gMap[normN] = {
                            nick: n,
                            realname: r.realname || fallbackAddr?.realname || '',
                            phone: finalPh,
                            address: stripZipcode(r.address || fallbackAddr?.address || ''),
                            memo: r.memo || fallbackAddr?.memo || '',
                            shipping: singleShipFee,
                            deposit: 0,
                            cardMode: 'none',
                            cashReceiptMode: 'none',
                            isVip: Boolean(r.isVip),
                            isNoShow: false,
                            isConfirmed: false,
                            pin: normalizePin4(r.pin) || (finalPh.length >= 4 ? finalPh.slice(-4) : ''),
                            trackingNumber: '',
                            deposits: [],
                            showDeposits: false,
                            items: []
                        };
                    }
                    const itemTotal = (Number(r.price) || 0) * (Number(r.qty) || 1);
                    if (r.product) {
                        gMap[normN].items.push({
                            id: `item_${Date.now()}_${Math.random()}`,
                            product: r.product,
                            qty: Number(r.qty) || 1,
                            price: itemTotal,
                            isWaitlist: false,
                            waitlistOrder: 0
                        });
                    }
                    if (r.isPaid) gMap[normN].deposit += itemTotal;
                });
                // 동일 고객(닉네임)의 배송비 입금은 딱 1회만 합산!
                Object.keys(gMap).forEach(normN => {
                    const g = gMap[normN];
                    const custRows = validRows.filter(r => normalizeString(r.nick) === normN);
                    if (custRows.some(r => Boolean(r.isShipPaid))) {
                        g.deposit += g.shipping;
                    }
                });
                return Object.values(gMap);
            }, [liveDefaultShip, findMasterAddressMatch]);

            const handleInterimSaveStaffLive = () => {
                try {
                    localStorage.setItem('ember_staff_live_rows_v1', JSON.stringify(liveOrderRows));
                    localStorage.setItem('ember_staff_live_title_v1', liveBroadcastTitle);
                } catch (e) {}
                syncStaffLiveRowsToPortal(liveOrderRows, liveBroadcastTitle, isStaffLiveActive || liveOrderRows.some(r => r.nick && r.product));

                const validRows = liveOrderRows.filter(r => r.nick && r.product);
                if (validRows.length > 0) {
                    const cleanB = cleanDisplayTabName(liveBroadcastTitle || '오늘의방송');
                    const tabKey = '주문_' + cleanB;
                    const tempGroups = buildGroupsFromLiveRows(validRows);
                    const existingBlk = localBroadcastStoreRef.current[tabKey];
                    // 만약 이미 같은 이름의 마감 방송이 있다면 기존 고객들과 합쳐서 보존!
                    let mergedGroups = tempGroups;
                    if (existingBlk && Array.isArray(existingBlk.groups) && existingBlk.groups.length > 0) {
                        const map = new Map();
                        existingBlk.groups.forEach(g => map.set(normalizeString(g.nick), { ...g, items: [...(g.items || [])] }));
                        tempGroups.forEach(ng => {
                            const k = normalizeString(ng.nick);
                            if (map.has(k)) {
                                const ex = map.get(k);
                                const existingProds = new Set((ex.items || []).map(it => `${it.product}_${it.qty}_${it.price}`));
                                const newItemsOnly = (ng.items || []).filter(it => !existingProds.has(`${it.product}_${it.qty}_${it.price}`));
                                map.set(k, {
                                    ...ex,
                                    deposit: Math.max(Number(ex.deposit) || 0, Number(ng.deposit) || 0),
                                    items: [...(ex.items || []), ...newItemsOnly]
                                });
                            } else {
                                map.set(k, ng);
                            }
                        });
                        mergedGroups = Array.from(map.values());
                    }

                    setOrderTabs(prev => Array.from(new Set([tabKey, ...prev])));
                    setLocalBroadcastStore(prev => {
                        const next = {
                            ...prev,
                            [tabKey]: {
                                broadcastName: cleanB,
                                freeShipThreshold: 70000,
                                defaultShipping: liveDefaultShip,
                                cardFeeRate: 10,
                                updatedAt: Date.now(),
                                groups: mergedGroups
                            }
                        };
                        localBroadcastStoreRef.current = next;
                        try { localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(next)); } catch (e) {}
                        return next;
                    });
                    syncBroadcastGroupsToFirebase(cleanB, mergedGroups, 70000, 10, customerCredits, 'staff');
                }
                showToast(`💾 [${cleanDisplayTabName(liveBroadcastTitle)}] 현재 작성 중인 주문(${liveOrderRows.length}줄)이 안전하게 중간저장되었습니다!`);

            // 직원 라이브 방송 마감 및 직원용 주문 조회로 넘기기 (현재 상태 그대로 확정 저장 후 종료!)
            const handleFinishStaffLiveBroadcast = () => {
                const validRows = liveOrderRows.filter(r => r.nick && r.product);
                if (validRows.length === 0) return openModal('마감할 주문 내역이 없습니다.');
                const cleanB = cleanDisplayTabName(liveBroadcastTitle || '');

                    return openModal(
                        '마감할 정확한 방송 이름(예: 10/24 여성복)을 먼저 입력해 주세요.',
                        'prompt',

                                setLiveBroadcastTitle(nextClean);
