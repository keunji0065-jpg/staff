                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                const options = { method: payload ? 'POST' : 'GET', redirect: "follow", signal: controller.signal };
                if (payload) {
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                    options.body = JSON.stringify(payload);
                }
                try {
                    const res = await fetch(url, options);
                    clearTimeout(timer);
                    const text = await res.text();
                    return JSON.parse(text);
                } catch (err) {
                    clearTimeout(timer);
                    throw err;
                }
            };
            try {
                return await attemptFetch();
            } catch (firstErr) {
                try {
                    await new Promise(r => setTimeout(r, 400));
                    return await attemptFetch();
                } catch (secondErr) {
                    // POST 저장 시 CORS 리다이렉트로 응답 읽기만 실패한 경우 no-cors 폴백으로 시트 기록 보장!
                    if (payload) {

                                mode: 'no-cors',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },

                            return { status: 'success', success: true, fallbackNoCors: true };

            }

        const CsCopySelectModal = ({ isOpen, group, broadcastName, onClose, onConfirmCopy }) => {

            const [refundCompleted, setRefundCompleted] = useState(false);

            useEffect(() => {
                if (isOpen && group && Array.isArray(group.items)) {

            }, 0);

            const handleConfirm = () => {
                const taggedItems = (group.items || []).map((it, idx) => ({
                    ...it,
                    csTag: itemTags[idx] || '정상'
                }));

                    : autoReturnSum;
                onConfirmCopy(group, broadcastName, taggedItems, {
                    csMemo: csMemo.trim(),
                    refundAccount: refundAccount.trim(),

                    refundCompleted: Boolean(refundCompleted || convertedToCredit),
                    convertedToCredit: Boolean(convertedToCredit),

            return (

                        <div className="flex justify-between items-center pb-3 mb-3 border-b border-slate-200">
                            <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
                                <Icon name="arrows-left-right" weight="bold" className="text-blue-600" size={17} />

                            </h3>

                        </div>

                        <p className="text-xs text-slate-500 mb-2.5">
                            주문서 전체 품목이 함께 복사됩니다. 우측에서 <b>미송(발송대기)</b>, <b>교환</b>, <b>반품</b>할 품목의 상태를 선택해 주세요.

                        <div className="flex-1 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-lg px-3 mb-3 bg-slate-50/40">
                            <div className="py-1.5 flex items-center gap-1.5 text-[11px] font-extrabold text-blue-700">
                                <Icon name="calendar-check" weight="fill" size={13} />
                                <span>방송명: {(broadcastName || '').replace(/^주문_/, '')}</span>
                            </div>
                            {(group.items || []).map((it, idx) => {
                                const curTag = itemTags[idx] || '정상';
                                const isModalCsItem = curTag !== '정상';
                                const modalRowBoxStyle =
                                    curTag === '미송' ? 'bg-purple-100/90 border border-purple-300 border-l-4 border-l-purple-600 rounded-lg my-1 px-2.5 py-2 shadow-sm' :
                                    curTag === '교환' ? 'bg-blue-100/90 border border-blue-300 border-l-4 border-l-blue-600 rounded-lg my-1 px-2.5 py-2 shadow-sm' :
                                    curTag === '반품' ? 'bg-rose-100/90 border border-rose-300 border-l-4 border-l-rose-600 rounded-lg my-1 px-2.5 py-2 shadow-sm' :
                                    curTag === '불량/오배송' ? 'bg-red-100 border border-red-400 border-l-4 border-l-red-600 rounded-lg my-1 px-2.5 py-2 shadow-sm' :

                                    <div key={idx} className={`flex items-center justify-between gap-2 text-xs transition-all ${modalRowBoxStyle}`}>
                                        <div className="flex items-center gap-1.5 flex-1 min-w-0">
                                            {!isModalCsItem && <span className="text-slate-400 font-bold">•</span>}
                                            <span className={`truncate ${isModalCsItem ? 'text-slate-900 font-black text-[13px]' : 'text-slate-500 font-semibold'}`}>{it.product}</span>

                                            </span>
                                            <select
                                                value={curTag}
                                                onChange={e => setItemTags(prev => ({ ...prev, [idx]: e.target.value }))}
                                                className={`px-2 py-1 rounded border text-[11px] font-extrabold outline-none cursor-pointer shrink-0 ${
                                                    curTag === '미송' ? 'bg-purple-600 text-white border-purple-700' :
                                                    curTag === '교환' ? 'bg-blue-600 text-white border-blue-700' :
                                                    curTag === '반품' ? 'bg-rose-600 text-white border-rose-700' :
                                                    curTag === '불량/오배송' ? 'bg-red-600 text-white border-red-700' :
                                                    'bg-white text-slate-600 border-slate-300'
                                                }`}
                                            >
                                                <option value="정상" className="bg-white text-slate-700">정상유지</option>
                                                <option value="미송" className="bg-white text-purple-800">📦 미송(발송대기)</option>
                                                <option value="교환" className="bg-white text-blue-700">🔄 교환요청</option>
                                                <option value="반품" className="bg-white text-rose-700">↩️ 반품요청</option>
                                                <option value="불량/오배송" className="bg-white text-red-700">🚨 불량/오배송</option>
                                            </select>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="space-y-2.5 mb-4 text-xs">
                            <div>
                                <label className="block font-bold text-slate-700 mb-1">📝 미송 / CS 메모 (입고예정일, 교환 옵션, 사유 등)</label>
                                <input
                                    type="text"
                                    value={csMemo}
                                    onChange={e => setCsMemo(e.target.value)}
                                    placeholder="예: 거래처 리오더 중(10/25 입고 후 발송예정) / 라벨없음 반품 등"
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 font-bold outline-none focus:border-blue-600"
                                />
                            </div>
                            <div>
                                <label className="block font-bold text-slate-700 mb-1">🏦 환불 계좌번호 (은행/계좌/예금주)</label>
                                <input
                                    type="text"
                                    value={refundAccount}
                                    onChange={e => setRefundAccount(e.target.value)}
                                    placeholder="예: 카카오뱅크 3333-00-0000 홍길동"
                                    className="w-full border border-slate-300 rounded-lg px-3 py-2 font-bold outline-none focus:border-blue-600"
                                />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <div>
                                    <label className="block font-bold text-slate-700 mb-1">💸 환불예정금액 및 환불여부</label>
                                    <div className="flex items-center gap-1">
                                        <input
                                            type="text"
                                            value={refundAmount !== '' ? (refundAmount ? Number(String(refundAmount).replace(/[^0-9]/g, '')).toLocaleString() : '') : (autoReturnSum > 0 ? autoReturnSum.toLocaleString() : '')}
                                            onChange={e => setRefundAmount(e.target.value.replace(/[^0-9]/g, ''))}
                                            placeholder="환불금액(원)"
                                            className="w-full border border-slate-300 rounded-lg px-2 py-2 text-right font-bold text-rose-700 outline-none focus:border-blue-600"
                                        />
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const next = !refundCompleted;
                                                setRefundCompleted(next);
                                                if (!next) setConvertedToCredit(false);
                                            }}
                                            className={`px-2 py-2 rounded-lg font-extrabold text-[11px] shrink-0 border transition ${
                                                refundCompleted && !convertedToCredit
                                                    ? 'bg-blue-600 text-white border-blue-700'
                                                    : 'bg-slate-100 text-slate-600 border-slate-300'
                                            }`}
                                        >
                                            {refundCompleted && !convertedToCredit ? '환불완료' : '환불대기'}
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const next = !convertedToCredit;
                                                setConvertedToCredit(next);
                                                if (next) setRefundCompleted(true);
                                            }}
                                            className={`px-2 py-2 rounded-lg font-extrabold text-[11px] shrink-0 border transition ${
                                                convertedToCredit
                                                    ? 'bg-teal-600 text-white border-teal-700'
                                                    : 'bg-teal-50 text-teal-700 border-teal-300 hover:bg-teal-100'
                                            }`}
                                            title="환불금을 고객의 보유 적립금으로 전환합니다"
                                        >
                                            {convertedToCredit ? '💰적립전환됨' : '💰적립금전환'}
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-700 mb-1">🚚 교반품비 (배송비)</label>
                                    <div className="flex items-center gap-1.5">
                                        <input
                                            type="text"
                                            value={csFee ? Number(String(csFee).replace(/[^0-9]/g, '')).toLocaleString() : ''}
                                            onChange={e => {
                                                const v = e.target.value.replace(/[^0-9]/g, '');
                                                setCsFee(v);
                                            }}
                                            placeholder="예: 4,000"
                                            className="w-full border border-slate-300 rounded-lg px-2.5 py-2 text-right font-bold outline-none focus:border-blue-600"
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setCsFeePaid(!csFeePaid)}
                                            className={`px-2.5 py-2 rounded-lg font-extrabold text-[11px] shrink-0 border transition ${
                                                csFeePaid
                                                    ? 'bg-emerald-600 text-white border-emerald-700'
                                                    : 'bg-slate-100 text-slate-600 border-slate-300'
                                            }`}
                                        >
                                            {csFeePaid ? '입금됨' : '미입금'}

                        <div className="flex gap-2">
                            <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-lg text-xs hover:bg-slate-200">취소</button>
                            <button
                                type="button"
                                onClick={handleConfirm}
                                className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-lg text-xs shadow-sm"
                            >
                                미송/교환/반품 탭으로 복사 ({selectedCount}건 지정)
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // CS 메모 문자열에서 [계좌: ...], [환불액: ...], [환불완료], [적립금전환완료] 태그나 '/ 은행명 계좌번호' 형태를 깔끔하게 분리/병합하는 헬퍼
        const splitCsMemoAndAccount = (rawMemoStr) => {
            let raw = String(rawMemoStr || '').trim();
            if (!raw) return { memoOnly: '', accountOnly: '', refundAmount: 0, refundCompleted: false, convertedToCredit: false };

            let refundCompleted = false;
            let convertedToCredit = false;
            if (raw.includes('[적립금전환완료]')) {
                refundCompleted = true;
                convertedToCredit = true;
                raw = raw.replace(/\[적립금전환완료\]/g, '').trim();
            }
            if (raw.includes('[환불완료]')) {
                refundCompleted = true;
                raw = raw.replace(/\[환불완료\]/g, '').trim();
            }

            let refundAmount = 0;
            const amtMatch = raw.match(/\[환불액:\s*([0-9,]+)\]/);
            if (amtMatch) {
                refundAmount = Number(amtMatch[1].replace(/[^0-9]/g, '')) || 0;
                raw = raw.replace(amtMatch[0], '').trim();
            }

            const tagMatch = raw.match(/\[계좌:\s*([^\]]+)\]/);
            if (tagMatch) {
                const accountOnly = tagMatch[1].trim();
                const memoOnly = raw.replace(tagMatch[0], '').trim();
                return { memoOnly, accountOnly, refundAmount, refundCompleted, convertedToCredit };
            }
            const slashBankMatch = raw.match(/^(.*?)\s*\/\s*((?:카카오|카뱅|농협|국민|신한|우리|하나|기업|토스|우체국|새마을|신협|수협|부산|대구|경남|광주|전북|제주|케이|씨티|SC).*)$/);
            if (slashBankMatch) {
                return { memoOnly: slashBankMatch[1].trim(), accountOnly: slashBankMatch[2].trim(), refundAmount, refundCompleted, convertedToCredit };
            }
            return { memoOnly: raw, accountOnly: '', refundAmount, refundCompleted, convertedToCredit };
        };

        const combineCsMemoAndAccount = (memoOnly, accountOnly, refundAmount = 0, refundCompleted = false, convertedToCredit = false) => {
            const parts = [];
            const m = String(memoOnly || '').trim();
            const a = String(accountOnly || '').trim();
            const rAmt = Number(String(refundAmount || '0').replace(/[^0-9]/g, '')) || 0;
            if (m) parts.push(m);
            if (a) parts.push(`[계좌: ${a}]`);
            if (rAmt > 0) parts.push(`[환불액: ${rAmt}]`);
            if (convertedToCredit) parts.push(`[적립금전환완료]`);
            else if (refundCompleted) parts.push(`[환불완료]`);
            return parts.join(' ');
        };

        // ✨ 고객용 포털에 미송/교환/반품 내역을 실시간 동기화하는 함수 (보안: 직원용 csMemo는 절대 전송하지 않음!)
        const syncCsGroupsToFirebase = (csList) => {
            if (!staffFbDb || !Array.isArray(csList)) return;
            try {
                const publicCsList = csList.map(c => {
                    const parsedMemo = splitCsMemoAndAccount(c.csMemo);
                    const accOnly = c.refundAccount !== undefined ? c.refundAccount : parsedMemo.accountOnly;
                    const autoRetSum = (c.items || []).filter(x => x.csTag === '반품').reduce((s, x) => s + (Number(x.price) || 0), 0);
                    const finalRefAmt = (c.refundAmount !== undefined && c.refundAmount !== '')
                        ? Number(c.refundAmount)
                        : (parsedMemo.refundAmount > 0 ? parsedMemo.refundAmount : autoRetSum);
                    const finalRefDone = c.refundCompleted !== undefined ? Boolean(c.refundCompleted) : Boolean(parsedMemo.refundCompleted);
                    const finalCredConv = c.convertedToCredit !== undefined ? Boolean(c.convertedToCredit) : Boolean(parsedMemo.convertedToCredit);
                    const shipFee = Number(c.shipping) || 0;
                    const feePaid = c.csFeePaid !== undefined ? Boolean(c.csFeePaid) : (Number(c.deposit) > 0 && Number(c.deposit) >= shipFee);

                    // 고객에게 보여줄 대상 품목만 필터링 (미송/교환/반품 등 지정된 품목 위주, 만약 전체 정상으로 복사된 경우 전체 표시)
                    const taggedOnly = (c.items || []).filter(it => it.csTag && it.csTag !== '정상');
                    const displayItems = taggedOnly.length > 0 ? taggedOnly : (c.items || []);

                    return {
                        id: c.id,
                        createdAt: c.createdAt || '',
                        sourceBroadcast: cleanDisplayTabName(c.sourceBroadcast || ''),
                        csStatus: c.csStatus === '처리완료' ? '처리완료' : '미처리',
                        nick: c.nick || '',
                        realname: c.realname || '',
                        phone: fixPhoneNumber(c.phone || ''),
                        origTracking: c.origTracking || '',
                        csTracking: c.csTracking || '',
                        refundAccount: String(accOnly || '').trim(),
                        refundAmount: Number(finalRefAmt) || 0,
                        refundCompleted: finalRefDone || finalCredConv,
                        convertedToCredit: finalCredConv,
                        csFee: shipFee,
                        csFeePaid: feePaid,
                        items: displayItems.map(it => ({
                            product: it.product || '',
                            qty: Number(it.qty) || 1,
                            price: Number(it.price) || 0,
                            csTag: it.csTag || '정상'
                        }))
                        // ⚠️ csMemo(직원용 메모)는 의도적으로 제외하여 고객에게 절대 노출되지 않도록 완벽 차단!
                    };
                });

                staffFbDb.ref('ember_live_data/_portal_cs').set({
                    updatedAt: Date.now(),
                    items: publicCsList
                }).catch(() => {});
            } catch (e) {}

                                    quantity: Number(it.qty) || 1,
                                    qty: Number(it.qty) || 1,
                                    '단가(제품금액)': Number(it.price) || 0,
                                    price: Number(it.price) || 0,
                                    '배송비': sum.ship,
                                    shipping: sum.ship,
                                    '입금액': idx === 0 ? sum.dep : 0,
                                    deposit: idx === 0 ? sum.dep : 0,
                                    '카드결제': cardStr,
                                    '수령인명': g.realname || '',
                                    '연락처': cleanPh ? "'" + cleanPh : '',
                                    '주소': stripZipcode(g.address || ''),
                                    '요청사항': cleanMemoText(g.memo, g.address),
                                    'VIP여부': g.isVip ? 'O' : '',
                                    '노쇼여부': g.isNoShow ? 'O' : '',
                                    '대기여부': waitCell,
                                    '비밀번호': pinStr ? "'" + pinStr : '',
                                    '주문확인': g.isConfirmed ? 'O' : '',
                                    '입금내역JSON': idx === 0 ? depJson : '',
                                    '송장번호': g.trackingNumber ? "'" + String(g.trackingNumber).replace(/^'+/, '') : ''
                                });
                            });
                        });
                        return rows;
                    };

                    const allCombinedRows = [];
                    Object.keys(latestStore)
                        .filter(k => k.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(k))
                        .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                        .forEach(tKey => {
                            const blk = latestStore[tKey];
                            if (blk && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                const bTitle = cleanDisplayTabName(blk.broadcastName || tKey);
                                allCombinedRows.push(...buildRows(bTitle, blk.freeShipThreshold, blk.defaultShipping, blk.cardFeeRate, blk.groups));
                            }
                        });

                    if (allCombinedRows.length > 0) {
                        pendingOrdersRowsRef.current = allCombinedRows;
                        flushOrdersQueueToSheet();
                    }
                }, 350);
            }, [broadcastName, selectedTab, freeShipThreshold, defaultShipping, cardFeeRate, customerCredits, getGroupSummary, flushOrdersQueueToSheet, showToast]);

            // ✨ CS 내역(미송/교환/반품)을 절대 유실되지 않는 순차 대기열(Queue)을 통해 직원용 구글 시트('교환반품CS' 탭)와 고객 포털(Firebase)에 즉시 저장하는 전용 함수
            const flushCsQueueToSheet = useCallback(async () => {
                if (isCsSavingQueueRef.current) return;
                isCsSavingQueueRef.current = true;
                try {
                    while (pendingCsListRef.current !== null) {
                        const listToPush = pendingCsListRef.current;
                        pendingCsListRef.current = null;
                        const serializedCs = listToPush.map(c => ({
                            ...c,
                            csMemo: combineCsMemoAndAccount(c.csMemo, c.refundAccount, c.refundAmount, c.refundCompleted, c.convertedToCredit),
                            shipping: Number(c.shipping) || 0,
                            deposit: c.csFeePaid ? (Number(c.shipping) || Number(c.deposit) || 0) : 0
                        }));
                        await fetchGas(activeGasUrl, {
                            action: 'save_cs_orders',
                            masterId: activeStaffSheetId,
                            items: serializedCs
                        }, 15000);
                    }
                } catch (e) {} finally {
                    isCsSavingQueueRef.current = false;
                }
            }, [activeGasUrl, activeStaffSheetId]);

            const saveCsOrdersToSheetImmediate = useCallback((targetCsList, toastMessage = '') => {
                const listToSave = Array.isArray(targetCsList) ? targetCsList : csGroupsRef.current;
                csGroupsRef.current = listToSave;
                try {
                    localStorage.setItem('ember_staff_cs_groups_v1', JSON.stringify(listToSave));
                    localStorage.setItem(STAFF_CS_DIRTY_TIME_KEY, String(Date.now()));
                } catch (e) {}

                // 1) 고객 포털 클라우드(_portal_cs)에 0.01초 만에 즉시 동기화 및 알림 표시 (화면 멈춤 ZERO)
                syncCsGroupsToFirebase(listToSave);
                setHasUnsavedChanges(false);
                if (toastMessage) showToast(toastMessage);

                // 2) 직원용 구글 시트('교환반품CS' 탭) 대기열에 최신 리스트를 넣고 끝까지 순차 저장 보장!
                pendingCsListRef.current = listToSave;
                flushCsQueueToSheet();
            }, [flushCsQueueToSheet, showToast]);

            // CS 데이터(메모, 계좌번호, 송장 등) 타이핑 수정 시 0.5초 디바운스로 자동 시트 저장 예약
            const scheduleAutoSaveCs = useCallback((nextCsList, msg = '') => {
                csGroupsRef.current = nextCsList;
                try {
                    localStorage.setItem('ember_staff_cs_groups_v1', JSON.stringify(nextCsList));
                    localStorage.setItem(STAFF_CS_DIRTY_TIME_KEY, String(Date.now()));
                } catch (e) {}
                syncCsGroupsToFirebase(nextCsList);
                if (autoSaveCsTimerRef.current) clearTimeout(autoSaveCsTimerRef.current);
                autoSaveCsTimerRef.current = setTimeout(() => {
                    saveCsOrdersToSheetImmediate(nextCsList, msg);
                }, 500);
            }, [saveCsOrdersToSheetImmediate]);

            // 현재 화면에서 수정된 customerGroups를 로컬 방송 창고에도 자동 백업 (새로고침해도 절대 날아가지 않음)
            useEffect(() => {
                const cleanCur = cleanDisplayTabName(broadcastName || selectedTab || '');
                if (!cleanCur || customerGroups.length === 0) return;
                const tabKey = selectedTab || ('주문_' + cleanCur);
                setLocalBroadcastStore(prev => ({
                    ...prev,
                    [tabKey]: {
                        broadcastName: cleanCur,
                        freeShipThreshold,
                        defaultShipping,
                        cardFeeRate,
                        updatedAt: Date.now(),
                        groups: customerGroups
                    }
                }));
            }, [customerGroups, broadcastName, selectedTab, freeShipThreshold, defaultShipping, cardFeeRate]);

            const loadSheetOrders = useCallback(async (tabNameToLoad, forceFromServer = false) => {
                if (!tabNameToLoad) {
                    setIsLoading(false);
                    return;
                }
                const rawTabStr = String(tabNameToLoad).trim();
                const cleanBase = cleanDisplayTabName(rawTabStr);
                const canonicalTab = rawTabStr.startsWith('주문_') ? rawTabStr : ('주문_' + cleanBase);

                // 1순위: 로컬 창고에 이미 불러온 데이터가 있고 강제 서버 새로고침이 아니면 0.01초 만에 즉시 전환! (직원이 수정한 최신 입금/배송비 100% 보존)
                const latestLocalBlk = localBroadcastStoreRef.current?.[canonicalTab] || localBroadcastStore?.[canonicalTab];
                if (!forceFromServer && latestLocalBlk && Array.isArray(latestLocalBlk.groups) && latestLocalBlk.groups.length > 0) {
                    setBroadcastName(cleanBase);
                    setFreeShipThreshold(latestLocalBlk.freeShipThreshold ?? 70000);
                    setDefaultShipping(latestLocalBlk.defaultShipping ?? 4000);
                    setCardFeeRate(latestLocalBlk.cardFeeRate ?? 10);
                    setCustomerGroups(latestLocalBlk.groups);
                    setHasUnsavedChanges(false);
                    setIsLoading(false);
                    return;
                }

                setIsLoading(true);
                try {
                    // 1순위: 캐시 지연이 전혀 없는 실시간 앱스 스크립트(get_orders)로 '메인주문' 시트 원본을 즉시 읽기!
                    let parsedBlocks = {};
                    const res = await fetchGas(`${activeGasUrl}?action=get_orders&masterId=${activeStaffSheetId}&tabName=${encodeURIComponent('메인주문')}&t=${Date.now()}`, null, 12000);
                    const fetched = Array.isArray(res?.data) ? res.data : (Array.isArray(res?.orders) ? res.orders : []);
                    if (fetched.length > 0) {
                        parsedBlocks = parseRowsIntoBroadcastBlocks(fetched, '메인주문');
                    }

                    // 2순위 폴백: GAS 통신 실패 시에만 직통 리더 사용
                    if (Object.keys(parsedBlocks).length === 0) {
                        const directRows = await fetchGoogleSheetDirect(activeStaffSheetId, '메인주문');
                        if (Array.isArray(directRows) && directRows.length > 0) {
                            parsedBlocks = parseRowsIntoBroadcastBlocks(directRows, '메인주문');
                        }
                    }

                    const blockKeys = Object.keys(parsedBlocks);
                    if (blockKeys.length > 0) {
                        const lastDirtyTs = Number(localStorage.getItem(STAFF_LOCAL_DIRTY_TIME_KEY) || '0');
                        const isRecentlyModified = (Date.now() - lastDirtyTs < 30000);
                        const mergedStore = { ...parsedBlocks, ...(isRecentlyModified ? localBroadcastStoreRef.current : {}) };
                        localBroadcastStoreRef.current = mergedStore;
                        setLocalBroadcastStore(mergedStore);
                        const targetBlk = mergedStore[canonicalTab] || parsedBlocks[canonicalTab] || parsedBlocks[blockKeys[0]];
                        setBroadcastName(targetBlk.broadcastName);
                        setFreeShipThreshold(targetBlk.freeShipThreshold ?? 70000);
                        setDefaultShipping(targetBlk.defaultShipping ?? 4000);
                        setCardFeeRate(targetBlk.cardFeeRate ?? 10);
                        setCustomerGroups(targetBlk.groups);
                    } else {
                        setBroadcastName(cleanBase);
                        setCustomerGroups([]);
                    }
                    setHasUnsavedChanges(false);
                } catch (e) {
                    showToast('주문서 로드 중 오류가 발생했습니다.');
                } finally {
                    setIsLoading(false);
                }
            }, [activeGasUrl, activeStaffSheetId, localBroadcastStore, showToast]);

            const loadCsOrders = useCallback(async () => {
                try {
                    const res = await fetchGas(`${activeGasUrl}?action=get_cs_orders&masterId=${activeStaffSheetId}&t=${Date.now()}`);
                    let rawList = Array.isArray(res?.data) ? res.data : [];

                    // 만약 '교환반품CS의 사본'으로 복사되어 있어서 기본 조회가 비어있다면 사본 시트 및 직통 리더까지 확인!
                    if (rawList.length === 0) {
                        for (const csTabName of ['교환반품CS', '교환반품CS의 사본', '교환반품CS 의 사본']) {
                            const resCopy = await fetchGas(`${activeGasUrl}?action=get_orders&masterId=${activeStaffSheetId}&tabName=${encodeURIComponent(csTabName)}&t=${Date.now()}`, null, 10000);
                            if (Array.isArray(resCopy?.data) && resCopy.data.length > 0) {
                                rawList = resCopy.data;
                                break;
                            }
                            const directCs = await fetchGoogleSheetDirect(activeStaffSheetId, csTabName);
                            if (Array.isArray(directCs) && directCs.length > 0) {
                                rawList = directCs;
                                break;
                            }
                        }
                    }

                    // 🛡️ 직원이 방금 CS를 등록/수정한 지 25초 이내라면 구글 시트의 느린 캐시가 최신 로컬 CS 목록을 덮어쓰지 못하도록 완벽 보호!
                    const lastCsDirtyTs = Number(localStorage.getItem(STAFF_CS_DIRTY_TIME_KEY) || '0');
                    if (Date.now() - lastCsDirtyTs < 25000 && csGroupsRef.current && csGroupsRef.current.length > 0) {
                        syncCsGroupsToFirebase(csGroupsRef.current);
                        return;
                    }

                    if (rawList.length === 0) {
                        // 서버 시트가 비어있는데 로컬에 기존 CS 내역이 있다면 시트로 즉시 백업 푸시!
                        if (csGroupsRef.current && csGroupsRef.current.length > 0) {
                            saveCsOrdersToSheetImmediate(csGroupsRef.current);
                        }
                        return;
                    }
                    const parsed = rawList.map((r, i) => {
                        let items = [];
                        const jsonRaw = pickRowField(r, ['전체품목JSON', 'itemsJson'], 15);
                        if (jsonRaw) {
                            try {
                                const p = JSON.parse(jsonRaw);
                                if (Array.isArray(p)) items = p;
                            } catch (e) {}
                        }
                        const cardStr = String(pickRowField(r, ['카드결제', 'card'], 13)).trim();
                        const cardMode = cardStr.includes('완료') ? 'completed' : (cardStr ? 'requested' : 'none');
                        const rawMemoCell = String(pickRowField(r, ['CS메모', 'csMemo'], 10) || '');
                        const { memoOnly, accountOnly, refundAmount, refundCompleted, convertedToCredit } = splitCsMemoAndAccount(rawMemoCell);
                        const shipNum = Number(String(pickRowField(r, ['배송비', 'shipping'], 11) || '0').replace(/[^0-9.-]/g, '')) || 0;
                        const depNum = Number(String(pickRowField(r, ['입금액', 'deposit'], 12) || '0').replace(/[^0-9.-]/g, '')) || 0;
                        const parsedItems = Array.isArray(items) ? items : [];
                        const autoRetSum = parsedItems.filter(x => x.csTag === '반품').reduce((s, x) => s + (Number(x.price) || 0), 0);
                        return {
                            id: String(pickRowField(r, ['CS_ID', 'id'], 0) || `cs_${Date.now()}_${i}`),
                            createdAt: String(pickRowField(r, ['등록일시', 'createdAt'], 1) || ''),
                            sourceBroadcast: String(pickRowField(r, ['원본방송', 'sourceBroadcast'], 2) || '').replace(/^주문_/, ''),
                            csStatus: String(pickRowField(r, ['처리상태', 'csStatus'], 3) || '접수'),
                            nick: String(pickRowField(r, ['닉네임', 'nick'], 4) || ''),
                            realname: String(pickRowField(r, ['수령인명', 'realname'], 5) || ''),
                            phone: fixPhoneNumber(pickRowField(r, ['연락처', 'phone'], 6)),
                            address: stripZipcode(pickRowField(r, ['주소', 'address'], 7) || ''),
                            origTracking: String(pickRowField(r, ['원송장번호', 'origTracking'], 8) || '').replace(/^'+/, ''),
                            csTracking: String(pickRowField(r, ['교반송장번호', 'csTracking'], 9) || '').replace(/^'+/, ''),
                            csMemo: memoOnly,
                            refundAccount: accountOnly,
                            refundAmount: refundAmount > 0 ? refundAmount : autoRetSum,
                            refundCompleted: Boolean(refundCompleted || convertedToCredit),
                            convertedToCredit: Boolean(convertedToCredit),
                            shipping: shipNum,
                            deposit: depNum,
                            csFeePaid: shipNum > 0 && depNum >= shipNum,
                            cardMode: cardMode,
                            items: parsedItems
                        };
                    }).filter(c => c.nick);
                    setCsGroups(parsed);
                    csGroupsRef.current = parsed;
                    try { localStorage.setItem('ember_staff_cs_groups_v1', JSON.stringify(parsed)); } catch (e) {}
                    syncCsGroupsToFirebase(parsed);
                } catch (e) {}
            }, [activeGasUrl, activeStaffSheetId, saveCsOrdersToSheetImmediate]);

            const loadMasterAddresses = useCallback(async () => {
                try {
                    const directAddrRows = await fetchGoogleSheetDirect(activeDictSheetId, '찐고객사전');
                    if (Array.isArray(directAddrRows) && directAddrRows.length > 0) {
                        const directList = [];
                        directAddrRows.forEach(a => {
                            const nick = String(pickRowField(a, ['닉네임', 'nickname', '주문자', '고객명'], 0)).trim();
                            const realname = String(pickRowField(a, ['수령인명', 'realname', '수령인', '이름', '성명'], 1)).trim();
                            const phone = fixPhoneNumber(pickRowField(a, ['연락처', 'phone', '전화번호', '핸드폰번호'], 2));
                            const address = stripZipcode(pickRowField(a, ['주소', 'address', '배송지'], 3));
                            const rawMemo = String(pickRowField(a, ['배송메모', 'memo', '요청사항', '메모'], 4)).trim();
                            const memo = cleanMemoText(/^\d{5}$/.test(rawMemo) ? pickRowField(a, ['col_5'], 5) : rawMemo, address);
                            if (nick.toLowerCase() === 'nickname' || nick === '닉네임') return;
                            if ((nick || realname) && address) {
                                directList.push({ nickname: nick || realname, realname, phone, address, memo });
                            }
                        });
                        if (directList.length > 0) {
                            setMasterAddresses(directList);
                            try { localStorage.setItem('ember_staff_master_addrs_v1', JSON.stringify(directList)); } catch (e) {}
                        }
                    }

                    // ✨ 사장님 마스터 시트의 '고객상태관리' 탭도 직통(gviz)으로 0.5초 만에 읽어와 차감된 적립금·VIP 상태를 즉시 반영!
                    const directCustRows = await fetchGoogleSheetDirect(activeDictSheetId, '고객상태관리');
                    if (Array.isArray(directCustRows) && directCustRows.length > 0) {
                        const directCredits = {};
                        const directVips = {};
                        directCustRows.forEach(c => {
                            const n = String(pickRowField(c, ['닉네임', 'nickname'], 0)).trim();
                            if (!n || n === '닉네임' || n.toLowerCase() === 'nickname') return;
                            if (n === '___SYSTEM_YT_API_KEY___') {
                                const savedKey = String(pickRowField(c, ['고객상태', '비밀번호'], 1)).trim();
                                if (savedKey) {
                                    setSharedYtApiKey(savedKey);
                                    try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(savedKey)); } catch (e) {}
                                }
                                return;
                            }
                            const st = String(pickRowField(c, ['고객상태', 'status'], 1)).trim().toLowerCase();
                            const rawCredStr = String(pickRowField(c, ['적립금', 'credit'], 5) ?? '').trim();
                            const cred = Number(rawCredStr.replace(/[^0-9.-]/g, '')) || 0;
                            if (st === 'vip' || st === 'manager' || st === '관리자') {
                                directVips[normalizeString(n)] = true;
                                const hKey = normalizeHandleNick(n);
                                if (hKey) directVips[hKey] = true;
                            }
                            directCredits[n] = Math.max(0, cred);
                        });
                        setVipNickMap(directVips);
                        setCustomerCredits(directCredits);
                    }

                    const res = await fetchGas(`${activeGasUrl}?action=get_all&depId=${DEFAULT_DEP_SHEET_ID}&masterId=${activeDictSheetId}&skipHeavy=false&t=${Date.now()}`);
                    const incoming = [];
                    if (res && (res.status === 'success' || res.success) && Array.isArray(res.masterAddresses)) {
                        res.masterAddresses.forEach(a => {
                            let nick = '', realname = '', phone = '', address = '', memo = '';
                            if (Array.isArray(a)) {
                                nick = String(a[0] || '').trim();
                                realname = String(a[1] || '').trim();
                                phone = fixPhoneNumber(a[2] || '');
                                address = stripZipcode(a[3] || '');
                                const c4 = String(a[4] || '').trim();
                                memo = cleanMemoText(/^\d{5}$/.test(c4) ? (a[5] || '') : c4, address);
                            } else if (a && typeof a === 'object') {
                                nick = String(pickRowField(a, ['닉네임', 'nickname', '주문자', '고객명'], 0)).trim();
                                realname = String(pickRowField(a, ['수령인명', 'realname', '수령인', '이름', '성명'], 1)).trim();
                                phone = fixPhoneNumber(pickRowField(a, ['연락처', 'phone', '전화번호', '핸드폰번호'], 2));
                                address = stripZipcode(pickRowField(a, ['주소', 'address', '배송지'], 3));
                                const rawMemo = String(pickRowField(a, ['배송메모', 'memo', '요청사항', '메모'], 4)).trim();
                                memo = cleanMemoText(/^\d{5}$/.test(rawMemo) ? pickRowField(a, ['col_5'], 5) : rawMemo, address);
                            }
                            if (nick.toLowerCase() === 'nickname' || realname.toLowerCase() === 'realname') return;
                            if ((nick || realname) && address) {
                                incoming.push({ nickname: nick || realname, realname, phone, address, memo });
                            }
                        });
                    }

                    if (res && Array.isArray(res.customerDb)) {
                        const sheetCredits = {};
                        const sheetVips = {};
                        res.customerDb.forEach(c => {
                            const n = String(c['닉네임'] || c.col_0 || '').trim();
                            // 사장님 시트('고객상태관리' 탭)에 백업된 유튜브 API 키 자동 추출 및 로컬 캐시 저장
                            if (n === '___SYSTEM_YT_API_KEY___') {
                                const savedKey = String(c['고객상태'] || c['비밀번호'] || c.col_1 || c.col_2 || '').trim();
                                if (savedKey) {
                                    setSharedYtApiKey(savedKey);
                                    try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(savedKey)); } catch (e) {}
                                }
                                return;
                            }
                            const st = String(c['고객상태'] || '').trim().toLowerCase();
                            const cred = Number(String(c['적립금'] || '0').replace(/[^0-9.-]/g, '')) || 0;
                            if (n && (st === 'vip' || st === 'manager' || st === '관리자')) {
                                sheetVips[normalizeString(n)] = true;
                                const hKey = normalizeHandleNick(n);
                                if (hKey) sheetVips[hKey] = true;
                            }
                            if (n && n !== '닉네임') {
                                sheetCredits[n] = Math.max(0, cred);
                            }
                        });
                        setVipNickMap(sheetVips);
                        // ✨ 중요: 이전 캐시(...prev)가 시트의 줄어든 적립금(...sheetCredits)을 덮어쓰지 않도록 시트 원본 값으로 즉시 교체!
                        setCustomerCredits(sheetCredits);
                    }

                    if (incoming.length > 0) {
                        // ✨ 시트에서 수정/삭제한 내역이 100% 그대로 반영되도록 이전 로컬 캐시(prev)를 섞지 않고 시트 데이터로 즉시 교체!
                        setMasterAddresses(incoming);
                        try { localStorage.setItem('ember_staff_master_addrs_v1', JSON.stringify(incoming)); } catch (e) {}
                    }
                } catch (e) {}
            }, [activeGasUrl, activeDictSheetId]);

            // 🛡️ 구글 시트 할당량 절약용 가벼운 직통(gviz) 주소록/적립금 동기화 함수 (앱스 스크립트 호출 ZERO!)
            const syncMasterAddressDirectOnly = useCallback(async () => {
                try {
                    const directAddrRows = await fetchGoogleSheetDirect(activeDictSheetId, '찐고객사전');
                    if (Array.isArray(directAddrRows) && directAddrRows.length > 0) {
                        const directList = [];
                        directAddrRows.forEach(a => {
                            const nick = String(pickRowField(a, ['닉네임', 'nickname', '주문자', '고객명'], 0)).trim();
                            const realname = String(pickRowField(a, ['수령인명', 'realname', '수령인', '이름', '성명'], 1)).trim();
                            const phone = fixPhoneNumber(pickRowField(a, ['연락처', 'phone', '전화번호', '핸드폰번호'], 2));
                            const address = stripZipcode(pickRowField(a, ['주소', 'address', '배송지'], 3));
                            const rawMemo = String(pickRowField(a, ['배송메모', 'memo', '요청사항', '메모'], 4)).trim();
                            const memo = cleanMemoText(/^\d{5}$/.test(rawMemo) ? pickRowField(a, ['col_5'], 5) : rawMemo, address);
                            if (nick.toLowerCase() === 'nickname' || nick === '닉네임') return;
                            if ((nick || realname) && address) {
                                directList.push({ nickname: nick || realname, realname, phone, address, memo });
                            }
                        });
                        if (directList.length > 0) {
                            setMasterAddresses(directList);
                        }
                    }
                } catch (e) {}
            }, [activeDictSheetId]);

            const findMasterAddressMatch = useCallback((nickStr, pinHint = '') => {
                if (!nickStr || !Array.isArray(masterAddresses) || masterAddresses.length === 0) return null;
                const targetNorm = normalizeString(nickStr);
                const targetHandle = normalizeHandleNick(nickStr);
                const cleanPin = normalizePin4(pinHint);
                const hasRecipientTag = /\([^)]+\)$/.test(String(nickStr).trim());

                const exactMatches = masterAddresses.filter(a => normalizeString(a.nickname) === targetNorm);
                if (exactMatches.length === 1) {
                    const cand = exactMatches[0];
                    const candPin = fixPhoneNumber(cand.phone).slice(-4);
                    if (!cleanPin || !candPin || cleanPin === candPin) return cand;
                } else if (exactMatches.length > 1) {
                    if (cleanPin) {
                        const byPin = exactMatches.filter(a => fixPhoneNumber(a.phone).slice(-4) === cleanPin);
                        if (byPin.length > 0) return byPin[byPin.length - 1];
                    }
                    const distinctPhones = new Set(exactMatches.map(a => fixPhoneNumber(a.phone)).filter(Boolean));
                    if (distinctPhones.size <= 1) return exactMatches[exactMatches.length - 1];
                }

                if (!hasRecipientTag && targetHandle && targetHandle.length >= 2) {
                    const handleMatches = masterAddresses.filter(a => normalizeHandleNick(a.nickname) === targetHandle && !/\([^)]+\)$/.test(String(a.nickname).trim()));
                    if (handleMatches.length === 1) {
                        const cand = handleMatches[0];
                        const candPin = fixPhoneNumber(cand.phone).slice(-4);
                        if (!cleanPin || !candPin || cleanPin === candPin) return cand;
                    } else if (handleMatches.length > 1 && cleanPin) {
                        const byPin = handleMatches.filter(a => fixPhoneNumber(a.phone).slice(-4) === cleanPin);
                        if (byPin.length === 1) return byPin[0];
                    }
                }
                return null;
            }, [masterAddresses]);

            // 실시간 고객 포털 분리배송(_portal_splits) 및 사장님 주문서 즉시 이관(boss_pushed / boss_closed) 수신
            useEffect(() => {
                if (!staffFbDb) return;
                const splitsRef = staffFbDb.ref('ember_live_data/_portal_splits');
                const ordersRef = staffFbDb.ref('ember_live_data/_portal_orders');
                const processedSplitIds = new Set();
                let lastBossPushTs = 0;

                const handleBossOrdersPush = (snap) => {
                    const val = snap.val();
                    if (!val || typeof val !== 'object') return;
                    Object.entries(val).forEach(([bKey, node]) => {
                        if (bKey === '__MAIN_LIVE__' || !node || !Array.isArray(node.customers) || node.customers.length === 0) return;
                        if (node.updatedBy !== 'boss_pushed' && node.updatedBy !== 'boss_closed') return;

                        const cleanB = cleanDisplayTabName(node.broadcastName || bKey);
                        if (!cleanB || ['오늘의방송', '기본방송'].includes(cleanB)) return;
                        const tabKey = '주문_' + cleanB;
                        const existingBlk = localBroadcastStoreRef.current?.[tabKey];
                        if (existingBlk && existingBlk.bossPushTimestamp && node.updatedAt && existingBlk.bossPushTimestamp >= node.updatedAt) return;

                        lastBossPushTs = Math.max(lastBossPushTs, node.updatedAt || Date.now());
                        explicitlyDeletedTabsRef.current.delete(tabKey);

                        const convertedGroups = node.customers.map(c => {
                            const cardRaw = String(c.isCard || '').trim();
                            const cardOnly = cardRaw.replace(/현영완료|현영요청|현영/g, '').trim();
                            const cardMode = cardOnly.includes('완료') ? 'completed' : ((cardOnly.startsWith('O') || cardOnly.includes('카드')) ? 'requested' : 'none');
                            const cashMode = (c.cashReceipt === 'completed' || cardRaw.includes('현영완료')) ? 'completed' : ((c.cashReceipt === 'requested' || cardRaw.includes('현영')) ? 'requested' : 'none');
                            return {
                                nick: c.nickname,
                                realname: c.address?.realname || '',
                                phone: fixPhoneNumber(c.address?.phone || ''),
                                address: stripZipcode(c.address?.baseAddress || ''),
                                memo: c.address?.memo || '',
                                shipping: c.shipping !== undefined ? Number(c.shipping) : (Number(node.defaultShipping) ?? 4000),
                                deposit: Number(c.depositTotal) || 0,
                                cardMode: cardMode,
                                cashReceiptMode: cashMode,
                                isVip: Boolean(c.isVip),
                                isNoShow: Boolean(c.isNoShow),
                                isConfirmed: Boolean(c.isConfirmed),
                                pin: normalizePin4(c.phoneLast4),
                                trackingNumber: (Array.isArray(c.trackingNumbers) && c.trackingNumbers[0]) ? c.trackingNumbers[0] : '',
                                deposits: Array.isArray(c.deposits) ? c.deposits : [],
                                showDeposits: false,
                                items: (Array.isArray(c.items) ? c.items : []).map((it, idx) => ({
                                    id: `item_${node.updatedAt || Date.now()}_${idx}_${Math.random()}`,
                                    product: it.product || '',
                                    qty: Number(it.qty) || 1,
                                    price: Number(it.price) || 0,
                                    isWaitlist: Boolean(it.isWaitlist),
                                    waitlistOrder: Number(it.waitlistOrder) || 0
                                }))
                            };
                        });

                        const newBlk = {
                            broadcastName: cleanB,
                            freeShipThreshold: node.freeShippingThreshold !== undefined ? Number(node.freeShippingThreshold) : 70000,
                            defaultShipping: node.defaultShipping !== undefined ? Number(node.defaultShipping) : 4000,
                            cardFeeRate: Number(node.cardFeeRate) || 10,
                            updatedAt: Date.now(),
                            bossPushTimestamp: node.updatedAt || Date.now(),
                            groups: convertedGroups
                        };

                        // 🛡️ 사장님이 방금 전송한 방송이 직원 웹앱의 자동저장 타이머에 의해 옛날 데이터로 덮어써지지 않도록 예약된 타이머 즉시 취소!
                        if (autoSaveOrdersTimerRef.current) {
                            clearTimeout(autoSaveOrdersTimerRef.current);
                            autoSaveOrdersTimerRef.current = null;
                        }
                        pendingOrdersRowsRef.current = null;

                        setLocalBroadcastStore(prev => {
                            const next = { ...prev, [tabKey]: newBlk };
                            localBroadcastStoreRef.current = next;
                            try {
                                localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(next));
                                localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                            } catch (e) {}
                            return next;
                        });
                        setOrderTabs(prev => Array.from(new Set([tabKey, ...prev])));
                        setSelectedTab(tabKey);
                        setBroadcastName(cleanB);
                        setFreeShipThreshold(newBlk.freeShipThreshold);
                        setDefaultShipping(newBlk.defaultShipping);
                        setCardFeeRate(newBlk.cardFeeRate);
                        customerGroupsRef.current = convertedGroups;
                        setCustomerGroups(convertedGroups);
                        showToast(`📥 사장님 주문서에서 [${cleanB}] 최신 주문(${convertedGroups.length}명)이 도착했습니다!`);
                    });
                };

                const handleSplits = (snap) => {
                    const val = snap.val();
                    if (!val || typeof val !== 'object') return;
                    Object.values(val).forEach(sp => {
                        if (!sp || !sp.id || processedSplitIds.has(sp.id)) return;
                        processedSplitIds.add(sp.id);
                        const spBName = cleanDisplayTabName(sp.broadcastName || '');
                        const curBName = cleanDisplayTabName(broadcastName || selectedTab || '');
                        if (!spBName || normalizeString(spBName) !== normalizeString(curBName)) return;

                        setCustomerGroups(prev => {
                            const origIdx = prev.findIndex(g => normalizeString(g.nick) === normalizeString(sp.originalNickname));
                            if (origIdx === -1) return prev;
                            if (prev.some(g => normalizeString(g.nick) === normalizeString(sp.splitNickname))) return prev;
                            const origGroup = prev[origIdx];
                            const next = [...prev];
                            next[origIdx] = {
                                ...origGroup,
                                shipping: sp.remainShipping !== undefined ? Number(sp.remainShipping) : origGroup.shipping,
                                items: Array.isArray(sp.remainItems) && sp.remainItems.length > 0 ? sp.remainItems : origGroup.items
                            };
                            next.splice(origIdx + 1, 0, {
                                ...origGroup,
                                nick: sp.splitNickname,
                                realname: sp.address?.realname || origGroup.realname,
                                phone: fixPhoneNumber(sp.address?.phone || origGroup.phone),
                                address: stripZipcode(sp.address?.baseAddress || ''),
                                memo: sp.address?.memo || '',
                                shipping: Number(sp.splitShipping) || 0,
                                deposit: 0,
                                trackingNumber: '',
                                deposits: [],
                                items: Array.isArray(sp.splitItems) ? sp.splitItems : []
                            });
                            return next;
                        });
                    });
                };
                splitsRef.on('value', handleSplits);
                ordersRef.on('value', handleBossOrdersPush);
                return () => {
                    splitsRef.off('value', handleSplits);
                    ordersRef.off('value', handleBossOrdersPush);
                };
            }, [broadcastName, selectedTab]);

            const loadLiveInventoryFromMaster = useCallback(async () => {
                try {
                    const directInv = await fetchGoogleSheetDirect(activeDictSheetId, '실시간재고');
                    if (Array.isArray(directInv)) {
                        const list = [];
                        directInv.forEach((r, idx) => {
                            const name = String(pickRowField(r, ['name', '상품명'], 0)).trim();
                            if (!name || name === '__EMPTY__' || name.toLowerCase() === 'name' || name === '상품명') return;
                            const price = Number(String(pickRowField(r, ['price', '단가'], 1) || '0').replace(/[^0-9.-]/g, '')) || 0;
                            const status = String(pickRowField(r, ['status', '상태'], 3)).trim();
                    list.push({ id: `linv_${idx}_${Date.now()}`, name, price, isSoldOut: status === '품절' });
                });
                setLiveInventory(list);
            }
        } catch (e) {}
    }, [activeDictSheetId]);

    const loadInitialTabs = useCallback(async (forceRefresh = false) => {
        setIsLoading(true);
        try {
            let deletedInCloud = new Set();
            let bossPushedNodes = {};
            if (staffFbDb) {
                try {
                    const [delSnap, ordersSnap] = await Promise.all([
                        staffFbDb.ref('ember_live_data/_deleted_broadcasts').once('value'),
                        staffFbDb.ref('ember_live_data/_portal_orders').once('value')
                    ]);
                    const delVal = delSnap.val() || {};
                    Object.keys(delVal).forEach(k => {
                        deletedInCloud.add(normalizeString(k));
                        if (delVal[k]?.broadcastName) deletedInCloud.add(normalizeString(delVal[k].broadcastName));
                    });
                    bossPushedNodes = ordersSnap.val() || {};
                } catch (e) {}
            }

            let parsedBlocks = {};
            // 1순위: 캐시 지연이 전혀 없는 실시간 앱스 스크립트(get_orders)로 '메인주문' 시트 원본을 즉시 스캔!
            const res = await fetchGas(`${activeGasUrl}?action=get_orders&masterId=${activeStaffSheetId}&tabName=${encodeURIComponent('메인주문')}&t=${Date.now()}`, null, 12000).catch(() => null);
            const fetched = Array.isArray(res?.data) ? res.data : (Array.isArray(res?.orders) ? res.orders : []);
            if (fetched.length > 0) {
                parsedBlocks = parseRowsIntoBroadcastBlocks(fetched, '메인주문');
            } else {
                const directRows = await fetchGoogleSheetDirect(activeStaffSheetId, '메인주문');
                if (Array.isArray(directRows) && directRows.length > 0) {
                    parsedBlocks = parseRowsIntoBroadcastBlocks(directRows, '메인주문');
                }
            }

            const lastDirtyTs = Number(localStorage.getItem(STAFF_LOCAL_DIRTY_TIME_KEY) || '0');
            const isRecentlyModified = !forceRefresh && (Date.now() - lastDirtyTs < 25000);

            const mergedStore = {};
            Object.entries(parsedBlocks).forEach(([tKey, blk]) => {
                const cleanB = cleanDisplayTabName(blk.broadcastName || tKey);
                if (!cleanB || explicitlyDeletedTabsRef.current.has(tKey) || deletedInCloud.has(normalizeString(cleanB))) return;
                mergedStore[tKey] = blk;
            });

            // 사장님 주문서에서 방금 전송(boss_pushed / boss_closed)한 최신 클라우드 데이터가 있으면 최우선으로 병합!
            Object.entries(bossPushedNodes).forEach(([bKey, node]) => {
                if (bKey === '__MAIN_LIVE__' || !node || !Array.isArray(node.customers) || node.customers.length === 0) return;
                if (node.updatedBy !== 'boss_pushed' && node.updatedBy !== 'boss_closed') return;
                const cleanB = cleanDisplayTabName(node.broadcastName || bKey);
                if (!cleanB || ['오늘의방송', '기본방송'].includes(cleanB)) return;
                if (deletedInCloud.has(normalizeString(cleanB))) return;
                const tabKey = '주문_' + cleanB;
                const convertedGroups = node.customers.map(c => {
                    const cardRaw = String(c.isCard || '').trim();
                    const cardOnly = cardRaw.replace(/현영완료|현영요청|현영/g, '').trim();
                    const cardMode = cardOnly.includes('완료') ? 'completed' : ((cardOnly.startsWith('O') || cardOnly.includes('카드')) ? 'requested' : 'none');
                    const cashMode = (c.cashReceipt === 'completed' || cardRaw.includes('현영완료')) ? 'completed' : ((c.cashReceipt === 'requested' || cardRaw.includes('현영')) ? 'requested' : 'none');
                    return {
                        nick: c.nickname,
                        realname: c.address?.realname || '',
                        phone: fixPhoneNumber(c.address?.phone || ''),
                        address: stripZipcode(c.address?.baseAddress || ''),
                        memo: c.address?.memo || '',
                        shipping: c.shipping !== undefined ? Number(c.shipping) : (Number(node.defaultShipping) ?? 4000),
                        deposit: Number(c.depositTotal) || 0,
                        cardMode: cardMode,
                        cashReceiptMode: cashMode,
                        isVip: Boolean(c.isVip),
                        isNoShow: Boolean(c.isNoShow),
                        isConfirmed: Boolean(c.isConfirmed),
                        pin: normalizePin4(c.phoneLast4),
                        trackingNumber: (Array.isArray(c.trackingNumbers) && c.trackingNumbers[0]) ? c.trackingNumbers[0] : '',
                        deposits: Array.isArray(c.deposits) ? c.deposits : [],
                        showDeposits: false,
                        items: (Array.isArray(c.items) ? c.items : []).map((it, idx) => ({
                            id: `item_${node.updatedAt || Date.now()}_${idx}_${Math.random()}`,
                            product: it.product || '',
                            qty: Number(it.qty) || 1,
                            price: Number(it.price) || 0,
                            isWaitlist: Boolean(it.isWaitlist),
                            waitlistOrder: Number(it.waitlistOrder) || 0
                        }))
                    };
                });
                mergedStore[tabKey] = {
                    broadcastName: cleanB,
                    freeShipThreshold: node.freeShippingThreshold !== undefined ? Number(node.freeShippingThreshold) : (mergedStore[tabKey]?.freeShipThreshold ?? 70000),
                    defaultShipping: node.defaultShipping !== undefined ? Number(node.defaultShipping) : (mergedStore[tabKey]?.defaultShipping ?? 4000),
                    cardFeeRate: Number(node.cardFeeRate) || 10,
                    updatedAt: node.updatedAt || Date.now(),
                    bossPushTimestamp: node.updatedAt || Date.now(),
                    groups: convertedGroups
                };
            });

            if (isRecentlyModified && localBroadcastStoreRef.current) {
                Object.entries(localBroadcastStoreRef.current).forEach(([tKey, blk]) => {
                    const cleanB = cleanDisplayTabName(blk?.broadcastName || tKey);
                    if (!cleanB || explicitlyDeletedTabsRef.current.has(tKey) || deletedInCloud.has(normalizeString(cleanB))) return;
                    if (mergedStore[tKey]?.bossPushTimestamp && (!blk.bossPushTimestamp || mergedStore[tKey].bossPushTimestamp > blk.bossPushTimestamp)) {
                        return;
                    }
                    mergedStore[tKey] = blk;
                });
            }

            const sortedTabs = Object.keys(mergedStore).sort((a, b) => {
                const scA = extractBroadcastDateScore(a);
                const scB = extractBroadcastDateScore(b);
                if (scA !== scB) return scB - scA;
                return b.localeCompare(a, 'ko');
            });

            localBroadcastStoreRef.current = mergedStore;
            setLocalBroadcastStore(mergedStore);
            setOrderTabs(sortedTabs);

            const targetTab = (selectedTab && mergedStore[selectedTab]) ? selectedTab : (sortedTabs[0] || '');
            if (targetTab && mergedStore[targetTab]) {
                setSelectedTab(targetTab);
                const blk = mergedStore[targetTab];
                setBroadcastName(cleanDisplayTabName(blk.broadcastName || targetTab));
                setFreeShipThreshold(blk.freeShipThreshold ?? 70000);
                setDefaultShipping(blk.defaultShipping ?? 4000);
                setCardFeeRate(blk.cardFeeRate ?? 10);
                customerGroupsRef.current = blk.groups || [];
                setCustomerGroups(blk.groups || []);
            } else {
                setSelectedTab('');
                setBroadcastName('');
                customerGroupsRef.current = [];
                setCustomerGroups([]);
            }
        } catch (e) {} finally {
            setIsLoading(false);
        }
    }, [activeStaffSheetId, activeGasUrl, selectedTab]);

    const handleClearLiveInventory = useCallback(() => {
                if (liveInventory.length === 0) return showToast('이미 방송 라인업이 비어 있습니다.');
                openModal(
                    '현재 등록된 방송 라인업(상품 목록)을 모두 비우시겠습니까?\n(비우는 즉시 구글 시트 실시간재고와 고객용 라인업에서도 모두 지워집니다)',
                    'confirm',
                    async () => {
                        setLiveInventory([]);
                        if (staffFbDb) {
                            staffFbDb.ref('ember_live_data').update({
                                '_global_config/currentPinnedId': null,
                                '_live_catalog': {
                                    items: [],
                                    rawCount: 0,
                                    explicitClear: true,
                                    updatedAt: Date.now()
                                }
                            }).catch(() => {});
                        }
                        try {
                            await fetchGas(activeGasUrl, {
                                action: 'save_inventory',
                                masterId: activeDictSheetId,
                                forceClear: true,
                                data: [{ name: '__EMPTY__', price: 0, stock: '', status: '품절', isLocked: false }]
                            });
                        } catch (e) {}
                        showToast('🧹 방송 라인업 상품 목록이 모두 비워졌습니다!');
                    }
                );
            }, [liveInventory.length, openModal, showToast, activeGasUrl, activeDictSheetId]);

            useEffect(() => {
                loadInitialTabs(false);
                loadCsOrders();
                loadMasterAddresses();
                loadLiveInventoryFromMaster();
                // 🛡️ 구글 앱스 스크립트 호출량을 아끼기 위해 주기적 동기화는 30초마다 무료 직통 리더(gviz)만 사용!
                const dictTimer = setInterval(() => {
                    if (!document.hidden) syncMasterAddressDirectOnly();
                }, 30000);
                return () => clearInterval(dictTimer);
            }, [loadMasterAddresses, syncMasterAddressDirectOnly, loadLiveInventoryFromMaster]);

            const extractYtId = (url) => {
                if (!url) return '';
                const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/))([\w-]{11})/);
                return m ? m[1] : String(url).trim();
            };

            const handleConnectYoutubeLive = async (e) => {
                if (e) e.preventDefault();
                if (isBossLiveNow) {
                    return openModal(`🚨 현재 사장님 주문서에서 [${bossActiveBroadcastName}] 생방송이 진행 중입니다!\n\n유튜브 API 할당량 보호 및 주문서 충돌 방지를 위해 사장님 생방송 중에는 직원용 라이브 주문서를 연결할 수 없습니다.`);
                }
                const vid = extractYtId(liveYoutubeUrl);
                if (!vid || vid.length !== 11) {
                    return openModal('유튜브 라이브 영상 주소(URL)를 정확히 입력해 주세요.');
                }
                // 1) 파이어베이스 + 로컬스토리지 + 사장님 마스터 시트(GAS get_all)에서 사용 가능한 모든 API 키 수집
                let rawKeyStr = sharedYtApiKey || '';
                if (staffFbDb) {
                    try {
                        const snap = await staffFbDb.ref('ember_live_data/_global_config/sharedYtApiKey').once('value');
                        if (snap.val()) rawKeyStr = `${rawKeyStr}\n${snap.val()}`;
                    } catch (err) {}
                }
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && k.endsWith('youtubeApiKey')) {
                            const val = localStorage.getItem(k);
                            if (val) {
                                try {
                                    const parsed = JSON.parse(val);
                                    if (parsed) rawKeyStr = `${rawKeyStr}\n${parsed}`;
                                } catch (e) {
                                    rawKeyStr = `${rawKeyStr}\n${val}`;
                                }
                            }
                        }
                    }
                } catch (err) {}

                // 만약 아직 키가 없다면 사장님 마스터 시트('고객상태관리' 탭)에서 앱스 스크립트(get_all)로 즉시 조회!
                if (!rawKeyStr || !rawKeyStr.includes('AIza')) {
                    try {
                        const gasRes = await fetchGas(`${activeGasUrl}?action=get_all&masterId=${activeDictSheetId}&skipHeavy=true&t=${Date.now()}`, null, 10000);
                        if (gasRes && Array.isArray(gasRes.customerDb)) {
                            const keyRow = gasRes.customerDb.find(c => String(c['닉네임'] || c.col_0 || '').trim() === '___SYSTEM_YT_API_KEY___');
                            if (keyRow) {
                                const sheetKey = String(keyRow['고객상태'] || keyRow['비밀번호'] || keyRow.col_1 || keyRow.col_2 || '').trim();
                                if (sheetKey) {
                                    rawKeyStr = `${rawKeyStr}\n${sheetKey}`;
                                    setSharedYtApiKey(sheetKey);
                                    try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(sheetKey)); } catch (e) {}
                                }
                            }
                        }
                    } catch (err) {}
                }

                // 정규식으로 문자열 안에 들어있는 모든 구글 API 키(AIza... 39자리)를 빠짐없이 추출
                const matchedKeys = String(rawKeyStr || '').match(/AIza[0-9A-Za-z\-_]{35}/g) || [];
                const apiKeys = Array.from(new Set(matchedKeys));

                if (apiKeys.length === 0) {
                    return openModal('유튜브 API 키를 불러오지 못했습니다.\n우측 [강은지 주문서]를 한 번 열어두시거나, 아래 입력창에 유튜브 API 키(AIza...)를 붙여넣어 주세요.', 'prompt', (inputKey) => {
                        if (inputKey && inputKey.includes('AIza')) {
                            const cleanK = inputKey.trim();
                            setSharedYtApiKey(cleanK);
                            try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(cleanK)); } catch (e) {}
                            if (staffFbDb) staffFbDb.ref('ember_live_data/_global_config/sharedYtApiKey').set(cleanK).catch(() => {});
                            fetchGas(activeGasUrl, {
                                action: 'save_customer_management',
                                masterId: activeDictSheetId,
                                data: { nickname: '___SYSTEM_YT_API_KEY___', type: cleanK }
                            }).catch(() => {});
                            showToast('✅ API 키가 저장되었습니다! 다시 [연결] 버튼을 눌러주세요.');
                        }
                    }, '', '유튜브 API 키 등록');
                }

                // 여러 개의 키가 함께 공유될 수 있도록 전체 키 문자열을 상태에 보존
                const joinedKeys = apiKeys.join('\n');
                if (joinedKeys !== sharedYtApiKey) {
                    setSharedYtApiKey(joinedKeys);
                    try { localStorage.setItem('default_youtubeApiKey', JSON.stringify(joinedKeys)); } catch (e) {}
                }

                let lastErrorMsg = '';
                let videoFoundButNoActiveChat = false;
                let endedStreamTitle = '';

                for (let i = 0; i < apiKeys.length; i++) {
                    const curKey = apiKeys[i];
                    try {
                        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails,snippet&id=${vid}&key=${curKey}`);
                        const data = await res.json();

                        if (!res.ok || data?.error) {
                            lastErrorMsg = data?.error?.message || `HTTP ${res.status}`;
                            continue; // 현재 키가 할당량 초과(403) 또는 키 오류면 즉시 다음 키로 넘어감!
                        }

                        if (!data.items || data.items.length === 0) {
                            return openModal('해당 유튜브 영상을 찾을 수 없습니다.\n(비공개 영상이거나 주소가 잘못되었는지 확인해 주세요)');
                        }

                        const videoItem = data.items[0];
                        const liveDetails = videoItem.liveStreamingDetails;
                        const chatId = liveDetails?.activeLiveChatId;

                        if (chatId) {
                            liveNextPageTokenRef.current = '';
                            setIsLiveChatPaused(false);
                            setIsStaffActivePoller(true);
                            setLiveChatId(chatId);
                            setIsStaffLiveActive(true);
                            if (staffFbDb) {
                                staffFbDb.ref('ember_live_data/_portal_live_mode').update({
                                    isLive: true,
                                    liveOwner: 'staff',
                                    activePollerTabId: myStaffPollerTabIdRef.current,
                                    activeBroadcastName: cleanDisplayTabName(liveBroadcastTitle || '오늘의방송'),
                                    updatedAt: Date.now()
                                }).catch(() => {});
                                staffFbDb.ref('ember_live_data/_global_config').update({
                                    catalogClosedLock: false,
                                    isStoreClosed: false
                                }).catch(() => {});
                            }
                            syncStaffLiveRowsToPortal(liveOrderRows, liveBroadcastTitle, true);
                            showToast(`🟢 유튜브 라이브 연결 완료! (${i + 1}번째 API 키 사용중)`);
                            return;
                        } else {
                            videoFoundButNoActiveChat = true;
                            endedStreamTitle = videoItem.snippet?.title || '';
                            break;
                        }
                    } catch (err) {
                        lastErrorMsg = err.message || '네트워크 오류';
                    }
                }

                if (videoFoundButNoActiveChat) {
                    openModal(
                        `선택하신 영상${endedStreamTitle ? ` [${endedStreamTitle}]` : ''}은 현재 '실시간 스트리밍 중'이 아니거나 이미 종료된 다시보기 영상입니다.\n\n💡 유튜브 정책상 실시간 채팅 수집은 현재 생방송(LIVE)이 켜져 있는 영상에서만 작동합니다.`
                    );
                } else {
                    openModal(`유튜브 연결 실패: ${lastErrorMsg || '등록된 모든 API 키의 일일 할당량이 초과되었거나 잘못된 키입니다.'}`);
                }
            };

            // 유튜브 라이브 채팅 폴링 (오직 방송을 시작한 단일 탭에서만 실행 & 할당량 소진된 키는 즉시 다음 키로 자동 전환!)
            useEffect(() => {
                if (activeMainTab !== 'live_order' || !liveChatId || !sharedYtApiKey || isLiveChatPaused || !isStaffLiveActive || !isStaffActivePoller) return;
                let timer = null;
                let cancelled = false;
                const keys = Array.from(new Set(String(sharedYtApiKey).match(/AIza[0-9A-Za-z\-_]{35}/g) || []));
                const deadKeySet = new Set();
                let keyIdx = 0;

                const pollChat = async () => {
                    if (cancelled || keys.length === 0) return;
                    const aliveKeys = keys.filter(k => !deadKeySet.has(k));
                    if (aliveKeys.length === 0) return;
                    const curKey = aliveKeys[keyIdx % aliveKeys.length];

                    let nextWaitMs = 5500;
                    try {
                        let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${liveChatId}&part=snippet,authorDetails&maxResults=200&key=${curKey}`;
                        if (liveNextPageTokenRef.current) url += `&pageToken=${liveNextPageTokenRef.current}`;
                        const res = await fetch(url);
                        const data = await res.json();
                        if (!res.ok || data?.error) {
                            if (res.status === 403 || res.status === 400 || data?.error?.code === 403) {
                                deadKeySet.add(curKey);
                                keyIdx++;
                                if (!cancelled && keys.filter(k => !deadKeySet.has(k)).length > 0) {
                                    timer = setTimeout(pollChat, 300); // 막힌 즉시 0.3초 만에 다음 키로 재시도!
                                    return;
                                }
                            }
                        } else {
                            if (data.pollingIntervalMillis) {
                                nextWaitMs = Math.max(5500, Number(data.pollingIntervalMillis));
                            }
                            if (Array.isArray(data.items) && data.items.length > 0) {
                                if (data.nextPageToken) liveNextPageTokenRef.current = data.nextPageToken;
                                const incoming = data.items.map(item => ({
                                    id: item.id,
                                    time: new Date(item.snippet.publishedAt).toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' }),
                                    nickname: String(item.authorDetails.displayName || '').replace(/@/g, '').trim(),
                                    content: item.snippet.displayMessage
                                }));
                                unsavedLiveChatsRef.current.push(...incoming);
                                setLiveChats(prev => {
                                    const map = new Map();
                                    [...prev, ...incoming].forEach(c => map.set(c.id, c));
                                    const arr = Array.from(map.values());
                                    return arr.slice(-500);
                                });
                            }
                        }
                    } catch (e) {}
                    if (!cancelled) timer = setTimeout(pollChat, nextWaitMs);
