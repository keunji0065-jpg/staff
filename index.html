                };
                pollChat();

                const backupInterval = setInterval(() => {
                    if (unsavedLiveChatsRef.current.length > 0) {
                        const batch = [...unsavedLiveChatsRef.current];
                        unsavedLiveChatsRef.current = [];
                        fetchGas(activeGasUrl, {
                            action: 'save_chats',
                            masterId: activeDictSheetId,
                            broadcastName: liveBroadcastTitle,
                            data: batch.map(c => [c.time, c.nickname, c.content])
                        }).catch(() => {});
                    }
                }, 15000);

                return () => {
                    cancelled = true;
                    if (timer) clearTimeout(timer);
                    clearInterval(backupInterval);
                };
            }, [activeMainTab, liveChatId, sharedYtApiKey, isLiveChatPaused, isStaffLiveActive, isStaffActivePoller, activeGasUrl, activeDictSheetId, liveBroadcastTitle]);

            // 직원이 라이브 주문표를 수정할 때마다 고객용 셀프 포털(__MAIN_LIVE__)에 실시간 미러링
            const syncStaffLiveRowsToPortal = useCallback((rowsToSync, bTitle, isLiveOn) => {
                if (!staffFbDb || isBossLiveNow) return;
                const cleanB = cleanDisplayTabName(bTitle || '오늘의방송');
                if (!isLiveOn) {
                    staffFbDb.ref('ember_live_data/_portal_live_mode').set({
                        isLive: false,
                        liveOwner: 'none',
                        lastClosedBroadcastName: cleanB,
                        updatedAt: Date.now()
                    }).catch(() => {});
                    staffFbDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').remove().catch(() => {});
                    return;
                }
                const byNick = {};
                (rowsToSync || []).forEach(r => {
                    const nick = String(r.nick || '').trim();
                    if (!nick) return;
                    const normN = normalizeString(nick);
                    if (!byNick[normN]) {
                        const matchedFallback = (!r.address) ? findMasterAddressMatch(nick) : null;
                        const finalReal = r.realname || matchedFallback?.realname || '';
                        const finalPh = fixPhoneNumber(r.phone || matchedFallback?.phone || '');
                        const finalAddr = stripZipcode(r.address || matchedFallback?.address || '');
                        const finalMemo = r.memo || matchedFallback?.memo || '';
                        const pin4 = normalizePin4(r.pin) || (finalPh.length >= 4 ? finalPh.slice(-4) : '');
                        const custRows = (rowsToSync || []).filter(x => normalizeString(x.nick) === normN);
                        const custProdSum = custRows.reduce((s, x) => {
                            const p = (Number(x.price) || 0) * (Number(x.qty) || 1);
                            return s + (p > 0 ? p : 0);
                        }, 0);
                        const isJeju = Boolean(finalAddr && finalAddr.includes('제주'));
                        const isFreeShip = Number(liveFreeShipThreshold) > 0 && custProdSum >= Number(liveFreeShipThreshold);
                        const repShipRow = custRows.find(x => x.shipping !== undefined && x.shipping !== '') || custRows[0] || r;
                        const autoShip = r.isVip ? 0 : (custProdSum > 0 ? ((isFreeShip ? 0 : Number(liveDefaultShip)) + (isJeju ? 3000 : 0)) : Number(liveDefaultShip));
                        const singleShipFee = r.isVip ? 0 : (isFreeShip ? (isJeju ? 3000 : 0) : (Number(repShipRow.shipping ?? autoShip) || 0));
                        byNick[normN] = {
                            sheetTabName: '메인주문',
                            nickname: nick,
                            phoneLast4: pin4,
                            broadcastName: cleanB,
                            isVip: Boolean(r.isVip),
                            credit: getCustomerCreditAmount(nick),
                            freeShippingThreshold: Number(liveFreeShipThreshold) || 70000,
                            cardFeeRate: 10,
                            isCard: '',
                            cashReceipt: 'none',
                            shipping: singleShipFee,
                            depositTotal: 0,
                            deposits: [],
                            items: [],
                            address: finalAddr ? {
                                realname: finalReal,
                                phone: finalPh,
                                zipcode: '',
                                baseAddress: finalAddr,
                                detailAddress: '',
                                memo: finalMemo,
                                updatedAt: ''
                            } : null,
                            trackingNumbers: [],
                            isConfirmed: false
                        };
                    }
                    const priceTotal = (Number(r.price) || 0) * (Number(r.qty) || 1);
                    if (r.product) {
                        byNick[normN].items.push({
                            id: byNick[normN].items.length + 1,
                            product: r.product,
                            qty: Number(r.qty) || 1,
                            price: priceTotal,
                            isWaitlist: false,
                            waitlistOrder: 0
                        });
                    }
                    if (r.isPaid) {
                        byNick[normN].depositTotal += priceTotal;
                    }
                });
                Object.values(byNick).forEach(cust => {
                    const normN = normalizeString(cust.nickname);
                    const allRowsForCust = (rowsToSync || []).filter(r => normalizeString(r.nick) === normN);
                    const isShipPaidForCust = allRowsForCust.some(r => Boolean(r.isShipPaid));
                    if (isShipPaidForCust) {
                        cust.depositTotal += (Number(cust.shipping) || 0);
                    }
                });
                staffFbDb.ref('ember_live_data/_portal_live_mode').update({
                    isLive: true,
                    liveOwner: 'staff',
                    activePollerTabId: myStaffPollerTabIdRef.current,
                    activeBroadcastName: cleanB,
                    updatedAt: Date.now()
                }).catch(() => {});
                staffFbDb.ref('ember_live_data/_global_config').update({
                    catalogClosedLock: false,
                    isStoreClosed: false
                }).catch(() => {});
                staffFbDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').set({
                    broadcastName: cleanB,
                    updatedAt: Date.now(),
                    updatedBy: 'staff_live',
                    customers: Object.values(byNick)
                }).catch(() => {});

                // 생방송 활성화 상태에서는 입력·변경 시마다 직원용 시트('메인주문')와 고객 포털에도 즉시 자동 저장!
                const validRows = (rowsToSync || []).filter(r => r.nick && r.product);
                if (validRows.length > 0 && cleanB && !['오늘의방송', '기본방송'].includes(cleanB)) {
                    const tabKey = '주문_' + cleanB;
                    const tempGroups = Object.values(byNick).map(c => ({
                        nick: c.nickname,
                        realname: c.address?.realname || '',
                        phone: c.address?.phone || '',
                        address: c.address?.baseAddress || '',
                        memo: c.address?.memo || '',
                        shipping: Number(c.shipping) || 0,
                        deposit: Number(c.depositTotal) || 0,
                        cardMode: 'none',
                        cashReceiptMode: 'none',
                        isVip: Boolean(c.isVip),
                        isNoShow: false,
                        isConfirmed: false,
                        pin: c.phoneLast4 || '',
                        trackingNumber: '',
                        deposits: [],
                        showDeposits: false,
                        items: (c.items || []).map((it, idx) => ({
                            id: `item_${Date.now()}_${idx}`,
                            product: it.product,
                            qty: it.qty,
                            price: it.price,
                            isWaitlist: false,
                            waitlistOrder: 0
                        }))
                    }));
                    setOrderTabs(prev => Array.from(new Set([tabKey, ...prev])));
                    saveUpdatedGroupsImmediately(tempGroups, '', cleanB);
                }
            }, [liveDefaultShip, liveFreeShipThreshold, getCustomerCreditAmount, saveUpdatedGroupsImmediately, findMasterAddressMatch]);

            // 라이브 작성 중인 줄에 아직 주소가 비어있는데 찐고객사전/이전방송 주소록이 로드되면 자동으로 채워넣기!
            useEffect(() => {
                if (masterAddresses.length === 0 || liveOrderRows.length === 0) return;
                setLiveOrderRows(prev => {
                    let changed = false;
                    const next = prev.map(r => {
                        if (!r.nick || r.address) return r;
                        const m = findMasterAddressMatch(r.nick);
                        if (!m || !m.address) return r;
                        changed = true;
                        const cleanPh = fixPhoneNumber(m.phone || '');
                        return {
                            ...r,
                            realname: r.realname || m.realname || '',
                            phone: r.phone || cleanPh,
                            address: stripZipcode(m.address),
                            memo: r.memo || m.memo || '',
                            pin: r.pin || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '')
                        };
                    });
                    return changed ? next : prev;
                });
            }, [masterAddresses, findMasterAddressMatch]);

            // 채팅 클릭 시 닉네임 복사 + 빈 주문서 줄 생성 후 상품명 칸에 포커스
            const handleLiveChatNickClick = (chat) => {
                const cleanN = String(chat.nickname || '').trim();
                if (!cleanN) return;
                copyToClipboard(cleanN);
                setClickedLiveChatIds(prev => ({ ...prev, [chat.id]: true }));
                const matchedAddr = findMasterAddressMatch(cleanN);
                const isVipCust = Boolean(vipNickMap[normalizeString(cleanN)] || (normalizeHandleNick(cleanN) && vipNickMap[normalizeHandleNick(cleanN)]));
                const cleanPh = matchedAddr ? fixPhoneNumber(matchedAddr.phone) : '';
                const existingRow = liveOrderRows.find(r => normalizeString(r.nick) === normalizeString(cleanN));
                const nowTs = Date.now();
                const rowId = `lrow_${nowTs}_${Math.random().toString(36).slice(2, 6)}`;
                const newRow = {
                    id: rowId,
                    createdAt: nowTs,
                    nick: cleanN,
                    pin: existingRow?.pin || (cleanPh.length >= 4 ? cleanPh.slice(-4) : ''),
                    product: '',
                    qty: 1,
                    price: 0,
                    shipping: existingRow !== undefined ? existingRow.shipping : (isVipCust ? 0 : liveDefaultShip),
                    isPaid: false,
                    isShipPaid: existingRow ? Boolean(existingRow.isShipPaid) : false,
                    isVip: isVipCust,
                    realname: existingRow?.realname || matchedAddr?.realname || '',
                    phone: existingRow?.phone || cleanPh,
                    address: existingRow?.address || stripZipcode(matchedAddr?.address || ''),
                    memo: existingRow?.memo || matchedAddr?.memo || ''
                };
                const nextRows = [newRow, ...liveOrderRows];
                setLiveOrderRows(nextRows);
                if (!isStaffLiveActive) setIsStaffLiveActive(true);
                syncStaffLiveRowsToPortal(nextRows, liveBroadcastTitle, true);
                setTimeout(() => {
                    const el = document.getElementById(`live-prod-${rowId}`);
                    if (el) el.focus();
                }, 40);
            };

            const updateLiveOrderRow = (rowId, updater) => {
                setLiveOrderRows(prev => {
                    const target = prev.find(r => r.id === rowId);
                    const updatedTarget = target ? updater(target) : null;
                    const targetNormNick = updatedTarget && updatedTarget.nick ? normalizeString(updatedTarget.nick) : '';

                    let next = prev.map(r => (r.id === rowId ? updatedTarget : r));

                    if (targetNormNick) {
                        const custProdSum = next
                            .filter(r => normalizeString(r.nick) === targetNormNick)
                            .reduce((sum, r) => {
                                const p = (Number(r.price) || 0) * (Number(r.qty) || 1);
                                return sum + (p > 0 ? p : 0);
                            }, 0);
                        const isJeju = Boolean(updatedTarget.address && String(updatedTarget.address).includes('제주'));
                        const isFreeShip = Number(liveFreeShipThreshold) > 0 && custProdSum >= Number(liveFreeShipThreshold);
                        const autoShip = updatedTarget.isVip
                            ? 0
                            : (custProdSum > 0 ? ((isFreeShip ? 0 : Number(liveDefaultShip)) + (isJeju ? 3000 : 0)) : Number(liveDefaultShip));
                        const didManualShipChange = target && Number(target.shipping) !== Number(updatedTarget.shipping);
                        const finalShip = didManualShipChange ? Number(updatedTarget.shipping) : autoShip;

                        next = next.map(r => {
                            if (normalizeString(r.nick) === targetNormNick) {
                                return {
                                    ...r,
                                    pin: updatedTarget.pin,
                                    shipping: finalShip,
                                    isShipPaid: Boolean(updatedTarget.isShipPaid),
                                    realname: updatedTarget.realname,
                                    phone: updatedTarget.phone,
                                    address: updatedTarget.address,
                                    memo: updatedTarget.memo
                                };
                            }
                            return r;
                        });
                    }
                    syncStaffLiveRowsToPortal(next, liveBroadcastTitle, isStaffLiveActive || next.some(x => x.product));
                    return next;
                });
            };

            // 라이브 주문표 정렬 토글 핸들러 (닉네임 / 주문상품명 / 입금확인)
            const handleToggleLiveSort = (field) => {
                setLiveSortConfig(prev => {
                    if (prev.field !== field) {
                        return { field, dir: 'asc' };
                    }
                    if (prev.dir === 'asc') {
                        return { field, dir: 'desc' };
                    }
                    return { field: 'time', dir: 'desc' }; // 3번째 클릭 시 원래 입력시간순 복귀
                });
            };

            const sortedLiveOrderRows = useMemo(() => {
                const list = [...liveOrderRows];
                const { field, dir } = liveSortConfig;
                if (field === 'time') {
                    return list.sort((a, b) => {
                        const tA = Number(a.createdAt || String(a.id).replace(/[^0-9]/g, '').slice(0, 13)) || 0;
                        const tB = Number(b.createdAt || String(b.id).replace(/[^0-9]/g, '').slice(0, 13)) || 0;
                        return dir === 'asc' ? tA - tB : tB - tA;
                    });
                }
                if (field === 'nick') {
                    return list.sort((a, b) => {
                        const cmp = String(a.nick || '').localeCompare(String(b.nick || ''), 'ko', { numeric: true });
                        return dir === 'asc' ? cmp : -cmp;
                    });
                }
                if (field === 'product') {
                    return list.sort((a, b) => {
                        const cmp = String(a.product || '').localeCompare(String(b.product || ''), 'ko', { numeric: true });
                        return dir === 'asc' ? cmp : -cmp;
                    });
                }
                if (field === 'paid') {
                    return list.sort((a, b) => {
                        const pA = (a.isPaid ? 2 : 0) + (a.isShipPaid ? 1 : 0);
                        const pB = (b.isPaid ? 2 : 0) + (b.isShipPaid ? 1 : 0);
                        // asc: 미납(0) 먼저, desc: 완납(3) 먼저
                        if (pA !== pB) return dir === 'asc' ? pA - pB : pB - pA;
                        return String(a.nick || '').localeCompare(String(b.nick || ''), 'ko');
                    });
                }
                return list;
            }, [liveOrderRows, liveSortConfig]);

            const handleSaveLiveInventoryToSheet = async (nextInv) => {
                setLiveInventory(nextInv);
                if (staffFbDb && nextInv.length > 0) {
                    staffFbDb.ref('ember_live_data/_global_config').update({
                        catalogClosedLock: false,
                        isStoreClosed: false
                    }).catch(() => {});
                }
                try {
                    await fetchGas(activeGasUrl, {
                        action: 'save_inventory',
                        masterId: activeDictSheetId,
                        forceClear: true,
                        data: nextInv.length > 0
                            ? nextInv.map(i => ({ name: i.name, price: i.price, stock: '', status: i.isSoldOut ? '품절' : '', isLocked: false }))
                            : [{ name: '__EMPTY__', price: 0, stock: '', status: '품절', isLocked: false }]
                    });
                } catch (e) {}
            };

            // 주문 작성표에 방송 라인업에 없는 새 상품명을 입력하면 우측 방송 라인업 리스트에 자동으로 추가/단가 동기화하는 함수
            const syncNewProductFromOrderRowToLineup = useCallback((rawProdName, rawUnitPrice) => {
                const cleanName = String(rawProdName || '').trim();
                if (!cleanName || cleanName === '적립금') return;
                const unitPrice = Math.max(0, Number(rawUnitPrice) || 0);

                setLiveInventory(prev => {
                    const existIdx = prev.findIndex(item => normalizeString(item.name) === normalizeString(cleanName));
                    let nextInv = null;
                    if (existIdx === -1) {
                        nextInv = [{ id: `linv_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`, name: cleanName, price: unitPrice, isSoldOut: false }, ...prev];
                    } else if (unitPrice > 0 && Number(prev[existIdx].price || 0) !== unitPrice) {
                        nextInv = prev.map((item, idx) => idx === existIdx ? { ...item, price: unitPrice } : item);
                    }
                    if (nextInv) {
                        if (staffFbDb) {
                            staffFbDb.ref('ember_live_data/_global_config').update({
                                catalogClosedLock: false,
                                isStoreClosed: false
                            }).catch(() => {});
                        }
                        fetchGas(activeGasUrl, {
                            action: 'save_inventory',
                            masterId: activeDictSheetId,
                            forceClear: true,
                            data: nextInv.map(i => ({ name: i.name, price: i.price, stock: '', status: i.isSoldOut ? '품절' : '', isLocked: false }))
                        }).catch(() => {});
                        return nextInv;
                    }
                    return prev;
                });
            }, [activeGasUrl, activeDictSheetId]);

            // 라이브 작성 중 마감하지 않고도 현재까지 받은 주문을 직원용 시트('메인주문')와 로컬 방송 목록에 안전하게 중간 저장하는 함수!
            const buildGroupsFromLiveRows = useCallback((validRows) => {
                const gMap = {};
                validRows.forEach(r => {
                    const n = r.nick.trim();
                    const normN = normalizeString(n);
                    if (!gMap[normN]) {
                        const fallbackAddr = (!r.address) ? findMasterAddressMatch(n) : null;
                        const finalPh = fixPhoneNumber(r.phone || fallbackAddr?.phone || '');
                        const custRows = validRows.filter(x => normalizeString(x.nick) === normN);
                        const repShipRow = custRows.find(x => Number(x.shipping) > 0) || custRows[0] || r;
                        const singleShipFee = r.isVip ? 0 : (Number(repShipRow.shipping ?? liveDefaultShip) || 0);
                        gMap[normN] = {
                            nick: n,
                            realname: r.realname || fallbackAddr?.realname || '',
                            phone: finalPh,
                            address: stripZipcode(r.address || fallbackAddr?.address || ''),
                            memo: r.memo || fallbackAddr?.memo || '',
                            shipping: singleShipFee,
                            deposit: 0,
                            cardMode: 'none',
                            cashReceiptMode: 'none',
                            isVip: Boolean(r.isVip),
                            isNoShow: false,
                            isConfirmed: false,
                            pin: normalizePin4(r.pin) || (finalPh.length >= 4 ? finalPh.slice(-4) : ''),
                            trackingNumber: '',
                            deposits: [],
                            showDeposits: false,
                            items: []
                        };
                    }
                    const itemTotal = (Number(r.price) || 0) * (Number(r.qty) || 1);
                    if (r.product) {
                        gMap[normN].items.push({
                            id: `item_${Date.now()}_${Math.random()}`,
                            product: r.product,
                            qty: Number(r.qty) || 1,
                            price: itemTotal,
                            isWaitlist: false,
                            waitlistOrder: 0
                        });
                    }
                    if (r.isPaid) gMap[normN].deposit += itemTotal;
                });
                // 동일 고객(닉네임)의 배송비 입금은 딱 1회만 합산!
                Object.keys(gMap).forEach(normN => {
                    const g = gMap[normN];
                    const custRows = validRows.filter(r => normalizeString(r.nick) === normN);
                    if (custRows.some(r => Boolean(r.isShipPaid))) {
                        g.deposit += g.shipping;
                    }
                });
                return Object.values(gMap);
            }, [liveDefaultShip, findMasterAddressMatch]);

            const handleInterimSaveStaffLive = () => {
                try {
                    localStorage.setItem('ember_staff_live_rows_v1', JSON.stringify(liveOrderRows));
                    localStorage.setItem('ember_staff_live_title_v1', liveBroadcastTitle);
                } catch (e) {}
                syncStaffLiveRowsToPortal(liveOrderRows, liveBroadcastTitle, isStaffLiveActive || liveOrderRows.some(r => r.nick && r.product));

                const validRows = liveOrderRows.filter(r => r.nick && r.product);
                if (validRows.length > 0) {
                    const cleanB = cleanDisplayTabName(liveBroadcastTitle || '오늘의방송');
                    const tabKey = '주문_' + cleanB;
                    const tempGroups = buildGroupsFromLiveRows(validRows);
                    const existingBlk = localBroadcastStoreRef.current[tabKey];
                    // 만약 이미 같은 이름의 마감 방송이 있다면 기존 고객들과 합쳐서 보존!
                    let mergedGroups = tempGroups;
                    if (existingBlk && Array.isArray(existingBlk.groups) && existingBlk.groups.length > 0) {
                        const map = new Map();
                        existingBlk.groups.forEach(g => map.set(normalizeString(g.nick), { ...g, items: [...(g.items || [])] }));
                        tempGroups.forEach(ng => {
                            const k = normalizeString(ng.nick);
                            if (map.has(k)) {
                                const ex = map.get(k);
                                const existingProds = new Set((ex.items || []).map(it => `${it.product}_${it.qty}_${it.price}`));
                                const newItemsOnly = (ng.items || []).filter(it => !existingProds.has(`${it.product}_${it.qty}_${it.price}`));
                                map.set(k, {
                                    ...ex,
                                    deposit: Math.max(Number(ex.deposit) || 0, Number(ng.deposit) || 0),
                                    items: [...(ex.items || []), ...newItemsOnly]
                                });
                            } else {
                                map.set(k, ng);
                            }
                        });
                        mergedGroups = Array.from(map.values());
                    }

                    setOrderTabs(prev => Array.from(new Set([tabKey, ...prev])));
                    setLocalBroadcastStore(prev => {
                        const next = {
                            ...prev,
                            [tabKey]: {
                                broadcastName: cleanB,
                                freeShipThreshold: 70000,
                                defaultShipping: liveDefaultShip,
                                cardFeeRate: 10,
                                updatedAt: Date.now(),
                                groups: mergedGroups
                            }
                        };
                        localBroadcastStoreRef.current = next;
                        try { localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(next)); } catch (e) {}

                    });
                    syncBroadcastGroupsToFirebase(cleanB, mergedGroups, 70000, 10, customerCredits, 'staff');
                }
                showToast(`💾 [${cleanDisplayTabName(liveBroadcastTitle)}] 현재 작성 중인 주문(${liveOrderRows.length}줄)이 안전하게 중간저장되었습니다!`);
            };

            // 직원 라이브 방송 마감 및 직원용 주문 조회로 넘기기 (현재 상태 그대로 확정 저장 후 종료!)
            const handleFinishStaffLiveBroadcast = () => {
                const validRows = liveOrderRows.filter(r => r.nick && r.product);
                if (validRows.length === 0) return openModal('마감할 주문 내역이 없습니다.');
                const cleanB = cleanDisplayTabName(liveBroadcastTitle || '');
                if (!cleanB || cleanB === '오늘의방송' || cleanB === '기본방송') {
                    return openModal(
                        '마감할 정확한 방송 이름(예: 10/24 여성복)을 먼저 입력해 주세요.',
                        'prompt',
                        (inputTitle) => {
                            const nextClean = cleanDisplayTabName(inputTitle);
                            if (nextClean) {
                                setLiveBroadcastTitle(nextClean);
                                showToast(`📅 방송명이 [${nextClean}](으)로 변경되었습니다. 다시 [방송마감]을 눌러주세요!`);
                            }
                        },

                        '마감 방송명 설정'
                    );
                }

                const tabKey = '주문_' + cleanB;
                const confirmMsg = `[${cleanB}] 방송 주문(${validRows.length}건)을 현재 상태 그대로 확정하고 마감하시겠습니까?`;

                openModal(confirmMsg, 'confirm', () => {
                    const finalGroupsForThisBroadcast = buildGroupsFromLiveRows(validRows);

                    setIsStaffLiveActive(false);
                    setLiveChatId(null);
                    setIsLiveChatPaused(false);
                    liveNextPageTokenRef.current = '';
                    syncStaffLiveRowsToPortal([], cleanB, false);

                    // ✨ 방송 마감 시 고객용 라인업(live_catalog.html)도 즉시 마감 잠금 처리하고 구글 시트 '실시간재고'를 비워 다음 방송에 섞이지 않게 처리!
                    setLiveInventory([]);
                    if (staffFbDb) {
                        staffFbDb.ref('ember_live_data').update({
                            '_global_config/catalogClosedLock': true,
                            '_global_config/isStoreClosed': true,
                            '_global_config/currentPinnedId': null,
                            '_live_catalog': {
                                items: [],
                                rawCount: 0,
                                explicitClear: true,
                                updatedAt: Date.now()
                            }
                        }).catch(() => {});
                    }
                    fetchGas(activeGasUrl, {
                        action: 'save_inventory',
                        masterId: activeDictSheetId,
                        forceClear: true,
                        data: [{ name: '__EMPTY__', price: 0, stock: '', status: '품절', isLocked: false }]
                    }).catch(() => {});

                    setOrderTabs(prev => Array.from(new Set([tabKey, ...prev])));
                    setSelectedTab(tabKey);
                    setBroadcastName(cleanB);
                    setCustomerGroups(finalGroupsForThisBroadcast);
                    setLiveOrderRows([]);
                    try { localStorage.removeItem('ember_staff_live_rows_v1'); } catch (e) {}
                    setActiveMainTab('orders');

                    saveUpdatedGroupsImmediately(
                        finalGroupsForThisBroadcast,
                        `🎉 [${cleanB}] 방송 마감 완료! (현재 상태 그대로 확정 저장되었습니다)`,
                        cleanB
                    );
                });
            };

            const handleUpdateCustomerCredit = useCallback((nick, nextCreditAmt, reasonMemo = '직원용 적립금 수정') => {
                const cleanAmt = Math.max(0, Number(nextCreditAmt) || 0);
                const prevAmt = getCustomerCreditAmount(nick);
                const diffAmt = cleanAmt - prevAmt;
                const nowKst = new Date().toLocaleString('ko-KR');
                setCustomerCredits(prev => ({ ...prev, [nick]: cleanAmt }));
                setHasUnsavedChanges(true);
                fetchGas(activeGasUrl, {
                    action: 'save_customer_credit',
                    masterId: activeDictSheetId,
                    data: { nickname: nick, credit: cleanAmt }
                }).catch(() => {});
                if (staffFbDb) {
                    const safeNickKey = String(nick || '').replace(/[.#$\[\]\/]/g, '_').trim();
                    if (safeNickKey) {
                        const credRef = staffFbDb.ref(`ember_live_data/_portal_credits/${safeNickKey}`);
                        credRef.once('value').then(snap => {
                            const prevVal = snap.val() || {};
                            const prevLogs = Array.isArray(prevVal.logs) ? prevVal.logs : [];
                            const newLog = {
                                id: `cred_${Date.now()}`,
                                date: nowKst,
                                type: diffAmt >= 0 ? 'add' : 'use',
                                diff: diffAmt,
                                balance: cleanAmt,
                                reason: reasonMemo
                            };
                            credRef.set({
                                nickname: nick,
                                credit: cleanAmt,
                                updatedAt: Date.now(),
                                updatedAtStr: nowKst,
                                logs: [newLog, ...prevLogs].slice(0, 30)
                            }).catch(() => {});
                        }).catch(() => {});
                    }
                }
                showToast(`💰 '${nick}' 님의 적립금(${cleanAmt.toLocaleString()}원)이 시트와 고객 포털에 즉시 저장되었습니다!`);
            }, [activeGasUrl, activeDictSheetId, getCustomerCreditAmount, showToast]);

            const handleGlobalSearch = async () => {
                const kw = globalKeyword.trim();
                if (!kw) {
                    setGlobalSearchResults(null);
                    return;
                }
                // 만약 라이브 주문서 탭 등에서 검색을 눌렀다면 결과창이 바로 보이도록 주문조회 화면으로 자동 전환
                if (activeMainTab === 'live_order' || activeMainTab === 'tracking' || activeMainTab === 'export') {
                    setActiveMainTab('orders');
                }
                setIsSearchingGlobal(true);
                const normKw = normalizeString(kw);
                const localResults = [];
                const seenKeys = new Set();

                // 1) 미송 / 교환 / 반품 (CS) 전체 검색
                (csGroups || []).forEach(c => {
                    const hay = normalizeString([
                        c.sourceBroadcast, c.nick, c.realname, c.phone, c.address,
                        c.origTracking, c.csTracking, c.csMemo, c.refundAccount,
                        (c.items || []).map(i => i.product).join(' ')
                    ].join(' '));
                    if (hay.includes(normKw)) {
                        const uKey = `CS_${c.id || c.sourceBroadcast}_${normalizeString(c.nick)}`;
                        seenKeys.add(uKey);
                        localResults.push({
                            recordType: 'CS',
                            broadcastName: c.sourceBroadcast,
                            csStatus: c.csStatus,
                            nick: c.nick,
                            realname: c.realname,
                            phone: c.phone,
                            address: c.address,
                            trackingNumber: c.origTracking,
                            csTracking: c.csTracking,
                            csMemo: c.csMemo,
                            items: c.items || []
                        });
                    }
                });

                // 2) 현재 열려 있는 방송(customerGroups) + 전 방송 창고(localBroadcastStore) 통합 검색
                const combinedStore = { ...(localBroadcastStoreRef.current || {}), ...(localBroadcastStore || {}) };
                const cleanCurB = cleanDisplayTabName(broadcastName || selectedTab || '');
                if (cleanCurB && Array.isArray(customerGroups) && customerGroups.length > 0) {
                    combinedStore['주문_' + cleanCurB] = {
                        broadcastName: cleanCurB,
                        groups: customerGroups
                    };
                }

                Object.keys(combinedStore)
                    .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                    .forEach(tabName => {
                        const bData = combinedStore[tabName];
                        const bName = cleanDisplayTabName(bData?.broadcastName || tabName);
                        if (!bName || ['기본방송', '오늘의방송', '메인주문'].includes(bName)) return;
                        (bData?.groups || []).forEach(g => {
                            const hay = normalizeString([
                                bName, g.nick, g.realname, g.phone, g.address, g.memo, g.trackingNumber,
                                (g.items || []).map(i => i.product).join(' ')
                            ].join(' '));
                            if (hay.includes(normKw)) {
                                const uKey = `ORDER_${normalizeString(bName)}_${normalizeString(g.nick)}`;
                                if (!seenKeys.has(uKey)) {
                                    seenKeys.add(uKey);
                                    localResults.push({
                                        recordType: 'ORDER',
                                        tabName: tabName.startsWith('주문_') ? tabName : ('주문_' + bName),
                                        broadcastName: bName,
                                        nick: g.nick,
                                        realname: g.realname,
                                        phone: g.phone,
                                        address: g.address,
                                        trackingNumber: g.trackingNumber,
                                        shipping: g.shipping,
                                        deposit: g.deposit,
                                        items: g.items || []
                                    });
                                }
                            }
                        });
                    });

                // ⚡ 서버 응답을 기다리지 않고 0.01초 만에 즉시 로컬 통합검색 결과를 먼저 화면에 띄움!
                setGlobalSearchResults(localResults);

                try {
                    const res = await fetchGas(`${activeGasUrl}?action=search_all_broadcasts&masterId=${activeStaffSheetId}&keyword=${encodeURIComponent(kw)}&t=${Date.now()}`, null, 10000);
                    const serverResults = (res && res.success && Array.isArray(res.results)) ? res.results : [];
                    if (serverResults.length > 0) {
                        const merged = [...localResults];
                        serverResults.forEach(sr => {
                            const srBName = cleanDisplayTabName(sr.broadcastName || '');
                            const uKey = `${sr.recordType}_${normalizeString(srBName)}_${normalizeString(sr.nick)}`;
                            if (!seenKeys.has(uKey)) {
                                seenKeys.add(uKey);
                                merged.push({
                                    ...sr,
                                    broadcastName: srBName,
                                    tabName: sr.tabName || ('주문_' + srBName)
                                });
                            }
                        });
                        setGlobalSearchResults(merged);
                    }
                } catch (e) {
                    // 로컬 결과가 이미 표시되어 있으므로 에러 무시
                } finally {
                    setIsSearchingGlobal(false);
                }
            };

            const handleApplyCreditToOrderInStaff = useCallback((nick, availableCredit, currentBalance) => {
                const avail = Math.max(0, Number(availableCredit) || 0);
                const bal = Math.max(0, Number(currentBalance) || 0);
                if (avail <= 0 || bal <= 0) return;
                const useAmt = Math.min(avail, bal);
                const remainCredit = avail - useAmt;
                openModal(
                    `'${nick}' 고객님의 보유 적립금 ${avail.toLocaleString()}원 중 ${useAmt.toLocaleString()}원을 이번 주문에서 차감하시겠습니까?\n\n• 차감 후 남은 보유 적립금: ${remainCredit.toLocaleString()}원\n• 주문서에 '적립금 (-${useAmt.toLocaleString()}원)' 항목이 추가되고 시트에 즉시 자동 저장됩니다!`,
                    'confirm',
                    () => {
                        handleUpdateCustomerCredit(nick, remainCredit);
                        const nextGroups = customerGroups.map(cur => cur.nick === nick ? {
                            ...cur,
                            items: [
                                ...cur.items,
                                {
                                    id: `item_${Date.now()}_${Math.random()}`,
                                    product: '적립금',
                                    qty: 1,
                                    price: -Math.abs(useAmt),
                                    isWaitlist: false,
                                    waitlistOrder: 0
                                }
                            ]
                        } : cur);
                        setCustomerGroups(nextGroups);
                        saveUpdatedGroupsImmediately(nextGroups, `⚡ '${nick}' 님 주문에 적립금 -${useAmt.toLocaleString()}원이 차감되어 시트에 즉시 저장되었습니다!`);
                    }
                );
            }, [openModal, customerGroups, handleUpdateCustomerCredit]);

            const handleSaveAll = useCallback(async () => {
                if (isSaving) return;
                setIsSaving(true);
                try {
                    // ✨ 어느 탭을 보고 있든 [시트 저장 (Ctrl+S)]을 누르면 '메인주문' 탭과 '교환반품CS' 탭 양쪽 모두를 100% 동시에 저장합니다!
                    const serializedCs = (csGroupsRef.current || []).map(c => ({
                        ...c,
                        csMemo: combineCsMemoAndAccount(c.csMemo, c.refundAccount, c.refundAmount, c.refundCompleted, c.convertedToCredit),
                        shipping: Number(c.shipping) || 0,
                        deposit: c.csFeePaid ? (Number(c.shipping) || Number(c.deposit) || 0) : 0
                    }));
                    try {
                        localStorage.setItem('ember_staff_cs_groups_v1', JSON.stringify(csGroupsRef.current || []));
                        localStorage.setItem(STAFF_CS_DIRTY_TIME_KEY, String(Date.now()));
                    } catch (e) {}
                    syncCsGroupsToFirebase(csGroupsRef.current || []);

                    const cleanBName = cleanDisplayTabName(broadcastName || selectedTab);
                    const canonicalTab = '주문_' + cleanBName;

                    // 현재 방송의 행 데이터 생성 함수
                    const buildRowsForBroadcast = (bTitle, fThresh, dShip, cRate, groupsArr) => {
                        const safeFThresh = (fThresh !== undefined && fThresh !== null && fThresh !== '' && !isNaN(Number(fThresh))) ? Number(fThresh) : 70000;
                        const safeDShip = (dShip !== undefined && dShip !== null && dShip !== '' && !isNaN(Number(dShip))) ? Number(dShip) : 4000;
                        const rows = [{
                            '닉네임': '___WORKSPACE_META___',
                            '주문자': '___WORKSPACE_META___',
                            customer: '___WORKSPACE_META___',
                            nickname: '___WORKSPACE_META___',
                            name: '___WORKSPACE_META___',
                            '상품명': bTitle,
                            product: bTitle,
                            '수량': safeFThresh,
                            quantity: safeFThresh,
                            qty: safeFThresh,
                            '단가(제품금액)': safeDShip,
                            price: safeDShip,
                            '배송비': Number(cRate) || 10,
                            shipping: Number(cRate) || 10,
                            '입금액': 0,
                            deposit: 0,
                            '카드결제': '', '수령인명': '', '연락처': '', '주소': '', '요청사항': '',
                            'VIP여부': '', '노쇼여부': '', '대기여부': '', '비밀번호': '', '주문확인': '', '입금내역JSON': '', '송장번호': ''
                        }];
                        (groupsArr || []).forEach(g => {
                            const sum = getGroupSummary(g, safeFThresh, safeDShip, cRate);
                            const baseCardStr = g.cardMode === 'completed' ? `카드완료(${cRate}%)` : (g.cardMode === 'requested' ? `O(${cRate}%)` : '');
                            const cashStr = g.cashReceiptMode === 'completed' ? '현영완료' : (g.cashReceiptMode === 'requested' ? '현영요청' : '');
                            const cardStr = [baseCardStr, cashStr].filter(Boolean).join(' / ');
                            const cleanPh = fixPhoneNumber(g.phone);
                            const pinStr = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                            const depJson = Array.isArray(g.deposits) && g.deposits.length > 0 ? JSON.stringify(g.deposits) : '';
                            const itemsList = (g.items && g.items.length > 0) ? g.items : [{ product: '', qty: 1, price: 0, isWaitlist: false, waitlistOrder: 0 }];

                                const waitCell = it.isWaitlist ? `대기${it.waitlistOrder || 1}번` : '';
                                rows.push({
                                    '닉네임': g.nick,
                                    '주문자': g.nick,
                                    customer: g.nick,
                                    nickname: g.nick,
                                    name: g.nick,
                                    '상품명': it.product || '',
                                    product: it.product || '',
                                    '수량': Number(it.qty) || 1,
                                    quantity: Number(it.qty) || 1,
                                    qty: Number(it.qty) || 1,
                                    '단가(제품금액)': Number(it.price) || 0,
                                    price: Number(it.price) || 0,
                                    '배송비': sum.ship,
                                    shipping: sum.ship,
                                    '입금액': idx === 0 ? sum.dep : 0,
                                    deposit: idx === 0 ? sum.dep : 0,
                                    '카드결제': cardStr,
                                    '수령인명': g.realname || '',
                                    '연락처': cleanPh ? "'" + cleanPh : '',
                                    '주소': stripZipcode(g.address || ''),
                                    '요청사항': cleanMemoText(g.memo, g.address),
                                    'VIP여부': g.isVip ? 'O' : '',
                                    '노쇼여부': g.isNoShow ? 'O' : '',
                                    '대기여부': waitCell,
                                    '비밀번호': pinStr ? "'" + pinStr : '',
                                    '주문확인': g.isConfirmed ? 'O' : '',
                                    '입금내역JSON': idx === 0 ? depJson : '',
                                    '송장번호': g.trackingNumber ? "'" + String(g.trackingNumber).replace(/^'+/, '') : ''
                                });
                            });
                        });
                        return rows;
                    };

                    const updatedStore = {
                        ...localBroadcastStore,
                        ...(cleanBName ? {
                            [canonicalTab]: {
                                broadcastName: cleanBName,
                                freeShipThreshold,
                                defaultShipping,
                                cardFeeRate,
                                updatedAt: Date.now(),
                                groups: customerGroups
                            }
                        } : {})
                    };
                    setLocalBroadcastStore(updatedStore);
                    try {
                        localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(updatedStore));
                        localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                    } catch (e) {}

                    const allCombinedRows = [];
                    Object.keys(updatedStore)
                        .filter(k => k.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(k))
                        .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                        .forEach(tKey => {
                            const blk = updatedStore[tKey];
                            if (blk && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                const bTitle = cleanDisplayTabName(blk.broadcastName || tKey);
                                allCombinedRows.push(...buildRowsForBroadcast(bTitle, blk.freeShipThreshold, blk.defaultShipping, blk.cardFeeRate, blk.groups));
                            }
                        });

                    // 구글 시트 Lock 충돌 방지를 위해 순차적으로 빠르게 저장 (save_orders에 이미 송장번호 R열이 전부 포함되어 있으므로 중복 save_tracking_numbers 제거!)
                    let resOrders = { success: true };
                    if (allCombinedRows.length > 0) {
                        resOrders = await fetchGas(activeGasUrl, {
                            action: 'save_orders',
                            masterId: activeStaffSheetId,
                            targetSheetName: '메인주문',
                            onlyMainOrder: true,
                            broadcastName: '오늘의방송',
                            data: allCombinedRows
                        }, 12000);
                    }
                    const resCs = await fetchGas(activeGasUrl, {
                        action: 'save_cs_orders',
                        masterId: activeStaffSheetId,
                        items: serializedCs
                    }, 12000);

                    customerGroups.forEach(g => {
                        if (customerCredits[g.nick] !== undefined) {
                            fetchGas(activeGasUrl, {
                                action: 'save_customer_credit',
                                masterId: activeDictSheetId,
                                data: { nickname: g.nick, credit: Number(customerCredits[g.nick]) || 0 }
                            }).catch(() => {});
                        }
                    });

                    if (staffFbDb && cleanBName) {
                        const safeBKey = cleanBName.replace(/[.#$\[\]\/]/g, '_');
                        customerGroups.forEach(g => {
                            const safeNickKey = String(g.nick || '').replace(/[.#$\[\]\/]/g, '_').trim();
                            if (!safeNickKey) return;
                            if (customerCredits[g.nick] !== undefined) {
                                staffFbDb.ref(`ember_live_data/_portal_credits/${safeNickKey}`).set({
                                    nickname: g.nick,
                                    credit: Number(customerCredits[g.nick]) || 0,
                                    updatedAt: Date.now()
                                }).catch(() => {});
                            }
                            if (g.address && safeBKey) {
                                const addrPayload = {
                                    nickname: g.nick,
                                    realname: g.realname || '',
                                    phone: fixPhoneNumber(g.phone || ''),
                                    address: stripZipcode(g.address),
                                    memo: cleanMemoText(g.memo, g.address),
                                    broadcastName: cleanBName,
                                    updatedAt: new Date().toISOString()
                                };
                                staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set(addrPayload).catch(() => {});
                            }
                        });
                        syncBroadcastGroupsToFirebase(cleanBName, customerGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                    }

                    setHasUnsavedChanges(false);
                    if ((resOrders && (resOrders.success || resOrders.status === 'success')) || (resCs && (resCs.success || resCs.status === 'success'))) {
                        showToast(`✅ 직원용 시트('메인주문' 및 '교환반품CS')와 고객 포털에 모두 저장 완료!`);
                    } else {
                        showToast(`✅ 고객 포털 및 로컬에 즉시 반영되었습니다!`);
                    }
                } finally {
                    setIsSaving(false);
                }
            }, [isSaving, activeGasUrl, activeStaffSheetId, activeDictSheetId, selectedTab, broadcastName, freeShipThreshold, defaultShipping, cardFeeRate, customerGroups, customerCredits, localBroadcastStore, getGroupSummary, showToast]);

            useEffect(() => {
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'ㄴ')) {
                        e.preventDefault();
                        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                        setTimeout(() => { handleSaveAll(); }, 30);
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [handleSaveAll]);

            // 주문서 내역(품목명, 수량, 단가, 완납, 카드, 노쇼, 대기 등)을 수정하면 즉시 로컬 스토어를 갱신하고 직원용 구글 시트('메인주문')와 고객 포털에 저장!
            const updateCustomerGroup = useCallback((nick, updater, immediateToastMsg = '') => {
                try {
                    localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                } catch (e) {}
                const currentList = Array.isArray(customerGroupsRef.current) && customerGroupsRef.current.length > 0
                    ? customerGroupsRef.current
                    : customerGroups;
                const nextGroups = currentList.map(g => g.nick === nick ? updater(g) : g);
                customerGroupsRef.current = nextGroups;
                setCustomerGroups(nextGroups);
                saveUpdatedGroupsImmediately(nextGroups, immediateToastMsg);
            }, [customerGroups, saveUpdatedGroupsImmediately]);

            // 현재 선택된 방송의 무료배송 기준 및 기본배송비를 변경하고 전 고객 배송비를 즉시 재계산하는 함수
            const handleUpdateBroadcastShippingRules = useCallback((nextDefaultShip, nextFreeThresh, showMsg = true) => {
                const useDShip = nextDefaultShip !== null && nextDefaultShip !== undefined ? Number(nextDefaultShip) : Number(defaultShipping);
                const useFThresh = nextFreeThresh !== null && nextFreeThresh !== undefined ? Number(nextFreeThresh) : Number(freeShipThreshold);
                setDefaultShipping(useDShip);
                setFreeShipThreshold(useFThresh);

                const currentList = Array.isArray(customerGroupsRef.current) && customerGroupsRef.current.length > 0
                    ? customerGroupsRef.current
                    : customerGroups;
                const nextGroups = currentList.map(g => {
                    if (g.isVip) return { ...g, shipping: 0 };
                    const activeItems = (g.items || []).filter(i => !i.isWaitlist);
                    const prodForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);
                    if (activeItems.length === 0 || prodForShip <= 0) return { ...g, shipping: 0 };
                    const isJeju = Boolean(g.address && g.address.includes('제주'));
                    const isFree = useFThresh > 0 && prodForShip >= useFThresh;
                    const newShip = (isFree ? 0 : useDShip) + (isJeju ? 3000 : 0);
                    return { ...g, shipping: newShip };
                });

                customerGroupsRef.current = nextGroups;
                setCustomerGroups(nextGroups);

                const cleanBName = cleanDisplayTabName(broadcastName || selectedTab);
                if (cleanBName) {
                    const canonicalTab = '주문_' + cleanBName;
                    const updatedStore = {
                        ...localBroadcastStoreRef.current,
                        [canonicalTab]: {
                            broadcastName: cleanBName,
                            freeShipThreshold: useFThresh,
                            defaultShipping: useDShip,
                            cardFeeRate,
                            updatedAt: Date.now(),
                            groups: nextGroups
                        }
                    };
                    localBroadcastStoreRef.current = updatedStore;
                    setLocalBroadcastStore(updatedStore);
                    try {
                        localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(updatedStore));
                        localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                    } catch (e) {}
                    if (staffFbDb) {
                        syncBroadcastGroupsToFirebase(cleanBName, nextGroups, useFThresh, cardFeeRate, customerCredits, 'staff');
                    }
                }
                saveUpdatedGroupsImmediately(
                    nextGroups,
                    showMsg ? `🚚 [${cleanBName || '현재 방송'}] 배송비 기준(기본 ${useDShip.toLocaleString()}원 / ${useFThresh > 0 ? `${(useFThresh/10000)}만원 무배` : '무배없음'})이 일괄 적용되었습니다!` : '',
                    cleanBName,
                    useFThresh,
                    useDShip
                );
            }, [defaultShipping, freeShipThreshold, customerGroups, broadcastName, selectedTab, cardFeeRate, customerCredits, saveUpdatedGroupsImmediately]);

            const handleApplyMasterAddressToGroup = useCallback((targetNick, addrEntry) => {
                if (!targetNick || !addrEntry) return;
                const cleanPh = fixPhoneNumber(addrEntry.phone);
                const cleanAddr = stripZipcode(addrEntry.address || '');
                const cleanM = cleanMemoText(addrEntry.memo || '', cleanAddr);
                const newPin = cleanPh.length >= 4 ? cleanPh.slice(-4) : '';
                const cleanBName = cleanDisplayTabName(broadcastName || selectedTab || '');

                setCustomerGroups(prev => {
                    const nextGroups = prev.map(g => g.nick === targetNick ? {
                        ...g,
                        realname: addrEntry.realname || g.realname,
                        phone: cleanPh || g.phone,
                        address: cleanAddr || g.address,
                        memo: cleanM || g.memo,
                        pin: newPin || g.pin
                    } : g);

                    if (staffFbDb && cleanBName && cleanAddr) {
                        const safeBKey = cleanBName.replace(/[.#$\[\]\/]/g, '_');
                        const safeNickKey = String(targetNick).replace(/[.#$\[\]\/]/g, '_').trim();
                        if (safeBKey && safeNickKey) {
                            staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set({
                                nickname: targetNick,
                                realname: addrEntry.realname || '',
                                phone: cleanPh,
                                address: cleanAddr,
                                memo: cleanM,
                                broadcastName: cleanBName,
                                updatedAt: new Date().toISOString()
                            }).catch(() => {});
                        }
                    }

                    saveUpdatedGroupsImmediately(nextGroups, `📗 '${targetNick}' 님께 찐고객사전 배송지가 적용되어 시트와 고객 포털에 즉시 저장되었습니다!`);
                    return nextGroups;
                });
            }, [broadcastName, selectedTab, saveUpdatedGroupsImmediately]);

            const handleRenameBroadcast = useCallback((targetTabToRename = null) => {
                const baseTab = targetTabToRename || selectedTab || ('주문_' + broadcastName);
                const oldCleanName = cleanDisplayTabName(baseTab);
                if (!oldCleanName) return;

                openModal(
                    `'${oldCleanName}' 방송의 새로운 이름을 입력해 주세요.\n(변경 시 좌측 목록, 시트 구분선, 고객 포털에 모두 반영됩니다)`,
                    'prompt',
                    (newNameInput) => {
                        const nextCleanName = cleanDisplayTabName(newNameInput);
                        if (!nextCleanName || nextCleanName === oldCleanName) return;

                        const oldTabKey = '주문_' + oldCleanName;
                        const newTabKey = '주문_' + nextCleanName;

                        // 1) 로컬 방송 창고(localBroadcastStore)에서 키 이동 및 방송명 업데이트
                        setLocalBroadcastStore(prev => {
                            const nextStore = { ...prev };
                            const existingBlk = nextStore[oldTabKey] || nextStore[baseTab] || {
                                broadcastName: nextCleanName,
                                freeShipThreshold,
                                defaultShipping,
                                cardFeeRate,
                                groups: customerGroups
                            };
                            delete nextStore[oldTabKey];
                            if (baseTab !== oldTabKey) delete nextStore[baseTab];
                            nextStore[newTabKey] = {
                                ...existingBlk,
                                broadcastName: nextCleanName,
                                updatedAt: Date.now(),
                                groups: (selectedTab === oldTabKey || selectedTab === baseTab) ? customerGroups : (existingBlk.groups || [])
                            };
                            localBroadcastStoreRef.current = nextStore;
                            try {
                                localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(nextStore));
                                localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                            } catch (e) {}
                            return nextStore;
                        });

                        // 2) 좌측 방송 탭 목록 업데이트 및 날짜순 재정렬
                        setOrderTabs(prev => {
                            const replaced = prev.map(t => (t === oldTabKey || t === baseTab) ? newTabKey : t);
                            if (!replaced.includes(newTabKey)) replaced.unshift(newTabKey);
                            return Array.from(new Set(replaced)).sort((a, b) => {
                                const scoreA = extractBroadcastDateScore(a);
                                const scoreB = extractBroadcastDateScore(b);
                                if (scoreA !== scoreB) return scoreB - scoreA;
                                return b.localeCompare(a, 'ko');
                            });
                        });

                        // 3) 현재 보고 있던 방송이면 선택 상태도 새 이름으로 즉시 전환
                        if (selectedTab === oldTabKey || selectedTab === baseTab || cleanDisplayTabName(broadcastName) === oldCleanName) {
                            setSelectedTab(newTabKey);
                            setBroadcastName(nextCleanName);
                        }

                        // 4) 미송/교환/반품 CS 목록 중 이 방송에서 복사된 내역의 원본방송명도 함께 변경
                        const updatedCs = (csGroupsRef.current || []).map(c =>
                            cleanDisplayTabName(c.sourceBroadcast) === oldCleanName
                                ? { ...c, sourceBroadcast: nextCleanName }
                                : c
                        );
                        setCsGroups(updatedCs);
                        saveCsOrdersToSheetImmediate(updatedCs);

                        const targetGroupsToSave = (selectedTab === oldTabKey || selectedTab === baseTab)
                            ? customerGroups
                            : (localBroadcastStoreRef.current[newTabKey]?.groups || []);
                        saveUpdatedGroupsImmediately(
                            targetGroupsToSave,
                            `✏️ 방송 이름이 [${oldCleanName}] ➔ [${nextCleanName}](으)로 변경되었습니다!`,
                            nextCleanName
                        );
                    },
                    oldCleanName,
                    '방송 이름 변경'
                );
            }, [selectedTab, broadcastName, freeShipThreshold, defaultShipping, cardFeeRate, customerGroups, openModal, saveCsOrdersToSheetImmediate, saveUpdatedGroupsImmediately]);

            // ✨ 테스트로 생성된 방송이나 잘못 만든 방송 블록을 시트 + 로컬 + 고객 포털 클라우드 + 사장님 시트 탭에서 완전히 삭제하는 함수
            const handleDeleteBroadcastBlock = useCallback((targetTabToDelete) => {
                const cleanTarget = cleanDisplayTabName(targetTabToDelete);
                if (!cleanTarget) return;
                const tabKey = '주문_' + cleanTarget;

                openModal(
                    `[${cleanTarget}] 방송 전체 주문 내역을 완전히 삭제하시겠습니까?\n(삭제 즉시 직원용 시트, 사장님 보관 탭, 고객용 포털에서 모두 영구 삭제되며 다시는 부활하지 않습니다)`,
                    'confirm',
                    () => {
                        explicitlyDeletedTabsRef.current.add(tabKey);
                        pendingDeletedBroadcastsRef.current.add(cleanTarget);
                        try {
                            localStorage.setItem('ember_staff_deleted_tabs_v1', JSON.stringify(Array.from(explicitlyDeletedTabsRef.current)));
                        } catch (e) {}
                        const nextStore = { ...localBroadcastStoreRef.current };
                        delete nextStore[tabKey];
                        delete nextStore[targetTabToDelete];
                        localBroadcastStoreRef.current = nextStore;
                        setLocalBroadcastStore(nextStore);
                        try {
                            localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(nextStore));
                            localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                        } catch (e) {}

                        // 1) 고객 포털 클라우드(Firebase)에서도 해당 방송 방을 즉시 삭제하고, 영구 삭제 블랙리스트(_deleted_broadcasts)에 등록!
                        if (staffFbDb) {
                            const safeBKey = cleanTarget.replace(/[.#$\[\]\/]/g, '_');
                            if (safeBKey) {
                                staffFbDb.ref(`ember_live_data/_deleted_broadcasts/${safeBKey}`).set({
                                    broadcastName: cleanTarget,
                                    deletedAt: Date.now()
                                }).catch(() => {});
                                staffFbDb.ref(`ember_live_data/_portal_orders/${safeBKey}`).remove().catch(() => {});
                                staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}`).remove().catch(() => {});
                            }
                            staffFbDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').remove().catch(() => {});
                        }

                        // 2) 만약 사장님 마스터 시트나 직원용 시트에 '주문_방송명' 개별 탭이 남아있다면 그 탭도 함께 삭제!
                        fetchGas(activeGasUrl, {
                            action: 'delete_old_order_tabs',
                            masterId: activeDictSheetId,
                            tabNames: [tabKey, cleanTarget]
                        }).catch(() => {});
                        fetchGas(activeGasUrl, {
                            action: 'delete_old_order_tabs',
                            masterId: activeStaffSheetId,
                            tabNames: [tabKey, cleanTarget]
                        }).catch(() => {});

                        const remainingTabs = orderTabs.filter(t => t !== tabKey && t !== targetTabToDelete);
                        setOrderTabs(remainingTabs);

                        if (selectedTab === tabKey || selectedTab === targetTabToDelete) {
                            const nextTab = remainingTabs[0] || '';
                            setSelectedTab(nextTab);
                            if (nextTab && nextStore[nextTab]) {
                                setBroadcastName(nextStore[nextTab].broadcastName || cleanDisplayTabName(nextTab));
                                setCustomerGroups(nextStore[nextTab].groups || []);
                            } else {
                                setBroadcastName('');
                                setCustomerGroups([]);
                            }
                        }

                        // 3) 남은 방송들만 모아서 직원용 구글 시트('메인주문')에 덮어쓰기 저장
                        // 💡 핵심 트릭: 구버전 Code.gs가 시트에 남아있던 삭제 대상 방송을 '누락된 방송'으로 착각해 보존(부활)시키지 못하도록,
                        // 삭제할 방송의 빈 구분선(주문 행 0개)을 맨 끝에 포함시켜 보내면 구버전/신버전 Code.gs 모두 기존 블록을 100% 폐기합니다!
                        const allCombinedRows = [];
                        Object.keys(nextStore)
                            .filter(k => k.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(k))
                            .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                            .forEach(tKey => {
                                const blk = nextStore[tKey];
                                if (blk && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                    const bTitle = cleanDisplayTabName(blk.broadcastName || tKey);
                                    const cRate = Number(blk.cardFeeRate) || 10;
                                    allCombinedRows.push({
                                        '닉네임': '___WORKSPACE_META___', '상품명': bTitle,
                                        '수량': Number(blk.freeShipThreshold) || 70000,
                                        '단가(제품금액)': Number(blk.defaultShipping) || 4000,
                                        '배송비': cRate, '입금액': 0
                                    });
                                    blk.groups.forEach(g => {
                                        const sum = getGroupSummary(g, blk.freeShipThreshold, blk.defaultShipping, cRate);
                                        const baseCardStr = g.cardMode === 'completed' ? `카드완료(${cRate}%)` : (g.cardMode === 'requested' ? `O(${cRate}%)` : '');
                                        const cashStr = g.cashReceiptMode === 'completed' ? '현영완료' : (g.cashReceiptMode === 'requested' ? '현영요청' : '');
                                        const cardStr = [baseCardStr, cashStr].filter(Boolean).join(' / ');
                                        const cleanPh = fixPhoneNumber(g.phone);
                                        const pinStr = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                                        const depJson = Array.isArray(g.deposits) && g.deposits.length > 0 ? JSON.stringify(g.deposits) : '';
                                        (g.items || []).forEach((it, idx) => {
                                            allCombinedRows.push({
                                                '닉네임': g.nick, '상품명': it.product || '', '수량': Number(it.qty) || 1,
                                                '단가(제품금액)': Number(it.price) || 0, '배송비': sum.ship,
                                                '입금액': idx === 0 ? sum.dep : 0, '카드결제': cardStr,

            const handleTrackingExcelUpload = (e) => {

                    try {
                        const data = new Uint8Array(evt.target.result);

                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        // 1행이 제목줄이 아닌 롯데택배 양식도 모두 읽을 수 있도록 2차원 배열로 먼저 스캔
                        const rawAoA = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                        let headerRowIdx = 0;
                        for (let r = 0; r < Math.min(rawAoA.length, 10); r++) {
                            const rowStr = (rawAoA[r] || []).map(c => String(c || '').replace(/\s+/g, '')).join('|');

                                headerRowIdx = r;
                                break;
                            }
                        }

                        const headers = (rawAoA[headerRowIdx] || []).map((h, idx) => String(h || '').trim() || `col_${idx}`);
                        const rows = rawAoA.slice(headerRowIdx + 1).map(rowArr => {
                            const obj = {};
                            headers.forEach((h, idx) => { obj[h] = rowArr[idx] !== undefined ? rowArr[idx] : ''; });
                            return obj;
                        });

                        const cleanPersonName = (str) => {
                            return String(str || '')

                                .replace(/\(.*?\)/g, '')
                                .replace(/님$/g, '')
                                .replace(/[★☆♡♥]/g, '')
                                .trim();
                        };

                        const matchedByNick = {};
                        const duplicateWarnings = [];
                        const unmatchedRows = [];

                        rows.forEach(r => {
                            let nick = '', realname = '', phone = '', trk = '';
                            Object.keys(r).forEach(k => {
                                const ck = k.replace(/\s+/g, '');
                                const val = String(r[k] ?? '').trim();
                                if (!val) return;
                                if (ck.includes('닉네임') || ck.includes('주문자') || ck.includes('주문자명')) {
                                    nick = cleanPersonName(val);
                                } else if (ck.includes('수하인') || ck.includes('수령인') || ck.includes('받는분') || ck.includes('받는사람') || ck.includes('성명') || ck === '이름' || ck === '고객명' || ck.includes('수취인')) {
                                    if (!ck.includes('전화') && !ck.includes('연락처') && !ck.includes('핸드폰') && !ck.includes('휴대폰') && !ck.includes('주소')) {
                                        realname = cleanPersonName(val);
                                    }
                                } else if (ck.includes('전화') || ck.includes('연락처') || ck.includes('핸드폰') || ck.includes('휴대폰') || ck.includes('모바일')) {
                                    const digits = val.replace(/[^0-9]/g, '');
                                    if (digits.length >= 4 && digits.length > phone.length) phone = digits;
                                } else if (ck.includes('운송장') || ck.includes('송장') || ck.includes('등기') || ck.includes('화물번호')) {
                                    const cleanTrk = val.replace(/[^0-9-]/g, '').replace(/^-+|-+$/g, '');
                                    if (cleanTrk.replace(/[^0-9]/g, '').length >= 10) trk = cleanTrk;
                                }
                            });

                            if (!trk || (!nick && !realname && !phone)) return;

                            const inPhoneFull = fixPhoneNumber(phone);
                            const inPhoneLast4 = phone.length >= 4 ? phone.slice(-4) : '';
                            const inNickNorm = normalizeString(nick);
                            const inNickHandle = normalizeHandleNick(nick);
                            const inRealNorm = normalizeString(realname);
                            const inRealHandle = normalizeHandleNick(realname);

                            let candidates = [];

                            // 1순위: 휴대폰 전체 번호 일치 (가장 정확)
                            if (inPhoneFull.length >= 10) {
                                candidates = customerGroups.filter(g => fixPhoneNumber(g.phone) === inPhoneFull);
                            }
                            // 2순위: 닉네임(핸들 제거 포함) 정확히 일치
                            if (candidates.length !== 1 && inNickNorm) {
                                const byNick = customerGroups.filter(g =>
                                    normalizeString(g.nick) === inNickNorm ||
                                    (inNickHandle && normalizeHandleNick(g.nick) === inNickHandle)
                                );
                                if (byNick.length > 0) candidates = byNick;
                            }
                            // 3순위: 수령인 성함 + 전화번호 뒷 4자리 동시 일치 (동명이인 완벽 구분)
                            if (candidates.length !== 1 && inRealNorm && inPhoneLast4) {
                                const byNameAndLast4 = customerGroups.filter(g => {
                                    const gReal = normalizeString(cleanPersonName(g.realname));
                                    const gNick = normalizeHandleNick(g.nick);
                                    const gLast4 = g.phone && g.phone.length >= 4 ? g.phone.slice(-4) : normalizePin4(g.pin);
                                    return (gReal === inRealNorm || gNick === inRealNorm) && gLast4 === inPhoneLast4;
                                });
                                if (byNameAndLast4.length > 0) candidates = byNameAndLast4;
                            }
                            // 4순위: 수령인 성함(또는 닉네임)이 일치하는 경우
                            if (candidates.length === 0 && (inRealNorm || inNickNorm)) {
                                const targetNorm = inRealNorm || inNickNorm;
                                candidates = customerGroups.filter(g => {
                                    const gReal = normalizeString(cleanPersonName(g.realname));
                                    const gNick = normalizeString(g.nick);
                                    const gNickH = normalizeHandleNick(g.nick);
                                    return gReal === targetNorm || gNick === targetNorm || (gNickH && gNickH === (inRealHandle || inNickHandle));
                                });
                            }

                            if (candidates.length === 1) {
                                const targetNick = candidates[0].nick;
                                if (matchedByNick[targetNick] && !matchedByNick[targetNick].includes(trk)) {
                                    matchedByNick[targetNick] = `${matchedByNick[targetNick]}, ${trk}`;
                                } else {
                                    matchedByNick[targetNick] = trk;
                                }
                            } else if (candidates.length > 1) {
                                duplicateWarnings.push(`• 수령인 '${realname || nick}' (${trk}) ➔ 동명이인: [${candidates.map(m => m.nick).join(', ')}]`);
                            } else {
                                unmatchedRows.push(`• ${realname || nick}${phone ? ` (${phone})` : ''} : ${trk}`);
                            }
                        });

                        const matchedCount = Object.keys(matchedByNick).length;
                        if (matchedCount > 0) {
                            const nextGroups = customerGroups.map(g => {
                                if (matchedByNick[g.nick]) {
                                    return { ...g, trackingNumber: matchedByNick[g.nick] };
                                }
                                return g;
                            });
                            setCustomerGroups(nextGroups);

                            // ✨ 엑셀 업로드 즉시 시트와 고객 포털에 자동 저장!
                            await saveUpdatedGroupsImmediately(nextGroups, `✅ 총 ${matchedCount}명의 송장번호가 시트 및 고객 포털에 즉시 저장되었습니다!`);

                            let msg = `✅ [${cleanDisplayTabName(broadcastName || selectedTab)}] 방송에 총 ${matchedCount}명의 롯데택배 송장번호가 매칭되어 시트와 고객 포털에 즉시 자동 저장되었습니다!`;
                            if (duplicateWarnings.length > 0) {
                                msg += `\n\n⚠️ [동명이인 보류 ${duplicateWarnings.length}건 - 개별 송장입력으로 넣어주세요]\n` + duplicateWarnings.slice(0, 10).join('\n');
                            }
                            if (unmatchedRows.length > 0) {
                                msg += `\n\n❓ [현재 방송 명단에 없는 수령인 ${unmatchedRows.length}건]\n(다른 날짜 방송인지 좌측 방송 탭을 확인해 주세요)\n` + unmatchedRows.slice(0, 8).join('\n') + (unmatchedRows.length > 8 ? `\n...외 ${unmatchedRows.length - 8}건` : '');
                            }

                            if (unmatchedRows.length > 0) {
                                failMsg += `\n\n[엑셀에서 읽힌 수령인 예시]\n` + unmatchedRows.slice(0, 5).join('\n');
                            }
                            openModal(failMsg);
                        }
                    } catch (err) {
                        openModal('송장 엑셀 파일 처리 중 오류가 발생했습니다.');
