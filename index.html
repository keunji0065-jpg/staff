                } catch (e) {}
            }, [activeGasUrl, activeDictSheetId]);

            const findMasterAddressMatch = useCallback((nick) => {
                if (!nick || masterAddresses.length === 0) return null;
                const targetNorm = normalizeString(nick);
                const targetHandle = normalizeHandleNick(nick);
                if (!targetNorm) return null;
                return masterAddresses.find(a => normalizeString(a.nickname) === targetNorm)
                    || (targetHandle && targetHandle.length >= 2 ? masterAddresses.find(a => normalizeHandleNick(a.nickname) === targetHandle) : null)
                    || null;
            }, [masterAddresses]);

            const handleApplyMasterAddressToGroup = useCallback((targetNick, addrEntry) => {
                if (!targetNick || !addrEntry) return;
                const cleanPh = fixPhoneNumber(addrEntry.phone);
                const cleanAddr = stripZipcode(addrEntry.address || '');
                const cleanM = cleanMemoText(addrEntry.memo || '', cleanAddr);
                const newPin = cleanPh.length >= 4 ? cleanPh.slice(-4) : '';

                setCustomerGroups(prev => {
                    const nextGroups = prev.map(g => g.nick === targetNick ? {
                        ...g,
                        realname: addrEntry.realname || g.realname,
                        phone: cleanPh || g.phone,
                        address: cleanAddr || g.address,
                        memo: cleanM || g.memo,
                        pin: newPin || g.pin
                    } : g);

                    // 로컬 방송 창고에도 즉시 반영하여 탭을 옮기거나 새로고침해도 절대 사라지지 않도록 보장!
                    const cleanCur = cleanDisplayTabName(broadcastName || selectedTab || '');
                    const tabKey = selectedTab || ('주문_' + cleanCur);
                    if (cleanCur) {
                        setLocalBroadcastStore(storePrev => {
                            const nextStore = {
                                ...storePrev,
                                [tabKey]: {
                                    ...(storePrev[tabKey] || {}),
                                    broadcastName: cleanCur,
                                    freeShipThreshold,
                                    defaultShipping,
                                    cardFeeRate,
                                    updatedAt: Date.now(),
                                    groups: nextGroups
                                }
                            };
                            try {
                                localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(nextStore));
                                localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                            } catch (e) {}
                            return nextStore;
                        });
                    }
                    return nextGroups;
                });

                setHasUnsavedChanges(true);
                showToast(`📗 '${targetNick}' 님께 찐고객사전 배송지가 즉시 적용되었습니다! [시트 저장 (Ctrl+S)]을 누르면 시트에 확정됩니다.`);
            }, [broadcastName, selectedTab, freeShipThreshold, defaultShipping, cardFeeRate, showToast]);

            const loadInitialTabs = useCallback(async (forceRefreshFromSheet = false) => {
                setIsLoading(true);
                try {
                    const discoveredBlocks = {};

                    // 오직 직원 전용 구글 시트('주문' 탭)에 실제로 들어있는 데이터만 읽어옵니다! (사장님 클라우드 데이터나 옛날 캐시와 절대 섞지 않음)
                    const [directOrderRows, directFirstRows, gasOrderRes] = await Promise.all([
                        fetchGoogleSheetDirect(activeStaffSheetId, '주문'),
                        fetchGoogleSheetDirect(activeStaffSheetId, null),
                        fetchGas(`${activeGasUrl}?action=get_orders&masterId=${activeStaffSheetId}&tabName=${encodeURIComponent('주문')}&t=${Date.now()}`, null, 12000).catch(() => null)
                    ]);

                    if (Array.isArray(directOrderRows) && directOrderRows.length > 0) {
                        Object.assign(discoveredBlocks, parseRowsIntoBroadcastBlocks(directOrderRows, '주문'));
                    } else if (Array.isArray(directFirstRows) && directFirstRows.length > 0) {
                        Object.assign(discoveredBlocks, parseRowsIntoBroadcastBlocks(directFirstRows, '주문'));
                    }

                    if (Object.keys(discoveredBlocks).length === 0) {
                        const gasOrderRows = Array.isArray(gasOrderRes?.data) ? gasOrderRes.data : (Array.isArray(gasOrderRes?.orders) ? gasOrderRes.orders : []);
                        if (gasOrderRows.length > 0) {
                            Object.assign(discoveredBlocks, parseRowsIntoBroadcastBlocks(gasOrderRows, '주문'));
                        }
                    }

                    // ✨ 고객이 셀프 포털에서 방금 입력한 배송지(_portal_broadcast_addresses)와 주문확정(_portal_confirmed) 내역을 모든 방송 블록에 즉시 병합!
                    if (staffFbDb && Object.keys(discoveredBlocks).length > 0) {
                        try {
                            const [bcastAddrSnap, confSnap] = await Promise.all([
                                staffFbDb.ref('ember_live_data/_portal_broadcast_addresses').once('value'),
                                staffFbDb.ref('ember_live_data/_portal_confirmed').once('value')
                            ]);
                            const allBcastAddrs = bcastAddrSnap.val() || {};
                            const allConfMap = confSnap.val() || {};
                            const confList = Object.values(allConfMap).filter(c => c && c.nickname);

                            Object.values(discoveredBlocks).forEach(blk => {
                                if (!blk || !Array.isArray(blk.groups)) return;
                                const cleanB = cleanDisplayTabName(blk.broadcastName || '');
                                const safeBKey = cleanB.replace(/[.#$\[\]\/]/g, '_');
                                const addrMapForB = allBcastAddrs[safeBKey] || {};
                                const addrEntries = Object.values(addrMapForB).filter(a => a && a.nickname && (a.address || a.baseAddress));

                                blk.groups = blk.groups.map(g => {
                                    let updatedG = { ...g };
                                    if (addrEntries.length > 0) {
                                        const matchedAddr = addrEntries.find(a =>
                                            normalizeString(a.nickname) === normalizeString(g.nick) ||
                                            (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                                        );
                                        if (matchedAddr) {
                                            const newAddrStr = stripZipcode(matchedAddr.address || `${matchedAddr.baseAddress || ''} ${matchedAddr.detailAddress || ''}`.trim());
                                            const newReal = matchedAddr.realname || g.realname;
                                            const newPh = fixPhoneNumber(matchedAddr.phone || g.phone);
                                            const newMemo = cleanMemoText(matchedAddr.memo ?? g.memo, newAddrStr);
                                            if (newAddrStr) {
                                                updatedG = {
                                                    ...updatedG,
                                                    realname: newReal,
                                                    phone: newPh,
                                                    address: newAddrStr,
                                                    memo: newMemo,
                                                    pin: newPh.length >= 4 ? newPh.slice(-4) : updatedG.pin
                                                };
                                            }
                                        }
                                    }
                                    if (!updatedG.isConfirmed && confList.length > 0) {
                                        const isConf = confList.some(c => {
                                            const cBName = cleanDisplayTabName(c.broadcastName || '');
                                            if (cBName && normalizeString(cBName) !== normalizeString(cleanB)) return false;
                                            return normalizeString(c.nickname) === normalizeString(g.nick);
                                        });
                                        if (isConf) updatedG.isConfirmed = true;
                                    }
                                    return updatedG;
                                });
                            });
                        } catch (fbErr) {}
                    }

                    // 시트에서 정상적으로 읽어왔다면 옛날 로컬 캐시(중복 방송들)를 버리고 시트 원본으로 100% 덮어씁니다!
                    const hasSheetData = Object.keys(discoveredBlocks).length > 0;
                    const finalBlocksMap = hasSheetData ? discoveredBlocks : localBroadcastStore;
                    setLocalBroadcastStore(finalBlocksMap);
                    try {
                        localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(finalBlocksMap));
                    } catch (e) {}

                    // 클라우드(_portal_orders)에도 직원 시트의 방송들을 동기화
                    if (hasSheetData && staffFbDb) {
                        Object.values(finalBlocksMap).forEach(blk => {
                            if (blk && blk.broadcastName && Array.isArray(blk.groups)) {
                                syncBroadcastGroupsToFirebase(
                                    blk.broadcastName,
                                    blk.groups,
                                    blk.freeShipThreshold || 70000,
                                    blk.cardFeeRate || 10,
                                    customerCredits,
                                    'staff_init'
                                );
                            }
                        });
                    }

                    const validSortedTabs = Object.keys(finalBlocksMap)
                        .filter(t => t && t.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(t))
                        .sort((a, b) => {
                            const scoreA = extractBroadcastDateScore(a);
                            const scoreB = extractBroadcastDateScore(b);
                            if (scoreA !== scoreB) return scoreB - scoreA;
                            return b.localeCompare(a, 'ko');
                        });

                    setOrderTabs(validSortedTabs);

                    if (validSortedTabs.length > 0) {
                        const targetTab = (selectedTab && validSortedTabs.includes(selectedTab)) ? selectedTab : validSortedTabs[0];
                        setSelectedTab(targetTab);
                        const targetBlk = finalBlocksMap[targetTab];
                        if (targetBlk) {
                            setBroadcastName(targetBlk.broadcastName || cleanDisplayTabName(targetTab));
                            setFreeShipThreshold(targetBlk.freeShipThreshold || 70000);
                            setDefaultShipping(targetBlk.defaultShipping || 4000);
                            setCardFeeRate(targetBlk.cardFeeRate || 10);
                            setCustomerGroups(targetBlk.groups || []);
                        }
                    } else {
                        setSelectedTab('');
                        setCustomerGroups([]);
                    }
                    setHasUnsavedChanges(false);
                } catch (e) {
                    setIsLoading(false);
                } finally {
                    setIsLoading(false);
                }
            }, [activeGasUrl, activeStaffSheetId, localBroadcastStore, selectedTab, customerCredits]);

            useEffect(() => {
                loadInitialTabs(false);
                loadCsOrders();
                loadMasterAddresses();
            }, []);

            // ✨ [핵심] 고객이 포털에서 주소를 입력하거나 주문확정을 눌렀을 때 현재 보고 있는 방송뿐만 아니라 모든 방송 창고(localBroadcastStore)에 실시간으로 자동 반영!
            useEffect(() => {
                if (!staffFbDb) return;
                const cleanCurB = String(broadcastName || selectedTab || '').replace(/^주문_/, '').trim();

                const allAddrRef = staffFbDb.ref('ember_live_data/_portal_broadcast_addresses');
                const confRef = staffFbDb.ref('ember_live_data/_portal_confirmed');

                const handlePortalAllAddrChange = (snap) => {
                    const allVal = snap.val();
                    if (!allVal || typeof allVal !== 'object') return;

                    // 1) 현재 화면에 열려있는 방송(customerGroups) 즉시 업데이트
                    if (cleanCurB) {
                        const safeCurBKey = cleanCurB.replace(/[.#$\[\]\/]/g, '_');
                        const curBMap = allVal[safeCurBKey];
                        if (curBMap && typeof curBMap === 'object') {
                            const addrEntries = Object.values(curBMap).filter(a => a && a.nickname && (a.address || a.baseAddress));
                            if (addrEntries.length > 0) {
                                setCustomerGroups(prev => {
                                    let changed = false;
                                    const next = prev.map(g => {
                                        const matched = addrEntries.find(a =>
                                            normalizeString(a.nickname) === normalizeString(g.nick) ||
                                            (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                                        );
                                        if (!matched) return g;
                                        const newAddrStr = stripZipcode(matched.address || `${matched.baseAddress || ''} ${matched.detailAddress || ''}`.trim());
                                        const newReal = matched.realname || g.realname;
                                        const newPh = fixPhoneNumber(matched.phone || g.phone);
                                        const newMemo = cleanMemoText(matched.memo ?? g.memo, newAddrStr);
                                        if (newAddrStr && (g.address !== newAddrStr || g.realname !== newReal || g.phone !== newPh || g.memo !== newMemo)) {
                                            changed = true;
                                            return {
                                                ...g,
                                                realname: newReal,
                                                phone: newPh,
                                                address: newAddrStr,
                                                memo: newMemo,
                                                pin: newPh.length >= 4 ? newPh.slice(-4) : g.pin
                                            };
                                        }
                                        return g;
                                    });
                                    return changed ? next : prev;
                                });
                            }
                        }
                    }

                    // 2) 백그라운드의 다른 방송들(localBroadcastStore)도 고객이 입력한 주소로 동시 업데이트하여 저장 시 절대 누락되지 않도록 보호!
                    setLocalBroadcastStore(prevStore => {
                        let storeChanged = false;
                        const nextStore = { ...prevStore };
                        Object.keys(nextStore).forEach(tabKey => {
                            const blk = nextStore[tabKey];
                            if (!blk || !Array.isArray(blk.groups)) return;
                            const bTitle = cleanDisplayTabName(blk.broadcastName || tabKey);
                            const safeBKey = bTitle.replace(/[.#$\[\]\/]/g, '_');
                            const bAddrMap = allVal[safeBKey];
                            if (!bAddrMap || typeof bAddrMap !== 'object') return;
                            const addrEntries = Object.values(bAddrMap).filter(a => a && a.nickname && (a.address || a.baseAddress));
                            if (addrEntries.length === 0) return;

                            let blkChanged = false;
                            const nextGroups = blk.groups.map(g => {
                                const matched = addrEntries.find(a =>
                                    normalizeString(a.nickname) === normalizeString(g.nick) ||
                                    (normalizeHandleNick(a.nickname) && normalizeHandleNick(a.nickname) === normalizeHandleNick(g.nick))
                                );
                                if (!matched) return g;
                                const newAddrStr = stripZipcode(matched.address || `${matched.baseAddress || ''} ${matched.detailAddress || ''}`.trim());
                                const newReal = matched.realname || g.realname;
                                const newPh = fixPhoneNumber(matched.phone || g.phone);
                                const newMemo = cleanMemoText(matched.memo ?? g.memo, newAddrStr);
                                if (newAddrStr && (g.address !== newAddrStr || g.realname !== newReal || g.phone !== newPh || g.memo !== newMemo)) {
                                    blkChanged = true;
                                    return {
                                        ...g,
                                        realname: newReal,
                                        phone: newPh,
                                        address: newAddrStr,
                                        memo: newMemo,
                                        pin: newPh.length >= 4 ? newPh.slice(-4) : g.pin
                                    };
                                }
                                return g;
                            });
                            if (blkChanged) {
                                storeChanged = true;
                                nextStore[tabKey] = { ...blk, groups: nextGroups };
                            }
                        });
                        return storeChanged ? nextStore : prevStore;
                    });
                };

                const handlePortalConfirmChange = (snap) => {
                    const val = snap.val();
                    if (!val || typeof val !== 'object') return;
                    const confList = Object.values(val).filter(c => c && c.nickname);
                    if (confList.length === 0) return;

                    setCustomerGroups(prev => {
                        let changed = false;
                        const next = prev.map(g => {
                            if (g.isConfirmed) return g;
                            const isConf = confList.some(c => {
                                const cBName = String(c.broadcastName || '').replace(/^주문_/, '').trim();
                                if (cBName && cleanCurB && normalizeString(cBName) !== normalizeString(cleanCurB)) return false;
                                return normalizeString(c.nickname) === normalizeString(g.nick);
                            });
                            if (isConf) {
                                changed = true;
                                return { ...g, isConfirmed: true };
                            }
                            return g;
                        });
                        return changed ? next : prev;
                    });
                };

                allAddrRef.on('value', handlePortalAllAddrChange);
                confRef.on('value', handlePortalConfirmChange);
                return () => {
                    allAddrRef.off('value', handlePortalAllAddrChange);
                    confRef.off('value', handlePortalConfirmChange);
                };
            }, [broadcastName, selectedTab]);

            // ✨ 고객이 포털에서 본인의 환불 계좌번호를 직접 입력하거나 수정했을 때 직원용 CS 화면에도 실시간으로 자동 반영!
            useEffect(() => {
                if (!staffFbDb) return;
                const refAccRef = staffFbDb.ref('ember_live_data/_portal_cs_accounts');
                const handleAccountUpdate = (snap) => {
                    const val = snap.val();
                    if (!val || typeof val !== 'object') return;
                    setCsGroups(prev => {
                        let changed = false;
                        const next = prev.map(c => {
                            const entry = val[c.id];
                            if (entry && entry.refundAccount !== undefined && String(entry.refundAccount).trim() !== String(c.refundAccount || '').trim()) {
                                changed = true;
                                return { ...c, refundAccount: String(entry.refundAccount).trim() };
                            }
                            return c;
                        });
                        return changed ? next : prev;
                    });
                };
                refAccRef.on('value', handleAccountUpdate);
                return () => refAccRef.off('value', handleAccountUpdate);
            }, []);

            const getCustomerCreditAmount = useCallback((nick) => {
                if (!nick) return 0;
                if (customerCredits[nick] !== undefined) return Number(customerCredits[nick]) || 0;
                const targetNorm = normalizeString(nick);
                const targetHandle = normalizeHandleNick(nick);
                for (const k of Object.keys(customerCredits)) {
                    if (normalizeString(k) === targetNorm || (targetHandle && normalizeHandleNick(k) === targetHandle)) {
                        return Number(customerCredits[k]) || 0;
                    }
                }
                return 0;
            }, [customerCredits]);

            const handleUpdateCustomerCredit = useCallback((nick, nextCreditAmt) => {
                const cleanAmt = Math.max(0, Number(nextCreditAmt) || 0);
                setCustomerCredits(prev => ({ ...prev, [nick]: cleanAmt }));
                setHasUnsavedChanges(true);
                showToast(`💰 '${nick}' 님의 적립금(${cleanAmt.toLocaleString()}원)이 화면에 반영되었습니다. [시트 저장 (Ctrl+S)]을 눌러야 최종 저장됩니다!`);
            }, [showToast]);

            const handleGlobalSearch = async () => {
                const kw = globalKeyword.trim();
                if (!kw) {
                    setGlobalSearchResults(null);
                    return;
                }
                const normKw = normalizeString(kw);
                setIsSearchingGlobal(true);

                // 1) 로컬에 저장된 모든 방송 + CS 데이터에서 0.01초 만에 즉시 검색!
                const localResults = [];
                csGroups.forEach(c => {
                    const hay = normalizeString([
                        c.nick, c.realname, c.phone, c.origTracking, c.csTracking, c.csMemo,
                        (c.items || []).map(i => i.product).join(' ')
                    ].join(' '));
                    if (hay.includes(normKw)) {
                        localResults.push({
                            recordType: 'CS',
                            broadcastName: c.sourceBroadcast,
                            csStatus: c.csStatus,
                            nick: c.nick,
                            realname: c.realname,
                            phone: c.phone,
                            address: c.address,
                            trackingNumber: c.origTracking,
                            csTracking: c.csTracking,
                            csMemo: c.csMemo,
                            items: c.items || []
                        });
                    }
                });

                Object.entries(localBroadcastStore || {}).forEach(([tabName, bData]) => {
                    const bName = String(bData?.broadcastName || tabName).replace(/^주문_/, '');
                    (bData?.groups || []).forEach(g => {
                        const hay = normalizeString([
                            g.nick, g.realname, g.phone, g.address, g.trackingNumber,
                            (g.items || []).map(i => i.product).join(' ')
                        ].join(' '));
                        if (hay.includes(normKw)) {
                            localResults.push({
                                recordType: 'ORDER',
                                tabName,
                                broadcastName: bName,
                                nick: g.nick,
                                realname: g.realname,
                                phone: g.phone,
                                address: g.address,
                                trackingNumber: g.trackingNumber,
                                shipping: g.shipping,
                                deposit: g.deposit,
                                items: g.items || []
                            });
                        }
                    });
                });

                try {
                    const res = await fetchGas(`${activeGasUrl}?action=search_all_broadcasts&masterId=${activeStaffSheetId}&keyword=${encodeURIComponent(kw)}&t=${Date.now()}`);
                    const serverResults = (res && res.success && Array.isArray(res.results)) ? res.results : [];
                    const merged = [...localResults];
                    serverResults.forEach(sr => {
                        const exists = merged.some(m => m.recordType === sr.recordType && m.broadcastName === sr.broadcastName && normalizeString(m.nick) === normalizeString(sr.nick));
                        if (!exists) merged.push(sr);
                    });
                    setGlobalSearchResults(merged);
                } catch (e) {
                    setGlobalSearchResults(localResults);
                } finally {
                    setIsSearchingGlobal(false);
                }
            };

            const getGroupSummary = useCallback((g) => {
                const activeItems = (g.items || []).filter(i => !i.isWaitlist);
                const waitItems = (g.items || []).filter(i => i.isWaitlist);
                const prodTotal = activeItems.reduce((s, i) => s + (Number(i.price) || 0), 0);
                const prodForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);

                let ship = 0;
                if (activeItems.length > 0 && prodForShip > 0 && !g.isVip) {
                    const isJeju = Boolean(g.address && g.address.includes('제주'));
                    const isFreeShip = freeShipThreshold > 0 && prodForShip >= freeShipThreshold;
                    if (g.shipping !== undefined && g.shipping !== '' && Number(g.shipping) !== defaultShipping) {
                        ship = Number(g.shipping);
                    } else {
                        const baseShip = isFreeShip ? 0 : defaultShipping;
                        const jejuExtra = isJeju ? 3000 : 0;
                        ship = baseShip + jejuExtra;
                    }
                }
                const baseGrand = prodTotal + ship;
                const dep = Number(g.deposit) || 0;
                const baseBal = baseGrand - dep;
                const feeRate = Number(cardFeeRate) > 0 ? Number(cardFeeRate) / 100 : 0.1;
                const cardFee = (g.cardMode !== 'none' && baseBal > 0) ? Math.round(baseBal * feeRate) : 0;
                const finalGrand = baseGrand + cardFee;
                const finalBal = baseBal + cardFee;
                const isPaid = activeItems.length > 0 && baseBal <= 0 && g.cardMode === 'none';

                return { activeItems, waitItems, prodTotal, ship, baseGrand, dep, baseBal, cardFee, finalGrand, finalBal, isPaid };
            }, [freeShipThreshold, defaultShipping, cardFeeRate]);

            const handleApplyCreditToOrderInStaff = useCallback((nick, availableCredit, currentBalance) => {
                const avail = Math.max(0, Number(availableCredit) || 0);
                const bal = Math.max(0, Number(currentBalance) || 0);
                if (avail <= 0 || bal <= 0) return;
                const useAmt = Math.min(avail, bal);
                const remainCredit = avail - useAmt;
                openModal(
                    `'${nick}' 고객님의 보유 적립금 ${avail.toLocaleString()}원 중 ${useAmt.toLocaleString()}원을 이번 주문에서 차감하시겠습니까?\n\n• 차감 후 남은 보유 적립금: ${remainCredit.toLocaleString()}원\n• 주문서에 '적립금 (-${useAmt.toLocaleString()}원)' 항목이 자동 추가됩니다.\n• 적용 후 우측 상단 [시트 저장 (Ctrl+S)]을 꼭 눌러주세요!`,
                    'confirm',
                    () => {
                        setCustomerCredits(prev => ({ ...prev, [nick]: remainCredit }));
                        setCustomerGroups(prev => prev.map(cur => cur.nick === nick ? {
                            ...cur,
                            items: [
                                ...cur.items,
                                {
                                    id: `item_${Date.now()}_${Math.random()}`,
                                    product: '적립금',
                                    qty: 1,
                                    price: -Math.abs(useAmt),
                                    isWaitlist: false,
                                    waitlistOrder: 0
                                }
                            ]
                        } : cur));
                        setHasUnsavedChanges(true);
                        showToast(`⚡ '${nick}' 님 주문에 적립금 -${useAmt.toLocaleString()}원이 차감되었습니다! [시트 저장 (Ctrl+S)]을 눌러 확정하세요.`);
                    }
                );
            }, [openModal, showToast]);

            const handleSaveAll = useCallback(async () => {
                if (isSaving) return;
                setIsSaving(true);
                try {
                    if (activeMainTab === 'cs') {
                        const serializedCs = csGroups.map(c => ({
                            ...c,
                            csMemo: combineCsMemoAndAccount(c.csMemo, c.refundAccount, c.refundAmount, c.refundCompleted),
                            shipping: Number(c.shipping) || 0,
                            deposit: c.csFeePaid ? (Number(c.shipping) || Number(c.deposit) || 0) : 0
                        }));
                        // 고객용 포털 클라우드(_portal_cs)에도 즉시 동기화 (단, 직원용 csMemo는 제외됨!)
                        syncCsGroupsToFirebase(csGroups);

                        const res = await fetchGas(activeGasUrl, {
                            action: 'save_cs_orders',
                            masterId: activeStaffSheetId,
                            items: serializedCs
                        });
                        if (res && res.success) {
                            setHasUnsavedChanges(false);
                            showToast('✅ 직원용 시트 및 고객 포털에 [미송/교환/반품] 저장 완료!');
                        } else {
                            setHasUnsavedChanges(false);
                            showToast('💾 고객 포털 및 로컬에 안전하게 반영되었습니다!');
                        }
                    } else {
                        const cleanBName = cleanDisplayTabName(broadcastName || selectedTab);
                        const canonicalTab = '주문_' + cleanBName;

                        // 현재 방송의 행 데이터 생성 함수
                        const buildRowsForBroadcast = (bTitle, fThresh, dShip, cRate, groupsArr) => {
                            const rows = [{
                                '닉네임': '___WORKSPACE_META___',
                                '상품명': bTitle,
                                '수량': Number(fThresh) || 70000,
                                '단가(제품금액)': Number(dShip) || 4000,
                                '배송비': Number(cRate) || 10,
                                '입금액': 0,
                                '카드결제': '', '수령인명': '', '연락처': '', '주소': '', '요청사항': '',
                                'VIP여부': '', '노쇼여부': '', '대기여부': '', '비밀번호': '', '주문확인': '', '입금내역JSON': '', '송장번호': ''
                            }];
                            (groupsArr || []).forEach(g => {
                                const sum = getGroupSummary(g);
                                const cardStr = g.cardMode === 'completed' ? `카드완료(${cRate}%)` : (g.cardMode === 'requested' ? `O(${cRate}%)` : '');
                                const cleanPh = fixPhoneNumber(g.phone);
                                const pinStr = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                                const depJson = Array.isArray(g.deposits) && g.deposits.length > 0 ? JSON.stringify(g.deposits) : '';
                                const itemsList = (g.items && g.items.length > 0) ? g.items : [{ product: '', qty: 1, price: 0, isWaitlist: false, waitlistOrder: 0 }];

                                itemsList.forEach((it, idx) => {
                                    const waitCell = it.isWaitlist ? `대기${it.waitlistOrder || 1}번` : '';
                                    rows.push({
                                        '닉네임': g.nick,
                                        '상품명': it.product || '',
                                        '수량': Number(it.qty) || 1,
                                        '단가(제품금액)': Number(it.price) || 0,
                                        '배송비': sum.ship,
                                        '입금액': idx === 0 ? sum.dep : 0,
                                        '카드결제': cardStr,
                                        '수령인명': g.realname || '',
                                        '연락처': cleanPh ? "'" + cleanPh : '',
                                        '주소': stripZipcode(g.address || ''),
                                        '요청사항': cleanMemoText(g.memo, g.address),
                                        'VIP여부': g.isVip ? 'O' : '',
                                        '노쇼여부': g.isNoShow ? 'O' : '',
                                        '대기여부': waitCell,
                                        '비밀번호': pinStr ? "'" + pinStr : '',
                                        '주문확인': g.isConfirmed ? 'O' : '',
                                        '입금내역JSON': idx === 0 ? depJson : '',
                                        '송장번호': g.trackingNumber ? "'" + String(g.trackingNumber).replace(/^'+/, '') : ''
                                    });
                                });
                            });
                            return rows;
                        };

                        // 모든 방송 블록을 하나의 통합 리스트(allCombinedRows)로 합쳐서 시트를 늘리지 않고 단일 시트에만 저장!
                        const updatedStore = {
                            ...localBroadcastStore,
                            [canonicalTab]: {
                                broadcastName: cleanBName,
                                freeShipThreshold,
                                defaultShipping,
                                cardFeeRate,
                                updatedAt: Date.now(),
                                groups: customerGroups
                            }
                        };
                        setLocalBroadcastStore(updatedStore);
                        try { localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(updatedStore)); } catch (e) {}

                        const allCombinedRows = [];
                        Object.keys(updatedStore)
                            .filter(k => k.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(k))
                            .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                            .forEach(tKey => {
                                const blk = updatedStore[tKey];
                                if (blk && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                    const bTitle = cleanDisplayTabName(blk.broadcastName || tKey);
                                    allCombinedRows.push(...buildRowsForBroadcast(bTitle, blk.freeShipThreshold, blk.defaultShipping, blk.cardFeeRate, blk.groups));
                                }
                            });

                        // ✨ 핵심: '주문_10/20 악세사리', '주문_주문' 같은 불필요한 새 시트가 생기지 않도록 targetSheetName을 '주문'으로 고정하여 단일 통합 시트('주문')만 업데이트하고, 기존에 잘못 생겼던 중복 시트들은 자동으로 삭제 정리합니다!
                        const [res] = await Promise.all([
                            fetchGas(activeGasUrl, {
                                action: 'save_orders',
                                masterId: activeStaffSheetId,
                                targetSheetName: '주문',
                                onlyMainOrder: true,
                                broadcastName: '오늘의방송',
                                data: allCombinedRows
                            }),
                            fetchGas(activeGasUrl, {
                                action: 'delete_old_order_tabs',
                                masterId: activeStaffSheetId,
                                tabNames: ['주문_주문', '주문_10/20 악세사리', '주문_10/18 여성복', '주문_10/16 여성복', '주문_10/20 모이사', '주문_10/18 혜자집', '메인주문']
                            }).catch(() => null)
                        ]);

                        customerGroups.forEach(g => {
                            if (customerCredits[g.nick] !== undefined) {
                                fetchGas(activeGasUrl, {
                                    action: 'save_customer_credit',
                                    masterId: activeDictSheetId,
                                    data: { nickname: g.nick, credit: Number(customerCredits[g.nick]) || 0 }
                                }).catch(() => {});
                            }
                        });

                        if (staffFbDb) {
                            const safeBKey = cleanBName.replace(/[.#$\[\]\/]/g, '_');
                            customerGroups.forEach(g => {
                                const safeNickKey = String(g.nick || '').replace(/[.#$\[\]\/]/g, '_').trim();
                                if (!safeNickKey) return;
                                if (customerCredits[g.nick] !== undefined) {
                                    staffFbDb.ref(`ember_live_data/_portal_credits/${safeNickKey}`).set({
                                        nickname: g.nick,
                                        credit: Number(customerCredits[g.nick]) || 0,
                                        updatedAt: Date.now()
                                    }).catch(() => {});
                                }
                                if (g.address && safeBKey) {
                                    const addrPayload = {
                                        nickname: g.nick,
                                        realname: g.realname || '',
                                        phone: fixPhoneNumber(g.phone || ''),
                                        address: stripZipcode(g.address),
                                        memo: cleanMemoText(g.memo, g.address),
                                        broadcastName: cleanBName,
                                        updatedAt: new Date().toISOString()
                                    };
                                    staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set(addrPayload).catch(() => {});
                                }
                            });
                            syncBroadcastGroupsToFirebase(cleanBName, customerGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                            syncCsGroupsToFirebase(csGroups);
                        }

                        if (res && (res.success || res.status === 'success')) {
                            setHasUnsavedChanges(false);
                            showToast(`✅ 시트를 늘리지 않고 통합 주문서 및 고객 포털에 저장 완료!`);
                        } else {
                            setHasUnsavedChanges(false);
                            showToast(`✅ 고객 포털 및 로컬에 즉시 반영되었습니다!`);
                        }
                    }
                } finally {
                    setIsSaving(false);
                }
            }, [isSaving, activeMainTab, activeGasUrl, activeStaffSheetId, activeDictSheetId, csGroups, selectedTab, broadcastName, freeShipThreshold, defaultShipping, cardFeeRate, customerGroups, customerCredits, localBroadcastStore, getGroupSummary, showToast]);
            useEffect(() => {
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'ㄴ')) {
                        e.preventDefault();
                        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                        setTimeout(() => { handleSaveAll(); }, 30);
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [handleSaveAll]);

            const updateCustomerGroup = useCallback((nick, updater) => {
                setCustomerGroups(prev => prev.map(g => g.nick === nick ? updater(g) : g));
                setHasUnsavedChanges(true);
            }, []);

            // ✨ 직원이 현재 선택된 방송 이름을 직접 수정하는 함수 (로컬 스토어 + 좌측 탭 + CS 원본방송명 + 고객포털 Firebase 동시 변경)
            const handleRenameBroadcast = useCallback((targetTabKey = null) => {
                const baseTab = targetTabKey || selectedTab || ('주문_' + cleanDisplayTabName(broadcastName));
                const oldCleanName = cleanDisplayTabName(baseTab || broadcastName);
                if (!oldCleanName) return;

                openModal(
                    `'${oldCleanName}' 방송의 새로운 이름을 입력해 주세요.\n(변경 후 [시트 저장 (Ctrl+S)]을 누르면 시트와 고객 포털에 최종 확정됩니다)`,
                    'prompt',
                    (inputVal) => {
                        const nextCleanName = cleanDisplayTabName(inputVal);
                        if (!nextCleanName || nextCleanName === oldCleanName) return;

                        const oldTabKey = '주문_' + oldCleanName;
                        const newTabKey = '주문_' + nextCleanName;

                        if (orderTabs.includes(newTabKey) && oldTabKey !== newTabKey) {
                            openModal(`이미 '${nextCleanName}' 이름의 방송이 존재합니다.`, 'alert');
                            return;
                        }

                        // 1) 로컬 방송 창고에서 키 이름 교체
                        setLocalBroadcastStore(prev => {
                            const nextStore = { ...prev };
                            const existingBlk = nextStore[oldTabKey] || nextStore[baseTab] || {
                                broadcastName: oldCleanName,
                                freeShipThreshold,
                                defaultShipping,
                                cardFeeRate,
                                groups: customerGroups
                            };
                            delete nextStore[oldTabKey];
                            if (baseTab !== oldTabKey) delete nextStore[baseTab];

                            nextStore[newTabKey] = {
                                ...existingBlk,
                                broadcastName: nextCleanName,
                                updatedAt: Date.now(),
                                groups: (selectedTab === oldTabKey || selectedTab === baseTab) ? customerGroups : (existingBlk.groups || [])
                            };
                            try { localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(nextStore)); } catch (e) {}
                            return nextStore;
                        });

                        // 2) 좌측 방송 탭 목록 업데이트 및 날짜순 재정렬
                        setOrderTabs(prev => {
                            const replaced = prev.map(t => (t === oldTabKey || t === baseTab) ? newTabKey : t);
                            if (!replaced.includes(newTabKey)) replaced.unshift(newTabKey);
                            return Array.from(new Set(replaced)).sort((a, b) => {
                                const scoreA = extractBroadcastDateScore(a);
                                const scoreB = extractBroadcastDateScore(b);
                                if (scoreA !== scoreB) return scoreB - scoreA;
                                return b.localeCompare(a, 'ko');
                            });
                        });

                        // 3) 현재 보고 있던 방송이면 선택 상태도 새 이름으로 즉시 전환
                        if (selectedTab === oldTabKey || selectedTab === baseTab || cleanDisplayTabName(broadcastName) === oldCleanName) {
                            setSelectedTab(newTabKey);
                            setBroadcastName(nextCleanName);
                        }

                        // 4) 미송/교환/반품 CS 목록 중 이 방송에서 복사된 내역의 원본방송명도 함께 변경
                        setCsGroups(prev => prev.map(c =>
                            cleanDisplayTabName(c.sourceBroadcast) === oldCleanName
                                ? { ...c, sourceBroadcast: nextCleanName }
                                : c
                        ));

                        // 5) 고객 포털 실시간 클라우드(Firebase)에서 이전 방송키 데이터를 새 방송키로 이동
                        if (staffFbDb) {
                            const oldSafeKey = oldCleanName.replace(/[.#$\[\]\/]/g, '_');
                            const targetGroups = (selectedTab === oldTabKey || selectedTab === baseTab)
                                ? customerGroups
                                : (localBroadcastStore[oldTabKey]?.groups || []);
                            if (oldSafeKey) {
                                staffFbDb.ref(`ember_live_data/_portal_orders/${oldSafeKey}`).remove().catch(() => {});
                            }
                            syncBroadcastGroupsToFirebase(nextCleanName, targetGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                        }

                        setHasUnsavedChanges(true);
                        showToast(`✏️ 방송 이름이 '${oldCleanName}' ➔ '${nextCleanName}'(으)로 변경되었습니다! [시트 저장 (Ctrl+S)]을 눌러 확정하세요.`);
                    },
                    oldCleanName,
                    '방송 이름 변경'
                );
            }, [selectedTab, broadcastName, orderTabs, freeShipThreshold, defaultShipping, cardFeeRate, customerGroups, customerCredits, localBroadcastStore, openModal, showToast]);

            const handleSingleAddOrder = (e) => {
                e.preventDefault();
                const cleanN = newNick.trim();
                const cleanP = newProd.trim();
                if (!cleanN || !cleanP) return openModal('닉네임과 상품명을 모두 입력해 주세요.');
                const q = Number(newQty) || 1;
                const unitP = Number(String(newPrice).replace(/,/g, '')) || 0;
                const totalP = (cleanP === '적립금' && unitP > 0) ? -Math.abs(unitP * q) : unitP * q;

                const matchedDictAddr = findMasterAddressMatch(cleanN);

                setCustomerGroups(prev => {
                    const idx = prev.findIndex(g => normalizeString(g.nick) === normalizeString(cleanN));
                    if (idx !== -1) {
                        const copy = [...prev];
                        copy[idx] = {
                            ...copy[idx],
                            realname: copy[idx].realname || matchedDictAddr?.realname || '',
                            phone: copy[idx].phone || matchedDictAddr?.phone || '',
                            address: copy[idx].address || stripZipcode(matchedDictAddr?.address || ''),
                            memo: copy[idx].memo || matchedDictAddr?.memo || '',
                            items: [...copy[idx].items, { id: `item_${Date.now()}`, product: cleanP, qty: q, price: totalP, isWaitlist: false, waitlistOrder: 0 }]
                        };
                        return copy;
                    }
                    const cleanPh = matchedDictAddr ? fixPhoneNumber(matchedDictAddr.phone) : '';
                    return [{
                        nick: cleanN,
                        realname: matchedDictAddr?.realname || '',
                        phone: cleanPh,
                        address: stripZipcode(matchedDictAddr?.address || ''),
                        memo: matchedDictAddr?.memo || '',
                        shipping: defaultShipping,
                        deposit: 0,
                        cardMode: 'none',
                        isVip: false,
                        isNoShow: false,
                        isConfirmed: false,
                        pin: cleanPh.length >= 4 ? cleanPh.slice(-4) : '',
                        trackingNumber: '',
                        deposits: [],
                        showDeposits: false,
                        items: [{ id: `item_${Date.now()}`, product: cleanP, qty: q, price: totalP, isWaitlist: false, waitlistOrder: 0 }]
                    }, ...prev];
                });

                setNewProd('');
                setNewQty(1);
                setNewPrice('');
                setShowNewNickSuggest(false);
                setHasUnsavedChanges(true);
                if (matchedDictAddr) {
                    showToast(`'${cleanN}' 님 주문 추가 + 📗찐고객사전 주소(${matchedDictAddr.realname})가 자동 연동되었습니다! (Ctrl+S로 저장하세요)`);
                } else {
                    showToast(`'${cleanN}' 님 주문이 추가되었습니다. (Ctrl+S로 저장하세요)`);
                }
            };

            const newNickSuggestions = useMemo(() => {
                const kw = normalizeString(newNick);
                if (!kw || masterAddresses.length === 0) return [];
                return masterAddresses.filter(a => {
                    const nNorm = normalizeString(a.nickname);
                    const rNorm = normalizeString(a.realname);
                    return nNorm.includes(kw) || (rNorm && rNorm.includes(kw));
                }).slice(0, 6);
            }, [newNick, masterAddresses]);

            const handleConfirmCopyToCs = (group, bName, taggedItems, extraInfo = {}) => {
                const isObj = extraInfo && typeof extraInfo === 'object';
                const memoStr = isObj ? (extraInfo.csMemo || '') : String(extraInfo || '');
                const accStr = isObj ? (extraInfo.refundAccount || '') : '';
                const refAmt = isObj ? (Number(extraInfo.refundAmount) || 0) : 0;
                const refDone = isObj ? Boolean(extraInfo.refundCompleted) : false;
                const feeNum = isObj ? (Number(extraInfo.csFee) || 0) : 0;
                const feePaid = isObj ? Boolean(extraInfo.csFeePaid) : false;

                const newCsEntry = {
                    id: `cs_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                    createdAt: new Date().toLocaleString('ko-KR'),
                    sourceBroadcast: (bName || selectedTab || '').replace(/^주문_/, ''),
                    csStatus: '접수',
                    nick: group.nick,
                    realname: group.realname || '',
                    phone: group.phone || '',
                    address: stripZipcode(group.address || ''),
                    origTracking: group.trackingNumber || '',
                    csTracking: '',
                    csMemo: memoStr,
                    refundAccount: accStr,
                    refundAmount: refAmt,
                    refundCompleted: refDone,
                    shipping: feeNum,
                    deposit: feePaid ? feeNum : 0,
                    csFeePaid: feePaid,
                    cardMode: group.cardMode || 'none',
                    items: taggedItems
                };

                setCsGroups(prev => [newCsEntry, ...prev]);
                setHasUnsavedChanges(true);
                setActiveMainTab('cs');
                showToast(`🔄 '${group.nick}' 님의 주문서가 [미송/교환/반품 관리] 탭으로 복사되었습니다. [시트 저장 (Ctrl+S)]을 눌러 저장하세요!`);
            };

            const handleTrackingExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });

                        const parsedList = [];
                        const duplicateWarnings = [];

                        rows.forEach(r => {
                            let nick = '', realname = '', phone = '', trk = '';
                            Object.keys(r).forEach(k => {
                                const ck = k.replace(/\s+/g, '');
                                const val = String(r[k] || '').trim();
                                if (!val) return;
                                if (ck.includes('닉네임') || ck.includes('주문자')) nick = val.replace(/^\[.*?\]\s*/, '').trim();
                                else if (ck.includes('수하인') || ck.includes('수령인') || ck.includes('받는') || ck === '이름' || ck === '성명' || ck === '고객명') realname = val.replace(/^\[.*?\]\s*/, '').trim();
                                else if (ck.includes('전화') || ck.includes('연락처') || ck.includes('핸드폰') || ck.includes('휴대폰')) phone = fixPhoneNumber(val);
                                else if (ck.includes('운송장') || ck.includes('송장') || ck.includes('등기')) trk = val.replace(/[^0-9,-]/g, '');
                            });

                            if (trk && (nick || realname || phone)) {
                                const matches = customerGroups.filter(g => {
                                    if (nick && normalizeString(g.nick) === normalizeString(nick)) return true;
                                    if (phone && g.phone && g.phone === phone) return true;
                                    if (realname && normalizeString(g.realname) === normalizeString(realname)) return true;
                                    return false;
                                });

                                if (matches.length > 1) {
                                    duplicateWarnings.push(`• 수하인 '${realname || nick}' (${trk}) ➔ 동명이인: [${matches.map(m => m.nick).join(', ')}]`);
                                } else if (matches.length === 1) {
                                    parsedList.push({ nickname: matches[0].nick, realname: realname || nick, phone, trackingNumber: trk });
                                } else {
                                    parsedList.push({ nickname: nick, realname: realname || nick, phone, trackingNumber: trk });
                                }
                            }
                        });

                        if (parsedList.length > 0) {
                            setCustomerGroups(prev => prev.map(g => {
                                const found = parsedList.find(p => p.nickname && normalizeString(p.nickname) === normalizeString(g.nick));
                                return found ? { ...g, trackingNumber: found.trackingNumber } : g;
                            }));
                            setHasUnsavedChanges(true);

                            let msg = `총 ${parsedList.length}건의 롯데택배 송장번호가 화면에 매칭되었습니다!\n\n👉 확인 후 우측 상단 [시트 저장 (Ctrl+S)] 버튼을 눌러야 시트에 최종 저장됩니다.`;
                            if (duplicateWarnings.length > 0) {
                                msg += `\n\n⚠️ [동명이인 보류 ${duplicateWarnings.length}건]\n` + duplicateWarnings.join('\n');
                            }
                            openModal(msg);
                        } else {
                            openModal('엑셀에서 유효한 [수령인명/닉네임 + 운송장번호] 열을 찾지 못했습니다.');
                        }
                    } catch (err) {
                        openModal('엑셀 파일 처리 중 오류가 발생했습니다.');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            const handleExportProductsExcel = () => {
                const summary = {};
                const paidSummary = {};
                customerGroups.forEach(g => {
                    if (g.isNoShow) return;
                    const sum = getGroupSummary(g);
                    const isPaidOrCard = sum.isPaid || g.cardMode === 'requested' || g.cardMode === 'completed';
                    sum.activeItems.forEach(it => {
                        const p = it.product || '(상품명없음)';
                        const q = Number(it.qty) || 1;
                        const uPrice = q > 0 ? Math.round((Number(it.price) || 0) / q) : 0;
                        if (!summary[p]) summary[p] = { total: 0, price: uPrice };
                        if (!paidSummary[p]) paidSummary[p] = 0;
                        summary[p].total += q;
                        if (isPaidOrCard) paidSummary[p] += q;
                    });
                });

                const rows = Object.keys(summary).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true })).map(p => ({
                    '상품명': p,
                    '제품단가': summary[p].price,
                    '입금/카드 수량': paidSummary[p] || 0,
                    '미입금 수량': summary[p].total - (paidSummary[p] || 0),
                    '총 수량': summary[p].total
                }));
                downloadExcel(rows, `${broadcastName || '방송'}_발주용품목집계`);
            };

            const handleExportCustomersExcel = () => {
                const excelRows = [];
                customerGroups.forEach(g => {
                    const sum = getGroupSummary(g);
                    if (sum.activeItems.length === 0 && sum.waitItems.length === 0) return;
                    let statusStr = '완납';
                    if (g.isNoShow) statusStr = '노쇼';
                    else if (g.cardMode === 'completed') statusStr = `카드완료(${sum.finalBal.toLocaleString()})`;
                    else if (g.cardMode === 'requested') statusStr = `카드요청(${sum.finalBal.toLocaleString()})`;
                    else if (sum.baseBal > 0) statusStr = `미입금(미수 ${sum.baseBal.toLocaleString()})`;
                    else if (sum.baseBal < 0) statusStr = `과납(${Math.abs(sum.baseBal).toLocaleString()})`;

                    const makeRow = (prodStr) => ({
                        '방송명': broadcastName,
                        '결제상태': statusStr,
                        '닉네임': g.isVip ? `[VIP] ${g.nick}` : g.nick,
                        '주문상품(수량)': prodStr,
                        '수령인명': g.realname || '',
                        '연락처': g.phone || '',
                        '주소': stripZipcode(g.address || ''),
                        '배송메모': g.memo || '',
                        '송장번호': g.trackingNumber || ''
                    });

                    excelRows.push(makeRow(`[ ${g.nick} ]`));
                    sum.activeItems.forEach(it => {
                        excelRows.push(makeRow(`${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                    sum.waitItems.forEach(it => {
                        const rankBadge = it.waitlistOrder ? `[대기${it.waitlistOrder}번] ` : '[대기] ';
                        excelRows.push(makeRow(`${rankBadge}${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                });
                downloadExcel(excelRows, `${broadcastName || '방송'}_배송용고객리스트`);
            };

            const stats = useMemo(() => {
                let totalCustomers = 0, totalQty = 0, paidCount = 0, unpaidCount = 0, cardReqCount = 0, cardCompCount = 0, noAddrCount = 0, waitCount = 0;
                customerGroups.forEach(g => {
                    const sum = getGroupSummary(g);
                    if (sum.waitItems.length > 0) waitCount++;
                    if (sum.activeItems.length === 0) return;
                    totalCustomers++;
                    totalQty += sum.activeItems.reduce((acc, it) => acc + (Number(it.qty) || 1), 0);
                    if (!g.address) noAddrCount++;
                    if (g.cardMode === 'completed') cardCompCount++;
                    else if (g.cardMode === 'requested') cardReqCount++;
                    else if (sum.isPaid) paidCount++;
                    else unpaidCount++;
                });
                return { totalCustomers, totalQty, paidCount, unpaidCount, cardReqCount, cardCompCount, noAddrCount, waitCount };
            }, [customerGroups, getGroupSummary]);

            const filteredGroups = useMemo(() => {
                const kw = normalizeString(localSearchTerm);
                return customerGroups.filter(g => {
                    const sum = getGroupSummary(g);
                    if (statusFilter === 'paid' && !(sum.isPaid && g.cardMode === 'none')) return false;
                    if (statusFilter === 'unpaid' && !(sum.baseBal > 0 && g.cardMode === 'none' && sum.activeItems.length > 0)) return false;
                    if (statusFilter === 'card_req' && g.cardMode !== 'requested') return false;
                    if (statusFilter === 'card_comp' && g.cardMode !== 'completed') return false;
                    if (statusFilter === 'no_addr' && g.address) return false;
                    if (statusFilter === 'waitlist' && sum.waitItems.length === 0) return false;

                    if (!kw) return true;
                    const hay = normalizeString([
                        g.nick, g.realname, g.phone, g.address, g.trackingNumber,
                        (g.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [customerGroups, statusFilter, localSearchTerm, getGroupSummary]);

            const filteredCsGroups = useMemo(() => {
                const kw = normalizeString(csSearchTerm);
                return csGroups.filter(c => {
                    const hasMisong = (c.items || []).some(it => it.csTag === '미송');
                    const hasExRet = (c.items || []).some(it => it.csTag && it.csTag !== '정상' && it.csTag !== '미송');
                    if (csStatusFilter === 'active' && c.csStatus === '처리완료') return false;
                    if (csStatusFilter === 'misong' && (!hasMisong || c.csStatus === '처리완료')) return false;
                    if (csStatusFilter === 'exret' && (!hasExRet || c.csStatus === '처리완료')) return false;
                    if (csStatusFilter === 'completed' && c.csStatus !== '처리완료') return false;
                    if (!kw) return true;
                    const hay = normalizeString([
                        c.sourceBroadcast, c.nick, c.realname, c.phone, c.address, c.origTracking, c.csTracking, c.csMemo, c.refundAccount,
                        (c.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [csGroups, csSearchTerm, csStatusFilter]);

            return (
                <div className="h-screen flex flex-col bg-slate-100 overflow-hidden">
                    {toastMsg && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-extrabold shadow-lg">
                            {toastMsg}
                        </div>

                    <CustomModal modal={modal} onClose={() => setModal(p => ({ ...p, isOpen: false }))} />
                    <AddressEditModal
                        isOpen={Boolean(addrEditTarget)}
                        group={addrEditTarget}
                        masterAddresses={masterAddresses}
                        onClose={() => setAddrEditTarget(null)}
                        onSave={(newAddr) => {
                            const targetNick = addrEditTarget.nick;
                            const cleanPh = fixPhoneNumber(newAddr.phone || '');
                            const cleanA = stripZipcode(newAddr.address || '');
                            const cleanM = cleanMemoText(newAddr.memo || '', cleanA);
                            const newPin = cleanPh.length >= 4 ? cleanPh.slice(-4) : '';

                            setCustomerGroups(prev => {
                                const nextGroups = prev.map(cur => cur.nick === targetNick ? {
                                    ...cur,
                                    realname: newAddr.realname,
                                    phone: cleanPh,
                                    address: cleanA,
                                    memo: cleanM,
                                    pin: newPin || cur.pin
                                } : cur);

                                const cleanCur = cleanDisplayTabName(broadcastName || selectedTab || '');
                                const tabKey = selectedTab || ('주문_' + cleanCur);
                                if (cleanCur) {
                                    setLocalBroadcastStore(storePrev => {
                                        const nextStore = {
                                            ...storePrev,
                                            [tabKey]: {
                                                ...(storePrev[tabKey] || {}),
                                                broadcastName: cleanCur,
                                                freeShipThreshold,
                                                defaultShipping,
                                                cardFeeRate,
                                                updatedAt: Date.now(),
                                                groups: nextGroups
                                            }
                                        };
                                        try { localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(nextStore)); } catch (e) {}
                                        return nextStore;
                                    });
                                }
                                return nextGroups;
                            });
                            setHasUnsavedChanges(true);
                            setAddrEditTarget(null);
                            showToast(`✏️ '${targetNick}' 배송지가 화면에 반영되었습니다. 우측 상단 [시트 저장 (Ctrl+S)]을 누르면 최종 저장됩니다!`);
                        }}
                    />
                    <CsCopySelectModal
                        isOpen={Boolean(csCopyTarget)}
                        group={csCopyTarget?.group}
                        broadcastName={csCopyTarget?.broadcastName}

                    />

                    {cleanupModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={() => setCleanupModalOpen(false)}>
                            <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-md mx-4 flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center pb-2.5 mb-2.5 border-b">
                                    <h3 className="text-sm font-extrabold text-slate-800">🧹 오래된 방송 시트 정리 (용량 확보)</h3>
                                    <button onClick={() => setCleanupModalOpen(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" weight="bold" size={18}/></button>
                                </div>
                                <p className="text-xs text-slate-500 mb-3">
                                    정산 및 배송이 완전히 끝난 옛날 방송 시트를 선택해 정리할 수 있습니다. (최근 5개 방송은 보호됩니다)
                                </p>
                                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 mb-4">
                                    {orderTabs.slice(5).map(t => (
                                        <label key={t} className="flex items-center justify-between p-2 rounded border bg-slate-50 cursor-pointer text-xs font-bold">
                                            <span>{t.replace(/^주문_/, '')}</span>
                                            <input
                                                type="checkbox"
                                                checked={Boolean(selectedOldTabs[t])}
                                                onChange={e => setSelectedOldTabs(p => ({ ...p, [t]: e.target.checked }))}

                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setCleanupModalOpen(false)} className="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">닫기</button>

                                        선택한 시트 삭제
                                    </button>
                                </div>
                            </div>
                        </div>

                    <header className="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0 shadow-sm">
                        <div className="flex items-center gap-2 flex-wrap">
                            <h1 className="flex items-baseline gap-2">
                                <Icon name="package" weight="fill" className="text-blue-600 self-center" size={22} />
                                <span className="text-lg sm:text-xl font-black text-slate-900 tracking-tight">엠버 직원용 시스템</span>
                                <span className="text-[11px] font-bold text-slate-400">
                                    ({APP_VERSION} · 최종수정일: {LAST_MODIFIED_DATE} by.깔로)
