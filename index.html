    <!-- 글꼴과 대문 이미지를 비동기로 로드하여 첫 화면 멈춤(Render-blocking) 원천 차단 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="this.media='all'">

            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

            padding: 0;

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzQiXNFeSrZGH8TPvDHoaSaEV5Wg3KVy-WaMp62ssPNHkec-XojgxDGII2oYQD_iVKZ/exec';
        const DEFAULT_MASTER_SHEET_ID = '1B8SBMX18_Px1CpRHuDTxqodqudiTrf6NfVoptjHtnGQ';
        const KAKAO_CHANNEL_URL = 'http://pf.kakao.com/_xxxx';
        const BANK_NAME_HOLDER = '카카오뱅크 · 김선정';
        const BANK_ACCOUNT_NUMBER = '7942-32-84990';
        const DEFAULT_STAFF_SHEET_ID = '1sM5bkDqEjD6Kpxu2yoJe2aiMuqpcWLMAIGpY3iL5_x8';

        let portalFbDb = null;
        try {
            const fbConfig = {
                apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",
                authDomain: "my-live-shop.firebaseapp.com",
                databaseURL: "https://my-live-shop-default-rtdb.firebaseio.com",
                projectId: "my-live-shop",
                storageBucket: "my-live-shop.firebasestorage.app",
                messagingSenderId: "598748133843",
                appId: "1:598748133843:web:17c7d83321fc191f85d726"
            };
            if (window.firebase) {
                if (!window.firebase.apps.length) window.firebase.initializeApp(fbConfig);
                portalFbDb = window.firebase.database();
            }
        } catch (e) {}

        // ⚡ 초고속 시트 메모리 캐시 (고객이 닉네임/비번을 입력하는 동안 미리 백그라운드에서 로드하여 버튼 클릭 시 0.05초 만에 열리도록 가속!)
        const portalSheetCache = {
            staffOrderRows: null,
            staffCsRows: null,
            lastFetchedAt: 0,
            fetchingPromise: null
        };

        const fetchGasWithRetry = async (url, options = null, maxRetries = 1, timeoutMs = 4000) => {
            let lastErr = null;
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const fetchOpts = options
                        ? { ...options, redirect: 'follow', signal: controller.signal }
                        : { method: 'GET', redirect: 'follow', signal: controller.signal };
                    const res = await fetch(url, fetchOpts);
                    clearTimeout(timer);
                    const text = await res.text();
                    const parsed = JSON.parse(text);
                    if (parsed) return parsed;
                } catch (err) {
                    clearTimeout(timer);
                    lastErr = err;
                    if (attempt < maxRetries - 1) {
                        await new Promise(r => setTimeout(r, 200));
                    }
                }
            }
            if (options && options.method === 'POST') {
                try {
                    await fetch(url, { ...options, mode: 'no-cors' });
                    return { status: 'success', success: true, fallbackNoCors: true };
                } catch (e) {}
            }
            throw lastErr || new Error('네트워크 연결 지연');
        };

        // 구글 시트 공개/공유 문서 직통 리더 (구글 글로벌 CDN 경유 - 수백 명 동시 접속 시에도 0.3초 응답 & 서버 다운 없음!)
        const fetchGoogleSheetDirectPortal = (sheetId, sheetName = null, timeoutMs = 3200) => {
            return new Promise((resolve) => {
                const cbName = `portal_gviz_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
                const timer = setTimeout(() => {
                    if (window[cbName]) delete window[cbName];
                    resolve(null);
                }, timeoutMs);

                window[cbName] = (res) => {
                    clearTimeout(timer);
                    delete window[cbName];
                    if (!res || res.status === 'error' || !res.table) {
                        resolve(null);
                        return;
                    }
                    const cols = (res.table.cols || []).map((c, idx) => String(c?.label || '').trim() || `col_${idx}`);
                    const rows = (res.table.rows || []).map(r => {
                        const obj = {};
                        (r.c || []).forEach((cell, idx) => {
                            const val = cell ? (cell.f !== undefined && cell.f !== null ? String(cell.f) : (cell.v !== undefined && cell.v !== null ? String(cell.v) : '')) : '';
                            const colKey = cols[idx] || `col_${idx}`;
                            obj[colKey] = val;
                            obj[`col_${idx}`] = val;
                        });
                        return obj;
                    });
                    resolve(rows);
                };

                const script = document.createElement('script');
                const sheetParam = sheetName ? `&sheet=${encodeURIComponent(sheetName)}` : `&gid=0`;
                script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${cbName}${sheetParam}&headers=1&t=${Math.floor(Date.now() / 10000)}`;
                script.onerror = () => {
                    clearTimeout(timer);
                    if (window[cbName]) delete window[cbName];
                    resolve(null);
                };
                document.body.appendChild(script);
                setTimeout(() => { try { document.body.removeChild(script); } catch (e) {} }, timeoutMs + 500);
            });
        };

        // 백그라운드 시트 프리로더 (30초 캐시 유지로 중복 다운로드 원천 차단)
        const preloadStaffSheetsInBackground = (force = false) => {
            const now = Date.now();
            if (!force && portalSheetCache.staffOrderRows && (now - portalSheetCache.lastFetchedAt < 30000)) {
                return Promise.resolve(portalSheetCache);
            }
            if (portalSheetCache.fetchingPromise && !force) {
                return portalSheetCache.fetchingPromise;
            }
            portalSheetCache.fetchingPromise = (async () => {
                try {
                    const [ordRows, csRows] = await Promise.all([
                        fetchGoogleSheetDirectPortal(DEFAULT_STAFF_SHEET_ID, '주문', 3000).then(r => (Array.isArray(r) && r.length > 0) ? r : fetchGoogleSheetDirectPortal(DEFAULT_STAFF_SHEET_ID, null, 2500)),
                        fetchGoogleSheetDirectPortal(DEFAULT_STAFF_SHEET_ID, '교환반품CS', 3000)
                    ]);
                    if (Array.isArray(ordRows) && ordRows.length > 0) {
                        portalSheetCache.staffOrderRows = ordRows;
                        portalSheetCache.lastFetchedAt = Date.now();
                    }
                    if (Array.isArray(csRows)) {
                        portalSheetCache.staffCsRows = csRows;
                    }
                } catch (e) {}
                portalSheetCache.fetchingPromise = null;
                return portalSheetCache;
            })();
            return portalSheetCache.fetchingPromise;
        };

        // 시트 셀의 CS메모 문자열에서 계좌번호/환불금액/환불완료 여부만 추출하고 직원용 순수 메모는 철저히 버리는 보안 파서
        const extractPublicCsFieldsFromRawMemo = (rawMemoStr) => {
            let raw = String(rawMemoStr || '').trim();
            if (!raw) return { accountOnly: '', refundAmount: 0, refundCompleted: false };

            let refundCompleted = false;
            if (raw.includes('[환불완료]')) {
                refundCompleted = true;
                raw = raw.replace(/\[환불완료\]/g, '').trim();
            }

            let refundAmount = 0;
            const amtMatch = raw.match(/\[환불액:\s*([0-9,]+)\]/);
            if (amtMatch) {
                refundAmount = Number(amtMatch[1].replace(/[^0-9]/g, '')) || 0;
                raw = raw.replace(amtMatch[0], '').trim();
            }

            let accountOnly = '';
            const tagMatch = raw.match(/\[계좌:\s*([^\]]+)\]/);
            if (tagMatch) {
                accountOnly = tagMatch[1].trim();
            } else {
                const slashBankMatch = raw.match(/^(.*?)\s*\/\s*((?:카카오|카뱅|농협|국민|신한|우리|하나|기업|토스|우체국|새마을|신협|수협|부산|대구|경남|광주|전북|제주|케이|씨티|SC).*)$/);
                if (slashBankMatch) {
                    accountOnly = slashBankMatch[2].trim();
                }
            }
            return { accountOnly, refundAmount, refundCompleted };
        };

        // 실제 주문 품목이 있는 주문서가 1개라도 존재하면 '최근 주문 내역 없음' 빈 더미 카드는 무조건 제거하는 헬퍼
        const removeDummyEmptyOrdersIfRealExists = (list) => {
            if (!Array.isArray(list) || list.length <= 1) return list || [];
            const realOrders = list.filter(item =>
                item &&
                item.broadcastName !== '최근 주문 내역 없음' &&
                item.sheetTabName !== '메인주문_빈카드' &&
                !(item.sheetTabName === '메인주문' && (!Array.isArray(item.items) || item.items.length === 0))
            );
            return realOrders.length > 0 ? realOrders : [list[0]];
        };

        // 고객 본인의 미송 / 교환 / 반품 내역만 필터링하여 가져오는 함수 (직원용 csMemo는 절대 포함하지 않음)
        const lookupCustomerCsRecords = async (targetNicksList, cleanPin) => {
            const validNicks = (Array.isArray(targetNicksList) ? targetNicksList : [targetNicksList]).filter(Boolean);
            if (validNicks.length === 0) return [];
            const normInPin = normalizePin4(cleanPin);

            const isMyCsRecord = (csNick, csRealname, csPhone) => {
                const phPin = csPhone && String(csPhone).replace(/[^0-9]/g, '').length >= 4
                    ? normalizePin4(String(csPhone).replace(/[^0-9]/g, '').slice(-4))
                    : '';
                if (phPin && normInPin && phPin !== normInPin) return false;
                for (const myNick of validNicks) {
                    const sc = getNickMatchScore(csNick, csRealname || '', myNick);
                    if (sc >= 2) return true;
                    if (sc >= 1 && phPin && normInPin && phPin === normInPin) return true;
                }
                return false;
            };

            const resultsMap = new Map();

            const registerPublicCsItem = (c, customAccOverride) => {
                if (!c || !c.nick) return;
                if (!isMyCsRecord(c.nick, c.realname, c.phone)) return;
                const parsedFromMemo = extractPublicCsFieldsFromRawMemo(c.csMemo || '');
                const allItems = Array.isArray(c.items) ? c.items : [];
                const taggedOnly = allItems.filter(it => it.csTag && it.csTag !== '정상');
                const displayItems = taggedOnly.length > 0 ? taggedOnly : allItems;
                const autoRetSum = displayItems.filter(x => x.csTag === '반품').reduce((s, x) => s + (Number(x.price) || 0), 0);

                const finalAcc = customAccOverride !== undefined
                    ? customAccOverride
                    : (c.refundAccount !== undefined && c.refundAccount !== '' ? c.refundAccount : parsedFromMemo.accountOnly);
                const finalRefundAmt = Number(c.refundAmount) > 0
                    ? Number(c.refundAmount)
                    : (parsedFromMemo.refundAmount > 0 ? parsedFromMemo.refundAmount : autoRetSum);
                const finalRefundDone = Boolean(c.refundCompleted || parsedFromMemo.refundCompleted);
                const shipFee = Number(c.csFee !== undefined ? c.csFee : c.shipping) || 0;
                const feePaid = c.csFeePaid !== undefined ? Boolean(c.csFeePaid) : (Number(c.deposit) > 0 && Number(c.deposit) >= shipFee);

                resultsMap.set(c.id || `${c.nick}_${c.sourceBroadcast}`, {
                    id: c.id || `${c.nick}_${c.sourceBroadcast}`,
                    sourceBroadcast: String(c.sourceBroadcast || '').replace(/^주문_/, '').trim(),
                    csStatus: c.csStatus === '처리완료' ? '처리완료' : '미처리',
                    nick: c.nick,
                    origTracking: String(c.origTracking || '').replace(/^'+/, '').trim(),
                    csTracking: String(c.csTracking || '').replace(/^'+/, '').trim(),
                    refundAccount: String(finalAcc || '').trim(),
                    refundAmount: finalRefundAmt,
                    refundCompleted: finalRefundDone,
                    csFee: shipFee,
                    csFeePaid: feePaid,
                    items: displayItems.map(it => ({
                        product: it.product || '',
                        qty: Number(it.qty) || 1,
                        price: Number(it.price) || 0,
                        csTag: it.csTag || '정상'
                    }))
                });
            };

            // 1) Firebase 실시간 클라우드(_portal_cs) 및 고객 계좌입력(_portal_cs_accounts) 초고속 스캔 (1.5초 타임아웃)
            let accVal = {};
            if (portalFbDb) {
                try {
                    const fbCsPromise = Promise.all([
                        portalFbDb.ref('ember_live_data/_portal_cs').once('value'),
                        portalFbDb.ref('ember_live_data/_portal_cs_accounts').once('value')
                    ]);
                    const timeoutPromise = new Promise(r => setTimeout(() => r(null), 1800));
                    const snaps = await Promise.race([fbCsPromise, timeoutPromise]);
                    if (snaps) {
                        const [csSnap, accSnap] = snaps;
                        const csVal = csSnap.val();
                        accVal = accSnap.val() || {};
                        const itemsList = (csVal && Array.isArray(csVal.items)) ? csVal.items : [];
                        itemsList.forEach(c => {
                            registerPublicCsItem(c, accVal[c?.id]?.refundAccount);
                        });
                    }
                } catch (e) {}
            }

            // 2) 구글 시트('교환반품CS') 캐시 또는 직통 리더로 빠르게 조회 (무거운 GAS 중복 호출 제거!)
            try {
                let directStaffCs = portalSheetCache.staffCsRows;
                if (!Array.isArray(directStaffCs)) {
                    directStaffCs = await fetchGoogleSheetDirectPortal(DEFAULT_STAFF_SHEET_ID, '교환반품CS', 2800).catch(() => null);
                    if (Array.isArray(directStaffCs)) portalSheetCache.staffCsRows = directStaffCs;
                }

                const combinedSheetRows = Array.isArray(directStaffCs) ? directStaffCs : [];

                combinedSheetRows.forEach((r, idx) => {
                    const cNick = String(r['닉네임'] || r.nick || r.col_4 || '').trim();
                    const cReal = String(r['수령인명'] || r.realname || r.col_5 || '').trim();
                    const cPhone = fixPhoneStr(r['연락처'] || r.phone || r.col_6 || '');
                    if (!cNick || cNick === '닉네임') return;
                    if (!isMyCsRecord(cNick, cReal, cPhone)) return;

                    const csId = String(r['CS_ID'] || r.id || r.col_0 || `cs_sheet_${cNick}_${idx}`);
                    let parsedItems = [];
                    const jsonRaw = r['전체품목JSON'] || r.itemsJson || r.col_15 || '';
                    if (jsonRaw) {
                        try {
                            const p = typeof jsonRaw === 'string' ? JSON.parse(jsonRaw) : jsonRaw;
                            if (Array.isArray(p)) parsedItems = p;
                        } catch (e) {}
                    }
                    const rawMemoCell = String(r['CS메모'] || r.csMemo || r.col_10 || '');
                    const shipFee = Number(String(r['배송비'] || r.shipping || r.col_11 || '0').replace(/[^0-9.-]/g, '')) || 0;
                    const depAmt = Number(String(r['입금액'] || r.deposit || r.col_12 || '0').replace(/[^0-9.-]/g, '')) || 0;
                    const stRaw = String(r['처리상태'] || r.csStatus || r.col_3 || '').trim();

                    registerPublicCsItem({
                        id: csId,
                        sourceBroadcast: String(r['원본방송'] || r.sourceBroadcast || r.col_2 || '').replace(/^주문_/, '').trim(),
                        csStatus: stRaw === '처리완료' ? '처리완료' : '미처리',
                        nick: cNick,
                        realname: cReal,
                        phone: cPhone,
                        origTracking: String(r['원송장번호'] || r.origTracking || r.col_8 || '').replace(/^'+/, '').trim(),
                        csTracking: String(r['교반송장번호'] || r.csTracking || r.col_9 || '').replace(/^'+/, '').trim(),
                        csMemo: rawMemoCell,
                        shipping: shipFee,
                        deposit: depAmt,
                        items: parsedItems
                    }, accVal[csId]?.refundAccount);
                });
            } catch (e) {}

            // 3) 보조: 로컬 스토리지 데이터도 병합
            try {
                const localCsRaw = localStorage.getItem('ember_staff_cs_groups_v1');
                if (localCsRaw) {
                    const localCsList = JSON.parse(localCsRaw);
                    if (Array.isArray(localCsList)) {
                        localCsList.forEach(c => {
                            registerPublicCsItem(c, accVal[c?.id]?.refundAccount);
                        });
                    }
                }
            } catch (e) {}

            return Array.from(resultsMap.values());
        };

        // ✨ 직원용 구글 시트('주문' 단일 통합 시트)에서 고객의 모든 방송 주문서를 초고속으로 찾아오는 함수
        const lookupOrderFromStaffSheetDirect = async (rawNick, cleanPin, forceRefresh = false) => {
            const normInPin = normalizePin4(cleanPin);
            if (!rawNick || !normInPin) return null;

            try {
                let rows = (!forceRefresh && Array.isArray(portalSheetCache.staffOrderRows) && portalSheetCache.staffOrderRows.length > 0)
                    ? portalSheetCache.staffOrderRows
                    : null;

                if (!rows) {
                    await preloadStaffSheetsInBackground(forceRefresh);
                    rows = portalSheetCache.staffOrderRows;
                }
                if (!Array.isArray(rows) || rows.length === 0) {
                    const gasRes = await fetchGasWithRetry(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_STAFF_SHEET_ID}&tabName=${encodeURIComponent('주문')}&t=${Date.now()}`, null, 1, 3500).catch(() => null);
                    if (gasRes && Array.isArray(gasRes.data) && gasRes.data.length > 0) {
                        rows = gasRes.data;
                        portalSheetCache.staffOrderRows = rows;
                        portalSheetCache.lastFetchedAt = Date.now();
                    }
                }
                if (!Array.isArray(rows) || rows.length === 0) return null;

                // 1) ___WORKSPACE___ 구분선을 기준으로 방송별 그룹 분리
                const blocks = {};
                let curB = '최근 방송';
                let curMeta = { fThresh: 70000, dShip: 4000, cRate: 10 };

                const ensureBlk = (bName, meta) => {
                    const cleanB = String(bName || '최근 방송').replace(/^주문_/, '').trim();
                    if (!blocks[cleanB]) {
                        blocks[cleanB] = {
                            broadcastName: cleanB,
                            fThresh: meta.fThresh,
                            dShip: meta.dShip,
                            cRate: meta.cRate,
                            custMap: {}
                        };
                    }
                    return blocks[cleanB];
                };

                // 고객별 등록된 PIN 사전 수집 (교차 검증용)
                const knownPinsByNick = {};
                const knownAddrByNick = {};
                const addKnownPin = (nKey, pVal) => {
                    if (!nKey || !pVal) return;
                    if (!knownPinsByNick[nKey]) knownPinsByNick[nKey] = new Set();
                    knownPinsByNick[nKey].add(pVal);
                };

                rows.forEach((r, idx) => {
                    const nick = String(r['닉네임'] || r['주문자'] || r.col_0 || '').trim();
                    const prod = String(r['상품명'] || r['품목'] || r.col_1 || '').trim();
                    if (!nick || nick === '닉네임' || nick === '주문자') return;

                    if (nick.startsWith('___WORKSPACE')) {
                        if (prod) curB = String(prod).replace(/^주문_/, '').trim();
                        curMeta = {
                            fThresh: Number(r['수량'] || r.col_2) > 0 ? Number(r['수량'] || r.col_2) : 70000,
                            dShip: (r['단가(제품금액)'] !== '' && Number(r['단가(제품금액)'] ?? r.col_3) >= 0) ? Number(r['단가(제품금액)'] ?? r.col_3) : 4000,

                        };
                        ensureBlk(curB, curMeta);

                    }

                    const blk = ensureBlk(curB, curMeta);
                    const col9Val = String(r.col_9 || '').trim();
                    const col10Val = String(r.col_10 || '').trim();
                    const isCol9Zip = /^\(\d{5}\)$/.test(col9Val) || /^\d{5}$/.test(col9Val);
                    const shifted = isCol9Zip ? 1 : 0;

                    const qtyVal = Number(String(r['수량'] ?? r.col_2 ?? '1').replace(/[^0-9.-]/g, '')) || 1;
                    const priceVal = Number(String(r['단가(제품금액)'] ?? r.col_3 ?? '0').replace(/[^0-9.-]/g, '')) || 0;
                    const shipRaw = r['배송비'] ?? r.col_4;
                    const depVal = Number(String(r['입금액'] ?? r.col_5 ?? '0').replace(/[^0-9.-]/g, '')) || 0;
                    const cardRaw = String(r['카드결제'] ?? r.col_6 ?? '').trim();
                    const realname = String(r['수령인명'] ?? r.col_7 ?? '').trim();
                    const phone = fixPhoneStr(r['연락처'] ?? r.col_8 ?? '');

                    let rawAddr = String(r['주소'] || '').trim();
                    if (!rawAddr || /^\(\d{5}\)$/.test(rawAddr) || /^\d{5}$/.test(rawAddr)) {
                        rawAddr = isCol9Zip ? col10Val : (col9Val || col10Val);
                    }
                    const cleanAddr = String(rawAddr || '').replace(/^\(\d{5}\)\s*/, '').trim();
                    const memo = String(r['요청사항'] ?? r[`col_${10 + shifted}`] ?? '').trim();
                    const vipRaw = String(r['VIP여부'] ?? r[`col_${11 + shifted}`] ?? '').trim();
                    const waitRaw = String(r['대기여부'] ?? r[`col_${13 + shifted}`] ?? '').trim();
                    const pinRaw = normalizePin4(r['비밀번호'] ?? r[`col_${14 + shifted}`] ?? '');
                    const confRaw = String(r['주문확인'] ?? r[`col_${15 + shifted}`] ?? '').trim();
                    const depJsonRaw = String(r['입금내역JSON'] ?? r[`col_${16 + shifted}`] ?? '').trim();
                    const trkRaw = String(r['송장번호'] ?? r[`col_${17 + shifted}`] ?? '').replace(/^'+/, '').trim();

                    const effectivePin = pinRaw || (phone.length >= 4 ? normalizePin4(phone.slice(-4)) : '');
                    const nKey = normalizeNick(nick);
                    const hKey = cleanHandle(nick);
                    if (effectivePin) {

                    if (cleanAddr && !knownAddrByNick[nKey]) {
                        knownAddrByNick[nKey] = {
                            realname: realname || '',
                            phone: phone || '',
                            zipcode: '',
                            baseAddress: cleanAddr,
                            detailAddress: '',
                            memo: (memo === cleanAddr || /^\(\d{5}\)/.test(memo)) ? '' : memo,
                            updatedAt: ''
                        };
                    }

                    if (!blk.custMap[nick]) {

                        if (depJsonRaw) {

                                const p = JSON.parse(depJsonRaw);

                        }
                        const shipNum = (shipRaw !== '' && shipRaw !== undefined)
                            ? Number(String(shipRaw).replace(/[^0-9.-]/g, ''))
                            : blk.dShip;

                        blk.custMap[nick] = {
                            sheetTabName: '주문_' + blk.broadcastName,
                            nickname: nick,
                            phoneLast4: effectivePin,
                            broadcastName: blk.broadcastName,
                            isVip: vipRaw === 'O' || vipRaw === 'true',
                            credit: 0,
                            freeShippingThreshold: blk.fThresh,
                            cardFeeRate: blk.cRate,
                            isCard: cardRaw,
                            shipping: isNaN(shipNum) ? blk.dShip : shipNum,
                            depositTotal: 0,
                            deposits: parsedDeps,
                            items: [],
                            address: cleanAddr ? {
                                realname: realname || '',
                                phone: phone || '',
                                zipcode: '',
                                baseAddress: cleanAddr,
                                detailAddress: '',
                                memo: (memo === cleanAddr || /^\(\d{5}\)/.test(memo)) ? '' : memo,
                                updatedAt: ''
                            } : null,
                            trackingNumbers: trkRaw ? [trkRaw] : [],
                            isConfirmed: confRaw === 'O' || confRaw === 'true'
                        };
                    } else {
                        const cObj = blk.custMap[nick];
                        if (!cObj.phoneLast4 && effectivePin) cObj.phoneLast4 = effectivePin;
                        if (!cObj.address && cleanAddr) {
                            cObj.address = {
                                realname: realname || '',
                                phone: phone || '',
                                zipcode: '',
                                baseAddress: cleanAddr,
                                detailAddress: '',
                                memo: (memo === cleanAddr || /^\(\d{5}\)/.test(memo)) ? '' : memo,
                                updatedAt: ''
                            };
                        }
                        if (trkRaw && !cObj.trackingNumbers.includes(trkRaw)) {
                            cObj.trackingNumbers.push(trkRaw);
                        }
                    }

                    if (depVal > 0) {
                        blk.custMap[nick].depositTotal += depVal;
                    }
                    if (prod) {
                        const isWait = waitRaw === 'O' || waitRaw.includes('대기');
                        const wMatch = waitRaw.match(/(\d+)/);
                        blk.custMap[nick].items.push({
                            id: idx + 1,
                            product: prod,
                            qty: qtyVal,
                            price: priceVal,
                            isWaitlist: isWait,
                            waitlistOrder: wMatch ? Number(wMatch[1]) : (isWait ? 1 : 0)
                        });
                    }
                });

                const pinVerifiedMatches = [];
                let pinMismatchFound = false;

                Object.values(blocks).forEach(blk => {
                    let bestCand = null;
                    let bestScore = 0;

                    Object.values(blk.custMap).forEach(cust => {
                        const sc = getNickMatchScore(cust.nickname, cust.address?.realname || '', rawNick);
                        if (sc <= 0) return;

                        const nKey = normalizeNick(cust.nickname);
                        const hKey = cleanHandle(cust.nickname);
                        const directPin = cust.phoneLast4 || (cust.address?.phone ? normalizePin4(cust.address.phone.slice(-4)) : '');
                        const knownSet = knownPinsByNick[nKey] || (hKey ? knownPinsByNick[hKey] : null);
                        const isPinMatched = Boolean(normInPin && ((directPin && directPin === normInPin) || (knownSet && knownSet.has(normInPin))));

                        if (isPinMatched) {
                            const effScore = sc + 10;
                            if (effScore > bestScore) {
                                bestScore = effScore;
                                bestCand = {
                                    ...cust,
                                    _matchScore: effScore,
                                    phoneLast4: normInPin,
                                    address: cust.address || knownAddrByNick[nKey] || null
                                };
                            }
                        } else if (directPin || (knownSet && knownSet.size > 0)) {
                            pinMismatchFound = true;
                        }
                    });

                    if (bestCand) pinVerifiedMatches.push(bestCand);
                });

                if (pinVerifiedMatches.length > 0) {
                    pinVerifiedMatches.sort((a, b) => (b._matchScore || 0) - (a._matchScore || 0));
                    const primaryNick = pinVerifiedMatches[0].nickname;
                    const primaryNorm = normalizeNick(primaryNick);
                    const primaryHandle = cleanHandle(primaryNick);

                    const matchedHistory = sortHistoryByNewestDate(
                        pinVerifiedMatches.filter(item =>
                            normalizeNick(item.nickname) === primaryNorm ||
                            (primaryHandle && cleanHandle(item.nickname) === primaryHandle)
                        )
                    );
                    if (matchedHistory.length > 0) {
                        return {
                            status: 'success',
                            customerData: matchedHistory[0],
                            historyList: matchedHistory
                        };
                    }
                }

                if (pinMismatchFound) {
                    return { status: 'error', errorType: 'WRONG_PIN' };
                }
            } catch (e) {}
            return null;
        };

        const lookupOrderFromFirebase = async (rawNick, cleanPin) => {
            if (!portalFbDb) return null;
            try {
                const normInPin = normalizePin4(cleanPin);
                const fbFetchPromise = Promise.all([
                    portalFbDb.ref('ember_live_data/_portal_orders').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_master_addrs').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_credits').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_confirmed').once('value'),
                    portalFbDb.ref('ember_live_data/_portal_broadcast_addresses').once('value')
                ]);
                // Firebase 응답이 2.2초 이상 지연되면 즉시 통과하여 시트 직통 리더가 처리하도록 안전 타임아웃 적용
                const snaps = await Promise.race([
                    fbFetchPromise,
                    new Promise(r => setTimeout(() => r(null), 2200))
                ]);
                if (!snaps) return null;
                const [ordersSnap, masterAddrSnap, creditsSnap, confSnap, bcastAddrSnap] = snaps;
                const store = ordersSnap.val() || {};
                const masterAddrMap = masterAddrSnap.val() || {};
                const creditsMap = creditsSnap.val() || {};
                const portalConfMap = confSnap.val() || {};
                const bcastAddrMap = bcastAddrSnap.val() || {};

                const findCreditForNick = (targetNick) => {
                    if (!targetNick) return 0;
                    const tNorm = normalizeNick(targetNick);
                    const tClean = cleanHandle(targetNick);
                    for (const k in creditsMap) {
                        const item = creditsMap[k];
                        if (!item) continue;
                        const itemNick = item.nickname || k;
                        if (normalizeNick(itemNick) === tNorm || (tClean && cleanHandle(itemNick) === tClean)) {
                            return Number(item.credit) || 0;
                        }
                    }
                    return 0;
                };

                // 1) 찐고객사전 클라우드 캐시 및 전체 방송 주문서에서 닉네임별 등록된 모든 비밀번호(뒷4자리)와 주소를 사전 수집 (교차 검증용)
                const matchedMasterMap = {};
                const knownPinsByNick = {};
                const addKnownPin = (nickKey, pinVal) => {
                    if (!nickKey || !pinVal) return;
                    if (!knownPinsByNick[nickKey]) knownPinsByNick[nickKey] = new Set();
                    knownPinsByNick[nickKey].add(pinVal);
                };

                const handleCountMap = {};
                Object.values(masterAddrMap).forEach(a => {
                    if (!a || !a.nickname) return;
                    const hk = cleanHandle(a.nickname);
                    if (hk) handleCountMap[hk] = (handleCountMap[hk] || 0) + 1;
                });

                let bestMasterAddr = null;
                let bestAddrScore = 0;

                Object.values(masterAddrMap).forEach(a => {
                    if (!a || !a.nickname) return;
                    const aPin = a.phone && String(a.phone).length >= 4 ? normalizePin4(String(a.phone).slice(-4)) : '';
                    const normNickKey = normalizeNick(a.nickname);
                    const cleanHandleKey = cleanHandle(a.nickname);
                    if (aPin) {
                        const entryObj = { addr: a, pin: aPin };
                        if (normNickKey) {
                            matchedMasterMap[normNickKey] = entryObj;
                            addKnownPin(normNickKey, aPin);
                        }
                        // 핸들을 뗀 이름이 찐고객사전 내에서 유일한 1명일 때만 보조 키로 등록 (동명이인 번호 혼선 방지)
                        if (cleanHandleKey && handleCountMap[cleanHandleKey] === 1) {
                            matchedMasterMap[cleanHandleKey] = entryObj;
                            addKnownPin(cleanHandleKey, aPin);
                        }
                    }

                    const sc = getNickMatchScore(a.nickname, a.realname || '', rawNick);
                    if (sc <= 0) return;

                    // 비밀번호(전화번호 뒷 4자리)가 완벽히 같으면 부분 닉네임(sc >= 1)이어도 100% 본인 인정!
                    if (aPin && normInPin && aPin === normInPin) {
                        if (sc > bestAddrScore) {
                            bestAddrScore = sc;
                            bestMasterAddr = a;
                        }
                    }
                });

                // 모든 방송 주문서를 1차 스캔하여 어느 한 방송에라도 전화번호/비밀번호가 등록된 고객의 PIN과 주소를 공유
                if (store && typeof store === 'object') {
                    Object.values(store).forEach(bData => {
                        if (!bData || !Array.isArray(bData.customers)) return;
                        bData.customers.forEach(cust => {
                            if (!cust || !cust.nickname) return;
                            const cNormKey = normalizeNick(cust.nickname);
                            const cPin = normalizePin4(cust.phoneLast4 || (cust.address?.phone ? cust.address.phone.slice(-4) : ''));
                            if (cPin && cNormKey) {
                                addKnownPin(cNormKey, cPin);
                                if (!matchedMasterMap[cNormKey] && cust.address && cust.address.baseAddress) {
                                    matchedMasterMap[cNormKey] = {
                                        addr: {
                                            nickname: cust.nickname,
                                            realname: cust.address.realname || '',
                                            phone: cust.address.phone || '',
                                            zipcode: cust.address.zipcode || '',
                                            address: cust.address.baseAddress || '',
                                            memo: cust.address.memo || ''
                                        },
                                        pin: cPin
                                    };
                                }
                            }
                        });
                    });
                }

                const pinVerifiedMatches = [];
                const unpinnedExactMatches = [];
                let pinMismatchFound = false;

                if (store && typeof store === 'object') {
                    const broadcasts = Object.values(store);
                    broadcasts.forEach(bData => {
                        if (!bData || !Array.isArray(bData.customers)) return;
                        const cleanBName = String(bData.broadcastName || '').replace(/^주문_/, '').trim();
                        const safeBKey = cleanBName.replace(/[.#$\[\]\/]/g, '_');
                        const bcastSpecificAddrs = (safeBKey && bcastAddrMap[safeBKey]) ? bcastAddrMap[safeBKey] : {};

                        let bestPinCand = null;
                        let bestPinScore = 0;
                        let bestUnpinnedCand = null;

                        bData.customers.forEach(cust => {
                            const sc = getNickMatchScore(cust.nickname, cust.address?.realname || '', rawNick);
                            if (sc <= 0) return;

                            const cNormKey = normalizeNick(cust.nickname);
                            const cHandleKey = cleanHandle(cust.nickname);
                            const safeCustKey = String(cust.nickname || '').replace(/[.#$\[\]\/]/g, '_');
                            const bcastCustomAddr = bcastSpecificAddrs[safeCustKey] || null;
                            const masterEntry = matchedMasterMap[cNormKey] || (handleCountMap[cHandleKey] === 1 ? matchedMasterMap[cHandleKey] : null);
                            const directPin = normalizePin4(
                                (bcastCustomAddr && bcastCustomAddr.phone ? String(bcastCustomAddr.phone).slice(-4) : '') ||
                                cust.phoneLast4 ||
                                (cust.address?.phone ? cust.address.phone.slice(-4) : '') ||
                                (masterEntry ? masterEntry.pin : '')
                            );
                            const knownPinSet = knownPinsByNick[cNormKey] || (handleCountMap[cHandleKey] === 1 ? knownPinsByNick[cHandleKey] : null);
                            const hasAnyKnownPin = Boolean(directPin || (knownPinSet && knownPinSet.size > 0));
                            const isPinMatched = Boolean(normInPin && ((directPin && directPin === normInPin) || (knownPinSet && knownPinSet.has(normInPin))));

                            const fbCredit = findCreditForNick(cust.nickname) || Number(cust.credit) || 0;
                            const isPortalConfirmed = Boolean(cust.isConfirmed || portalConfMap[`${safeBKey}___${safeCustKey}`] || portalConfMap[safeCustKey]);

                            // 이 방송 전용으로 고객이 수정한 배송지가 있으면 무조건 최우선(1순위) 적용!
                            const resolvedAddrObj = bcastCustomAddr ? {
                                realname: bcastCustomAddr.realname || '',
                                phone: fixPhoneStr(bcastCustomAddr.phone || ''),
                                zipcode: bcastCustomAddr.zipcode || '',
                                baseAddress: bcastCustomAddr.baseAddress || bcastCustomAddr.address || '',
                                detailAddress: bcastCustomAddr.detailAddress || '',
                                memo: bcastCustomAddr.memo || '',
                                updatedAt: bcastCustomAddr.updatedAt || ''
                            } : cust.address;

                            if (isPinMatched) {
                                // 1) 비밀번호(뒷 4자리)가 일치하는 경우: 부분 닉네임(깔로, 깔로다, 주세요 등 sc >= 1) 모두 허용!
                                const effectiveScore = sc + 10;
                                if (effectiveScore > bestPinScore) {
                                    bestPinScore = effectiveScore;
                                    const fallbackAddrObj = (resolvedAddrObj && resolvedAddrObj.baseAddress) ? resolvedAddrObj : (masterEntry ? {
                                        realname: masterEntry.addr.realname || '',
                                        phone: fixPhoneStr(masterEntry.addr.phone || ''),
                                        zipcode: masterEntry.addr.zipcode || '',
                                        baseAddress: masterEntry.addr.address || '',
                                        detailAddress: '',
                                        memo: masterEntry.addr.memo || '',
                                        updatedAt: ''
                                    } : (bestMasterAddr && cleanHandle(bestMasterAddr.nickname) === cHandleKey ? {
                                        realname: bestMasterAddr.realname || '',
                                        phone: fixPhoneStr(bestMasterAddr.phone || ''),
                                        zipcode: bestMasterAddr.zipcode || '',
                                        baseAddress: bestMasterAddr.address || '',
                                        detailAddress: '',
                                        memo: bestMasterAddr.memo || '',
                                        updatedAt: ''
                                    } : null));

                                    bestPinCand = {
                                        ...cust,
                                        _matchScore: effectiveScore,
                                        credit: fbCredit,
                                        phoneLast4: normInPin,
                                        address: fallbackAddrObj,
                                        _hasBcastCustomAddr: Boolean(bcastCustomAddr),
                                        isConfirmed: isPortalConfirmed
                                    };
                                }
                            } else if (!hasAnyKnownPin && sc === 3) {
                                // 2) 모든 방송과 찐고객사전 어디에도 아직 전화번호(비밀번호)가 전혀 없는 신규 첫구매 고객 주문서:
                                // 남의 미입력 주문서가 끌려오지 않도록 부분 포함(sc=2)은 제외하고, 핸들/영어를 뺀 한글 이름이 100% 일치(sc=3)할 때만 후보 등록
                                bestUnpinnedCand = {
                                    ...cust,
                                    _matchScore: 3,
                                    credit: fbCredit,
                                    phoneLast4: normInPin,
                                    address: resolvedAddrObj || null,
                                    _hasBcastCustomAddr: Boolean(bcastCustomAddr),
                                    isConfirmed: isPortalConfirmed
                                };
                            } else if (hasAnyKnownPin && normInPin && !isPinMatched) {
                                pinMismatchFound = true;
                            }
                        });

                        if (bestPinCand) {
                            pinVerifiedMatches.push(bestPinCand);
                        } else if (bestUnpinnedCand) {
                            unpinnedExactMatches.push(bestUnpinnedCand);
                        }
                    });
                }

                // 비밀번호로 검증된 주문서가 하나라도 있으면, 해당 고객의 고유 닉네임(lockedNick)과 일치하는 방송만 표시 (다른 사람의 미입력 주문서 혼입 완벽 차단!)
                let matchedHistory = [];
                if (pinVerifiedMatches.length > 0) {
                    pinVerifiedMatches.sort((a, b) => (b._matchScore || 0) - (a._matchScore || 0));
                    const primaryNick = pinVerifiedMatches[0].nickname;
                    const primaryNorm = normalizeNick(primaryNick);
                    const primaryHandle = cleanHandle(primaryNick);

                    matchedHistory = pinVerifiedMatches.filter(item =>
                        normalizeNick(item.nickname) === primaryNorm ||
                        (primaryHandle && cleanHandle(item.nickname) === primaryHandle)
                    );
                } else if (!bestMasterAddr && unpinnedExactMatches.length > 0 && !pinMismatchFound) {
                    const primaryNick = unpinnedExactMatches[0].nickname;
                    const primaryNorm = normalizeNick(primaryNick);
                    matchedHistory = unpinnedExactMatches.filter(item => normalizeNick(item.nickname) === primaryNorm);
                }

                if (matchedHistory.length > 0) {
                    const sorted = sortHistoryByNewestDate(matchedHistory);
                    return {
                        status: 'success',
                        customerData: sorted[0],
                        historyList: sorted
                    };
                }

                // 주문 내역은 없지만 찐고객사전에 등록된 고객이고 비밀번호(뒷 4자리)가 정확히 일치하면 어떤 부분 닉네임을 쳤든 빈 주문서로 접속 허용
                if (bestMasterAddr && bestAddrScore >= 1) {
                    const aPin = bestMasterAddr.phone && String(bestMasterAddr.phone).length >= 4 ? normalizePin4(String(bestMasterAddr.phone).slice(-4)) : '';
                    if (aPin && aPin === normInPin) {
                        const emptyCard = {
                            sheetTabName: '메인주문',
                            nickname: bestMasterAddr.nickname,
                            phoneLast4: normInPin,
                            broadcastName: '최근 주문 내역 없음',
                            isVip: false,
                            credit: findCreditForNick(bestMasterAddr.nickname),
                            freeShippingThreshold: 70000,
                            cardFeeRate: 10,
                            isCard: '',
                            shipping: 0,
                            depositTotal: 0,
                            deposits: [],
                            items: [],
                            address: {
                                realname: bestMasterAddr.realname || '',
                                phone: fixPhoneStr(bestMasterAddr.phone || ''),
                                zipcode: bestMasterAddr.zipcode || '',
                                baseAddress: bestMasterAddr.address || '',
                                detailAddress: '',
                                memo: bestMasterAddr.memo || '',
                                updatedAt: ''
                            },
                            trackingNumbers: [],
                            isConfirmed: false
                        };
                        return {
                            status: 'success',
                            customerData: emptyCard,
                            historyList: [emptyCard]
                        };
                    }
                }

                if (pinMismatchFound) {
                    return { status: 'error', errorType: 'WRONG_PIN' };
                }
            } catch (e) {}
            return null;
        };

        // 사업자 정보 설정 (주소나 이메일/연락처를 필요 시 수정하세요)
        const BUSINESS_INFO = {
            companyName: "엠버언니",
            ceoName: "김선정",
            privacyOfficer: "김선정",
            bizNumber: "259-20-02160",
            mailOrderNumber: "2026-서울동대문-1240",
            csCenter: "카카오톡 채널 '엠버언니'",
            address: "서울특별시 동대문구"
        };

        // 대문 고정 화보 이미지 (모바일 데이터 절약 및 초고속 로딩을 위해 w=720, q=75 최적화)
        const FIXED_AUTUMN_WINTER_HERO = 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=720&q=75';

        const normalizeNick = (str) => {
            return String(str || "").replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, "").toLowerCase();
        };

        const cleanHandle = (str) => {
            if (!str) return "";
            let s = String(str).trim();
            // 뒤에 붙은 유튜브 핸들 꼬리표(-SD2 등 -영문숫자 2~8자) 제거
            s = s.replace(/-[a-zA-Z0-9]{2,8}$/, "");
            return s.replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, "").toLowerCase();
        };

        const extractKorean = (str) => {
            if (!str) return "";
            return String(str).replace(/[^가-힣]/g, "");
        };

        // 한글 모음(ㅐ/ㅔ, ㅒ/ㅖ) 및 초성 거센소리/된소리(ㄱ/ㅋ/ㄲ, ㄷ/ㅌ/ㄸ, ㅂ/ㅍ/ㅃ, ㅈ/ㅊ/ㅉ) 혼동 오타 보정용 정규화 함수 (예: 코구마 === 코쿠마, 태로맘 === 테로맘)
        const normalizeKoreanVowel = (str) => {
            const s = normalizeNick(str);
            let out = "";
            for (let i = 0; i < s.length; i++) {
                const code = s.charCodeAt(i);
                if (code >= 0xAC00 && code <= 0xD7A3) {
                    const offset = code - 0xAC00;
                    let cho = Math.floor(offset / 588);
                    let jung = Math.floor((offset % 588) / 28);
                    const jong = offset % 28;
                    // 초성 거센소리/된소리 통일: ㄱ(0)/ㄲ(1)/ㅋ(15) -> 0, ㄷ(3)/ㄸ(4)/ㅌ(16) -> 3, ㅂ(7)/ㅃ(8)/ㅍ(17) -> 7, ㅈ(12)/ㅉ(13)/ㅊ(14) -> 12
                    if (cho === 1 || cho === 15) cho = 0;
                    else if (cho === 4 || cho === 16) cho = 3;
                    else if (cho === 8 || cho === 17) cho = 7;
                    else if (cho === 13 || cho === 14) cho = 12;
                    // 모음 ㅐ/ㅔ, ㅒ/ㅖ, ㅜ/ㅡ 통일
                    if (jung === 1) jung = 5; // ㅐ -> ㅔ 통일
                    if (jung === 3) jung = 7; // ㅒ -> ㅖ 통일
                    out += String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
                } else {
                    out += s[i];
                }
            }
            return out;
        };

        // 고객이 입력한 닉네임(또는 한글 일부/실명)과 DB의 닉네임/실명 간의 일치 점수를 계산하는 스마트 매칭 함수
        // 사장님 주문서에는 핸들/영어가 다 포함되어 있고(예: 깔로다주세요-SD2),
        // 고객은 영어/핸들을 빼고 '깔로', '깔로다', '깔로다주', '주세요' 등 일부만 입력하므로 DB닉네임이 고객입력값을 포함하는 경우만 인정합니다!
        const getNickMatchScore = (dbNick, dbRealname, userInput) => {
            if (!userInput || !dbNick) return 0;
            const nDb = normalizeNick(dbNick);
            const nIn = normalizeNick(userInput);
            if (!nIn || !nDb) return 0;

            // 1순위(3점): 대소문자/공백 무시 완전 일치 또는 핸들 꼬리표(-SD2 등) 제거 후 완전 일치
            if (nDb === nIn) return 3;
            const cDb = cleanHandle(dbNick);
            const cIn = cleanHandle(userInput);
            if (cDb && cIn && cDb === cIn) return 3;

            // 2순위: 주문서 아이디에서 영어/숫자/기호를 뺀 순수 한글 비교
            // 예: DB '깔로다주세요-SD2' -> 순수 한글 '깔로다주세요'
            // 고객 입력: '깔로다주세요'(3점), '깔로', '깔로다', '깔로다주', '주세요'(2점)
            // 주의: 반드시 DB의 한글 닉네임(kDb)이 고객 입력 한글(kIn)을 포함(kDb.includes(kIn))해야 하며, 반대로 1글자짜리 kDb('영')가 '하이영'에 포함되는 역방향 매칭은 절대 금지!
            const kDb = extractKorean(cDb || nDb);
            const kIn = extractKorean(cIn || nIn);
            if (kDb && kIn) {
                if (kDb.length >= 2 && kDb === kIn) return 3;
                if (kIn.length >= 2 && kDb.length >= 2 && kDb.includes(kIn)) return 2;
                const vDb = normalizeKoreanVowel(kDb);
                const vIn = normalizeKoreanVowel(kIn);
                if (vDb.length >= 2 && vDb === vIn) return 2;
                if (vIn.length >= 2 && vDb.length >= 2 && vDb.includes(vIn)) return 2;
            }

            // 영문/숫자 포함 부분 일치 (반드시 DB 닉네임이 고객 입력값(2자 이상)을 포함할 때만 인정)
            if (nIn.length >= 2 && nDb.length >= 2 && nDb.includes(nIn)) return 2;
            if (cIn.length >= 2 && cDb.length >= 2 && cDb.includes(cIn)) return 2;

            // 3순위(1점): 닉네임 대신 수령인 실명(본명) 전체를 정확히 입력한 경우만 인정
            const nReal = normalizeNick(dbRealname);
            if (nReal && nIn.length >= 2 && nReal === nIn) return 1;

            return 0;
        };

        const isFlexibleNickMatch = (rowNick, inputNick, rowRealname = "") => {
            return getNickMatchScore(rowNick, rowRealname, inputNick) > 0;

        const fixPhoneStr = (p) => {
            if (!p) return "";
            let c = String(p).replace(/[^0-9]/g, "");
            if (c.length === 10 && !c.startsWith("0")) c = "0" + c;
            return c;
        };

        const normalizePin4 = (val) => {
            if (val === undefined || val === null) return "";
            const digits = String(val).replace(/[^0-9]/g, "");
            if (!digits) return "";
            return digits.length < 4 ? digits.padStart(4, "0") : digits.slice(-4);
        };

        const maskName = (name) => {
            if (!name) return "";
            const s = String(name).trim();
            if (s.length <= 1) return s;
            if (s.length === 2) return s[0] + "*";
            return s[0] + "*".repeat(s.length - 2) + s[s.length - 1];
        };

        const maskPhone = (phone) => {
            if (!phone) return "";
            const clean = String(phone).replace(/[^0-9]/g, "");
            if (clean.length < 7) return phone;
            return `${clean.slice(0, 3)}-****-${clean.slice(-4)}`;
        };

        const maskAddress = (baseAddr, detailAddr, zipcode) => {
            const cleanZip = String(zipcode || "").replace(/[^0-9]/g, "");
            const cleanBase = String(baseAddr || "").replace(/^\(\d{5}\)\s*/, "").trim();
            const d = String(detailAddr || "").trim();
            const full = `${cleanBase} ${d}`.trim();
            if (!full) return "";

            const zipPart = cleanZip ? `(${cleanZip.slice(0, 3)}**) ` : "";

            // 1) 괄호 안 아파트/건물명 마스킹: (연산동, 연산엘지아파트) -> (연산동, *****)
            let masked = full.replace(/\(([^)]+)\)/g, (match, inner) => {
                if (inner.includes(",")) {
                    const parts = inner.split(",");
                    return `(${parts[0].trim()}, *****)`;
                }
                return inner.length > 2 ? `(${inner.slice(0, 2)}***)` : `(${inner})`;
            });

            // 2) 동·호·층·번지 숫자 확실히 마스킹: 115동1704호 -> ***동****호
            masked = masked.replace(/(\d+)\s*(동|호|층|번지|길|로\s*\d*)/g, (m, num, unit) => {
                if (unit.startsWith("길") || unit.startsWith("로")) return m;
                return `${"*".repeat(Math.max(2, num.length))}${unit}`;
            });

            // 3) 도로명/지번 본번·부번 및 남은 상세 숫자 마스킹 (예: 고분로 200 -> 고분로 ***, 101-1204 -> ***-****)
            masked = masked.replace(/\d+-\d+/g, "***-****");
            masked = masked.replace(/([가-힣]+(?:로|길|동|읍|면|리))\s+(\d+)(-\d+)?/g, "$1 ***");

            // 4) 그 외 뒤에 남은 2자리 이상 숫자도 모두 마스킹
            masked = masked.replace(/\d{2,}/g, (n) => "*".repeat(n.length));

            return `${zipPart}${masked}`;
        };

        const formatKstDateString = (val) => {
            if (!val) return "";
            const s = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(s)) return s.slice(0, 16);
            const dt = new Date(s);
            if (!isNaN(dt.getTime()) && (s.includes("T") || s.includes("GMT") || s.endsWith("Z"))) {
                const kst = new Date(dt.getTime() + 9 * 60 * 60 * 1000);
                const yyyy = kst.getUTCFullYear();
                const mm = String(kst.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(kst.getUTCDate()).padStart(2, '0');
                const hh = String(kst.getUTCHours()).padStart(2, '0');
                const min = String(kst.getUTCMinutes()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
            }
            return s;
        };

        const getKstNowString = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');

            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;

        const extractBroadcastDateScore = (titleOrTab) => {
            const s = String(titleOrTab || '').replace(/^주문_/, '').trim();
            if (!s) return 0;
            // 1) YYYY-MM-DD 또는 YY-MM-DD 형식
            const fullMatch = s.match(/(?:20)?(\d{2})[./\-\s년]+(\d{1,2})[./\-\s월]+(\d{1,2})/);
            if (fullMatch) {
                const yy = parseInt(fullMatch[1], 10);
                const mm = parseInt(fullMatch[2], 10);
                const dd = parseInt(fullMatch[3], 10);
                if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
                    return (2000 + yy) * 10000 + mm * 100 + dd;
                }
            }
            // 2) MM/DD, MM.DD, MM-DD, MM DD, MM월 DD일 형식 (예: "10/20 악세사리", "10 18 여성복", "10 16 여성복")
            const mdMatch = s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])[./\-\s월]+([0-2]?\d|3[01])(?:일|\b|\s|[^0-9])/);
            if (mdMatch) {
                const mm = parseInt(mdMatch[1], 10);
                const dd = parseInt(mdMatch[2], 10);
                return 2026 * 10000 + mm * 100 + dd;
            }
            return 0;
        };

        const sortHistoryByNewestDate = (list) => {
            if (!Array.isArray(list)) return [];
            return [...list].sort((a, b) => {
                const scoreA = extractBroadcastDateScore(a?.broadcastName || a?.sheetTabName || '');
                const scoreB = extractBroadcastDateScore(b?.broadcastName || b?.sheetTabName || '');
                if (scoreA !== scoreB) return scoreB - scoreA; // 늦은(최신) 날짜가 무조건 맨 앞으로!
                return 0;

        const filterVerifiedHistoryList = (rawList, rawNickInput, cleanPinInput, lockedFullNick = "") => {

            const step1 = rawList.filter(item => {

                const itemPin = normalizePin4(
                    item.phoneLast4 ||
                    (item.address && item.address.phone ? String(item.address.phone).slice(-4) : "")

                // 다른 비밀번호가 등록된 주문서는 어떤 경우에도 절대 표시 불가!
                if (itemPin && normInPin && itemPin !== normInPin) {

                }
                const sc = getNickMatchScore(item.nickname, item.address?.realname || "", rawNickInput);
                const lockedSc = lockedFullNick ? getNickMatchScore(item.nickname, "", lockedFullNick) : 0;
                if (sc <= 0 && lockedSc <= 0) {

                // 비밀번호가 일치하는 주문서는 부분 닉네임(sc >= 1)도 허용하되, 비밀번호가 아예 없는 미입력 주문서는 정확히 이름이 일치(sc === 3)할 때만 허용
                if (!itemPin && sc < 3 && lockedSc < 3) {
                    return false;
                }
                return true;
            });

            if (step1.length === 0) return [];

            const sortedByConfidence = [...step1].sort((a, b) => {
                const aPin = normalizePin4(a.phoneLast4 || (a.address?.phone ? String(a.address.phone).slice(-4) : ""));
                const bPin = normalizePin4(b.phoneLast4 || (b.address?.phone ? String(b.address.phone).slice(-4) : ""));
                const aHasPin = (aPin && aPin === normInPin) ? 1 : 0;
                const bHasPin = (bPin && bPin === normInPin) ? 1 : 0;
                if (aHasPin !== bHasPin) return bHasPin - aHasPin;
                const scA = getNickMatchScore(a.nickname, a.address?.realname || "", rawNickInput);
                const scB = getNickMatchScore(b.nickname, b.address?.realname || "", rawNickInput);
                return scB - scA;
            });

            const targetNick = lockedFullNick || sortedByConfidence[0].nickname;
            const targetNorm = normalizeNick(targetNick);
            const targetHandle = cleanHandle(targetNick);

            return sortHistoryByNewestDate(step1.filter(item =>
                normalizeNick(item.nickname) === targetNorm ||
                (targetHandle && cleanHandle(item.nickname) === targetHandle)
            ));
        };
