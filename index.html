                        if (res && res.success) showToast(`✅ [${canonicalTab}] 시트 저장 및 사장님 주문서 실시간 반영 완료!`);
                        else showToast('🚨 시트 저장 실패: ' + (res?.message || ''));
                    }
                } finally {
                    setIsSaving(false);
                }
            }, [isSaving, activeMainTab, csGroups, selectedTab, broadcastName, freeShipThreshold, defaultShipping, cardFeeRate, customerGroups, customerCredits, getGroupSummary, showToast]);

            useEffect(() => {
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'ㄴ')) {
                        e.preventDefault();
                        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                        setTimeout(() => { handleSaveAll(); }, 30);
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [handleSaveAll]);

            const updateCustomerGroup = useCallback((nick, updater) => {
                setCustomerGroups(prev => prev.map(g => g.nick === nick ? updater(g) : g));
            }, []);

            const handleSingleAddOrder = (e) => {
                e.preventDefault();
                const cleanN = newNick.trim();
                const cleanP = newProd.trim();
                if (!cleanN || !cleanP) return openModal('닉네임과 상품명을 모두 입력해 주세요.');
                const q = Number(newQty) || 1;
                const unitP = Number(String(newPrice).replace(/,/g, '')) || 0;
                const totalP = unitP * q;

                const matchedDictAddr = findMasterAddressMatch(cleanN);

                setCustomerGroups(prev => {
                    const idx = prev.findIndex(g => normalizeString(g.nick) === normalizeString(cleanN));
                    if (idx !== -1) {
                        const copy = [...prev];
                        copy[idx] = {
                            ...copy[idx],
                            realname: copy[idx].realname || matchedDictAddr?.realname || '',
                            phone: copy[idx].phone || matchedDictAddr?.phone || '',
                            address: copy[idx].address || matchedDictAddr?.address || '',
                            memo: copy[idx].memo || matchedDictAddr?.memo || '',
                            items: [...copy[idx].items, { id: `item_${Date.now()}`, product: cleanP, qty: q, price: totalP, isWaitlist: false, waitlistOrder: 0 }]
                        };
                        return copy;
                    }
                    const cleanPh = matchedDictAddr ? fixPhoneNumber(matchedDictAddr.phone) : '';
                    return [{
                        nick: cleanN,
                        realname: matchedDictAddr?.realname || '',
                        phone: cleanPh,
                        address: matchedDictAddr?.address || '',
                        memo: matchedDictAddr?.memo || '',
                        shipping: defaultShipping,
                        deposit: 0,
                        cardMode: 'none',
                        isVip: false,
                        isNoShow: false,
                        isConfirmed: false,
                        pin: cleanPh.length >= 4 ? cleanPh.slice(-4) : '',
                        trackingNumber: '',
                        deposits: [],
                        showDeposits: false,
                        items: [{ id: `item_${Date.now()}`, product: cleanP, qty: q, price: totalP, isWaitlist: false, waitlistOrder: 0 }]
                    }, ...prev];
                });

                setNewProd('');
                setNewQty(1);
                setNewPrice('');
                setShowNewNickSuggest(false);
                if (matchedDictAddr) {
                    showToast(`'${cleanN}' 님 주문 추가 + 📗찐고객사전 주소(${matchedDictAddr.realname})가 자동 연동되었습니다! (Ctrl+S로 저장하세요)`);
                } else {
                    showToast(`'${cleanN}' 님 주문이 추가되었습니다. (Ctrl+S로 시트에 저장하세요)`);
                }
            };

            const newNickSuggestions = useMemo(() => {
                const kw = normalizeString(newNick);
                if (!kw) return [];
                return masterAddresses.filter(a => {
                    const nNorm = normalizeString(a.nickname);
                    const rNorm = normalizeString(a.realname);
                    return nNorm.includes(kw) || (rNorm && rNorm.includes(kw));
                }).slice(0, 5);
            }, [newNick, masterAddresses]);

            const handleConfirmCopyToCs = (group, bName, taggedItems, csMemoText) => {
                const newCsEntry = {
                    id: `cs_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                    createdAt: new Date().toLocaleString('ko-KR'),
                    sourceBroadcast: (bName || selectedTab || '').replace(/^주문_/, ''),
                    csStatus: '접수',
                    nick: group.nick,
                    realname: group.realname || '',
                    phone: group.phone || '',
                    address: group.address || '',
                    origTracking: group.trackingNumber || '',
                    csTracking: '',
                    csMemo: csMemoText || '',
                    shipping: group.shipping || 0,
                    deposit: group.deposit || 0,
                    cardMode: group.cardMode || 'none',
                    items: taggedItems
                };

                setCsGroups(prev => {
                    const next = [newCsEntry, ...prev];
                    fetchGas(DEFAULT_GAS_URL, {
                        action: 'save_cs_orders',
                        masterId: DEFAULT_MASTER_SHEET_ID,
                        items: next
                    }).catch(() => {});
                    return next;
                });

                setActiveMainTab('cs');
                showToast(`🔄 '${group.nick}' 님의 주문서가 [교환/반품 CS 관리] 탭으로 복사 및 자동 저장되었습니다!`);
            };

            const handleTrackingExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });

                        const parsedList = [];
                        const duplicateWarnings = [];

                        rows.forEach(r => {
                            let nick = '', realname = '', phone = '', trk = '';
                            Object.keys(r).forEach(k => {
                                const ck = k.replace(/\s+/g, '');
                                const val = String(r[k] || '').trim();
                                if (!val) return;
                                if (ck.includes('닉네임') || ck.includes('주문자')) nick = val.replace(/^\[.*?\]\s*/, '').trim();
                                else if (ck.includes('수하인') || ck.includes('수령인') || ck.includes('받는') || ck === '이름' || ck === '성명' || ck === '고객명') realname = val.replace(/^\[.*?\]\s*/, '').trim();
                                else if (ck.includes('전화') || ck.includes('연락처') || ck.includes('핸드폰') || ck.includes('휴대폰')) phone = fixPhoneNumber(val);
                                else if (ck.includes('운송장') || ck.includes('송장') || ck.includes('등기')) trk = val.replace(/[^0-9,-]/g, '');
                            });

                            if (trk && (nick || realname || phone)) {
                                const matches = customerGroups.filter(g => {
                                    if (nick && normalizeString(g.nick) === normalizeString(nick)) return true;
                                    if (phone && g.phone && g.phone === phone) return true;
                                    if (realname && normalizeString(g.realname) === normalizeString(realname)) return true;
                                    return false;
                                });

                                if (matches.length > 1) {
                                    duplicateWarnings.push(`• 수하인 '${realname || nick}' (${trk}) ➔ 동명이인: [${matches.map(m => m.nick).join(', ')}]`);
                                } else if (matches.length === 1) {
                                    parsedList.push({ nickname: matches[0].nick, realname: realname || nick, phone, trackingNumber: trk });
                                } else {
                                    parsedList.push({ nickname: nick, realname: realname || nick, phone, trackingNumber: trk });
                                }
                            }
                        });

                        if (parsedList.length > 0) {
                            setCustomerGroups(prev => prev.map(g => {
                                const found = parsedList.find(p => p.nickname && normalizeString(p.nickname) === normalizeString(g.nick));
                                return found ? { ...g, trackingNumber: found.trackingNumber } : g;
                            }));

                            await fetchGas(DEFAULT_GAS_URL, {
                                action: 'save_tracking_numbers',
                                masterId: DEFAULT_MASTER_SHEET_ID,
                                broadcastName: broadcastName || selectedTab.replace(/^주문_/, ''),
                                data: parsedList
                            });

                            let msg = `총 ${parsedList.length}건의 롯데택배 송장번호가 [${selectedTab.replace(/^주문_/, '')}] 시트에 등록되었습니다!`;
                            if (duplicateWarnings.length > 0) {
                                msg += `\n\n⚠️ [동명이인 보류 ${duplicateWarnings.length}건]\n` + duplicateWarnings.join('\n');
                            }
                            openModal(msg);
                        } else {
                            openModal('엑셀에서 유효한 [수령인명/닉네임 + 운송장번호] 열을 찾지 못했습니다.');
                        }
                    } catch (err) {
                        openModal('엑셀 파일 처리 중 오류가 발생했습니다.');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            const handleExportProductsExcel = () => {
                const summary = {};
                const paidSummary = {};
                customerGroups.forEach(g => {
                    if (g.isNoShow) return;
                    const sum = getGroupSummary(g);
                    const isPaidOrCard = sum.isPaid || g.cardMode === 'requested' || g.cardMode === 'completed';
                    sum.activeItems.forEach(it => {
                        const p = it.product || '(상품명없음)';
                        const q = Number(it.qty) || 1;
                        const uPrice = q > 0 ? Math.round((Number(it.price) || 0) / q) : 0;
                        if (!summary[p]) summary[p] = { total: 0, price: uPrice };
                        if (!paidSummary[p]) paidSummary[p] = 0;
                        summary[p].total += q;
                        if (isPaidOrCard) paidSummary[p] += q;
                    });
                });

                const rows = Object.keys(summary).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true })).map(p => ({
                    '상품명': p,
                    '제품단가': summary[p].price,
                    '입금/카드 수량': paidSummary[p] || 0,
                    '미입금 수량': summary[p].total - (paidSummary[p] || 0),
                    '총 수량': summary[p].total
                }));
                downloadExcel(rows, `${broadcastName || '방송'}_발주용품목집계`);
            };

            const handleExportCustomersExcel = () => {
                const excelRows = [];
                customerGroups.forEach(g => {
                    const sum = getGroupSummary(g);
                    if (sum.activeItems.length === 0 && sum.waitItems.length === 0) return;
                    let statusStr = '완납';
                    if (g.isNoShow) statusStr = '노쇼';
                    else if (g.cardMode === 'completed') statusStr = `카드완료(${sum.finalBal.toLocaleString()})`;
                    else if (g.cardMode === 'requested') statusStr = `카드요청(${sum.finalBal.toLocaleString()})`;
                    else if (sum.baseBal > 0) statusStr = `미입금(미수 ${sum.baseBal.toLocaleString()})`;
                    else if (sum.baseBal < 0) statusStr = `과납(${Math.abs(sum.baseBal).toLocaleString()})`;

                    const makeRow = (prodStr) => ({
                        '방송명': broadcastName,
                        '결제상태': statusStr,
                        '닉네임': g.isVip ? `[VIP] ${g.nick}` : g.nick,
                        '주문상품(수량)': prodStr,
                        '수령인명': g.realname || '',
                        '연락처': g.phone || '',
                        '주소': g.address || '',
                        '배송메모': g.memo || '',
                        '송장번호': g.trackingNumber || ''
                    });

                    excelRows.push(makeRow(`[ ${g.nick} ]`));
                    sum.activeItems.forEach(it => {
                        excelRows.push(makeRow(`${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                    sum.waitItems.forEach(it => {
                        const rankBadge = it.waitlistOrder ? `[대기${it.waitlistOrder}번] ` : '[대기] ';
                        excelRows.push(makeRow(`${rankBadge}${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                });
                downloadExcel(excelRows, `${broadcastName || '방송'}_배송용고객리스트`);
            };

            const stats = useMemo(() => {
                let totalCustomers = 0, totalQty = 0, paidCount = 0, unpaidCount = 0, cardReqCount = 0, cardCompCount = 0, noAddrCount = 0, waitCount = 0;
                customerGroups.forEach(g => {
                    const sum = getGroupSummary(g);
                    if (sum.waitItems.length > 0) waitCount++;
                    if (sum.activeItems.length === 0) return;
                    totalCustomers++;
                    totalQty += sum.activeItems.reduce((acc, it) => acc + (Number(it.qty) || 1), 0);
                    if (!g.address) noAddrCount++;
                    if (g.cardMode === 'completed') cardCompCount++;
                    else if (g.cardMode === 'requested') cardReqCount++;
                    else if (sum.isPaid) paidCount++;
                    else unpaidCount++;
                });
                return { totalCustomers, totalQty, paidCount, unpaidCount, cardReqCount, cardCompCount, noAddrCount, waitCount };
            }, [customerGroups, getGroupSummary]);

            const filteredGroups = useMemo(() => {
                const kw = normalizeString(localSearchTerm);
                return customerGroups.filter(g => {
                    const sum = getGroupSummary(g);
                    if (statusFilter === 'paid' && !(sum.isPaid && g.cardMode === 'none')) return false;
                    if (statusFilter === 'unpaid' && !(sum.baseBal > 0 && g.cardMode === 'none' && sum.activeItems.length > 0)) return false;
                    if (statusFilter === 'card_req' && g.cardMode !== 'requested') return false;
                    if (statusFilter === 'card_comp' && g.cardMode !== 'completed') return false;
                    if (statusFilter === 'no_addr' && g.address) return false;
                    if (statusFilter === 'waitlist' && sum.waitItems.length === 0) return false;

                    if (!kw) return true;
                    const hay = normalizeString([
                        g.nick, g.realname, g.phone, g.address, g.trackingNumber,
                        (g.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [customerGroups, statusFilter, localSearchTerm, getGroupSummary]);

            const filteredCsGroups = useMemo(() => {
                const kw = normalizeString(csSearchTerm);
                return csGroups.filter(c => {
                    if (csStatusFilter === 'active' && c.csStatus === '처리완료') return false;
                    if (csStatusFilter === 'completed' && c.csStatus !== '처리완료') return false;
                    if (!kw) return true;
                    const hay = normalizeString([
                        c.sourceBroadcast, c.nick, c.realname, c.phone, c.address, c.origTracking, c.csTracking, c.csMemo,
                        (c.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [csGroups, csSearchTerm, csStatusFilter]);

            return (
                <div className="h-screen flex flex-col bg-slate-100 overflow-hidden">
                    {toastMsg && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-extrabold shadow-lg">
                            {toastMsg}
                        </div>
                    )}

                    <CustomModal modal={modal} onClose={() => setModal(p => ({ ...p, isOpen: false }))} />
                    <AddressEditModal
                        isOpen={Boolean(addrEditTarget)}
                        group={addrEditTarget}
                        masterAddresses={masterAddresses}
                        onClose={() => setAddrEditTarget(null)}
                        onSave={async (newAddr) => {
                            const targetNick = addrEditTarget.nick;
                            const cleanBName = (broadcastName || selectedTab).replace(/^주문_/, '').trim();
                            const canonicalTab = '주문_' + cleanBName;
                            setCustomerGroups(prev => {
                                const nextGroups = prev.map(cur => cur.nick === targetNick ? {
                                    ...cur,
                                    realname: newAddr.realname,
                                    phone: newAddr.phone,
                                    address: newAddr.address,
                                    memo: newAddr.memo,
                                    pin: newAddr.phone.length >= 4 ? newAddr.phone.slice(-4) : cur.pin
                                } : cur);
                                syncBroadcastGroupsToFirebase(cleanBName, nextGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                                return nextGroups;
                            });
                            if (staffFbDb) {
                                const safeNickKey = String(targetNick || '').replace(/[.#$\[\]\/]/g, '_');
                                const safeBKey = cleanBName.replace(/[.#$\[\]\/]/g, '_');
                                const addrPayload = {
                                    nickname: targetNick,
                                    realname: newAddr.realname,
                                    phone: newAddr.phone,
                                    address: newAddr.address,
                                    memo: newAddr.memo,
                                    broadcastName: cleanBName,
                                    updatedAt: new Date().toISOString()
                                };
                                if (safeBKey) {
                                    staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set(addrPayload).catch(() => {});
                                }
                                staffFbDb.ref(`ember_live_data/_portal_addresses/${safeNickKey}`).set(addrPayload).catch(() => {});
                            }
                            setAddrEditTarget(null);
                            await fetchGas(DEFAULT_GAS_URL, {
                                action: 'save_master_address',
                                masterId: DEFAULT_MASTER_SHEET_ID,
                                data: {
                                    nickname: targetNick,
                                    realname: newAddr.realname,
                                    phone: newAddr.phone,
                                    address: newAddr.address,
                                    memo: newAddr.memo,
                                    sheetTabName: canonicalTab,
                                    broadcastName: cleanBName
                                }
                            });
                            showToast(`✅ '${targetNick}' 배송지가 [${canonicalTab}] 시트 및 사장님 주문서에 즉시 반영되었습니다!`);
                        }}
                    />
                    <CsCopySelectModal
                        isOpen={Boolean(csCopyTarget)}
                        group={csCopyTarget?.group}
                        broadcastName={csCopyTarget?.broadcastName}
                        onClose={() => setCsCopyTarget(null)}
                        onConfirmCopy={handleConfirmCopyToCs}
                    />

                    {cleanupModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={() => setCleanupModalOpen(false)}>
                            <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-md mx-4 flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center pb-2.5 mb-2.5 border-b">
                                    <h3 className="text-sm font-extrabold text-slate-800">🧹 오래된 방송 시트 정리 (용량 확보)</h3>
                                    <button onClick={() => setCleanupModalOpen(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" weight="bold" size={18}/></button>
                                </div>
                                <p className="text-xs text-slate-500 mb-3">
                                    정산 및 배송이 완전히 끝난 옛날 방송 시트를 선택해 정리할 수 있습니다. (최근 5개 방송은 보호됩니다)
                                </p>
                                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 mb-4">
                                    {orderTabs.slice(5).map(t => (
                                        <label key={t} className="flex items-center justify-between p-2 rounded border bg-slate-50 cursor-pointer text-xs font-bold">
                                            <span>{t.replace(/^주문_/, '')}</span>
                                            <input
                                                type="checkbox"
                                                checked={Boolean(selectedOldTabs[t])}
                                                onChange={e => setSelectedOldTabs(p => ({ ...p, [t]: e.target.checked }))}
                                                className="w-4 h-4 accent-red-600"
                                            />
                                        </label>
                                    ))}
                                    {orderTabs.length <= 5 && (
                                        <div className="text-center py-6 text-xs text-slate-400">정리할 오래된 시트가 없습니다.</div>
                                    )}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setCleanupModalOpen(false)} className="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">닫기</button>
                                    <button
                                        onClick={async () => {
                                            const toDel = Object.keys(selectedOldTabs).filter(k => selectedOldTabs[k]);
                                            if (toDel.length === 0) return;
                                            const res = await fetchGas(DEFAULT_GAS_URL, {
                                                action: 'delete_old_order_tabs',
                                                masterId: DEFAULT_MASTER_SHEET_ID,
                                                tabNames: toDel
                                            });
                                            if (res && res.success) {
                                                showToast(`🧹 ${res.deletedCount}개의 오래된 시트를 정리했습니다.`);
                                                setCleanupModalOpen(false);
                                                setSelectedOldTabs({});
                                                loadInitialTabs();
                                            }
                                        }}
                                        className="flex-1 py-2 bg-red-600 text-white rounded-lg text-xs font-extrabold hover:bg-red-700"
                                    >
                                        선택한 시트 삭제
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0 shadow-sm">
                        <div className="flex items-center gap-3">
                            <h1 className="text-base font-black text-slate-900 flex items-center gap-1.5">
                                <Icon name="package" weight="fill" className="text-blue-600" size={20} />
                                <span>강은지 직원용 시스템({APP_VERSION})</span>
                            </h1>
                        </div>

                        <div className="flex items-center gap-2 flex-wrap flex-1 justify-end">
                            {/* 상단 우측: 전체방송 + 교환반품CS 통합검색 */}
                            <div className="flex items-center gap-1.5 w-full sm:w-auto sm:min-w-[320px] max-w-md">
                                <div className="relative flex-1">
                                    <Icon name="globe" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-indigo-500" size={14} />
                                    <input
                                        type="text"
                                        value={globalKeyword}
                                        onChange={e => { setGlobalKeyword(e.target.value); if (!e.target.value.trim()) setGlobalSearchResults(null); }}
                                        onKeyDown={e => { if (e.key === 'Enter') handleGlobalSearch(); }}
                                        placeholder="전체 방송 + CS 통합검색 (닉네임/수령인/송장 등)"
                                        className="w-full pl-8 pr-7 py-1.5 bg-indigo-50/50 border border-indigo-200 rounded-lg text-xs font-bold outline-none focus:bg-white focus:border-indigo-600"
                                    />
                                    {globalKeyword && (
                                        <button onClick={() => { setGlobalKeyword(''); setGlobalSearchResults(null); }} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <Icon name="x-circle" weight="fill" size={14} />
                                        </button>
                                    )}
                                </div>
                                <button
                                    onClick={handleGlobalSearch}
                                    disabled={isSearchingGlobal}
                                    className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-extrabold shrink-0 shadow-sm flex items-center gap-1"
                                >
                                    <Icon name="magnifying-glass" weight="bold" />
                                    <span>{isSearchingGlobal ? '검색중...' : '전체 통합검색'}</span>
                                </button>
                            </div>

                            <button
                                onClick={() => { loadSheetOrders(selectedTab); loadCsOrders(); loadMasterAddresses(orderTabs); }}
                                className="px-3 py-1.5 rounded-lg text-xs font-bold bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 flex items-center gap-1"
                            >
                                <Icon name="arrows-clockwise" weight="bold" className={isLoading ? "animate-spin text-blue-600" : ""} />
                                <span>새로고침</span>
                            </button>

                            <button
                                onClick={handleSaveAll}
                                disabled={isSaving}
                                className="px-3.5 py-1.5 rounded-lg text-xs font-extrabold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm flex items-center gap-1"
                            >
                                <Icon name="floppy-disk" weight="fill" />
                                <span>{isSaving ? '저장중...' : '시트 저장 (Ctrl+S)'}</span>
                            </button>
                        </div>
                    </header>

                    <div className="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
                        <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 gap-1">
                            <button
                                onClick={() => { setActiveMainTab('orders'); setGlobalSearchResults(null); }}
                                className={`px-3.5 py-1.5 rounded-md text-xs font-extrabold transition ${activeMainTab === 'orders' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                📋 주문 조회 ({customerGroups.length}명)
                            </button>
                            <button
                                onClick={() => { setActiveMainTab('cs'); setGlobalSearchResults(null); }}
                                className={`px-3.5 py-1.5 rounded-md text-xs font-extrabold transition ${activeMainTab === 'cs' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                🔄 교환/반품 CS ({csGroups.filter(c => c.csStatus !== '처리완료').length}/{csGroups.length}건)
                            </button>
                            <button
                                onClick={() => { setActiveMainTab('tracking'); setGlobalSearchResults(null); }}
                                className={`px-3.5 py-1.5 rounded-md text-xs font-extrabold transition ${activeMainTab === 'tracking' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                🚚 운송장 엑셀 등록
                            </button>
                            <button
                                onClick={() => { setActiveMainTab('export'); setGlobalSearchResults(null); }}
                                className={`px-3.5 py-1.5 rounded-md text-xs font-extrabold transition ${activeMainTab === 'export' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                📊 발주용 / 배송용 엑셀
                            </button>
                        </div>

                        <div className="text-[11px] font-bold text-slate-500 hidden md:block">

                                                                            <option value="정상">정상</option>
                                                                            <option value="교환">교환</option>
                                                                            <option value="반품">반품</option>
                                                                            <option value="불량/오배송">불량/오배송</option>
                                                                        </select>
                                                                        <span className={`truncate ${isCsItem ? 'font-extrabold text-slate-900' : 'font-semibold text-slate-500'}`}>
                                                                            {it.product}
                                                                        </span>
                                                                    </div>
                                                                    <div className="flex items-center gap-2 shrink-0 text-xs font-bold text-slate-700">
                                                                        <span>{it.qty}개</span>
                                                                        <span className="w-20 text-right tabular-nums">{Number(it.price || 0).toLocaleString()}원</span>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* 4단 CS 메모 한 줄 바 */}
                                                    <div className="bg-slate-50/60 border-t border-slate-100 px-3.5 py-1.5 flex items-center gap-2 text-xs">
                                                        <span className="font-extrabold text-slate-600 shrink-0">📝 CS 메모:</span>
                                                        <input
                                                            type="text"
                                                            value={cs.csMemo || ''}
                                                            onChange={e => setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, csMemo: e.target.value } : x))}
                                                            placeholder="교환 사이즈, 불량 사유, 환불 계좌 등 메모 입력 (입력 후 Ctrl+S 저장)"
                                                            className="flex-1 bg-white border border-slate-200 rounded px-2.5 py-1 text-xs font-bold text-slate-800 outline-none focus:border-blue-600"
                                                        />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeMainTab === 'tracking' && (
                            <div className="w-full bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-sm my-2">
                                <div className="w-14 h-14 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-3">
                                    <Icon name="truck" weight="fill" size={32} />
                                </div>
                                <h2 className="text-base font-black text-slate-900 mb-1">
                                    [{selectedTab.replace(/^주문_/, '')}] 롯데택배 운송장 엑셀 일괄 등록
                                </h2>
                                <p className="text-xs text-slate-500 mb-6 leading-relaxed">
                                    롯데택배 출고 엑셀 파일(수하인명/닉네임/연락처 + 운송장번호 열 포함)을 업로드하면<br/>
                                    현재 선택된 방송 주문서 시트에 송장번호가 자동 매칭되며, 동명이인은 자동으로 보류 및 안내됩니다.
                                </p>
                                <input type="file" accept=".xlsx,.xls,.csv" ref={trackingExcelRef} onChange={handleTrackingExcelUpload} className="hidden" />
                                <button
                                    onClick={() => trackingExcelRef.current?.click()}
                                    className="px-6 py-3.5 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl text-sm shadow-md inline-flex items-center gap-2"
                                >
                                    <Icon name="upload-simple" weight="bold" size={18} />
                                    <span>롯데택배 송장 엑셀 파일 선택 (.xlsx)</span>
                                </button>
                            </div>
                        )}

                        {activeMainTab === 'export' && (
                            <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-4 my-2">
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-sm">
                                    <h3 className="text-sm font-black text-slate-900 mb-1">📋 발주용 품목 집계 엑셀</h3>
                                    <p className="text-xs text-slate-500 mb-4">상품별 입금완료 수량 / 미입금 수량 요약 (품절대기 제외)</p>
                                    <button
                                        onClick={handleExportProductsExcel}
                                        className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-xl text-xs shadow"
                                    >
                                        발주리스트 엑셀 다운로드
                                    </button>
                                </div>
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-sm">
                                    <h3 className="text-sm font-black text-slate-900 mb-1">🚚 배송용 고객 정산 리스트 엑셀</h3>
                                    <p className="text-xs text-slate-500 mb-4">고객별 결제상태 · 주소 · 주문품목 · 대기순번 · 송장번호 포함</p>
                                    <button
                                        onClick={handleExportCustomersExcel}
                                        className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-xs shadow"
                                    >
                                        배송리스트 엑셀 다운로드
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StaffTrackingApp />);
    </script>
</body>
</html>
