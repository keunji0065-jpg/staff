        const PortalApp = () => {
            const [nickInput, setNickInput] = useState("");
            const [pinInput, setPinInput] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isLoading, setIsLoading] = useState(false);
            const [isRefreshing, setIsRefreshing] = useState(false);

            const [currentUser, setCurrentUser] = useState(null);
            const [orderHistoryList, setOrderHistoryList] = useState([]);
            const [selectedBroadcastIdx, setSelectedBroadcastIdx] = useState(0);
            const [isEditingAddress, setIsEditingAddress] = useState(false);
            const [addrForm, setAddrForm] = useState({
                realname: "",
                phone: "",
                zipcode: "",
                baseAddress: "",
                detailAddress: "",
                memo: ""
            });
            const [agreePrivacy, setAgreePrivacy] = useState(false);
            const [agreeThirdParty, setAgreeThirdParty] = useState(false);
            const [isSavingAddress, setIsSavingAddress] = useState(false);
            const [toastMsg, setToastMsg] = useState("");
            const [trackingMap, setTrackingMap] = useState({});
            const [collapsedTracks, setCollapsedTracks] = useState({});
            const [isDepositHistoryOpen, setIsDepositHistoryOpen] = useState(false);
            const [customerCsList, setCustomerCsList] = useState([]);
            const [editingCsAccountMap, setEditingCsAccountMap] = useState({});
            const [showBizFooter, setShowBizFooter] = useState(false);
            const touchStartYRef = React.useRef(null);
            const bottomReachedAtRef = React.useRef(0);
            const wheelOverscrollCountRef = React.useRef(0);

            // 고객의 미송/교환/반품(CS) 실시간 동기화 리스너 (직원용 시스템에서 저장 시 즉시 반영)
            useEffect(() => {
                if (!portalFbDb || !currentUser || !currentUser.nickname) return;
                const csRef = portalFbDb.ref('ember_live_data/_portal_cs');
                const handleCsChange = () => {
                    const allNicks = Array.from(new Set([
                        currentUser.nickname,
                        ...orderHistoryList.map(h => h.nickname)
                    ].filter(Boolean)));
                    lookupCustomerCsRecords(allNicks, currentUser.phoneLast4 || pinInput).then(list => {
                        if (Array.isArray(list)) setCustomerCsList(list);
                    }).catch(() => {});
                };
                csRef.on('value', handleCsChange);
                return () => csRef.off('value', handleCsChange);
            }, [currentUser?.nickname, currentUser?.phoneLast4, pinInput, orderHistoryList]);

            // 고객이 포털에서 직접 환불 계좌번호를 입력/저장하는 함수
            const handleSaveCustomerRefundAccount = async (csId) => {
                const nextAcc = String(editingCsAccountMap[csId] ?? '').trim();
                if (!nextAcc) {
                    showToast("환불받으실 은행명, 계좌번호, 예금주를 입력해 주세요.");
                    return;
                }
                setCustomerCsList(prev => prev.map(c => c.id === csId ? { ...c, refundAccount: nextAcc } : c));
                setEditingCsAccountMap(prev => {
                    const copy = { ...prev };
                    delete copy[csId];
                    return copy;
                });
                if (portalFbDb) {
                    try {
                        await portalFbDb.ref(`ember_live_data/_portal_cs_accounts/${csId}`).set({
                            csId,
                            nickname: currentUser?.nickname || '',
                            refundAccount: nextAcc,
                            updatedAt: getKstNowString()
                        });
                    } catch (e) {}
                }
                showToast("환불 계좌번호가 저장되었습니다!");
            };

            // 바닥에 완전히 도달해 멈춘(0.45초 이상 정지) 뒤, 한 번 더 강하게 아래로 당길 때만 사업자정보 창이 열리도록 정밀 감지
            useEffect(() => {
                if (!currentUser) {
                    setShowBizFooter(false);
                    bottomReachedAtRef.current = 0;
                    wheelOverscrollCountRef.current = 0;
                    return;
                }
                const isAtPageBottom = () => {
                    const scrollBottom = window.innerHeight + window.scrollY;
                    const docHeight = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
                    return scrollBottom >= docHeight - 6;
                };
                const handleScroll = () => {
                    if (isAtPageBottom()) {
                        if (bottomReachedAtRef.current === 0) {
                            bottomReachedAtRef.current = Date.now();
                        }
                    } else {
                        bottomReachedAtRef.current = 0;
                        wheelOverscrollCountRef.current = 0;
                    }
                };
                const handleTouchStart = (e) => {
                    // 이미 바닥에 도달한 지 0.45초 이상 지난 상태에서 다시 터치해 당길 때만 시작점 기록 (일반 스크롤 관성 완전 무시)
                    if (e.touches && e.touches.length === 1 && isAtPageBottom() && bottomReachedAtRef.current > 0 && (Date.now() - bottomReachedAtRef.current > 450)) {
                        touchStartYRef.current = e.touches[0].clientY;
                    } else {
                        touchStartYRef.current = null;
                    }
                };
                const handleTouchMove = (e) => {
                    if (touchStartYRef.current !== null && e.touches && e.touches.length === 1) {
                        const deltaY = touchStartYRef.current - e.touches[0].clientY;
                        // 바닥 정지 상태에서 위로 95px 이상 강하게 한 번 더 끌어올렸을 때만 사업자정보 오픈
                        if (deltaY > 95 && isAtPageBottom()) {
                            setShowBizFooter(true);
                            touchStartYRef.current = null;
                        }
                    }
                };
                const handleWheel = (e) => {
                    if (!isAtPageBottom()) {
                        wheelOverscrollCountRef.current = 0;
                        return;
                    }
                    if (bottomReachedAtRef.current === 0) {
                        bottomReachedAtRef.current = Date.now();
                        return;
                    }
                    // 바닥에 닿아 0.45초 이상 멈춘 뒤 마우스 휠을 아래로 4번 이상 연속 내렸을 때만 오픈
                    if (e.deltaY > 30 && (Date.now() - bottomReachedAtRef.current > 450)) {
                        wheelOverscrollCountRef.current += 1;
                        if (wheelOverscrollCountRef.current >= 4) {
                            setShowBizFooter(true);
                            wheelOverscrollCountRef.current = 0;
                        }
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                window.addEventListener('touchstart', handleTouchStart, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: true });
                window.addEventListener('wheel', handleWheel, { passive: true });
                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('touchstart', handleTouchStart);
                    window.removeEventListener('touchmove', handleTouchMove);
                    window.removeEventListener('wheel', handleWheel);
                };
            }, [currentUser]);

            // ✨ 고객이 페이지에 접속해서 닉네임을 입력하는 동안 백그라운드에서 미리 시트 데이터를 메모리에 프리로드(Pre-load)하여 조회 버튼 클릭 시 0.1초 만에 열리도록 가속!
            useEffect(() => {
                preloadStaffSheetsInBackground(false);
            }, []);

            // ✨ 실시간 적립금 동기화 센서: 고객이 주문서를 열어둔 상태에서 사장님이 [적립금전환]을 누르면 새로고침 없이 0.1초 만에 화면에 적립금이 뜹니다!
            useEffect(() => {
                if (!portalFbDb || !currentUser || !currentUser.nickname) return;
                const creditsRef = portalFbDb.ref('ember_live_data/_portal_credits');
                const handleCreditUpdate = (snap) => {
                    const creditsMap = snap.val() || {};
                    const tNorm = normalizeNick(currentUser.nickname);
                    const tClean = cleanHandle(currentUser.nickname);
                    let foundCredit = null;
                    for (const k in creditsMap) {
                        const item = creditsMap[k];
                        if (!item) continue;
                        const itemNick = item.nickname || k;
                        if (normalizeNick(itemNick) === tNorm || (tClean && cleanHandle(itemNick) === tClean)) {
                            foundCredit = Number(item.credit) || 0;
                            break;
                        }
                    }
                    if (foundCredit !== null && foundCredit !== (Number(currentUser.credit) || 0)) {
                        setCurrentUser(prev => prev ? { ...prev, credit: foundCredit } : prev);
                        setOrderHistoryList(prev => prev.map(item => ({ ...item, credit: foundCredit })));
                    }
                };
                creditsRef.on('value', handleCreditUpdate);
                return () => creditsRef.off('value', handleCreditUpdate);
            }, [currentUser?.nickname, currentUser?.credit]);

            const formatTrackingDisplay = (raw) => {
                const digits = String(raw || '').replace(/[^0-9]/g, '');
                if (digits.length === 12) {
                    return `${digits.slice(0, 4)}-${digits.slice(4, 8)}-${digits.slice(8, 12)}`;
                }
                return String(raw || '').trim();
            };

            const fetchInlineTracking = async (rawTrackNo, force = false) => {
                const cleanDigits = String(rawTrackNo || '').replace(/[^0-9]/g, '');
                if (!cleanDigits) return;
                if (!force && trackingMap[cleanDigits] && (trackingMap[cleanDigits].loading || trackingMap[cleanDigits].loaded)) {
                    return;
                }

                setTrackingMap(prev => ({
                    ...prev,
                    [cleanDigits]: { loading: true, loaded: false, stateText: "실시간 위치 조회중...", steps: [] }
                }));

                // 1) 테스트 샘플 송장번호인 경우 즉시 인라인 배송흐름 표시
                if (cleanDigits === "254819203841" || cleanDigits === "254800987712") {
                    setTimeout(() => {
                        setTrackingMap(prev => ({
                            ...prev,
                            [cleanDigits]: {
                                loading: false,
                                loaded: true,
                                stateText: cleanDigits === "254800987712" ? "배달완료" : "배송중 (간선하차)",
                                steps: cleanDigits === "254800987712" ? [
                                    { time: "2026-10-13 14:22", location: "서울성동(대)", status: "배달완료 · 고객님께 물품을 전달하였습니다 (문앞 배송)" },
                                    { time: "2026-10-13 08:40", location: "서울성동(대)", status: "배달출발 · 배달을 준비중입니다" },
                                    { time: "2026-10-12 22:15", location: "동서울터미널", status: "간선하차 · 물류터미널에 도착하였습니다" },
                                    { time: "2026-10-12 17:30", location: "광주광산(대)", status: "집하완료 · 보내시는 고객님으로부터 상품을 인수받았습니다" }
                                ] : [
                                    { time: "2026-10-19 01:15", location: "수도권메가허브", status: "간선하차 · 물류터미널에서 행선지별 분류중입니다" },
                                    { time: "2026-10-18 21:40", location: "광주터미널", status: "간선상차 · 수도권행 간선차량으로 출발하였습니다" },
                                    { time: "2026-10-18 18:10", location: "광주서구(대)", status: "집하완료 · 보내시는 고객님으로부터 상품을 인수받았습니다" }
                                ]
                            }
                        }));
                    }, 180);
                    return;
                }

                // 2) 공개 배송조회 API 1차 시도 (tracker.delivery - 롯데택배 kr.lotte)
                try {
                    const res = await fetch(`https://apis.tracker.delivery/carriers/kr.lotte/tracks/${cleanDigits}`);
                    if (res.ok) {
                        const data = await res.json();
                        const progresses = Array.isArray(data.progresses) ? [...data.progresses].reverse() : [];
                        if (progresses.length > 0) {
                            setTrackingMap(prev => ({
                                ...prev,
                                [cleanDigits]: {
                                    loading: false,
                                    loaded: true,
                                    stateText: data.state?.text || "배송중",
                                    steps: progresses.map(p => ({
                                        time: formatKstDateString(p.time),
                                        location: p.location?.name || "롯데택배",
                                        status: p.status?.text ? `${p.status.text}${p.description ? ` · ${p.description}` : ''}` : (p.description || '')
                                    }))
                                }
                            }));
                            return;
                        }
                    }
                } catch (e) {}

                // 3) 구글 앱스 스크립트 서버를 통한 롯데택배 직접 파싱 2차 시도
                try {
                    const gasRes = await fetch(`${DEFAULT_GAS_URL}?action=get_lotte_tracking&invNo=${cleanDigits}&t=${Date.now()}`);
                    const gasData = await gasRes.json();
                    if (gasData && gasData.status === 'success' && Array.isArray(gasData.steps) && gasData.steps.length > 0) {
                        setTrackingMap(prev => ({
                            ...prev,
                            [cleanDigits]: {
                                loading: false,
                                loaded: true,
                                stateText: gasData.stateText || "배송중",
                                steps: gasData.steps
                            }
                        }));
                        return;
                    }
                } catch (e) {}

                setTrackingMap(prev => ({
                    ...prev,
                    [cleanDigits]: {
                        loading: false,
                        loaded: true,
                        stateText: "운송장 등록 완료 (택배사 집하 대기중)",
                        steps: []
                    }
                }));
            };

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2200);
            };

            const copyText = (text, label) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                    showToast(`${label} 복사되었습니다.`);
                } catch (e) {}
                document.body.removeChild(ta);
            };

            const initAddressState = (userObj) => {
                const hasTrk = Boolean(
                    (Array.isArray(userObj?.trackingNumbers) && userObj.trackingNumbers.length > 0) ||
                    (userObj?.trackingNumber && String(userObj.trackingNumber).trim() !== "")
                );
                if (userObj && userObj.address && userObj.address.baseAddress) {
                    setAddrForm(userObj.address);
                    setIsEditingAddress(false);
                    setAgreePrivacy(true);
                    setAgreeThirdParty(true);
                } else if (hasTrk) {
                    setAddrForm(userObj?.address || { realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                    setIsEditingAddress(false);
                } else {
                    setAddrForm({ realname: "", phone: "", zipcode: "", baseAddress: "", detailAddress: "", memo: "" });
                    setIsEditingAddress(true);
                    setAgreePrivacy(false);
                    setAgreeThirdParty(false);
                }
            };

            const handleSelectBroadcast = (idx) => {
                if (!orderHistoryList[idx]) return;
                setSelectedBroadcastIdx(idx);
                setIsDepositHistoryOpen(false);
                const targetOrder = orderHistoryList[idx];
                setCurrentUser(targetOrder);
                initAddressState(targetOrder);
            };

            const handleLogin = async (e, customNick, customPin, isRefreshCall = false) => {
                if (e) e.preventDefault();
                setLoginError("");

                const rawNick = customNick !== undefined ? customNick : nickInput;
                const rawPin = customPin !== undefined ? customPin : pinInput;

                const cleanNick = cleanHandle(rawNick);
                const cleanPin = String(rawPin).trim();

                if (!cleanNick) {
                    setLoginError("유튜브 닉네임을 입력해 주세요.");
                    return;
                }
                if (cleanPin.length !== 4) {
                    setLoginError("비밀번호(휴대폰 뒷 4자리)를 입력해 주세요.");
                    return;
                }

                setIsLoading(true);
                if (isRefreshCall) {
                    setIsRefreshing(true);
                }
                setTrackingMap({});

                const sampleMatch = SAMPLE_DB.find(u => isFlexibleNickMatch(u.nickname, rawNick, u.address?.realname));
                if (sampleMatch) {
                    setTimeout(() => {
                        setIsLoading(false);
                        setIsRefreshing(false);
                        if (normalizePin4(sampleMatch.phoneLast4) === normalizePin4(cleanPin)) {
                            const rawHList = Array.isArray(sampleMatch.historyList) && sampleMatch.historyList.length > 0
                                ? sampleMatch.historyList
                                : [sampleMatch];
                            const hList = sortHistoryByNewestDate(rawHList);
                            setOrderHistoryList(hList);
                            const nextIdx = isRefreshCall && selectedBroadcastIdx < hList.length ? selectedBroadcastIdx : 0;
                            setSelectedBroadcastIdx(nextIdx);
                            setCurrentUser(hList[nextIdx]);
                            initAddressState(hList[nextIdx]);
                            setCustomerCsList(Array.isArray(sampleMatch.csList) ? sampleMatch.csList : []);
                            if (isRefreshCall) showToast("✨ 최신 주문·입금 내역으로 새로고침되었습니다!");
                        } else {
                            setLoginError("비밀번호(뒷 4자리)가 일치하지 않습니다.");
                        }
                    }, 200);
                    return;
                }

                try {
                    const fetchOrderWithPin = async (targetPin, targetNickOverride) => {
                        const queryNick = targetNickOverride !== undefined ? targetNickOverride : rawNick;
                        const url = `${DEFAULT_GAS_URL}?action=get_customer_order&masterId=${DEFAULT_MASTER_SHEET_ID}&nickname=${encodeURIComponent(queryNick)}&pin=${encodeURIComponent(targetPin)}&t=${Date.now()}`;
                        return await fetchGasWithRetry(url, null, 1, 3500);
                    };

                    // 주문 목록을 화면에 즉시 반영하고 백그라운드에서 추가 데이터를 병합하는 헬퍼
                    const applyAndMergeOrders = (initialList) => {
                        const cleaned = removeDummyEmptyOrdersIfRealExists(
                            filterVerifiedHistoryList(initialList, rawNick, cleanPin)
                        );
                        if (cleaned.length === 0) return false;
                        const hList = sortHistoryByNewestDate(cleaned);
                        setOrderHistoryList(hList);
                        const nextIdx = (isRefreshCall && selectedBroadcastIdx < hList.length) ? selectedBroadcastIdx : 0;
                        setSelectedBroadcastIdx(nextIdx);
                        setCurrentUser(hList[nextIdx]);
                        initAddressState(hList[nextIdx]);
                        setIsLoading(false);
                        setIsRefreshing(false);
                        if (isRefreshCall) showToast("✨ 최신 주문·입금 내역으로 새로고침되었습니다!");

                        // 미송 / 교환 / 반품(CS) 내역 비동기 조회
                        const resolvedFullNick = hList[0]?.nickname || rawNick;
                        lookupCustomerCsRecords([resolvedFullNick, rawNick], cleanPin).then(csRes => {
                            if (Array.isArray(csRes)) setCustomerCsList(csRes);
                        }).catch(() => {});

                        // 백그라운드에서 사장님 라이브 시트(현재 방송) 데이터도 조용히 확인하여 있으면 병합
                        fetchOrderWithPin(cleanPin, resolvedFullNick).then(gasRes => {
                            if (gasRes && gasRes.status === "success" && Array.isArray(gasRes.historyList) && gasRes.historyList.length > 0) {
                                const gasList = filterVerifiedHistoryList(gasRes.historyList, rawNick, cleanPin, resolvedFullNick);
                                if (gasList.length === 0) return;
                                setOrderHistoryList(prevList => {
                                    const mergedMap = new Map();
                                    prevList.forEach(item => mergedMap.set(item.sheetTabName || item.broadcastName, item));
                                    gasList.forEach(gItem => {
                                        if (gItem.broadcastName === '최근 주문 내역 없음' && mergedMap.size > 0) return;
                                        const key = gItem.sheetTabName || gItem.broadcastName;
                                        const existing = mergedMap.get(key);
                                        if (!existing) {
                                            mergedMap.set(key, gItem);
                                        } else {
                                            const bestCredit = Math.max(Number(existing.credit) || 0, Number(gItem.credit) || 0);
                                            const bestDep = Math.max(Number(existing.depositTotal) || 0, Number(gItem.depositTotal) || 0);
                                            const bestDepsArr = (Array.isArray(gItem.deposits) && gItem.deposits.length > (existing.deposits?.length || 0)) ? gItem.deposits : (existing.deposits || []);
                                            mergedMap.set(key, {
                                                ...gItem,
                                                ...existing,
                                                depositTotal: bestDep,
                                                credit: bestCredit,
                                                deposits: bestDepsArr,
                                                address: existing._hasBcastCustomAddr ? existing.address : (existing.address || gItem.address),
                                                isConfirmed: existing.isConfirmed || gItem.isConfirmed
                                            });
                                        }
                                    });
                                    const finalMerged = sortHistoryByNewestDate(removeDummyEmptyOrdersIfRealExists(Array.from(mergedMap.values())));
                                    setCurrentUser(cur => finalMerged[nextIdx] || finalMerged[0] || cur);
                                    return finalMerged;
                                });
                            }
                        }).catch(() => {});

                        return true;
                    };

                    // 🚀 1단계(0.05초~0.3초): 프리로드된 직원용 시트(gviz CDN)와 Firebase 클라우드를 동시에 시작하되,
                    // 둘 중 어느 하나라도 먼저 결과를 찾으면 기다리지 않고 0.1초 만에 즉시 화면을 엽니다!
                    const staffPromise = lookupOrderFromStaffSheetDirect(rawNick, cleanPin, isRefreshCall);
                    const fbPromise = lookupOrderFromFirebase(rawNick, cleanPin);

                    const [staffDirectData, fbInstantData] = await Promise.all([staffPromise, fbPromise]);

                    const combinedInstantList = [];
                    if (fbInstantData && fbInstantData.status === "success" && Array.isArray(fbInstantData.historyList)) {
                        combinedInstantList.push(...fbInstantData.historyList);
                    }
                    if (staffDirectData && staffDirectData.status === "success" && Array.isArray(staffDirectData.historyList)) {
                        staffDirectData.historyList.forEach(sItem => {
                            const key = sItem.sheetTabName || sItem.broadcastName;
                            const existIdx = combinedInstantList.findIndex(x => (x.sheetTabName || x.broadcastName) === key);
                            if (existIdx === -1) {
                                combinedInstantList.push(sItem);
                            } else {
                                const ex = combinedInstantList[existIdx];
                                combinedInstantList[existIdx] = {
                                    ...sItem,
                                    ...ex,
                                    depositTotal: Math.max(Number(ex.depositTotal) || 0, Number(sItem.depositTotal) || 0),
                                    address: ex._hasBcastCustomAddr ? ex.address : (ex.address || sItem.address),
                                    trackingNumbers: (Array.isArray(ex.trackingNumbers) && ex.trackingNumbers.length > 0) ? ex.trackingNumbers : (sItem.trackingNumbers || []),
                                    isConfirmed: Boolean(ex.isConfirmed || sItem.isConfirmed)
                                };
                            }
                        });
                    }

                    // 1단계에서 찾았으면 즉시 주문서 오픈! (GAS 응답 기다리지 않음)
                    if (combinedInstantList.length > 0 && applyAndMergeOrders(combinedInstantList)) {
                        return;
                    }

                    // 만약 1단계에서 비밀번호 불일치(WRONG_PIN)가 명확히 확인되었다면 무거운 GAS 조회를 생략하고 즉시 안내!
                    if ((staffDirectData && staffDirectData.errorType === "WRONG_PIN") || (fbInstantData && fbInstantData.errorType === "WRONG_PIN")) {
                        setIsLoading(false);
                        setIsRefreshing(false);
                        setLoginError("비밀번호(뒷 4자리)가 일치하지 않습니다. 첫 구매이거나 열리지 않으면 아래 노란색 카톡 버튼으로 문의해 주세요.");
                        return;
                    }

                    // 🚀 2단계: 직원용 시트/클라우드에 없는 신규 당일 첫구매 고객인 경우에만 사장님 시트(GAS) 및 CS 내역 조회 (최대 3.5초 타임아웃)
                    const [gasData, csOnlyCheck] = await Promise.all([
                        fetchOrderWithPin(cleanPin).catch(() => null),
                        lookupCustomerCsRecords([rawNick], cleanPin).catch(() => [])
                    ]);

                    let data = gasData;
                    if (data && data.status === "success") {
                        const rawGasList = Array.isArray(data.historyList) && data.historyList.length > 0 ? data.historyList : (data.customerData ? [data.customerData] : []);
                        if (applyAndMergeOrders(rawGasList)) {
                            return;
                        }
                    }

                    // 미송/교환/반품(CS) 내역에만 존재하는 고객인 경우 즉시 열람 허용
                    if (Array.isArray(csOnlyCheck) && csOnlyCheck.length > 0) {
                        const firstCs = csOnlyCheck[0];
                        const csCard = {
                            sheetTabName: '주문_' + (firstCs.sourceBroadcast || '교환반품'),
                            nickname: firstCs.nick || rawNick,
                            phoneLast4: normalizePin4(cleanPin),
                            broadcastName: firstCs.sourceBroadcast || '미송/교환/반품 내역',
                            isVip: false,
                            credit: 0,
                            freeShippingThreshold: 70000,
                            cardFeeRate: 10,
                            isCard: '',
                            shipping: 0,
                            depositTotal: 0,
                            deposits: [],
                            items: [],
                            address: null,
                            trackingNumbers: firstCs.origTracking ? [firstCs.origTracking] : [],
                            isConfirmed: false
                        };
                        setOrderHistoryList([csCard]);
                        setSelectedBroadcastIdx(0);
                        setCurrentUser(csCard);
                        initAddressState(csCard);
                        setCustomerCsList(csOnlyCheck);
                        setIsLoading(false);
                        setIsRefreshing(false);
                        return;
                    }

                    setIsLoading(false);
                    setIsRefreshing(false);

                    if (data && data.errorType === "WRONG_PIN") {
                        setLoginError("비밀번호(뒷 4자리)가 일치하지 않습니다. 첫 구매이거나 열리지 않으면 아래 노란색 카톡 버튼으로 문의해 주세요.");
                    } else {
                        setLoginError("주문 내역을 찾을 수 없습니다. (뒤쪽 -영문숫자 핸들을 뺀 한글 닉네임만 입력해 보세요!)");
                    }
                } catch (err) {
                    setIsLoading(false);
                    setIsRefreshing(false);
                    if (isRefreshCall) {
                        showToast("일시적인 네트워크 지연입니다. 다시 한번 눌러주세요.");
                    } else {
                        setLoginError("일시적인 연결 지연입니다. [주문서 조회하기]를 한 번 더 눌러주세요!");
                    }
                }
            };

            const handleOpenPostcode = () => {
                if (!window.daum || !window.daum.Postcode) {
                    showToast("주소 검색 도구를 불러오는 중입니다. 1초 후 다시 눌러주세요.");
                    return;
                }
                new window.daum.Postcode({
                    oncomplete: function(data) {
                        let fullAddr = data.address;
                        let extraAddr = '';
                        if (data.addressType === 'R') {
                            if (data.bname !== '') extraAddr += data.bname;
                            if (data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                            fullAddr += (extraAddr !== '' ? ` (${extraAddr})` : '');
                        }
                        setAddrForm(prev => ({
                            ...prev,
                            zipcode: data.zonecode,
                            baseAddress: fullAddr
                        }));
                    }
                }).open();
            };

            const handleSaveAddress = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                const hasTrackingNow = Boolean(
                    (Array.isArray(currentUser?.trackingNumbers) && currentUser.trackingNumbers.length > 0) ||
                    (currentUser?.trackingNumber && String(currentUser.trackingNumber).trim() !== "")
                );
                if (hasTrackingNow) {
                    setIsEditingAddress(false);
                    showToast("이미 송장번호가 등록(출고)된 방송의 배송지는 변경할 수 없습니다.");
                    return false;
                }
                if (!addrForm.realname.trim()) { showToast("수령인 성함을 입력해 주세요."); return false; }
                const cleanPhone = addrForm.phone.replace(/[^0-9]/g, "");
                if (cleanPhone.length < 10) { showToast("정확한 휴대폰 번호를 입력해 주세요."); return false; }
                if (!addrForm.baseAddress.trim()) { showToast("주소 검색을 통해 기본 주소를 입력해 주세요."); return false; }
                if (!agreePrivacy || !agreeThirdParty) { showToast("필수 개인정보 수집 및 제공에 동의해 주세요."); return false; }

                const nowStr = getKstNowString();
                const updatedAddr = { ...addrForm, phone: cleanPhone, updatedAt: nowStr };
                const newLast4 = cleanPhone.slice(-4);

                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                    setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, phoneLast4: newLast4, address: updatedAddr } : item));
                    setIsEditingAddress(false);
                    showToast(`[${currentUser.broadcastName || '현재 방송'}] 배송지가 저장되었습니다!`);
                    return true;
                }

                setIsSavingAddress(true);
                try {
                    const cleanBase = String(updatedAddr.baseAddress || "").replace(/^\(\d{5}\)\s*/, "").trim();
                    const fullCombinedAddress = `${cleanBase} ${updatedAddr.detailAddress}`.trim();
                    const cleanTargetBName = String(currentUser.broadcastName || '').replace(/^주문_/, '').trim();
                    const safeBKey = cleanTargetBName.replace(/[.#$\[\]\/]/g, '_');
                    const safeNickKey = String(currentUser.nickname || '').replace(/[.#$\[\]\/]/g, '_');

                    const payload = {
                        action: 'save_master_address',
                        masterId: DEFAULT_MASTER_SHEET_ID,
                        data: {
                            nickname: currentUser.nickname,
                            realname: updatedAddr.realname.trim(),
                            phone: "'" + cleanPhone,
                            address: fullCombinedAddress,
                            memo: updatedAddr.memo.trim(),
                            sheetTabName: currentUser.sheetTabName || ('주문_' + cleanTargetBName),
                            broadcastName: cleanTargetBName,
                            onlyThisBroadcast: true,
                            isCustomerPortal: true
                        }
                    };

                    // Firebase에 (1) 해당 방송 전용 주소 노드 및 (2) 해당 방송의 _portal_orders 고객 주소를 즉시 갱신하여 절대 예전 주소로 되돌아가지 않도록 고정!
                    if (portalFbDb) {
                        const addrRecord = {
                            nickname: currentUser.nickname,
                            realname: updatedAddr.realname.trim(),
                            phone: cleanPhone,
                            zipcode: '',
                            baseAddress: cleanBase,
                            detailAddress: updatedAddr.detailAddress,
                            address: fullCombinedAddress,
                            memo: updatedAddr.memo.trim(),
                            sheetTabName: currentUser.sheetTabName || ('주문_' + cleanTargetBName),
                            broadcastName: cleanTargetBName,
                            updatedAt: nowStr
                        };
                        if (safeBKey) {
                            portalFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set(addrRecord).catch(() => {});
                            portalFbDb.ref(`ember_live_data/_portal_orders/${safeBKey}`).once('value').then(snap => {
                                const bVal = snap.val();
                                if (bVal && Array.isArray(bVal.customers)) {
                                    const updatedCusts = bVal.customers.map(c => {
                                        if (normalizeNick(c.nickname) === normalizeNick(currentUser.nickname)) {
                                            return {
                                                ...c,
                                                phoneLast4: newLast4,
                                                address: {
                                                    realname: updatedAddr.realname.trim(),
                                                    phone: cleanPhone,
                                                    zipcode: '',
                                                    baseAddress: `${cleanBase} ${updatedAddr.detailAddress}`.trim(),
                                                    detailAddress: '',
                                                    memo: updatedAddr.memo.trim(),
                                                    updatedAt: nowStr
                                                }
                                            };
                                        }
                                        return c;
                                    });
                                    portalFbDb.ref(`ember_live_data/_portal_orders/${safeBKey}/customers`).set(updatedCusts).catch(() => {});
                                }
                            }).catch(() => {});
                        }
                        portalFbDb.ref(`ember_live_data/_portal_addresses/${safeNickKey}`).set(addrRecord).catch(() => {});
                    }

                    const result = await fetchGasWithRetry(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    }, 3);
                    if (result && (result.success || result.status === 'success')) {
                        setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                        setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, phoneLast4: newLast4, address: updatedAddr } : item));
                        setPinInput(newLast4);
                        setIsEditingAddress(false);
                        showToast(`[${currentUser.broadcastName || '현재 방송'}] 배송지가 안전하게 저장되었습니다!`);
                        return true;
                    } else if (result && result.errorType === 'TRACKING_LOCKED') {
                        setIsEditingAddress(false);
                        showToast(result.message || "이미 출고(송장등록)된 주문서는 배송지를 변경할 수 없습니다.");
                        return false;
                    } else {
                        showToast("저장에 실패했습니다. 다시 시도해 주세요.");
                        return false;
                    }
                } catch (err) {
                    // 만약 구글 시트 쓰기 락(Lock)이 걸렸더라도 Firebase에 백업되었음을 반영해 고객 불편 방지
                    if (portalFbDb) {
                        setCurrentUser(prev => ({ ...prev, phoneLast4: newLast4, address: updatedAddr }));
                        setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, phoneLast4: newLast4, address: updatedAddr } : item));
                        setPinInput(newLast4);
                        setIsEditingAddress(false);
                        showToast(`[${currentUser.broadcastName || '현재 방송'}] 배송지가 저장되었습니다!`);
                        return true;
                    }
                    showToast("접속자가 많아 지연되었습니다. 다시 한번 저장을 눌러주세요.");
                    return false;
                } finally {
                    setIsSavingAddress(false);
                }
            };

            const handleConfirmOrder = async () => {
                if (!currentUser.address || !currentUser.address.baseAddress || isEditingAddress) {
                    if (addrForm.realname.trim() || addrForm.phone.trim() || addrForm.baseAddress.trim()) {
                        const savedOk = await handleSaveAddress();
                        if (!savedOk) return;
                    } else {
                        showToast("먼저 배송지를 입력해 주세요!");
                        setIsEditingAddress(true);
                        return;
                    }
                }
                const nowStr = getKstNowString();
                const isSample = SAMPLE_DB.some(u => cleanHandle(u.nickname) === cleanHandle(currentUser.nickname));
                if (isSample) {
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, isConfirmed: true, address: item.address ? { ...item.address, updatedAt: nowStr } : item.address } : item));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                    return;
                }

                try {
                    if (portalFbDb) {
                        const safeNickKey = String(currentUser.nickname || '').replace(/[.#$\[\]\/]/g, '_');
                        portalFbDb.ref(`ember_live_data/_portal_confirmed/${safeNickKey}`).set({
                            nickname: currentUser.nickname,
                            broadcastName: currentUser.broadcastName || '',
                            confirmedAt: nowStr
                        }).catch(() => {});
                    }
                    await fetchGasWithRetry(DEFAULT_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'confirm_customer_order',
                            masterId: DEFAULT_MASTER_SHEET_ID,
                            data: {
                                nickname: currentUser.nickname,
                                sheetTabName: currentUser.sheetTabName || '메인주문',
                                broadcastName: currentUser.broadcastName || ''
                            }
                        })
                    }, 3);
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    setOrderHistoryList(prev => prev.map((item, i) => i === selectedBroadcastIdx ? { ...item, isConfirmed: true, address: item.address ? { ...item.address, updatedAt: nowStr } : item.address } : item));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                } catch (e) {
                    setCurrentUser(prev => ({
                        ...prev,
                        isConfirmed: true,
                        address: prev.address ? { ...prev.address, updatedAt: nowStr } : prev.address
                    }));
                    showToast("주문 및 배송지 확인이 완료되었습니다!");
                }
            };

            // 주문 금액 계산
            const activeItems = currentUser ? (currentUser.items || []).filter(i => !i.isWaitlist) : [];
            const waitlistItems = currentUser ? (currentUser.items || []).filter(i => i.isWaitlist) : [];
            const totalQty = activeItems.reduce((s, i) => s + Number(i.qty || 1), 0);
            const productTotal = activeItems.reduce((s, i) => s + Number(i.price || 0), 0);
            const isVipFree = Boolean(currentUser && (currentUser.isVip || currentUser.isManager));
            const shippingFee = currentUser ? (isVipFree ? 0 : (activeItems.length > 0 && productTotal > 0 ? Number(currentUser.shipping || 0) : 0)) : 0;
            const baseGrandTotal = productTotal + shippingFee;
            const depositTotal = currentUser ? Number(currentUser.depositTotal || 0) : 0;
            const rawBalance = baseGrandTotal - depositTotal;
            const isCard = Boolean(currentUser && (currentUser.isCard === true || String(currentUser.isCard || '').toUpperCase().startsWith('O') || String(currentUser.isCard || '').includes('카드') || String(currentUser.isCard || '').includes('완료')));
            const isCardPaid = Boolean(isCard && String(currentUser?.isCard || '').includes('완료'));
            const parsedFeeFromCardStr = (() => {
                const m = String(currentUser?.isCard || '').match(/(\d+(?:\.\d+)?)%/);
                return m ? Number(m[1]) : 0;
            })();
            const cardFeeRate = parsedFeeFromCardStr > 0 ? parsedFeeFromCardStr : ((currentUser && Number(currentUser.cardFeeRate) > 0) ? Number(currentUser.cardFeeRate) : 10);
            const cardFee = (isCard && rawBalance > 0) ? Math.round(rawBalance * (cardFeeRate / 100)) : 0;
            const finalGrandTotal = baseGrandTotal + cardFee;
            const finalBalance = rawBalance + cardFee;

            const isPaid = activeItems.length > 0 && finalBalance === 0 && !isCard;
            const isOverpaid = finalBalance < 0 && !isCard;
            const isUnpaid = finalBalance > 0 && !isCard;
            const customerCredit = currentUser ? (Number(currentUser.credit) || 0) : 0;

            const depositsHistory = currentUser && Array.isArray(currentUser.deposits) && currentUser.deposits.length > 0
                ? currentUser.deposits
                : (depositTotal > 0 ? [{ id: 'dep_sum', time: '', name: (currentUser?.address?.realname || currentUser?.nickname || '입금확인'), amount: depositTotal }] : []);

            const userTrackingList = (() => {
                if (!currentUser) return [];
                if (Array.isArray(currentUser.trackingNumbers) && currentUser.trackingNumbers.length > 0) {
                    return currentUser.trackingNumbers;
                }
                if (currentUser.trackingNumber) {
                    return String(currentUser.trackingNumber).split(/[,\/\n]+/).map(s => s.trim()).filter(Boolean);
                }
                return [];
            })();
            const isAddressLockedByTracking = userTrackingList.length > 0;
            // ✨ 주문서가 열리거나 방송 날짜 탭을 바꿀 때 송장번호(일반 출고송장 + 미송/교반 출고송장)가 있으면 그 자리에서 자동으로 배송흐름을 불러옵니다!
            useEffect(() => {
                if (userTrackingList.length > 0) {
                    userTrackingList.forEach(trk => {
                        const cleanDigits = String(trk).replace(/[^0-9]/g, '');
                        if (cleanDigits) fetchInlineTracking(cleanDigits);
                    });
                }
                if (Array.isArray(customerCsList) && customerCsList.length > 0) {
                    customerCsList.forEach(cs => {
                        if (cs.csTracking) {
                            const cleanDigits = String(cs.csTracking).replace(/[^0-9]/g, '');
                            if (cleanDigits) fetchInlineTracking(cleanDigits);
                        }
                    });
                }
            }, [currentUser, selectedBroadcastIdx, customerCsList]);

            return (
                <div className="w-full flex flex-col items-center">
                    {toastMsg && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-gray-900/95 text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center gap-1.5">
                            <Icon name="check-circle" weight="fill" className="text-green-400" size={15} />
                            <span>{toastMsg}</span>
                        </div>
                    )}

                    {!currentUser ? (
                        <div className="w-full max-w-[420px] min-h-[100dvh] sm:min-h-[760px] bg-[#2c2a29] sm:rounded-2xl shadow-lg border-0 sm:border border-gray-300 relative flex flex-col justify-end overflow-y-auto">
                            <img 
                                src={FIXED_AUTUMN_WINTER_HERO} 
                                fetchpriority="high"
                                decoding="async"
                                onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_COAT_HERO; }}
                                alt="엠버언니 가을겨울 화보" 
                                className="absolute inset-0 w-full h-full object-cover object-top select-none pointer-events-none"
                            />

                            {/* 전체 화보 화면(inset-0) 기준 정중앙에 EMBER 로고 배치 */}
                            <div className="absolute inset-0 z-10 flex items-center justify-center pointer-events-none px-4">
                                <h1 className="text-[#f8f5f0] text-[48px] sm:text-[54px] font-serif tracking-[0.3em] pl-[0.3em] font-medium drop-shadow-2xl translate-y-2" style={{ textShadow: '0 4px 25px rgba(0,0,0,0.75)' }}>EMBER</h1>
                            </div>

                            {/* 하단 반투명 글래스모피즘 로그인 카드 */}
                            <div className="relative z-20 px-3 pb-6 pt-2 safe-bottom mt-auto">
                                <div className="bg-white/55 backdrop-blur-md rounded-2xl p-4 shadow-xl border border-white/70">
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 className="text-[16px] font-black text-gray-900 tracking-tight drop-shadow-sm">
                                            통합주문확인
                                        </h2>
                                        <span className="text-[11px] font-extrabold text-blue-700 flex items-center gap-0.5 drop-shadow-sm">
                                            <Icon name="shield-check" weight="bold" size={14} /> 본인 인증 후 열람가능
                                        </span>
                                    </div>

                                    <form onSubmit={handleLogin} className="space-y-2.5">
                                        <div className="flex items-stretch gap-2">
                                            <div className="flex-1 space-y-2 min-w-0">
                                                <div className="flex items-center gap-2">
                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>닉</span><span>네</span><span>임</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={nickInput}
                                                        onChange={(e) => setNickInput(e.target.value)}
                                                        placeholder="예) 깔로-SD2 ➔ 깔로"
                                                        className="flex-1 min-w-0 px-3 py-2.5 bg-white/85 border border-white/90 rounded-lg text-[14px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>

                                                <div className="flex items-center gap-2">
                                                    <label className="text-[13px] font-extrabold text-gray-900 w-[64px] shrink-0 flex justify-between items-center drop-shadow-sm">
                                                        <span>비</span><span>밀</span><span>번</span><span>호</span><span className="ml-0.5">:</span>
                                                    </label>
                                                    <input 
                                                        type="password"
                                                        inputMode="numeric"
                                                        maxLength={4}
                                                        value={pinInput}
                                                        onChange={(e) => setPinInput(e.target.value.replace(/[^0-9]/g, ""))}
                                                        placeholder="핸드폰번호 뒤 4자리"
                                                        className="flex-1 min-w-0 px-3 py-2.5 bg-white/85 border border-white/90 rounded-lg text-[14px] font-bold text-gray-900 placeholder:text-gray-500 placeholder:font-normal focus:bg-white focus:border-blue-600 outline-none shadow-sm"
                                                    />
                                                </div>
                                            </div>

                                            <button 
                                                type="submit"
                                                disabled={isLoading}
                                                className="w-[84px] shrink-0 bg-gray-950 hover:bg-black active:scale-[0.99] text-white font-extrabold rounded-lg text-[13px] leading-snug shadow-md transition-all flex flex-col items-center justify-center gap-0.5"
                                            >
                                                {isLoading ? (

                                                                                <div className="text-[13px] font-extrabold text-gray-900 bg-gray-50 px-2.5 py-1.5 rounded border border-gray-200">
                                                                                    {cs.refundAccount ? cs.refundAccount : <span className="text-gray-400 font-semibold">우측 상단 [+ 계좌 입력하기]를 눌러 환불계좌를 남겨주세요.</span>}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                )}

                                                                {/* 3. 교반품비 (배송비) 내역이 있는 경우에만 표시 */}
                                                                {Number(cs.csFee) > 0 && (
                                                                    <div className="bg-white p-2.5 rounded-lg border border-gray-200 flex items-center justify-between">
                                                                        <span className="font-extrabold text-gray-800">🚚 교환/반품 배송비</span>
                                                                        <div className="flex items-center gap-1.5">
                                                                            <span className="text-[14px] font-black text-gray-900 tabular-nums">
                                                                                {Number(cs.csFee).toLocaleString()}원
                                                                            </span>
                                                                            <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded ${
                                                                                cs.csFeePaid
                                                                                    ? 'bg-emerald-600 text-white'
                                                                                    : 'bg-red-50 text-red-600 border border-red-200'
                                                                            }`}>
                                                                                {cs.csFeePaid ? '입금확인' : '미입금'}
                                                                            </span>
                                                                        </div>
                                                                    </div>
                                                                )}

                                                                {/* 4. 미송/교환 출고 송장번호가 등록된 경우 표시 */}
                                                                {cs.csTracking && (
                                                                    <div className="bg-red-50/70 p-2.5 rounded-lg border border-red-200 space-y-1.5">
                                                                        <div className="flex items-center justify-between">
                                                                            <div className="flex items-center gap-1.5">
                                                                                <span className="bg-[#E60012] text-white text-[10px] font-black px-1.5 py-0.5 rounded">출고송장</span>
                                                                                <span className="font-black text-gray-900 text-[13.5px] tabular-nums">
                                                                                    {formatTrackingDisplay(cs.csTracking)}
                                                                                </span>
                                                                            </div>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => copyText(csTrackDigits, "송장번호가")}
                                                                                className="bg-white text-gray-800 border border-gray-300 px-2 py-1 rounded text-[11px] font-extrabold"
                                                                            >
                                                                                번호복사
                                                                            </button>
                                                                        </div>
                                                                        {csTrkInfo && (
                                                                            <div className="text-[12px] font-extrabold text-[#E60012] flex items-center gap-1">
                                                                                <Icon name="truck" weight="fill" size={13} />
                                                                                <span>현재상태: {csTrkInfo.stateText || "배송 조회중..."}</span>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                )}

                                {/* 4. 하단 최종 확인 버튼 & 카톡 채널 문의 */}
                                <section className="pt-0.5 space-y-2 safe-bottom">
                                    {currentUser.isConfirmed ? (
                                        <div className="w-full py-3 bg-green-600 text-white font-extrabold rounded-lg text-center text-[14px] flex items-center justify-center gap-1.5 shadow-sm">
                                            <Icon name="check-circle" weight="fill" size={17} />
                                            <span>주문 및 배송지 확정 완료</span>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={handleConfirmOrder}
                                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold rounded-lg text-[14px] shadow-sm flex items-center justify-center gap-1.5 transition-all"
                                        >
                                            <Icon name="check-circle" weight="bold" size={17} />
                                            <span>주문내역·배송지 확정 (터치해야 발송됩니다)</span>
                                        </button>
                                    )}

                                    <a 
                                        href={KAKAO_CHANNEL_URL}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full py-3 bg-[#FEE500] hover:bg-[#FADA0A] text-gray-900 font-extrabold rounded-lg text-[14px] flex items-center justify-center gap-1.5 shadow-sm"
                                    >
                                        <Icon name="chat-circle-dots" weight="fill" size={17} />
                                        <span>품목수정 / 오류 등 카카오채널 연락하기</span>
                                    </a>

                                    {/* 5. 하단 EMBER SISTER OFFICIAL / SYSTEM BY. 깔로AI & 한번 더 당길 때만 가장 바닥에 열리는 사업자정보 */}
                                    <footer className="pt-6 pb-1 text-center select-none">
                                        <div 
                                            onClick={() => setShowBizFooter(prev => !prev)}
                                            className="cursor-pointer inline-flex flex-col items-center py-1 px-4 rounded-xl transition-opacity hover:opacity-85"
                                        >
                                            <div className="text-[11.5px] font-black tracking-[0.24em] text-gray-800 pl-[0.24em]">
                                                EMBER SISTER OFFICIAL
                                            </div>
                                            <div className="mt-1 flex items-center gap-2">
                                                <span className="w-3 h-[1px] bg-gray-300/80"></span>
                                                <span className="text-[10px] font-extrabold tracking-[0.14em] kalo-signature">
                                                    SYSTEM BY. 깔로AI
                                                </span>
                                                <span className="w-3 h-[1px] bg-gray-300/80"></span>
                                            </div>
                                        </div>

                                        {showBizFooter && (
                                            <div className="mt-3 pt-2 border-t border-gray-200/50 text-[9.5px] text-gray-300 leading-tight space-y-0.5 font-normal tracking-tight">
                                                <div>
                                                    상호: {BUSINESS_INFO.companyName} <span className="mx-1 text-gray-200">|</span> 대표자: {BUSINESS_INFO.ceoName} <span className="mx-1 text-gray-200">|</span> 사업자번호: {BUSINESS_INFO.bizNumber}
                                                </div>
                                                <div>
                                                    통신판매업신고: {BUSINESS_INFO.mailOrderNumber} <span className="mx-1 text-gray-200">|</span> 개인정보보호책임자: {BUSINESS_INFO.privacyOfficer}
                                                </div>
                                                <div>
                                                    소재지: {BUSINESS_INFO.address} <span className="mx-1 text-gray-200">|</span> 고객센터: {BUSINESS_INFO.csCenter}
                                                </div>
                                            </div>
                                        )}
                                    </footer>
                                </section>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PortalApp />);
    </script>
</body>
</html>
