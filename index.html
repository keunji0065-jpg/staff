                            </h1>
                        </div>

                        <div className="flex items-center gap-2 flex-wrap flex-1 justify-end">
                            <div className="flex items-center gap-1.5 w-full sm:w-auto sm:min-w-[300px] max-w-md">
                                <div className="relative flex-1">
                                    <Icon name="globe" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-indigo-500" size={14} />
                                    <input
                                        type="text"
                                        value={globalKeyword}
                                        onChange={e => { setGlobalKeyword(e.target.value); if (!e.target.value.trim()) setGlobalSearchResults(null); }}
                                        onKeyDown={e => { if (e.key === 'Enter') handleGlobalSearch(); }}
                                        placeholder="전체 방송 + CS 통합검색 (닉네임/수령인/송장 등)"
                                        className="w-full pl-8 pr-7 py-1.5 bg-indigo-50/50 border border-indigo-200 rounded-lg text-xs font-bold outline-none focus:bg-white focus:border-indigo-600"
                                    />
                                    {globalKeyword && (
                                        <button onClick={() => { setGlobalKeyword(''); setGlobalSearchResults(null); }} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <Icon name="x-circle" weight="fill" size={14} />
                                        </button>
                                    )}
                                </div>
                                <button
                                    onClick={handleGlobalSearch}
                                    disabled={isSearchingGlobal}
                                    className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-extrabold shrink-0 shadow-sm flex items-center gap-1"
                                >
                                    <Icon name="magnifying-glass" weight="bold" />
                                    <span>{isSearchingGlobal ? '검색중...' : '통합검색'}</span>
                                </button>
                            </div>

                            <button
                                onClick={() => { loadInitialTabs(false); loadCsOrders(); loadMasterAddresses(); }}
                                className="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 flex items-center gap-1"
                                title="직원 전용 구글 시트에서 최신 데이터 다시 읽어오기"
                            >
                                <Icon name="arrows-clockwise" weight="bold" className={isLoading ? "animate-spin text-blue-600" : ""} />
                                <span>시트동기화</span>
                            </button>

                            <button
                                onClick={handleSaveAll}
                                disabled={isSaving}
                                className={`px-3.5 py-1.5 rounded-lg text-xs font-extrabold text-white shadow-sm flex items-center gap-1 transition-all ${
                                    hasUnsavedChanges
                                        ? 'bg-amber-600 hover:bg-amber-700 ring-2 ring-amber-300 animate-pulse'
                                        : 'bg-emerald-600 hover:bg-emerald-700'
                                }`}
                            >
                                <Icon name="floppy-disk" weight="fill" />
                                <span>{isSaving ? '저장중...' : (hasUnsavedChanges ? '● 직원시트에 저장 (Ctrl+S)' : '시트 저장 (Ctrl+S)')}</span>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden">
                        {/* 📅 좌측 방송 날짜/이름 목록 사이드바 */}
                        <aside className="w-56 sm:w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 select-none shadow-sm z-10">
                            <div className="p-2.5 border-b border-slate-200 bg-slate-50/70">
                                <button
                                    type="button"
                                    onClick={() => { setActiveMainTab('cs'); setGlobalSearchResults(null); }}
                                    className={`w-full px-3 py-2.5 rounded-xl text-xs font-extrabold flex items-center justify-between transition shadow-sm border ${
                                        activeMainTab === 'cs'
                                            ? 'bg-rose-600 text-white border-rose-700 ring-2 ring-rose-200'
                                            : 'bg-white text-slate-800 border-slate-200 hover:bg-rose-50 hover:border-rose-200'
                                    }`}
                                >
                                    <span className="flex items-center gap-1.5">
                                        <Icon name="arrows-left-right" weight="bold" size={15} className={activeMainTab === 'cs' ? 'text-white' : 'text-rose-600'} />
                                        <span>미송 / 교환 / 반품</span>
                                    </span>
                                    <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-black ${
                                        activeMainTab === 'cs' ? 'bg-white text-rose-600' : 'bg-rose-100 text-rose-700'
                                    }`}>
                                        {csGroups.filter(c => c.csStatus !== '처리완료').length}/{csGroups.length}
                                    </span>
                                </button>
                            </div>

                            <div className="px-3 py-2 border-b border-slate-100 flex items-center justify-between bg-white">
                                <span className="text-[11px] font-extrabold text-slate-500 flex items-center gap-1">
                                    <Icon name="calendar-check" weight="fill" className="text-blue-600" size={14} />
                                    <span>마감된 방송 목록 ({orderTabs.length})</span>
                                </span>
                                {orderTabs.length > 5 && (
                                    <button
                                        type="button"
                                        onClick={() => setCleanupModalOpen(true)}
                                        className="text-[10px] font-extrabold text-slate-400 hover:text-red-600"
                                        title="오래된 방송 시트 정리"
                                    >
                                        🧹 정리
                                    </button>
                                )}
                            </div>

                            <div className="flex-1 overflow-y-auto p-2 space-y-1">
                                {orderTabs.length === 0 ? (
                                    <div className="text-center py-10 px-2 text-xs text-slate-400 leading-relaxed">
                                        등록된 방송 시트가 없습니다.<br/>
                                        사장님 주문서에서 마감하거나 상단 [시트동기화]를 눌러주세요.
                                    </div>
                                ) : (
                                    orderTabs.map((tab) => {
                                        const cleanName = cleanDisplayTabName(tab);
                                        const isSelected = selectedTab === tab && activeMainTab !== 'cs';
                                        const cachedCount = localBroadcastStore[tab]?.groups?.length;
                                        return (
                                            <div
                                                key={tab}
                                                onClick={() => {
                                                    setSelectedTab(tab);
                                                    setLocalSearchTerm('');
                                                    setGlobalSearchResults(null);
                                                    if (activeMainTab === 'cs') setActiveMainTab('orders');
                                                    loadSheetOrders(tab);
                                                }}
                                                className={`w-full text-left px-3 py-2.5 rounded-xl text-xs font-extrabold transition flex items-center justify-between gap-1.5 border cursor-pointer group ${
                                                    isSelected
                                                        ? 'bg-blue-600 text-white border-blue-700 shadow-sm'
                                                        : 'bg-white text-slate-700 border-slate-100 hover:bg-slate-100 hover:border-slate-200'
                                                }`}
                                            >
                                                <div className="flex items-center gap-2 min-w-0 flex-1">
                                                    <span className={`w-2 h-2 rounded-full shrink-0 ${isSelected ? 'bg-amber-300' : 'bg-slate-300'}`}></span>
                                                    <span className="truncate">{cleanName}</span>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0">
                                                    <button
                                                        type="button"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleRenameBroadcast(tab);
                                                        }}
                                                        className={`p-1 rounded transition ${
                                                            isSelected
                                                                ? 'text-blue-100 hover:text-white hover:bg-blue-700'
                                                                : 'text-slate-400 opacity-0 group-hover:opacity-100 hover:text-blue-600 hover:bg-slate-200/70'
                                                        }`}
                                                        title="이 방송 이름 변경"
                                                    >
                                                        <Icon name="pencil-simple" weight="bold" size={12} />
                                                    </button>
                                                    {cachedCount !== undefined && (

                                                            isSelected ? 'bg-blue-700 text-blue-100' : 'bg-slate-100 text-slate-500'
                                                        }`}>
                                                            {cachedCount}명

                                                    )}

                        <div className="flex-1 flex flex-col overflow-hidden">

                                <div className="flex items-center gap-2 flex-wrap">
                                    {activeMainTab === 'cs' ? (

                                            <button

                                                onClick={() => handleRenameBroadcast(selectedTab)}
                                                className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-black px-2.5 py-1 rounded-lg shadow-sm flex items-center gap-1.5 transition"

                                                <button

                                                    className={`px-3 py-1 rounded-md text-xs font-extrabold transition ${activeMainTab === 'orders' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}

                                                    className={`px-3 py-1 rounded-md text-xs font-extrabold transition ${activeMainTab === 'export' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}

                                                                    <div className="flex items-center gap-2.5 shrink-0 text-xs font-bold text-slate-700">
                                                                        <span>{it.qty}개</span>
                                                                        <span className="w-20 text-right tabular-nums">{Number(it.price || 0).toLocaleString()}원</span>
                                                                        <select
                                                                            value={tag}
                                                                            onChange={e => {
                                                                                const nextTag = e.target.value;
                                                                                setCsGroups(prev => prev.map(x => x.id !== cs.id ? x : {
                                                                                    ...x,
                                                                                    items: x.items.map((item, i) => i === idx ? { ...item, csTag: nextTag } : item)
                                                                                }));
                                                                                setHasUnsavedChanges(true);
                                                                            }}
                                                                            className={`px-2 py-0.5 rounded text-[11px] font-extrabold border outline-none cursor-pointer shrink-0 ${
                                                                                tag === '미송' ? 'bg-purple-100 text-purple-800 border-purple-400' :
                                                                                tag === '교환' ? 'bg-blue-50 text-blue-700 border-blue-300' :
                                                                                tag === '반품' ? 'bg-rose-50 text-rose-700 border-rose-300' :
                                                                                tag === '불량/오배송' ? 'bg-red-600 text-white border-red-700' :
                                                                                'bg-white text-slate-500 border-slate-200'
                                                                            }`}
                                                                        >
                                                                            <option value="정상">정상유지</option>
                                                                            <option value="미송">📦 미송(발송대기)</option>
                                                                            <option value="교환">🔄 교환요청</option>
                                                                            <option value="반품">↩️ 반품요청</option>
                                                                            <option value="불량/오배송">🚨 불량/오배송</option>
                                                                        </select>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* 하단 입력 바: 1) 메모  2) 계좌번호 + 환불예정 + 교반품비 모두 한 줄 배치 */}
                                                    <div className="bg-slate-50/80 border-t border-slate-200 px-3.5 py-2.5 flex flex-col gap-2 text-xs">
                                                        {/* 1열: 미송/CS 메모 */}
                                                        <div className="flex items-center gap-1.5 w-full">
                                                            <span className="font-extrabold text-slate-600 shrink-0 w-16 whitespace-nowrap">📝 상세메모:</span>
                                                            <input
                                                                type="text"
                                                                value={cs.csMemo || ''}
                                                                onChange={e => {
                                                                    setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, csMemo: e.target.value } : x));
                                                                    setHasUnsavedChanges(true);
                                                                }}
                                                                placeholder="미송 입고예정일(예: 10/25 입고 후 출고), 부분선발송 여부, 교환/반품 사유 등 입력"
                                                                className="flex-1 bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-800 outline-none focus:border-blue-600"
                                                            />
                                                        </div>

                                                        {/* 2열: 계좌번호 + 환불예정(환불대기/완료) + 교반품비(미입금/입금됨) 한 줄 통합 배치 */}
                                                        <div className="flex flex-wrap lg:flex-nowrap items-center gap-3 w-full">
                                                            {/* 환불 계좌번호 */}
                                                            <div className="flex items-center gap-1.5 flex-1 min-w-[240px]">
                                                                <span className="font-extrabold text-slate-600 shrink-0 w-16 whitespace-nowrap">🏦 계좌번호:</span>
                                                                <input
                                                                    type="text"
                                                                    value={cs.refundAccount !== undefined ? cs.refundAccount : splitCsMemoAndAccount(cs.csMemo).accountOnly}
                                                                    onChange={e => {
                                                                        const val = e.target.value;
                                                                        setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, refundAccount: val } : x));
                                                                        setHasUnsavedChanges(true);
                                                                    }}
                                                                    placeholder="은행 / 계좌번호 / 예금주 입력"
                                                                    className="flex-1 min-w-0 bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-800 outline-none focus:border-blue-600"
                                                                />
                                                                {(cs.refundAccount || splitCsMemoAndAccount(cs.csMemo).accountOnly) && (
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => {
                                                                            const acc = cs.refundAccount || splitCsMemoAndAccount(cs.csMemo).accountOnly;
                                                                            copyToClipboard(acc);
                                                                            showToast('계좌번호 복사됨');
                                                                        }}
                                                                        className="px-2.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-extrabold text-[11px] shrink-0 whitespace-nowrap"
                                                                        title="계좌번호 복사"
                                                                    >
                                                                        복사
                                                                    </button>
                                                                )}
                                                            </div>

                                                            {/* 환불예정 입력칸 + 환불완료 토글 */}
                                                            <div className="flex items-center gap-1.5 shrink-0">
                                                                <span className="font-extrabold text-rose-700 shrink-0 whitespace-nowrap">💸 환불예정:</span>
                                                                <div className="relative flex items-center w-28 shrink-0">
                                                                    <input
                                                                        type="text"
                                                                        value={displayRefundAmt > 0 ? Number(displayRefundAmt).toLocaleString() : ''}
                                                                        onChange={e => {
                                                                            const raw = e.target.value.replace(/[^0-9]/g, '');
                                                                            const num = raw ? Number(raw) : 0;
                                                                            setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, refundAmount: num } : x));
                                                                            setHasUnsavedChanges(true);
                                                                        }}
                                                                        placeholder="0"
                                                                        className="w-full bg-white border border-rose-300 rounded-lg pl-2.5 pr-6 py-1.5 text-xs font-extrabold text-right text-rose-700 outline-none focus:border-rose-500"
                                                                    />
                                                                    <span className="absolute right-2 text-[10px] text-rose-400 font-bold pointer-events-none">원</span>
                                                                </div>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => {
                                                                        setCsGroups(prev => prev.map(x => x.id === cs.id ? {
                                                                            ...x,
                                                                            refundCompleted: !x.refundCompleted
                                                                        } : x));
                                                                        setHasUnsavedChanges(true);
                                                                    }}
                                                                    className={`px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold border shrink-0 whitespace-nowrap transition ${
                                                                        cs.refundCompleted
                                                                            ? 'bg-blue-600 text-white border-blue-700 shadow-sm'
                                                                            : 'bg-white text-slate-500 border-slate-300 hover:bg-slate-100'
                                                                    }`}
                                                                    title="환불 이체 완료 여부"
                                                                >
                                                                    {cs.refundCompleted ? '환불완료' : '환불대기'}
                                                                </button>
                                                            </div>

                                                            {/* 교반품비 (배송비) + 입금여부 */}
                                                            <div className="flex items-center gap-1.5 shrink-0">
                                                                <span className="font-extrabold text-slate-600 shrink-0 whitespace-nowrap">🚚 교반품비:</span>
                                                                <div className="relative flex items-center w-24 shrink-0">
                                                                    <input
                                                                        type="text"
                                                                        value={Number(cs.shipping || 0) > 0 ? Number(cs.shipping).toLocaleString() : ''}
                                                                        onChange={e => {
                                                                            const raw = e.target.value.replace(/[^0-9]/g, '');
                                                                            const num = raw ? Number(raw) : 0;
                                                                            setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, shipping: num } : x));
                                                                            setHasUnsavedChanges(true);
                                                                        }}
                                                                        placeholder="0"
                                                                        className="w-full bg-white border border-slate-300 rounded-lg pl-2.5 pr-6 py-1.5 text-xs font-extrabold text-right text-slate-800 outline-none focus:border-blue-600"
                                                                    />
                                                                    <span className="absolute right-2 text-[10px] text-slate-400 font-bold pointer-events-none">원</span>
                                                                </div>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => {
                                                                        setCsGroups(prev => prev.map(x => x.id === cs.id ? {
                                                                            ...x,
                                                                            csFeePaid: !x.csFeePaid,
                                                                            deposit: !x.csFeePaid ? (Number(x.shipping) || 4000) : 0
                                                                        } : x));
                                                                        setHasUnsavedChanges(true);
                                                                    }}
                                                                    className={`px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold border shrink-0 whitespace-nowrap transition ${
                                                                        cs.csFeePaid
                                                                            ? 'bg-emerald-600 text-white border-emerald-700'
                                                                            : 'bg-white text-slate-500 border-slate-300 hover:bg-slate-100'
                                                                    }`}
                                                                    title="교반품비(택배비) 입금 확인 여부"
                                                                >
                                                                    {cs.csFeePaid ? '입금됨' : '미입금'}
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeMainTab === 'tracking' && (
                            <div className="w-full bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-sm my-2">
                                <div className="w-14 h-14 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-3">
                                    <Icon name="truck" weight="fill" size={32} />
                                </div>
                                <h2 className="text-base font-black text-slate-900 mb-1">
                                    [{selectedTab.replace(/^주문_/, '')}] 롯데택배 운송장 엑셀 일괄 등록
                                </h2>
                                <p className="text-xs text-slate-500 mb-6 leading-relaxed">
                                    롯데택배 출고 엑셀 파일(수하인명/닉네임/연락처 + 운송장번호 열 포함)을 업로드하면<br/>
                                    현재 선택된 방송 주문서 화면에 송장번호가 자동 매칭되며, 확인 후 [시트 저장 (Ctrl+S)]을 누르면 저장됩니다.
                                </p>
                                <input type="file" accept=".xlsx,.xls,.csv" ref={trackingExcelRef} onChange={handleTrackingExcelUpload} className="hidden" />
                                <button
                                    onClick={() => trackingExcelRef.current?.click()}
                                    className="px-6 py-3.5 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl text-sm shadow-md inline-flex items-center gap-2"
                                >
                                    <Icon name="upload-simple" weight="bold" size={18} />
                                    <span>롯데택배 송장 엑셀 파일 선택 (.xlsx)</span>
                                </button>
                            </div>
                        )}

                        {activeMainTab === 'export' && (
                            <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-4 my-2">
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-sm">
                                    <h3 className="text-sm font-black text-slate-900 mb-1">📋 발주용 품목 집계 엑셀</h3>
                                    <p className="text-xs text-slate-500 mb-4">상품별 입금완료 수량 / 미입금 수량 요약 (품절대기 제외)</p>
                                    <button
                                        onClick={handleExportProductsExcel}
                                        className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-xl text-xs shadow"
                                    >
                                        발주리스트 엑셀 다운로드
                                    </button>
                                </div>
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-sm">
                                    <h3 className="text-sm font-black text-slate-900 mb-1">🚚 배송용 고객 정산 리스트 엑셀</h3>
                                    <p className="text-xs text-slate-500 mb-4">고객별 결제상태 · 주소 · 주문품목 · 대기순번 · 송장번호 포함</p>
                                    <button
                                        onClick={handleExportCustomersExcel}
                                        className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-xs shadow"
                                    >
                                        배송리스트 엑셀 다운로드
                                    </button>
                                </div>
                            </div>
                        )}
                            </main>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StaffTrackingApp />);
    </script>
</body>
</html>
