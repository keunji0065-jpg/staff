                                                                                realname: existingSameCust?.realname || cur.realname || mAddr?.realname || '',
                                                                                phone: existingSameCust?.phone || cur.phone || cleanPh,
                                                                                address: existingSameCust?.address || cur.address || stripZipcode(mAddr?.address || ''),
                                                                                memo: existingSameCust?.memo || cur.memo || mAddr?.memo || '',
                                                                                pin: existingSameCust?.pin || cur.pin || (cleanPh.length >= 4 ? cleanPh.slice(-4) : ''),
                                                                                shipping: existingSameCust !== undefined ? existingSameCust.shipping : cur.shipping,
                                                                                isShipPaid: existingSameCust !== undefined ? Boolean(existingSameCust.isShipPaid) : Boolean(cur.isShipPaid)
                                                                            }));
                                                                        }}
                                                                        onKeyDown={e => {
                                                                            if (e.key === 'Tab' && !e.shiftKey) {
                                                                                e.preventDefault();
                                                                                focusLiveField(row.id, 'pin');
                                                                            } else if (e.key === 'Tab' && e.shiftKey && rowIdx > 0) {
                                                                                e.preventDefault();
                                                                                focusLiveField(sortedLiveOrderRows[rowIdx - 1].id, 'ship');
                                                                            } else if (e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                focusLiveField(row.id, 'prod');
                                                                            }
                                                                        }}
                                                                        placeholder="닉네임"
                                                                        className="w-full border border-slate-300 rounded px-2 py-1 font-extrabold text-slate-900 outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-500"
                                                                    />
                                                                </td>
                                                                <td className="py-1.5 px-1.5">
                                                                    <input
                                                                        id={`live-pin-${row.id}`}
                                                                        type="text"
                                                                        maxLength={4}
                                                                        value={row.pin}
                                                                        onFocus={e => e.target.select()}
                                                                        onChange={e => updateLiveOrderRow(row.id, cur => ({ ...cur, pin: e.target.value.replace(/[^0-9]/g, '') }))}
                                                                        onKeyDown={e => {
                                                                            if ((e.key === 'Tab' && !e.shiftKey) || e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                focusLiveField(row.id, 'prod');
                                                                            } else if (e.key === 'Tab' && e.shiftKey) {
                                                                                e.preventDefault();
                                                                                focusLiveField(row.id, 'nick');
                                                                            }
                                                                        }}
                                                                        placeholder="뒷4자리"
                                                                        className="w-full border border-blue-200 bg-blue-50/50 rounded px-1.5 py-1 text-center font-extrabold text-blue-700 outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-500"
                                                                    />
                                                                </td>
                                                                <td className="py-1.5 px-2 relative">
                                                                    <input
                                                                        id={`live-prod-${row.id}`}
                                                                        type="text"
                                                                        value={row.product}
                                                                        onFocus={e => {
                                                                            setActiveSuggestRowId(row.id);
                                                                            e.target.select();
                                                                        }}
                                                                        onBlur={() => {
                                                                            setTimeout(() => setActiveSuggestRowId(null), 180);
                                                                            if (row.product && String(row.product).trim()) {
                                                                                syncNewProductFromOrderRowToLineup(row.product, row.price);
                                                                            }
                                                                        }}
                                                                        onChange={e => {
                                                                            const val = e.target.value;
                                                                            const exactInv = liveInventory.find(it => it.name === val.trim());
                                                                            updateLiveOrderRow(row.id, cur => ({
                                                                                ...cur,
                                                                                product: val,
                                                                                price: exactInv ? exactInv.price : cur.price
                                                                            }));
                                                                        }}
                                                                        onKeyDown={e => {
                                                                            if (e.key === 'Tab' && !e.shiftKey) {
                                                                                e.preventDefault();
                                                                                if (row.product && String(row.product).trim()) {
                                                                                    syncNewProductFromOrderRowToLineup(row.product, row.price);
                                                                                }
                                                                                setActiveSuggestRowId(null);
                                                                                focusLiveField(row.id, 'qty');
                                                                            } else if (e.key === 'Tab' && e.shiftKey) {
                                                                                e.preventDefault();
                                                                                setActiveSuggestRowId(null);
                                                                                focusLiveField(row.id, 'pin');
                                                                            } else if (e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                if (matchingInvs.length > 0) {
                                                                                    const picked = matchingInvs[0];
                                                                                    updateLiveOrderRow(row.id, cur => ({
                                                                                        ...cur,
                                                                                        product: picked.name,
                                                                                        price: picked.price
                                                                                    }));
                                                                                } else if (row.product && String(row.product).trim()) {
                                                                                    syncNewProductFromOrderRowToLineup(row.product, row.price);
                                                                                }
                                                                                setActiveSuggestRowId(null);
                                                                                focusLiveField(row.id, 'qty');
                                                                            }
                                                                        }}
                                                                        placeholder="상품명 입력 (미등록 상품 자동추가)"
                                                                        className="w-full border border-slate-300 rounded px-2 py-1 font-bold text-slate-800 outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-500"
                                                                    />
                                                                    {matchingInvs.length > 0 && (
                                                                        <div className="absolute left-2 right-2 top-full mt-0.5 bg-white border border-blue-300 rounded-lg shadow-xl z-50 divide-y divide-slate-100">
                                                                            {matchingInvs.map(inv => (
                                                                                <button
                                                                                    key={inv.id}
                                                                                    type="button"
                                                                                    tabIndex={-1}
                                                                                    onMouseDown={() => {
                                                                                        updateLiveOrderRow(row.id, cur => ({
                                                                                            ...cur,
                                                                                            product: inv.name,
                                                                                            price: inv.price
                                                                                        }));
                                                                                        setActiveSuggestRowId(null);
                                                                                        setTimeout(() => focusLiveField(row.id, 'qty'), 20);
                                                                                    }}
                                                                                    className="w-full text-left px-2.5 py-1.5 hover:bg-blue-50 flex items-center justify-between text-xs font-extrabold"
                                                                                >
                                                                                    <span className="truncate text-slate-900">{inv.name}</span>
                                                                                    <span className="text-blue-600 shrink-0 ml-2">{Number(inv.price).toLocaleString()}원</span>
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                </td>
                                                                <td className="py-1.5 px-1.5">
                                                                    <input
                                                                        id={`live-qty-${row.id}`}
                                                                        type="number"
                                                                        min={1}
                                                                        value={row.qty}
                                                                        onFocus={e => e.target.select()}
                                                                        onChange={e => updateLiveOrderRow(row.id, cur => ({ ...cur, qty: Math.max(1, Number(e.target.value) || 1) }))}
                                                                        onKeyDown={e => {
                                                                            if ((e.key === 'Tab' && !e.shiftKey) || e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                focusLiveField(row.id, 'price');
                                                                            } else if (e.key === 'Tab' && e.shiftKey) {
                                                                                e.preventDefault();
                                                                                focusLiveField(row.id, 'prod');
                                                                            }
                                                                        }}
                                                                        className="w-full border border-slate-300 rounded px-1.5 py-1 text-center font-extrabold outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-500"
                                                                    />
                                                                </td>
                                                                <td className="py-1.5 px-2">
                                                                    <input
                                                                        id={`live-price-${row.id}`}
                                                                        type="text"
                                                                        value={row.price ? Number(row.price).toLocaleString() : ''}
                                                                        onFocus={e => e.target.select()}
                                                                        onChange={e => {
                                                                            const raw = e.target.value.replace(/[^0-9-]/g, '');
                                                                            updateLiveOrderRow(row.id, cur => ({ ...cur, price: Number(raw) || 0 }));
                                                                        }}
                                                                        onBlur={() => {
                                                                            if (row.product && String(row.product).trim()) {
                                                                                syncNewProductFromOrderRowToLineup(row.product, row.price);
                                                                            }
                                                                        }}
                                                                        onKeyDown={e => {
                                                                            if ((e.key === 'Tab' && !e.shiftKey) || e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                if (row.product && String(row.product).trim()) {
                                                                                    syncNewProductFromOrderRowToLineup(row.product, row.price);
                                                                                }
                                                                                if (isPrimaryShippingRow) {
                                                                                    focusLiveField(row.id, 'ship');
                                                                                } else if (rowIdx + 1 < sortedLiveOrderRows.length) {
                                                                                    focusLiveField(sortedLiveOrderRows[rowIdx + 1].id, 'nick');
                                                                                } else {
                                                                                    e.target.blur();
                                                                                }
                                                                            } else if (e.key === 'Tab' && e.shiftKey) {
                                                                                e.preventDefault();
                                                                                focusLiveField(row.id, 'qty');
                                                                            }
                                                                        }}
                                                                        placeholder="0"
                                                                        className="w-full border border-slate-300 rounded px-2 py-1 text-right font-extrabold outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-500"
                                                                    />
                                                                </td>
                                                                <td className="py-1.5 px-2">
                                                                    {isPrimaryShippingRow ? (
                                                                        <div className="flex items-center gap-1">
                                                                            <input
                                                                                id={`live-ship-${row.id}`}
                                                                                type="text"
                                                                                value={row.shipping !== undefined ? Number(row.shipping).toLocaleString() : '0'}
                                                                                onFocus={e => e.target.select()}
                                                                                onChange={e => {
                                                                                    const raw = e.target.value.replace(/[^0-9]/g, '');
                                                                                    updateLiveOrderRow(row.id, cur => ({ ...cur, shipping: raw === '' ? 0 : Number(raw) }));
                                                                                }}
                                                                                onKeyDown={e => {
                                                                                    if (e.key === 'Tab' && !e.shiftKey) {
                                                                                        if (rowIdx + 1 < sortedLiveOrderRows.length) {
                                                                                            e.preventDefault();
                                                                                            focusLiveField(sortedLiveOrderRows[rowIdx + 1].id, 'nick');
                                                                                        }
                                                                                    } else if (e.key === 'Tab' && e.shiftKey) {
                                                                                        e.preventDefault();
                                                                                        focusLiveField(row.id, 'price');
                                                                                    } else if (e.key === 'Enter') {
                                                                                        e.preventDefault();
                                                                                        e.target.blur();
                                                                                    }
                                                                                }}
                                                                                className="w-14 border border-slate-300 rounded px-1.5 py-1 text-right font-bold text-slate-700 outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-500"
                                                                            />
                                                                            <button
                                                                                type="button"
                                                                                tabIndex={-1}
                                                                                onClick={() => updateLiveOrderRow(row.id, cur => ({ ...cur, isShipPaid: !cur.isShipPaid }))}
                                                                                className={`px-1.5 py-1 rounded text-[10px] font-extrabold border shrink-0 transition ${
                                                                                    Number(row.shipping || 0) === 0
                                                                                        ? 'bg-slate-100 text-slate-400 border-slate-200'
                                                                                        : row.isShipPaid
                                                                                            ? 'bg-teal-600 text-white border-teal-700 shadow-sm'
                                                                                            : 'bg-white text-slate-500 border-slate-300 hover:bg-slate-100'
                                                                                }`}
                                                                                title="배송비 입금확인 토글 (동일 닉네임 1회만 적용)"
                                                                            >
                                                                                {Number(row.shipping || 0) === 0 ? '무배' : (row.isShipPaid ? '✔배입금' : '배미납')}
                                                                            </button>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="flex items-center justify-center py-1 px-1.5 rounded bg-slate-100 border border-slate-200 text-[10px] font-extrabold text-slate-500" title="동일 닉네임 첫 줄에 배송비가 이미 적용되어 합배송(0원) 처리됩니다">
                                                                            합배송(1회적용)
                                                                        </div>
                                                                    )}
                                                                </td>
                                                                <td className="py-1.5 px-2 text-center">
                                                                    <button
                                                                        type="button"
                                                                        tabIndex={-1}
                                                                        onClick={() => updateLiveOrderRow(row.id, cur => ({ ...cur, isPaid: !cur.isPaid }))}
                                                                        className={`w-full py-1 rounded font-extrabold text-[11px] border transition ${
                                                                            row.isPaid
                                                                                ? 'bg-emerald-600 text-white border-emerald-700 shadow-sm'
                                                                                : 'bg-white text-slate-500 border-slate-300 hover:bg-slate-100'
                                                                        }`}
                                                                    >
                                                                        {row.isPaid ? '✔ 입금됨' : '미납'}
                                                                    </button>
                                                                </td>
                                                                <td className="py-1.5 px-2">
                                                                    <button
                                                                        type="button"
                                                                        tabIndex={-1}
                                                                        onClick={() => {
                                                                            if (!row.nick) return openModal('먼저 닉네임을 입력해 주세요.');
                                                                            setLiveAddrEditNick(row.nick);
                                                                        }}
                                                                        className="w-full text-left truncate px-1.5 py-1 rounded hover:bg-slate-100 transition"
                                                                        title="클릭하여 찐고객사전 주소 검색 또는 배송지 직접 수정"
                                                                    >
                                                                        {row.address ? (
                                                                            <span className="text-[11px] font-extrabold text-emerald-700 truncate block max-w-[140px]">
                                                                                🏠 {row.realname || row.nick} ({row.address})
                                                                            </span>
                                                                        ) : (
                                                                            <span className="text-[11px] font-bold text-blue-600 underline">
                                                                                + 배송지 검색/입력
                                                                            </span>
                                                                        )}
                                                                    </button>
                                                                </td>
                                                                <td className="py-1.5 px-1 text-center">
                                                                    <button
                                                                        type="button"
                                                                        tabIndex={-1}
                                                                        onClick={() => {
                                                                            const next = liveOrderRows.filter(r => r.id !== row.id);
                                                                            setLiveOrderRows(next);
                                                                            syncStaffLiveRowsToPortal(next, liveBroadcastTitle, isStaffLiveActive);
                                                                        }}
                                                                        className="text-slate-300 hover:text-red-600 p-1"
                                                                    >
                                                                        <Icon name="trash" weight="bold" />
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* 3열: 라인업(실시간 재고) 목록 — 클릭시 상품명 복사 & 품절 직접 토글 */}
                                <div className="w-64 sm:w-72 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col shrink-0 overflow-hidden">
                                    <div className="p-2.5 bg-slate-100 border-b border-slate-200 space-y-2 shrink-0">
                                        <div className="flex items-center justify-between gap-1">
                                            <span className="text-xs font-extrabold text-slate-800">
                                                🏷️ 방송 라인업 ({liveInventory.length})
                                            </span>
                                            <div className="flex items-center gap-1">
                                                <button
                                                    type="button"
                                                    onClick={loadLiveInventoryFromMaster}
                                                    className="px-1.5 py-0.5 bg-white hover:bg-blue-50 text-blue-600 border border-blue-200 rounded text-[10px] font-extrabold transition"
                                                >
                                                    ↻ 새로고침
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={handleClearLiveInventory}
                                                    className="px-1.5 py-0.5 bg-red-500 hover:bg-red-600 text-white rounded text-[10px] font-extrabold shadow-sm transition"
                                                    title="방송 라인업 상품 목록 전체 비우기"
                                                >
                                                    비우기
                                                </button>
                                            </div>
                                        </div>
                                        <form
                                            onSubmit={e => {
                                                e.preventDefault();
                                                const n = newLiveInvName.trim();
                                                const p = Number(String(newLiveInvPrice).replace(/[^0-9]/g, '')) || 0;
                                                if (!n) return;
                                                const next = [{ id: `linv_${Date.now()}`, name: n, price: p, isSoldOut: false }, ...liveInventory];
                                                handleSaveLiveInventoryToSheet(next);
                                                setNewLiveInvName('');
                                                setNewLiveInvPrice('');
                                            }}
                                            className="flex gap-1"
                                        >
                                            <input
                                                type="text"
                                                value={newLiveInvName}
                                                onChange={e => setNewLiveInvName(e.target.value)}
                                                placeholder="01 상품명"
                                                className="flex-1 min-w-0 border border-slate-300 rounded px-2 py-1 text-[11px] font-bold outline-none"
                                            />
                                            <input
                                                type="text"
                                                value={newLiveInvPrice}
                                                onChange={e => {
                                                    const v = e.target.value.replace(/[^0-9]/g, '');
                                                    setNewLiveInvPrice(v ? Number(v).toLocaleString() : '');
                                                }}
                                                placeholder="단가"
                                                className="w-16 border border-slate-300 rounded px-1.5 py-1 text-[11px] text-right font-bold outline-none"
                                            />
                                            <button type="submit" className="px-2 py-1 bg-blue-600 text-white rounded text-[11px] font-extrabold shrink-0">
                                                등록
                                            </button>
                                        </form>
                                    </div>
                                    <div className="flex-1 overflow-y-auto divide-y divide-slate-100 p-1.5">
                                        {liveInventory.map(inv => (
                                            <div key={inv.id} className="py-1.5 px-2 flex items-center justify-between gap-1.5 hover:bg-slate-50 rounded group">
                                                <div
                                                    onClick={() => {
                                                        copyToClipboard(inv.name);
                                                        showToast(`📋 '${inv.name}' 복사됨`);
                                                    }}
                                                    className="flex-1 min-w-0 cursor-pointer"
                                                    title="클릭하여 상품명 복사"
                                                >
                                                    <div className={`text-xs font-extrabold truncate ${inv.isSoldOut ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                                        {inv.name}
                                                    </div>
                                                    <div className="text-[11px] font-bold text-blue-600">
                                                        {Number(inv.price).toLocaleString()}원
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0">
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            const next = liveInventory.map(x => x.id === inv.id ? { ...x, isSoldOut: !x.isSoldOut } : x);
                                                            handleSaveLiveInventoryToSheet(next);
                                                        }}
                                                        className={`px-2 py-1 rounded text-[10px] font-extrabold shrink-0 transition ${
                                                            inv.isSoldOut
                                                                ? 'bg-red-600 text-white'
                                                                : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
                                                        }`}
                                                    >
                                                        품절
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            const next = liveInventory.filter(x => x.id !== inv.id);
                                                            handleSaveLiveInventoryToSheet(next);
                                                            showToast(`🗑️ '${inv.name}' 상품이 라인업에서 삭제되었습니다.`);
                                                        }}
                                                        className="p-1 text-slate-300 hover:text-red-600 rounded transition"
                                                        title="이 상품 삭제"
                                                    >
                                                        <Icon name="trash" weight="bold" size={13} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                            </main>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StaffTrackingApp />);
    </script>
</body>
</html>
