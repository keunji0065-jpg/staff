<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202124">
    <title>강은지 직원용 시스템(v2.41)</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
        @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo/nanumsquareneo.css");
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'NanumSquareNeo', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        #root { height: 100%; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const APP_VERSION = "v2.41";
        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwRdlzvE-FN9R7mMXGiVSoHXDx1dmbi-XEtviDDsCAAlFr1K1pj2lp_jTkd_pQ4tZ8v/exec';
        const DEFAULT_MASTER_SHEET_ID = '1B8SBMX18_Px1CpRHuDTxqodqudiTrf6NfVoptjHtnGQ';

        const Icon = ({ name, className = "", weight = "regular", size = 15 }) => (
            <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{ fontSize: size }}></i>
        );

        const normalizeString = (str) => String(str || '').replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, '').toLowerCase();

        const fixPhoneNumber = (numStr) => {
            if (!numStr) return '';
            let cleaned = String(numStr).replace(/[^0-9]/g, '');
            if (cleaned.length === 10 && !cleaned.startsWith('0')) cleaned = '0' + cleaned;
            return cleaned;
        };

        // 시스템/기타 시트(메인주문, 시트4, 재고단가, 닉네임 등)는 제외하고 오직 '주문_' 방송 시트만 남긴 뒤 항상 '주문_방송명' 형태로 정규화
        const EXCLUDED_SYSTEM_TABS = new Set([
            '메인주문', '찐고객사전', '실시간재고', '고객상태관리', '방송별상품보관함',
            '채팅기록', '교환반품CS', '재고단가', '닉네임',
            '시트1', '시트2', '시트3', '시트4', '시트5', 'Sheet1', 'Sheet2'
        ]);

        const toCanonicalOrderTab = (name) => {
            const s = String(name || '').trim();
            if (!s) return null;
            if (s.startsWith('주문_')) return s;
            if (EXCLUDED_SYSTEM_TABS.has(s)) return null;
            if (/^(시트|sheet)\s*\d*$/i.test(s)) return null;
            if (s.includes('재고') || s.includes('사전') || s.includes('채팅') || s.includes('고객상태') || s.includes('교환반품') || s === '닉네임') return null;
            // 구버전 스크립트가 앞의 '주문_'을 떼고 보냈더라도 다시 '주문_'을 붙여서 정확히 '주문_' 시트를 가리키도록 복원
            return '주문_' + s;
        };

        const pickRowField = (row, keys, fallbackIdx = -1) => {
            if (!row || typeof row !== 'object') return '';
            for (let i = 0; i < keys.length; i++) {
                const k = keys[i];
                if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
                    return row[k];
                }
            }
            const rowKeys = Object.keys(row);
            for (let i = 0; i < keys.length; i++) {
                const targetNorm = normalizeString(keys[i]);
                const foundKey = rowKeys.find(rk => normalizeString(rk) === targetNorm || normalizeString(rk).includes(targetNorm));
                if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null && String(row[foundKey]).trim() !== '') {
                    return row[foundKey];
                }
            }
            if (fallbackIdx >= 0 && row[`col_${fallbackIdx}`] !== undefined) {
                return row[`col_${fallbackIdx}`];
            }
            return '';
        };

        const fetchGas = async (url, payload = null, timeoutMs = 14000) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const options = { method: payload ? 'POST' : 'GET', redirect: "follow", signal: controller.signal };
            if (payload) {
                options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                options.body = JSON.stringify(payload);
            }
            try {
                const res = await fetch(url, options);
                clearTimeout(timer);
                const text = await res.text();
                return JSON.parse(text);
            } catch (err) {
                clearTimeout(timer);
                return { status: 'error', message: err.message || '통신 실패' };
            }
        };

        const downloadExcel = (data, fileName) => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `${fileName}_${new Date().toLocaleDateString('ko-KR')}.xlsx`);
        };

        const CustomModal = ({ modal, onClose }) => {
            const [val, setVal] = useState(modal.defaultValue || '');
            useEffect(() => { setVal(modal.defaultValue || ''); }, [modal]);
            if (!modal.isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-sm mx-4 border border-slate-200" onClick={e => e.stopPropagation()}>
                        <h3 className="text-base font-extrabold text-slate-800 mb-2">{modal.title || '알림'}</h3>
                        <p className="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed mb-4">{modal.message}</p>
                        {modal.type === 'prompt' && (
                            <input
                                type="text"
                                value={val}
                                onChange={e => setVal(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Enter') { modal.onConfirm && modal.onConfirm(val); onClose(); } }}
                                autoFocus
                                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold mb-4 outline-none focus:border-blue-600"
                            />
                        )}
                        <div className="flex gap-2">
                            {modal.type !== 'alert' && (
                                <button onClick={onClose} className="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">취소</button>
                            )}
                            <button
                                onClick={() => { modal.onConfirm && modal.onConfirm(modal.type === 'prompt' ? val : true); onClose(); }}
                                className="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-800 text-white hover:bg-slate-900"
                            >
                                확인
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AddressEditModal = ({ isOpen, group, onClose, onSave }) => {
            const [realname, setRealname] = useState('');
            const [phone, setPhone] = useState('');
            const [zipcode, setZipcode] = useState('');
            const [baseAddr, setBaseAddr] = useState('');
            const [detailAddr, setDetailAddr] = useState('');
            const [memo, setMemo] = useState('');

            useEffect(() => {
                if (isOpen && group) {
                    setRealname(group.realname || '');
                    setPhone(group.phone || '');
                    const rawAddr = String(group.address || '').trim();
                    const zipMatch = rawAddr.match(/^\((\d{5})\)\s*(.*)$/);
                    setZipcode(zipMatch ? zipMatch[1] : '');
                    setBaseAddr(zipMatch ? zipMatch[2] : rawAddr);
                    setDetailAddr('');
                    setMemo(group.memo || '');
                }
            }, [isOpen, group]);

            if (!isOpen || !group) return null;

            const handleSearchPostcode = () => {
                if (!window.daum || !window.daum.Postcode) return;
                new window.daum.Postcode({
                    oncomplete: function(data) {
                        let full = data.address;
                        let extra = '';
                        if (data.addressType === 'R') {
                            if (data.bname !== '') extra += data.bname;
                            if (data.buildingName !== '') extra += (extra !== '' ? ', ' + data.buildingName : data.buildingName);
                            if (extra !== '') full += ` (${extra})`;
                        }
                        setZipcode(data.zonecode);
                        setBaseAddr(full);
                    }
                }).open();
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const zipPrefix = zipcode ? `(${zipcode}) ` : '';
                const combinedAddr = `${zipPrefix}${baseAddr} ${detailAddr}`.trim();
                onSave({
                    realname: realname.trim(),
                    phone: fixPhoneNumber(phone),
                    address: combinedAddr,
                    memo: memo.trim()
                });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center pb-3 mb-3 border-b border-slate-200">
                            <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
                                <Icon name="house-line" weight="fill" className="text-blue-600" />
                                <span>'{group.nick}' 배송지 수정</span>
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" weight="bold" size={18}/></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="block font-bold text-slate-600 mb-1">수령인명</label>
                                    <input type="text" value={realname} onChange={e => setRealname(e.target.value)} className="w-full border rounded px-2.5 py-2 font-bold outline-none focus:border-blue-600" />
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-600 mb-1">연락처</label>
                                    <input type="text" value={phone} onChange={e => setPhone(e.target.value.replace(/[^0-9]/g, ''))} className="w-full border rounded px-2.5 py-2 font-bold outline-none focus:border-blue-600" />
                                </div>
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 mb-1">주소</label>
                                <div className="flex gap-1.5 mb-1.5">
                                    <input type="text" value={zipcode} readOnly placeholder="우편번호" className="w-24 border rounded px-2.5 py-1.5 bg-slate-50 text-slate-600" />
                                    <button type="button" onClick={handleSearchPostcode} className="bg-slate-700 text-white px-3 py-1.5 rounded font-bold hover:bg-slate-800">우편번호 검색</button>
                                </div>
                                <input type="text" value={baseAddr} onChange={e => setBaseAddr(e.target.value)} placeholder="기본 주소" className="w-full border rounded px-2.5 py-2 mb-1.5 font-bold outline-none focus:border-blue-600" />
                                <input type="text" value={detailAddr} onChange={e => setDetailAddr(e.target.value)} placeholder="추가 상세주소 (입력 시 뒤에 합쳐짐)" className="w-full border rounded px-2.5 py-2 outline-none focus:border-blue-600" />
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 mb-1">배송 메모</label>
                                <input type="text" value={memo} onChange={e => setMemo(e.target.value)} className="w-full border rounded px-2.5 py-2 outline-none focus:border-blue-600" />
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-lg">취소</button>
                                <button type="submit" className="flex-1 py-2.5 bg-blue-600 text-white font-extrabold rounded-lg hover:bg-blue-700">저장</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const CsCopySelectModal = ({ isOpen, group, broadcastName, onClose, onConfirmCopy }) => {
            const [itemTags, setItemTags] = useState({});
            const [csMemo, setCsMemo] = useState('');

            useEffect(() => {
                if (isOpen && group && Array.isArray(group.items)) {
                    const init = {};
                    group.items.forEach((it, idx) => {
                        init[idx] = '정상';
                    });
                    if (group.items.length === 1) init[0] = '교환';
                    setItemTags(init);
                    setCsMemo('');
                }
            }, [isOpen, group]);

            if (!isOpen || !group) return null;

            const cycleTag = (idx, targetTag) => {
                setItemTags(prev => ({
                    ...prev,
                    [idx]: prev[idx] === targetTag ? '정상' : targetTag
                }));
            };

            const selectedCount = Object.values(itemTags).filter(v => v && v !== '정상').length;

            const handleConfirm = () => {
                const taggedItems = (group.items || []).map((it, idx) => ({
                    ...it,
                    csTag: itemTags[idx] || '정상'
                }));
                onConfirmCopy(group, broadcastName, taggedItems, csMemo.trim());
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-lg mx-4 flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center pb-3 mb-3 border-b border-slate-200">
                            <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
                                <Icon name="arrows-left-right" weight="bold" className="text-amber-600" size={17} />
                                <span>'{group.nick}' 교환/반품 CS 품목 선택 복사</span>
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" weight="bold" size={18}/></button>
                        </div>

                        <p className="text-xs text-slate-500 mb-2.5">
                            주문서 전체가 1개의 카드로 복사됩니다. 그중 <strong>교환이나 반품할 품목을 아래에서 지정</strong>해 주세요.
                        </p>

                        <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 mb-3">
                            {(group.items || []).map((it, idx) => {
                                const curTag = itemTags[idx] || '정상';
                                return (
                                    <div key={idx} className={`p-2.5 rounded-lg border flex items-center justify-between gap-2 text-xs ${
                                        curTag === '교환' ? 'bg-amber-50 border-amber-300' :
                                        curTag === '반품' ? 'bg-purple-50 border-purple-300' :
                                        curTag === '불량/오배송' ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'
                                    }`}>
                                        <div className="flex-1 min-w-0">
                                            <div className="font-extrabold text-slate-800 truncate">{it.product}</div>
                                            <div className="text-[11px] text-slate-500">{it.qty}개 · {Number(it.price).toLocaleString()}원</div>
                                        </div>
                                        <div className="flex items-center gap-1 shrink-0">
                                            {['교환', '반품', '불량/오배송'].map(tag => (
                                                <button
                                                    key={tag}
                                                    type="button"
                                                    onClick={() => cycleTag(idx, tag)}
                                                    className={`px-2 py-1 rounded text-[11px] font-extrabold border transition ${
                                                        curTag === tag
                                                            ? (tag === '교환' ? 'bg-amber-500 text-white border-amber-600' : tag === '반품' ? 'bg-purple-600 text-white border-purple-700' : 'bg-red-600 text-white border-red-700')
                                                            : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {tag}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mb-3">
                            <label className="block text-xs font-bold text-slate-700 mb-1">📝 CS 내용 메모 (교환 사이즈, 불량 사유, 환불 계좌 등)</label>
                            <input
                                type="text"
                                value={csMemo}
                                onChange={e => setCsMemo(e.target.value)}
                                placeholder="예: 66사이즈로 교환 요청 / 배송비 입금대기"
                                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold outline-none focus:border-amber-500"
                            />
                        </div>

                        <div className="flex gap-2">
                            <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-lg text-xs">취소</button>
                            <button
                                type="button"
                                onClick={handleConfirm}
                                className="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-lg text-xs shadow-sm"
                            >
                                교환/반품 CS 탭으로 복사 ({selectedCount > 0 ? `${selectedCount}품목 지정됨` : '전체 복사'})
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const StaffTrackingApp = () => {
            const [orderTabs, setOrderTabs] = useState([]);
            const [selectedTab, setSelectedTab] = useState('');
            const [broadcastName, setBroadcastName] = useState('');
            const [freeShipThreshold, setFreeShipThreshold] = useState(70000);
            const [defaultShipping, setDefaultShipping] = useState(4000);
            const [cardFeeRate, setCardFeeRate] = useState(10);

            const [customerGroups, setCustomerGroups] = useState([]);
            const [csGroups, setCsGroups] = useState([]);
            const [activeMainTab, setActiveMainTab] = useState('orders');
            const [statusFilter, setStatusFilter] = useState('all');

            const [searchTerm, setSearchTerm] = useState('');
            const [globalSearchResults, setGlobalSearchResults] = useState(null);
            const [isSearchingGlobal, setIsSearchingGlobal] = useState(false);

            const [newNick, setNewNick] = useState('');
            const [newProd, setNewProd] = useState('');
            const [newQty, setNewQty] = useState(1);
            const [newPrice, setNewPrice] = useState('');

            const [isLoading, setIsLoading] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [toastMsg, setToastMsg] = useState('');

            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null, defaultValue: '' });
            const [addrEditTarget, setAddrEditTarget] = useState(null);
            const [csCopyTarget, setCsCopyTarget] = useState(null);
            const [cleanupModalOpen, setCleanupModalOpen] = useState(false);
            const [selectedOldTabs, setSelectedOldTabs] = useState({});

            const trackingExcelRef = useRef(null);

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            }, []);

            const openModal = useCallback((message, type = 'alert', onConfirm = null, defaultValue = '', title = '확인') => {
                setModal({ isOpen: true, title, message, type, onConfirm, defaultValue });
            }, []);

            const loadSheetOrders = useCallback(async (tabNameToLoad) => {
                if (!tabNameToLoad) return;
                setIsLoading(true);
                try {
                    const cleanBase = String(tabNameToLoad).replace(/^주문_/, '').trim();
                    const canonicalTab = '주문_' + cleanBase;

                    // 1차 시도: '주문_방송명'으로 정확히 요청
                    let res = await fetchGas(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&tabName=${encodeURIComponent(canonicalTab)}&broadcastName=${encodeURIComponent(cleanBase)}&t=${Date.now()}`);
                    let rowsArray = Array.isArray(res?.data) ? res.data : (Array.isArray(res?.orders) ? res.orders : (Array.isArray(res?.rows) ? res.rows : []));

                    // 2차 시도: 구버전 스크립트 호환용 (broadcastName 기준 요청)
                    if (rowsArray.length === 0) {
                        const res2 = await fetchGas(`${DEFAULT_GAS_URL}?action=get_orders&masterId=${DEFAULT_MASTER_SHEET_ID}&tabName=${encodeURIComponent(cleanBase)}&broadcastName=${encodeURIComponent(cleanBase)}&t=${Date.now()}`);
                        const altRows = Array.isArray(res2?.data) ? res2.data : (Array.isArray(res2?.orders) ? res2.orders : (Array.isArray(res2?.rows) ? res2.rows : []));
                        if (altRows.length > 0) rowsArray = altRows;
                    }

                    let bName = cleanBase;
                    let fThresh = 70000;
                    let dShip = 4000;
                    let cRate = 10;

                    const groupsMap = {};
                    rowsArray.forEach((row, idx) => {
                        let nick = '';
                        let prod = '';
                        let qtyVal = 1;
                        let priceVal = 0;
                        let shipVal = '';
                        let depVal = 0;
                        let cardRaw = '';
                        let realname = '';
                        let phone = '';
                        let address = '';
                        let memo = '';
                        let vipRaw = '';
                        let noShowRaw = '';
                        let waitStr = '';
                        let pinRaw = '';
                        let confirmRaw = '';
                        let depJsonRaw = '';
                        let trkRaw = '';

                        if (Array.isArray(row)) {
                            nick = String(row[0] || '').trim();
                            prod = String(row[1] || '').trim();
                            qtyVal = row[2];
                            priceVal = row[3];
                            shipVal = row[4];
                            depVal = row[5];
                            cardRaw = String(row[6] || '').trim();
                            realname = String(row[7] || '').trim();
                            phone = String(row[8] || '').trim();
                            address = String(row[9] || '').trim();
                            memo = String(row[10] || '').trim();

            const getGroupSummary = useCallback((g) => {

                const prodSum = activeItems.reduce((s, it) => s + (Number(it.price) || 0), 0);

                const dep = Number(g.deposit) || 0;
                const baseBal = baseGrand - dep;
                const isCard = g.cardMode === 'requested' || g.cardMode === 'completed';
                const cardFee = (isCard && baseBal > 0) ? Math.round(baseBal * (cardFeeRate / 100)) : 0;
                const finalGrand = baseGrand + cardFee;
                const finalBal = baseBal + cardFee;
                const isPaid = activeItems.length > 0 && baseBal <= 0 && !isCard;

            const handleTrackingExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });

                        const parsedList = [];
                        const duplicateWarnings = [];

                        rows.forEach(r => {
                            let nick = '', realname = '', phone = '', trk = '';
                            Object.keys(r).forEach(k => {
                                const ck = k.replace(/\s+/g, '');
                                const val = String(r[k] || '').trim();
                                if (!val) return;
                                if (ck.includes('닉네임') || ck.includes('주문자')) nick = val.replace(/^\[.*?\]\s*/, '').trim();
                                else if (ck.includes('수하인') || ck.includes('수령인') || ck.includes('받는') || ck === '이름' || ck === '성명' || ck === '고객명') realname = val.replace(/^\[.*?\]\s*/, '').trim();
                                else if (ck.includes('전화') || ck.includes('연락처') || ck.includes('핸드폰') || ck.includes('휴대폰')) phone = fixPhoneNumber(val);
                                else if (ck.includes('운송장') || ck.includes('송장') || ck.includes('등기')) trk = val.replace(/[^0-9,-]/g, '');
                            });

                            if (trk && (nick || realname || phone)) {
                                const matches = customerGroups.filter(g => {
                                    if (nick && normalizeString(g.nick) === normalizeString(nick)) return true;
                                    if (phone && g.phone && g.phone === phone) return true;
                                    if (realname && normalizeString(g.realname) === normalizeString(realname)) return true;
                                    return false;
                                });

                                if (matches.length > 1) {
                                    duplicateWarnings.push(`• 수하인 '${realname || nick}' (${trk}) ➔ 동명이인: [${matches.map(m => m.nick).join(', ')}]`);
                                } else if (matches.length === 1) {
                                    parsedList.push({ nickname: matches[0].nick, realname: realname || nick, phone, trackingNumber: trk });
                                } else {
                                    parsedList.push({ nickname: nick, realname: realname || nick, phone, trackingNumber: trk });
                                }
                            }
                        });

                        if (parsedList.length > 0) {
                            setCustomerGroups(prev => prev.map(g => {
                                const found = parsedList.find(p => p.nickname && normalizeString(p.nickname) === normalizeString(g.nick));
                                return found ? { ...g, trackingNumber: found.trackingNumber } : g;
                            }));

                            await fetchGas(DEFAULT_GAS_URL, {
                                action: 'save_tracking_numbers',
                                masterId: DEFAULT_MASTER_SHEET_ID,
                                broadcastName: broadcastName || selectedTab.replace(/^주문_/, ''),
                                data: parsedList

                        }
                    } catch (err) {
                        openModal('엑셀 파일 처리 중 오류가 발생했습니다.');

                    if (g.isNoShow) statusStr = '노쇼';
                    else if (g.cardMode === 'completed') statusStr = `카드완료(${sum.finalBal.toLocaleString()})`;
                    else if (g.cardMode === 'requested') statusStr = `카드요청(${sum.finalBal.toLocaleString()})`;
                    else if (sum.baseBal > 0) statusStr = `미입금(미수 ${sum.baseBal.toLocaleString()})`;
                    else if (sum.baseBal < 0) statusStr = `과납(${Math.abs(sum.baseBal).toLocaleString()})`;

                    const makeRow = (prodStr) => ({
                        '방송명': broadcastName,
                        '결제상태': statusStr,
                        '닉네임': g.isVip ? `[VIP] ${g.nick}` : g.nick,
                        '주문상품(수량)': prodStr,
                        '수령인명': g.realname || '',
                        '연락처': g.phone || '',
                        '주소': g.address || '',
                        '배송메모': g.memo || '',
                        '송장번호': g.trackingNumber || ''
                    });

                    excelRows.push(makeRow(`[ ${g.nick} ]`));
                    sum.activeItems.forEach(it => {
                        excelRows.push(makeRow(`${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                    sum.waitItems.forEach(it => {
                        const rankBadge = it.waitlistOrder ? `[대기${it.waitlistOrder}번] ` : '[대기] ';
                        excelRows.push(makeRow(`${rankBadge}${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                });
                downloadExcel(excelRows, `${broadcastName || '방송'}_배송용고객리스트`);
            };

            const stats = useMemo(() => {
                let totalCustomers = 0, totalQty = 0, paidCount = 0, unpaidCount = 0, cardReqCount = 0, cardCompCount = 0, noAddrCount = 0, waitCount = 0;
                customerGroups.forEach(g => {
                    const sum = getGroupSummary(g);
                    if (sum.waitItems.length > 0) waitCount++;
                    if (sum.activeItems.length === 0) return;
                    totalCustomers++;
                    totalQty += sum.activeItems.reduce((acc, it) => acc + (Number(it.qty) || 1), 0);
                    if (!g.address) noAddrCount++;
                    if (g.cardMode === 'completed') cardCompCount++;
                    else if (g.cardMode === 'requested') cardReqCount++;
                    else if (sum.isPaid) paidCount++;
                    else unpaidCount++;
                });
                return { totalCustomers, totalQty, paidCount, unpaidCount, cardReqCount, cardCompCount, noAddrCount, waitCount };
            }, [customerGroups, getGroupSummary]);

            const filteredGroups = useMemo(() => {
                const kw = normalizeString(searchTerm);
                return customerGroups.filter(g => {
                    const sum = getGroupSummary(g);
                    if (statusFilter === 'paid' && !(sum.isPaid && g.cardMode === 'none')) return false;
                    if (statusFilter === 'unpaid' && !(sum.baseBal > 0 && g.cardMode === 'none' && sum.activeItems.length > 0)) return false;
                    if (statusFilter === 'card_req' && g.cardMode !== 'requested') return false;
                    if (statusFilter === 'card_comp' && g.cardMode !== 'completed') return false;
                    if (statusFilter === 'no_addr' && g.address) return false;
                    if (statusFilter === 'waitlist' && sum.waitItems.length === 0) return false;

                    if (!kw) return true;
                    const hay = normalizeString([
                        g.nick, g.realname, g.phone, g.address, g.trackingNumber,
                        (g.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [customerGroups, statusFilter, searchTerm, getGroupSummary]);

            const filteredCsGroups = useMemo(() => {
                const kw = normalizeString(searchTerm);
                if (!kw) return csGroups;
                return csGroups.filter(c => {
                    const hay = normalizeString([
                        c.nick, c.realname, c.phone, c.address, c.origTracking, c.csTracking, c.csMemo,
                        (c.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [csGroups, searchTerm]);

            return (
                <div className="h-screen flex flex-col bg-slate-100 overflow-hidden">
                    {toastMsg && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-extrabold shadow-lg">
                            {toastMsg}
                        </div>
                    )}

                    <CustomModal modal={modal} onClose={() => setModal(p => ({ ...p, isOpen: false }))} />
                    <AddressEditModal
                        isOpen={Boolean(addrEditTarget)}
                        group={addrEditTarget}
                        onClose={() => setAddrEditTarget(null)}
                        onSave={async (newAddr) => {
                            const targetNick = addrEditTarget.nick;
                            const cleanBName = (broadcastName || selectedTab).replace(/^주문_/, '').trim();
                            const canonicalTab = '주문_' + cleanBName;
                            updateCustomerGroup(targetNick, cur => ({
                                ...cur,
                                realname: newAddr.realname,
                                phone: newAddr.phone,
                                address: newAddr.address,
                                memo: newAddr.memo,
                                pin: newAddr.phone.length >= 4 ? newAddr.phone.slice(-4) : cur.pin
                            }));
                            setAddrEditTarget(null);
                            await fetchGas(DEFAULT_GAS_URL, {
                                action: 'save_master_address',
                                masterId: DEFAULT_MASTER_SHEET_ID,
                                data: {
                                    nickname: targetNick,
                                    realname: newAddr.realname,
                                    phone: newAddr.phone,
                                    address: newAddr.address,
                                    memo: newAddr.memo,
                                    sheetTabName: canonicalTab,
                                    broadcastName: cleanBName
                                }
                            });
                            showToast(`✅ '${targetNick}' 배송지가 [${canonicalTab}] 시트와 찐고객사전에 즉시 등록되었습니다!`);
                        }}
                    />
                    <CsCopySelectModal
                        isOpen={Boolean(csCopyTarget)}
                        group={csCopyTarget?.group}
                        broadcastName={csCopyTarget?.broadcastName}
                        onClose={() => setCsCopyTarget(null)}

                    />

                    {cleanupModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={() => setCleanupModalOpen(false)}>
                            <div className="bg-white rounded-xl shadow-2xl p-5 w-full max-w-md mx-4 flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center pb-2.5 mb-2.5 border-b">
                                    <h3 className="text-sm font-extrabold text-slate-800">🧹 오래된 방송 시트 정리 (용량 확보)</h3>
                                    <button onClick={() => setCleanupModalOpen(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" weight="bold" size={18}/></button>
                                </div>
                                <p className="text-xs text-slate-500 mb-3">
                                    정산 및 배송이 완전히 끝난 옛날 방송 시트를 선택해 정리할 수 있습니다. (최근 5개 방송은 보호됩니다)
                                </p>
                                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 mb-4">
                                    {orderTabs.slice(5).map(t => (
                                        <label key={t} className="flex items-center justify-between p-2 rounded border bg-slate-50 cursor-pointer text-xs font-bold">
                                            <span>{t.replace(/^주문_/, '')}</span>
                                            <input
                                                type="checkbox"
                                                checked={Boolean(selectedOldTabs[t])}
                                                onChange={e => setSelectedOldTabs(p => ({ ...p, [t]: e.target.checked }))}
                                                className="w-4 h-4 accent-red-600"
                                            />
                                        </label>
                                    ))}
                                    {orderTabs.length <= 5 && (
                                        <div className="text-center py-6 text-xs text-slate-400">정리할 오래된 시트가 없습니다.</div>
                                    )}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setCleanupModalOpen(false)} className="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">닫기</button>

                                        onClick={async () => {
                                            const toDel = Object.keys(selectedOldTabs).filter(k => selectedOldTabs[k]);
                                            if (toDel.length === 0) return;
                                            const res = await fetchGas(DEFAULT_GAS_URL, {
                                                action: 'delete_old_order_tabs',
                                                masterId: DEFAULT_MASTER_SHEET_ID,
                                                tabNames: toDel
                                            });
                                            if (res && res.success) {
                                                showToast(`🧹 ${res.deletedCount}개의 오래된 시트를 정리했습니다.`);
                                                setCleanupModalOpen(false);
                                                setSelectedOldTabs({});
                                                loadInitialTabs();
                                            }
                                        }}

                                    >
                                        선택한 시트 삭제
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0 shadow-sm">

                            <h1 className="text-base font-black text-slate-900 flex items-center gap-1.5">

                            <button

                            >
                                📋 주문 조회 / 추가 / 수정 ({customerGroups.length}명)

                            <button
                                onClick={() => { setActiveMainTab('cs'); setGlobalSearchResults(null); }}
                                className={`px-3.5 py-1.5 rounded-md text-xs font-extrabold transition ${activeMainTab === 'cs' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                🔄 교환/반품 CS 관리 ({csGroups.filter(c => c.csStatus !== '처리완료').length}/{csGroups.length}건)
                            </button>
                            <button
                                onClick={() => { setActiveMainTab('tracking'); setGlobalSearchResults(null); }}
                                className={`px-3.5 py-1.5 rounded-md text-xs font-extrabold transition ${activeMainTab === 'tracking' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                🚚 운송장 엑셀 등록
                            </button>
                            <button
                                onClick={() => { setActiveMainTab('export'); setGlobalSearchResults(null); }}
                                className={`px-3.5 py-1.5 rounded-md text-xs font-extrabold transition ${activeMainTab === 'export' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                📊 발주용 / 배송용 엑셀
                            </button>
                        </div>

                        <div className="flex items-center gap-1.5 flex-1 max-w-md">
                            <div className="relative flex-1">
                                <Icon name="magnifying-glass" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" size={14} />
                                <input
                                    type="text"
                                    value={searchTerm}
                                    onChange={e => { setSearchTerm(e.target.value); if (!e.target.value.trim()) setGlobalSearchResults(null); }}
                                    onKeyDown={e => { if (e.key === 'Enter') handleGlobalSearch(); }}
                                    placeholder="닉네임, 수령인, 연락처, 송장번호, 상품명 검색..."
                                    className="w-full pl-8 pr-7 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold outline-none focus:bg-white focus:border-blue-600"
                                />
                                {searchTerm && (
                                    <button onClick={() => { setSearchTerm(''); setGlobalSearchResults(null); }} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                        <Icon name="x-circle" weight="fill" size={14} />
                                    </button>
                                )}
                            </div>
                            <button
                                onClick={handleGlobalSearch}
                                disabled={isSearchingGlobal}
                                className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-extrabold shrink-0 shadow-sm flex items-center gap-1"
                            >
                                <Icon name="globe" weight="bold" />
                                <span>{isSearchingGlobal ? '검색중...' : '전체방송 통합검색'}</span>
                            </button>
                        </div>
                    </div>
                    {}
                    <main className="flex-1 overflow-y-auto p-3 sm:p-4 w-full">
                        {globalSearchResults !== null && (
                            <div className="mb-4 bg-indigo-50/90 border-2 border-indigo-300 rounded-xl p-4 shadow-sm w-full">
                                <div className="flex items-center justify-between pb-2.5 mb-3 border-b border-indigo-200">
                                    <div className="flex items-center gap-2">
                                        <span className="bg-indigo-600 text-white text-xs font-extrabold px-2.5 py-0.5 rounded">전체방송 + 교환반품CS 통합검색</span>
                                        <span className="text-xs font-extrabold text-indigo-900">'{searchTerm}' 검색 결과 총 {globalSearchResults.length}건</span>
                                    </div>
                                    <button onClick={() => setGlobalSearchResults(null)} className="text-xs font-extrabold text-indigo-700 bg-white px-2.5 py-1 rounded border border-indigo-200 hover:bg-indigo-100">
                                        통합검색 닫기 ✕
                                    </button>
                                </div>

                                {globalSearchResults.length === 0 ? (
                                    <div className="text-center py-6 text-xs text-slate-500">모든 이전 방송 주문서 및 교환반품CS 시트에서 일치하는 내역이 없습니다.</div>
                                ) : (
                                    <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                                        {globalSearchResults.map((res, rIdx) => (
                                            <div key={rIdx} className="bg-white rounded-lg p-3 border border-indigo-200 shadow-sm flex flex-col gap-1.5 text-xs">
                                                <div className="flex items-center justify-between flex-wrap gap-2">
                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                        {res.recordType === 'CS' ? (
                                                            <span className="bg-amber-500 text-white text-[11px] font-extrabold px-2 py-0.5 rounded">
                                                                🔄 교환/반품CS ({res.csStatus}) · 원본:{res.broadcastName}
                                                            </span>
                                                        ) : (
                                                            <span className="bg-blue-100 text-blue-800 text-[11px] font-extrabold px-2 py-0.5 rounded">
                                                                📅 {res.broadcastName}
                                                            </span>
                                                        )}
                                                        <span className="font-black text-sm text-slate-900">{res.nick}</span>
                                                        {res.realname && <span className="text-slate-600 font-bold">({res.realname} · {res.phone})</span>}
                                                        {res.trackingNumber && (
                                                            <span className="bg-red-50 text-red-600 border border-red-200 px-2 py-0.5 rounded font-bold text-[11px]">
                                                                📦 원송장: {res.trackingNumber}
                                                            </span>
                                                        )}
                                                        {res.csTracking && (
                                                            <span className="bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded font-bold text-[11px]">
                                                                🚚 교반송장: {res.csTracking}
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-1.5">
                                                        {res.recordType === 'ORDER' ? (
                                                            <>
                                                                <button
                                                                    onClick={() => setCsCopyTarget({ group: res, broadcastName: res.broadcastName })}
                                                                    className="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 rounded font-extrabold text-[11px]"
                                                                >
                                                                    🔄 교환/반품 CS복사
                                                                </button>
                                                                <button
                                                                    onClick={() => {
                                                                        setSelectedTab(res.tabName);
                                                                        setGlobalSearchResults(null);
                                                                        setActiveMainTab('orders');
                                                                        loadSheetOrders(res.tabName);
                                                                    }}
                                                                    className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-extrabold text-[11px]"
                                                                >

                                                                </button>

                                                        ) : (
                                                            <button
                                                                onClick={() => {

                                                                    setActiveMainTab('cs');

                                                                className="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded font-extrabold text-[11px]"
                                                            >

                        )}

                        {activeMainTab === 'orders' && (
                            <div className="space-y-2.5 w-full">
                                <div className="grid grid-cols-7 gap-1.5 text-center w-full">
                                    {[
                                        { id: 'all', label: '전체 주문현황', val: `${stats.totalCustomers}명 (${stats.totalQty}개)`, color: 'text-slate-800' },
                                        { id: 'paid', label: '완납', val: `${stats.paidCount}명`, color: 'text-emerald-600' },
                                        { id: 'unpaid', label: '미수금', val: `${stats.unpaidCount}명`, color: 'text-red-600' },

                                        { id: 'card_comp', label: '카드완료', val: `${stats.cardCompCount}명`, color: 'text-purple-600' },

                                        { id: 'waitlist', label: '⏱️ 품절대기', val: `${stats.waitCount}명`, color: 'text-amber-700' }

                                                                    tag === '불량/오배송' ? 'bg-red-50/70 -mx-3.5 px-3.5 font-extrabold' : ''
                                                                }`}>
                                                                    <div className="flex items-center gap-1.5 flex-1 min-w-0">
                                                                        {['정상', '교환', '반품', '불량/오배송'].map(tOpt => (
                                                                            <button
                                                                                key={tOpt}
                                                                                type="button"
                                                                                onClick={() => setCsGroups(prev => prev.map(x => x.id !== cs.id ? x : {
                                                                                    ...x,
                                                                                    items: x.items.map((item, i) => i === idx ? { ...item, csTag: tOpt } : item)
                                                                                }))}
                                                                                className={`px-2 py-0.5 rounded text-[10.5px] font-extrabold border shrink-0 ${
                                                                                    tag === tOpt
                                                                                        ? (tOpt === '교환' ? 'bg-amber-500 text-white border-amber-600' :
                                                                                           tOpt === '반품' ? 'bg-purple-600 text-white border-purple-700' :
                                                                                           tOpt === '불량/오배송' ? 'bg-red-600 text-white border-red-700' :
                                                                                           'bg-slate-700 text-white border-slate-800')
                                                                                        : 'bg-white text-slate-400 border-slate-200 hover:text-slate-700'
                                                                                }`}
                                                                            >
                                                                                {tOpt === '정상' ? '정상유지' : tOpt}
                                                                            </button>
                                                                        ))}
                                                                        <span className="truncate ml-1 text-slate-800 font-bold">{it.product}</span>
                                                                    </div>
                                                                    <div className="flex items-center gap-2 shrink-0 text-slate-700 font-bold">
                                                                        <span>{it.qty}개</span>
                                                                        <span className="w-20 text-right">{Number(it.price || 0).toLocaleString()}원</span>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    <div className="bg-slate-50 border-t border-slate-200 px-3.5 py-2.5 grid grid-cols-1 md:grid-cols-12 gap-2 text-xs items-center">
                                                        <div className="md:col-span-4 flex items-center gap-1.5">
                                                            <span className="font-bold text-slate-500 shrink-0">주소:</span>
                                                            <input
                                                                type="text"
                                                                value={cs.address || ''}
                                                                onChange={e => setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, address: e.target.value } : x))}
                                                                placeholder="수거/재발송 주소"
                                                                className="w-full bg-white border border-slate-300 rounded px-2 py-1 font-bold outline-none focus:border-amber-500"
                                                            />
                                                        </div>
                                                        <div className="md:col-span-2 flex items-center gap-1">
                                                            <span className="font-bold text-slate-500 shrink-0">원송장:</span>
                                                            <input
                                                                type="text"
                                                                value={cs.origTracking || ''}
                                                                onChange={e => setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, origTracking: e.target.value } : x))}
                                                                placeholder="기존 송장"
                                                                className="w-full bg-white border border-slate-300 rounded px-2 py-1 font-bold outline-none"
                                                            />
                                                        </div>
                                                        <div className="md:col-span-3 flex items-center gap-1">
                                                            <span className="font-extrabold text-red-600 shrink-0">📦교반송장:</span>
                                                            <input
                                                                type="text"
                                                                value={cs.csTracking || ''}
                                                                onChange={e => setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, csTracking: e.target.value } : x))}
                                                                placeholder="회수/재발송 운송장번호"
                                                                className="w-full bg-red-50/50 border border-red-300 rounded px-2 py-1 font-extrabold text-red-700 outline-none focus:bg-white"
                                                            />
                                                        </div>
                                                        <div className="md:col-span-3 flex items-center gap-1">
                                                            <span className="font-extrabold text-blue-700 shrink-0">📝CS내용:</span>
                                                            <input
                                                                type="text"
                                                                value={cs.csMemo || ''}
                                                                onChange={e => setCsGroups(prev => prev.map(x => x.id === cs.id ? { ...x, csMemo: e.target.value } : x))}
                                                                placeholder="교환사이즈, 사유, 계좌 등"
                                                                className="w-full bg-blue-50/50 border border-blue-300 rounded px-2 py-1 font-bold text-slate-800 outline-none focus:bg-white"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeMainTab === 'tracking' && (
                            <div className="w-full bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-sm my-2">
                                <div className="w-14 h-14 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-3">
                                    <Icon name="truck" weight="fill" size={32} />
                                </div>
                                <h2 className="text-base font-black text-slate-900 mb-1">
                                    [{selectedTab.replace(/^주문_/, '')}] 롯데택배 운송장 엑셀 일괄 등록
                                </h2>
                                <p className="text-xs text-slate-500 mb-6 leading-relaxed">
                                    롯데택배 출고 엑셀 파일(수하인명/닉네임/연락처 + 운송장번호 열 포함)을 업로드하면<br/>
                                    현재 선택된 방송 주문서 시트에 송장번호가 자동 매칭되며, 동명이인은 자동으로 보류 및 안내됩니다.
                                </p>
                                <input type="file" accept=".xlsx,.xls,.csv" ref={trackingExcelRef} onChange={handleTrackingExcelUpload} className="hidden" />
                                <button
                                    onClick={() => trackingExcelRef.current?.click()}
                                    className="px-6 py-3.5 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl text-sm shadow-md inline-flex items-center gap-2"
                                >
                                    <Icon name="upload-simple" weight="bold" size={18} />
                                    <span>롯데택배 송장 엑셀 파일 선택 (.xlsx)</span>
                                </button>
                            </div>
                        )}

                        {activeMainTab === 'export' && (
                            <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-4 my-2">
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-sm">
                                    <h3 className="text-sm font-black text-slate-900 mb-1">📋 발주용 품목 집계 엑셀</h3>
                                    <p className="text-xs text-slate-500 mb-4">상품별 입금완료 수량 / 미입금 수량 요약 (품절대기 제외)</p>
                                    <button
                                        onClick={handleExportProductsExcel}
                                        className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-xl text-xs shadow"
                                    >
                                        발주리스트 엑셀 다운로드
                                    </button>
                                </div>
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-sm">
                                    <h3 className="text-sm font-black text-slate-900 mb-1">🚚 배송용 고객 정산 리스트 엑셀</h3>
                                    <p className="text-xs text-slate-500 mb-4">고객별 결제상태 · 주소 · 주문품목 · 대기순번 · 송장번호 포함</p>
                                    <button
                                        onClick={handleExportCustomersExcel}
                                        className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-xs shadow"
                                    >
                                        배송리스트 엑셀 다운로드
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StaffTrackingApp />);
    </script>
</body>
</html>
