                    setLiveChatId(null);
                    setIsLiveChatPaused(false);
                    liveNextPageTokenRef.current = '';
                    syncStaffLiveRowsToPortal([], cleanB, false);

                    // ✨ 방송 마감 시 고객용 라인업(live_catalog.html)도 즉시 마감 잠금 처리하고 구글 시트 '실시간재고'를 비워 다음 방송에 섞이지 않게 처리!
                    setLiveInventory([]);
                    if (staffFbDb) {
                        staffFbDb.ref('ember_live_data').update({
                            '_global_config/catalogClosedLock': true,
                            '_global_config/isStoreClosed': true,
                            '_global_config/currentPinnedId': null,
                            '_live_catalog': {
                                items: [],
                                rawCount: 0,
                                explicitClear: true,
                                updatedAt: Date.now()
                            }
                        }).catch(() => {});
                    }
                    fetchGas(activeGasUrl, {
                        action: 'save_inventory',
                        masterId: activeDictSheetId,
                        forceClear: true,
                        data: [{ name: '__EMPTY__', price: 0, stock: '', status: '품절', isLocked: false }]
                    }).catch(() => {});

                    setOrderTabs(prev => Array.from(new Set([tabKey, ...prev])));
                    setSelectedTab(tabKey);
                    setBroadcastName(cleanB);
                    setCustomerGroups(finalGroupsForThisBroadcast);
                    setLiveOrderRows([]);
                    try { localStorage.removeItem('ember_staff_live_rows_v1'); } catch (e) {}
                    setActiveMainTab('orders');

                    saveUpdatedGroupsImmediately(
                        finalGroupsForThisBroadcast,
                        `🎉 [${cleanB}] 방송 마감 완료! (현재 상태 그대로 확정 저장되었습니다)`,
                        cleanB
                    );
                });
            };

            const getCustomerCreditAmount = useCallback((nick) => {
                if (!nick) return 0;
                if (customerCredits[nick] !== undefined) return Number(customerCredits[nick]) || 0;
                const targetNorm = normalizeString(nick);
                const targetHandle = normalizeHandleNick(nick);
                for (const k of Object.keys(customerCredits)) {
                    if (normalizeString(k) === targetNorm || (targetHandle && normalizeHandleNick(k) === targetHandle)) {
                        return Number(customerCredits[k]) || 0;
                    }
                }
                return 0;
            }, [customerCredits]);

            const handleUpdateCustomerCredit = useCallback((nick, nextCreditAmt, reasonMemo = '직원용 적립금 수정') => {
                const cleanAmt = Math.max(0, Number(nextCreditAmt) || 0);
                const prevAmt = getCustomerCreditAmount(nick);
                const diffAmt = cleanAmt - prevAmt;
                const nowKst = new Date().toLocaleString('ko-KR');
                setCustomerCredits(prev => ({ ...prev, [nick]: cleanAmt }));
                setHasUnsavedChanges(true);
                fetchGas(activeGasUrl, {
                    action: 'save_customer_credit',
                    masterId: activeDictSheetId,
                    data: { nickname: nick, credit: cleanAmt }
                }).catch(() => {});
                if (staffFbDb) {
                    const safeNickKey = String(nick || '').replace(/[.#$\[\]\/]/g, '_').trim();
                    if (safeNickKey) {
                        const credRef = staffFbDb.ref(`ember_live_data/_portal_credits/${safeNickKey}`);
                        credRef.once('value').then(snap => {
                            const prevVal = snap.val() || {};
                            const prevLogs = Array.isArray(prevVal.logs) ? prevVal.logs : [];
                            const newLog = {
                                id: `cred_${Date.now()}`,
                                date: nowKst,
                                type: diffAmt >= 0 ? 'add' : 'use',
                                diff: diffAmt,
                                balance: cleanAmt,
                                reason: reasonMemo
                            };
                            credRef.set({
                                nickname: nick,
                                credit: cleanAmt,
                                updatedAt: Date.now(),
                                updatedAtStr: nowKst,
                                logs: [newLog, ...prevLogs].slice(0, 30)
                            }).catch(() => {});
                        }).catch(() => {});
                    }
                }
                showToast(`💰 '${nick}' 님의 적립금(${cleanAmt.toLocaleString()}원)이 시트와 고객 포털에 즉시 저장되었습니다!`);
            }, [activeGasUrl, activeDictSheetId, getCustomerCreditAmount, showToast]);

            const handleGlobalSearch = async () => {
                const kw = globalKeyword.trim();
                if (!kw) return;
                setIsSearchingGlobal(true);
                const normKw = normalizeString(kw);
                const localResults = [];

                csGroups.forEach(c => {
                    const hay = normalizeString([
                        c.sourceBroadcast, c.nick, c.realname, c.phone, c.address,
                        c.origTracking, c.csTracking, c.csMemo, c.refundAccount,
                        (c.items || []).map(i => i.product).join(' ')
                    ].join(' '));
                    if (hay.includes(normKw)) {
                        localResults.push({
                            recordType: 'CS',
                            broadcastName: c.sourceBroadcast,
                            csStatus: c.csStatus,
                            nick: c.nick,
                            realname: c.realname,
                            phone: c.phone,
                            address: c.address,
                            trackingNumber: c.origTracking,
                            csTracking: c.csTracking,
                            csMemo: c.csMemo,
                            items: c.items || []
                        });
                    }
                });

                Object.entries(localBroadcastStore || {}).forEach(([tabName, bData]) => {
                    const bName = String(bData?.broadcastName || tabName).replace(/^주문_/, '');
                    (bData?.groups || []).forEach(g => {
                        const hay = normalizeString([
                            g.nick, g.realname, g.phone, g.address, g.trackingNumber,
                            (g.items || []).map(i => i.product).join(' ')
                        ].join(' '));
                        if (hay.includes(normKw)) {
                            localResults.push({
                                recordType: 'ORDER',
                                tabName,
                                broadcastName: bName,
                                nick: g.nick,
                                realname: g.realname,
                                phone: g.phone,
                                address: g.address,
                                trackingNumber: g.trackingNumber,
                                shipping: g.shipping,
                                deposit: g.deposit,
                                items: g.items || []
                            });
                        }
                    });
                });

                try {
                    const res = await fetchGas(`${activeGasUrl}?action=search_all_broadcasts&masterId=${activeStaffSheetId}&keyword=${encodeURIComponent(kw)}&t=${Date.now()}`);
                    const serverResults = (res && res.success && Array.isArray(res.results)) ? res.results : [];
                    const merged = [...localResults];
                    serverResults.forEach(sr => {
                        const exists = merged.some(m => m.recordType === sr.recordType && m.broadcastName === sr.broadcastName && normalizeString(m.nick) === normalizeString(sr.nick));
                        if (!exists) merged.push(sr);
                    });
                    setGlobalSearchResults(merged);
                } catch (e) {
                    setGlobalSearchResults(localResults);
                } finally {
                    setIsSearchingGlobal(false);
                }
            };

            const getGroupSummary = useCallback((g) => {
                const activeItems = (g.items || []).filter(i => !i.isWaitlist);
                const waitItems = (g.items || []).filter(i => i.isWaitlist);
                const prodTotal = activeItems.reduce((s, i) => s + (Number(i.price) || 0), 0);
                const prodForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);

                let ship = 0;
                if (activeItems.length > 0 && prodForShip > 0 && !g.isVip) {
                    // ✨ 시트 E열(배송비)에 명시적으로 적혀 있는 배송비(4000, 7000, 0 등)를 절대 무시하지 않고 100% 그대로 사용!
                    if (g.shipping !== undefined && g.shipping !== null && g.shipping !== '' && !isNaN(Number(g.shipping))) {
                        ship = Number(g.shipping);
                    } else {
                        const isJeju = Boolean(g.address && g.address.includes('제주'));
                        const isFreeShip = freeShipThreshold > 0 && prodForShip >= freeShipThreshold;
                        const baseShip = isFreeShip ? 0 : defaultShipping;
                        const jejuExtra = isJeju ? 3000 : 0;
                        ship = baseShip + jejuExtra;
                    }
                }
                const baseGrand = prodTotal + ship;
                const dep = Number(g.deposit) || 0;
                const baseBal = baseGrand - dep;
                const feeRate = Number(cardFeeRate) > 0 ? Number(cardFeeRate) / 100 : 0.1;
                const cardFee = (g.cardMode !== 'none' && baseBal > 0) ? Math.round(baseBal * feeRate) : 0;
                const finalGrand = baseGrand + cardFee;
                const finalBal = baseBal + cardFee;
                const isPaid = activeItems.length > 0 && baseBal <= 0 && g.cardMode === 'none';

                return { activeItems, waitItems, prodTotal, ship, baseGrand, dep, baseBal, cardFee, finalGrand, finalBal, isPaid };
            }, [freeShipThreshold, defaultShipping, cardFeeRate]);

            const handleApplyCreditToOrderInStaff = useCallback((nick, availableCredit, currentBalance) => {
                const avail = Math.max(0, Number(availableCredit) || 0);
                const bal = Math.max(0, Number(currentBalance) || 0);
                if (avail <= 0 || bal <= 0) return;
                const useAmt = Math.min(avail, bal);
                const remainCredit = avail - useAmt;
                openModal(
                    `'${nick}' 고객님의 보유 적립금 ${avail.toLocaleString()}원 중 ${useAmt.toLocaleString()}원을 이번 주문에서 차감하시겠습니까?\n\n• 차감 후 남은 보유 적립금: ${remainCredit.toLocaleString()}원\n• 주문서에 '적립금 (-${useAmt.toLocaleString()}원)' 항목이 추가되고 시트에 즉시 자동 저장됩니다!`,
                    'confirm',
                    () => {
                        handleUpdateCustomerCredit(nick, remainCredit);
                        const nextGroups = customerGroups.map(cur => cur.nick === nick ? {
                            ...cur,
                            items: [
                                ...cur.items,
                                {
                                    id: `item_${Date.now()}_${Math.random()}`,
                                    product: '적립금',
                                    qty: 1,
                                    price: -Math.abs(useAmt),
                                    isWaitlist: false,
                                    waitlistOrder: 0
                                }
                            ]
                        } : cur);
                        setCustomerGroups(nextGroups);
                        saveUpdatedGroupsImmediately(nextGroups, `⚡ '${nick}' 님 주문에 적립금 -${useAmt.toLocaleString()}원이 차감되어 시트에 즉시 저장되었습니다!`);
                    }
                );
            }, [openModal, customerGroups, handleUpdateCustomerCredit]);

            const handleSaveAll = useCallback(async () => {
                if (isSaving) return;
                setIsSaving(true);
                try {
                    // ✨ 어느 탭을 보고 있든 [시트 저장 (Ctrl+S)]을 누르면 '메인주문' 탭과 '교환반품CS' 탭 양쪽 모두를 100% 동시에 저장합니다!
                    const serializedCs = (csGroupsRef.current || []).map(c => ({
                        ...c,
                        csMemo: combineCsMemoAndAccount(c.csMemo, c.refundAccount, c.refundAmount, c.refundCompleted, c.convertedToCredit),
                        shipping: Number(c.shipping) || 0,
                        deposit: c.csFeePaid ? (Number(c.shipping) || Number(c.deposit) || 0) : 0
                    }));
                    try {
                        localStorage.setItem('ember_staff_cs_groups_v1', JSON.stringify(csGroupsRef.current || []));
                        localStorage.setItem(STAFF_CS_DIRTY_TIME_KEY, String(Date.now()));
                    } catch (e) {}
                    syncCsGroupsToFirebase(csGroupsRef.current || []);

                    const cleanBName = cleanDisplayTabName(broadcastName || selectedTab);
                    const canonicalTab = '주문_' + cleanBName;

                    // 현재 방송의 행 데이터 생성 함수
                    const buildRowsForBroadcast = (bTitle, fThresh, dShip, cRate, groupsArr) => {
                        const rows = [{
                            '닉네임': '___WORKSPACE_META___',
                            '주문자': '___WORKSPACE_META___',
                            customer: '___WORKSPACE_META___',
                            nickname: '___WORKSPACE_META___',
                            name: '___WORKSPACE_META___',
                            '상품명': bTitle,
                            product: bTitle,
                            '수량': Number(fThresh) || 70000,
                            quantity: Number(fThresh) || 70000,
                            qty: Number(fThresh) || 70000,
                            '단가(제품금액)': Number(dShip) || 4000,
                            price: Number(dShip) || 4000,
                            '배송비': Number(cRate) || 10,
                            shipping: Number(cRate) || 10,
                            '입금액': 0,
                            deposit: 0,
                            '카드결제': '', '수령인명': '', '연락처': '', '주소': '', '요청사항': '',
                            'VIP여부': '', '노쇼여부': '', '대기여부': '', '비밀번호': '', '주문확인': '', '입금내역JSON': '', '송장번호': ''
                        }];
                        (groupsArr || []).forEach(g => {
                            const sum = getGroupSummary(g);
                            const baseCardStr = g.cardMode === 'completed' ? `카드완료(${cRate}%)` : (g.cardMode === 'requested' ? `O(${cRate}%)` : '');
                            const cashStr = g.cashReceiptMode === 'completed' ? '현영완료' : (g.cashReceiptMode === 'requested' ? '현영요청' : '');
                            const cardStr = [baseCardStr, cashStr].filter(Boolean).join(' / ');
                            const cleanPh = fixPhoneNumber(g.phone);
                            const pinStr = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                            const depJson = Array.isArray(g.deposits) && g.deposits.length > 0 ? JSON.stringify(g.deposits) : '';
                            const itemsList = (g.items && g.items.length > 0) ? g.items : [{ product: '', qty: 1, price: 0, isWaitlist: false, waitlistOrder: 0 }];

                            itemsList.forEach((it, idx) => {
                                const waitCell = it.isWaitlist ? `대기${it.waitlistOrder || 1}번` : '';
                                rows.push({
                                    '닉네임': g.nick,
                                    '주문자': g.nick,
                                    customer: g.nick,
                                    nickname: g.nick,
                                    name: g.nick,
                                    '상품명': it.product || '',
                                    product: it.product || '',
                                    '수량': Number(it.qty) || 1,
                                    quantity: Number(it.qty) || 1,
                                    qty: Number(it.qty) || 1,
                                    '단가(제품금액)': Number(it.price) || 0,
                                    price: Number(it.price) || 0,
                                    '배송비': sum.ship,
                                    shipping: sum.ship,
                                    '입금액': idx === 0 ? sum.dep : 0,
                                    deposit: idx === 0 ? sum.dep : 0,
                                    '카드결제': cardStr,
                                    '수령인명': g.realname || '',
                                    '연락처': cleanPh ? "'" + cleanPh : '',
                                    '주소': stripZipcode(g.address || ''),
                                    '요청사항': cleanMemoText(g.memo, g.address),
                                    'VIP여부': g.isVip ? 'O' : '',
                                    '노쇼여부': g.isNoShow ? 'O' : '',
                                    '대기여부': waitCell,
                                    '비밀번호': pinStr ? "'" + pinStr : '',
                                    '주문확인': g.isConfirmed ? 'O' : '',
                                    '입금내역JSON': idx === 0 ? depJson : '',
                                    '송장번호': g.trackingNumber ? "'" + String(g.trackingNumber).replace(/^'+/, '') : ''
                                });
                            });
                        });
                        return rows;
                    };

                    const updatedStore = {
                        ...localBroadcastStore,
                        ...(cleanBName ? {
                            [canonicalTab]: {
                                broadcastName: cleanBName,
                                freeShipThreshold,
                                defaultShipping,
                                cardFeeRate,
                                updatedAt: Date.now(),
                                groups: customerGroups
                            }
                        } : {})
                    };
                    setLocalBroadcastStore(updatedStore);
                    try {
                        localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(updatedStore));
                        localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                    } catch (e) {}

                    const allCombinedRows = [];
                    Object.keys(updatedStore)
                        .filter(k => k.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(k))
                        .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                        .forEach(tKey => {
                            const blk = updatedStore[tKey];
                            if (blk && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                const bTitle = cleanDisplayTabName(blk.broadcastName || tKey);
                                allCombinedRows.push(...buildRowsForBroadcast(bTitle, blk.freeShipThreshold, blk.defaultShipping, blk.cardFeeRate, blk.groups));
                            }
                        });

                    // 구글 시트 Lock 충돌 방지를 위해 순차적으로 빠르게 저장 (save_orders에 이미 송장번호 R열이 전부 포함되어 있으므로 중복 save_tracking_numbers 제거!)
                    let resOrders = { success: true };
                    if (allCombinedRows.length > 0) {
                        resOrders = await fetchGas(activeGasUrl, {
                            action: 'save_orders',
                            masterId: activeStaffSheetId,
                            targetSheetName: '메인주문',
                            onlyMainOrder: true,
                            broadcastName: '오늘의방송',
                            data: allCombinedRows
                        }, 12000);
                    }
                    const resCs = await fetchGas(activeGasUrl, {
                        action: 'save_cs_orders',
                        masterId: activeStaffSheetId,
                        items: serializedCs
                    }, 12000);

                    customerGroups.forEach(g => {
                        if (customerCredits[g.nick] !== undefined) {
                            fetchGas(activeGasUrl, {
                                action: 'save_customer_credit',
                                masterId: activeDictSheetId,
                                data: { nickname: g.nick, credit: Number(customerCredits[g.nick]) || 0 }
                            }).catch(() => {});
                        }
                    });

                    if (staffFbDb && cleanBName) {
                        const safeBKey = cleanBName.replace(/[.#$\[\]\/]/g, '_');
                        customerGroups.forEach(g => {
                            const safeNickKey = String(g.nick || '').replace(/[.#$\[\]\/]/g, '_').trim();
                            if (!safeNickKey) return;
                            if (customerCredits[g.nick] !== undefined) {
                                staffFbDb.ref(`ember_live_data/_portal_credits/${safeNickKey}`).set({
                                    nickname: g.nick,
                                    credit: Number(customerCredits[g.nick]) || 0,
                                    updatedAt: Date.now()
                                }).catch(() => {});
                            }
                            if (g.address && safeBKey) {
                                const addrPayload = {
                                    nickname: g.nick,
                                    realname: g.realname || '',
                                    phone: fixPhoneNumber(g.phone || ''),
                                    address: stripZipcode(g.address),
                                    memo: cleanMemoText(g.memo, g.address),
                                    broadcastName: cleanBName,
                                    updatedAt: new Date().toISOString()
                                };
                                staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set(addrPayload).catch(() => {});
                            }
                        });
                        syncBroadcastGroupsToFirebase(cleanBName, customerGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                    }

                    setHasUnsavedChanges(false);
                    if ((resOrders && (resOrders.success || resOrders.status === 'success')) || (resCs && (resCs.success || resCs.status === 'success'))) {
                        showToast(`✅ 직원용 시트('메인주문' 및 '교환반품CS')와 고객 포털에 모두 저장 완료!`);
                    } else {
                        showToast(`✅ 고객 포털 및 로컬에 즉시 반영되었습니다!`);
                    }
                } finally {
                    setIsSaving(false);
                }
            }, [isSaving, activeGasUrl, activeStaffSheetId, activeDictSheetId, selectedTab, broadcastName, freeShipThreshold, defaultShipping, cardFeeRate, customerGroups, customerCredits, localBroadcastStore, getGroupSummary, showToast]);
            useEffect(() => {
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'ㄴ')) {
                        e.preventDefault();
                        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                        setTimeout(() => { handleSaveAll(); }, 30);
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [handleSaveAll]);

            // ✨ 주문서 전체 행을 순차 대기열(Queue)을 통해 구글 시트('메인주문' 탭)에 유실 없이 끝까지 저장하는 함수
            const flushOrdersQueueToSheet = useCallback(async () => {
                if (isOrdersSavingQueueRef.current) return;
                isOrdersSavingQueueRef.current = true;
                try {
                    while (pendingOrdersRowsRef.current !== null) {
                        const rowsToPush = pendingOrdersRowsRef.current;
                        pendingOrdersRowsRef.current = null;
                        if (rowsToPush.length > 0) {
                            await fetchGas(activeGasUrl, {
                                action: 'save_orders',
                                masterId: activeStaffSheetId,
                                targetSheetName: '메인주문',
                                onlyMainOrder: true,
                                broadcastName: '오늘의방송',
                                data: rowsToPush
                            }, 15000);
                        }
                    }
                } catch (e) {} finally {
                    isOrdersSavingQueueRef.current = false;
                }
            }, [activeGasUrl, activeStaffSheetId]);

            // ✨ 송장번호 및 단일 주문 추가/삭제/수정 변경 사항을 대기 시간 0초(Non-blocking)로 시트('메인주문' 탭)와 고객 포털(Firebase)에 즉시 자동 저장하는 헬퍼 함수
            const saveUpdatedGroupsImmediately = useCallback((nextGroups, toastMessage, targetBroadcastNameOverride = null) => {
                const rawTargetName = targetBroadcastNameOverride || broadcastName || selectedTab;
                const cleanBName = cleanDisplayTabName(rawTargetName);
                if (!cleanBName || ['기본방송', '주문', '주문통합', '메인주문'].includes(cleanBName)) {
                    return;
                }
                const canonicalTab = '주문_' + cleanBName;

                // 현재 화면에 열려 있던 이전 방송(selectedTab)도 최신 상태로 먼저 보존한 뒤, 타겟 방송(canonicalTab)을 업데이트!
                const prevActiveClean = cleanDisplayTabName(broadcastName || selectedTab);
                const prevCanonicalTab = prevActiveClean ? ('주문_' + prevActiveClean) : '';
                const baseStore = { ...localBroadcastStoreRef.current };
                if (prevCanonicalTab && prevCanonicalTab !== canonicalTab && customerGroupsRef.current && customerGroupsRef.current.length > 0) {
                    baseStore[prevCanonicalTab] = {
                        ...(baseStore[prevCanonicalTab] || {}),
                        broadcastName: prevActiveClean,
                        freeShipThreshold,
                        defaultShipping,
                        cardFeeRate,
                        updatedAt: Date.now(),
                        groups: customerGroupsRef.current
                    };
                }

                const updatedStore = {
                    ...baseStore,
                    [canonicalTab]: {
                        broadcastName: cleanBName,
                        freeShipThreshold,
                        defaultShipping,
                        cardFeeRate,
                        updatedAt: Date.now(),
                        groups: nextGroups
                    }
                };
                localBroadcastStoreRef.current = updatedStore;
                setLocalBroadcastStore(updatedStore);
                try {
                    localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(updatedStore));
                    localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                } catch (e) {}

                // 1) 고객 포털(Firebase)에 0.01초 만에 즉시 반영 및 완료 토스트 표시! (화면 멈춤 ZERO)
                if (staffFbDb && cleanBName) {
                    syncBroadcastGroupsToFirebase(cleanBName, nextGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                }
                setHasUnsavedChanges(false);
                if (toastMessage) showToast(toastMessage);

                // 2) 직원용 구글 시트('메인주문' 탭)에는 백그라운드 디바운스(0.35초) + 순차 대기열(Queue)로 모든 방송 블록을 빠짐없이 저장!
                if (autoSaveOrdersTimerRef.current) clearTimeout(autoSaveOrdersTimerRef.current);
                autoSaveOrdersTimerRef.current = setTimeout(() => {
                    const latestStore = localBroadcastStoreRef.current;
                    const buildRows = (bTitle, fThresh, dShip, cRate, groupsArr) => {
                        const rows = [{
                            '닉네임': '___WORKSPACE_META___',
                            '주문자': '___WORKSPACE_META___',
                            customer: '___WORKSPACE_META___',
                            nickname: '___WORKSPACE_META___',
                            name: '___WORKSPACE_META___',
                            '상품명': bTitle,
                            product: bTitle,
                            '수량': Number(fThresh) || 70000,
                            quantity: Number(fThresh) || 70000,
                            qty: Number(fThresh) || 70000,
                            '단가(제품금액)': Number(dShip) || 4000,
                            price: Number(dShip) || 4000,
                            '배송비': Number(cRate) || 10,
                            shipping: Number(cRate) || 10,
                            '입금액': 0,
                            deposit: 0,
                            '카드결제': '', '수령인명': '', '연락처': '', '주소': '', '요청사항': '',
                            'VIP여부': '', '노쇼여부': '', '대기여부': '', '비밀번호': '', '주문확인': '', '입금내역JSON': '', '송장번호': ''
                        }];
                        (groupsArr || []).forEach(g => {
                            const sum = getGroupSummary(g);
                            const baseCardStr = g.cardMode === 'completed' ? `카드완료(${cRate}%)` : (g.cardMode === 'requested' ? `O(${cRate}%)` : '');
                            const cashStr = g.cashReceiptMode === 'completed' ? '현영완료' : (g.cashReceiptMode === 'requested' ? '현영요청' : '');
                            const cardStr = [baseCardStr, cashStr].filter(Boolean).join(' / ');
                            const cleanPh = fixPhoneNumber(g.phone);
                            const pinStr = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                            const depJson = Array.isArray(g.deposits) && g.deposits.length > 0 ? JSON.stringify(g.deposits) : '';
                            const itemsList = (g.items && g.items.length > 0) ? g.items : [{ product: '', qty: 1, price: 0, isWaitlist: false, waitlistOrder: 0 }];

                            itemsList.forEach((it, idx) => {
                                const waitCell = it.isWaitlist ? `대기${it.waitlistOrder || 1}번` : '';
                                rows.push({
                                    '닉네임': g.nick,
                                    '주문자': g.nick,
                                    customer: g.nick,
                                    nickname: g.nick,
                                    name: g.nick,
                                    '상품명': it.product || '',
                                    product: it.product || '',
                                    '수량': Number(it.qty) || 1,
                                    quantity: Number(it.qty) || 1,
                                    qty: Number(it.qty) || 1,
                                    '단가(제품금액)': Number(it.price) || 0,
                                    price: Number(it.price) || 0,
                                    '배송비': sum.ship,
                                    shipping: sum.ship,
                                    '입금액': idx === 0 ? sum.dep : 0,
                                    deposit: idx === 0 ? sum.dep : 0,
                                    '카드결제': cardStr,
                                    '수령인명': g.realname || '',
                                    '연락처': cleanPh ? "'" + cleanPh : '',
                                    '주소': stripZipcode(g.address || ''),
                                    '요청사항': cleanMemoText(g.memo, g.address),
                                    'VIP여부': g.isVip ? 'O' : '',
                                    '노쇼여부': g.isNoShow ? 'O' : '',
                                    '대기여부': waitCell,
                                    '비밀번호': pinStr ? "'" + pinStr : '',
                                    '주문확인': g.isConfirmed ? 'O' : '',
                                    '입금내역JSON': idx === 0 ? depJson : '',
                                    '송장번호': g.trackingNumber ? "'" + String(g.trackingNumber).replace(/^'+/, '') : ''
                                });
                            });
                        });
                        return rows;
                    };

                    const allCombinedRows = [];
                    Object.keys(latestStore)
                        .filter(k => k.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(k))
                        .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                        .forEach(tKey => {
                            const blk = latestStore[tKey];
                            if (blk && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                const bTitle = cleanDisplayTabName(blk.broadcastName || tKey);
                                allCombinedRows.push(...buildRows(bTitle, blk.freeShipThreshold, blk.defaultShipping, blk.cardFeeRate, blk.groups));
                            }
                        });

                    if (allCombinedRows.length > 0) {
                        pendingOrdersRowsRef.current = allCombinedRows;
                        flushOrdersQueueToSheet();
                    }
                }, 350);
            }, [broadcastName, selectedTab, freeShipThreshold, defaultShipping, cardFeeRate, customerCredits, getGroupSummary, flushOrdersQueueToSheet, showToast]);

            // 주문서 내역(품목명, 수량, 단가, 완납, 카드, 노쇼, 대기 등)을 수정하면 즉시 로컬 스토어를 갱신하고 0.5초 뒤 자동으로 직원용 구글 시트('메인주문')와 고객 포털에 저장!
            const updateCustomerGroup = useCallback((nick, updater) => {
                setCustomerGroups(prev => {
                    const nextGroups = prev.map(g => g.nick === nick ? updater(g) : g);
                    const cleanBName = cleanDisplayTabName(broadcastName || selectedTab);
                    const canonicalTab = '주문_' + cleanBName;
                    if (cleanBName) {
                        const updatedStore = {
                            ...localBroadcastStoreRef.current,
                            [canonicalTab]: {
                                broadcastName: cleanBName,
                                freeShipThreshold,
                                defaultShipping,
                                cardFeeRate,
                                updatedAt: Date.now(),
                                groups: nextGroups
                            }
                        };
                        localBroadcastStoreRef.current = updatedStore;
                        try {
                            localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(updatedStore));
                            localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                        } catch (e) {}
                    }
                    if (cleanBName && staffFbDb) {
                        syncBroadcastGroupsToFirebase(cleanBName, nextGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                    }
                    if (autoSaveOrdersTimerRef.current) clearTimeout(autoSaveOrdersTimerRef.current);
                    autoSaveOrdersTimerRef.current = setTimeout(() => {
                        saveUpdatedGroupsImmediately(nextGroups, '');
                    }, 500);
                    return nextGroups;
                });
            }, [broadcastName, selectedTab, freeShipThreshold, defaultShipping, cardFeeRate, customerCredits, saveUpdatedGroupsImmediately]);

            const handleApplyMasterAddressToGroup = useCallback((targetNick, addrEntry) => {
                if (!targetNick || !addrEntry) return;
                const cleanPh = fixPhoneNumber(addrEntry.phone);
                const cleanAddr = stripZipcode(addrEntry.address || '');
                const cleanM = cleanMemoText(addrEntry.memo || '', cleanAddr);
                const newPin = cleanPh.length >= 4 ? cleanPh.slice(-4) : '';
                const cleanBName = cleanDisplayTabName(broadcastName || selectedTab || '');

                setCustomerGroups(prev => {
                    const nextGroups = prev.map(g => g.nick === targetNick ? {
                        ...g,
                        realname: addrEntry.realname || g.realname,
                        phone: cleanPh || g.phone,
                        address: cleanAddr || g.address,
                        memo: cleanM || g.memo,
                        pin: newPin || g.pin
                    } : g);

                    if (staffFbDb && cleanBName && cleanAddr) {
                        const safeBKey = cleanBName.replace(/[.#$\[\]\/]/g, '_');
                        const safeNickKey = String(targetNick).replace(/[.#$\[\]\/]/g, '_').trim();
                        if (safeBKey && safeNickKey) {
                            staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}/${safeNickKey}`).set({
                                nickname: targetNick,
                                realname: addrEntry.realname || '',
                                phone: cleanPh,
                                address: cleanAddr,
                                memo: cleanM,
                                broadcastName: cleanBName,
                                updatedAt: new Date().toISOString()
                            }).catch(() => {});
                        }
                    }

                    saveUpdatedGroupsImmediately(nextGroups, `📗 '${targetNick}' 님께 찐고객사전 배송지가 적용되어 시트와 고객 포털에 즉시 저장되었습니다!`);
                    return nextGroups;
                });
            }, [broadcastName, selectedTab, saveUpdatedGroupsImmediately]);

            const handleRenameBroadcast = useCallback((targetTabToRename = null) => {
                const baseTab = targetTabToRename || selectedTab || ('주문_' + broadcastName);
                const oldCleanName = cleanDisplayTabName(baseTab);
                if (!oldCleanName) return;

                openModal(
                    `'${oldCleanName}' 방송의 새로운 이름을 입력해 주세요.\n(변경 시 좌측 목록, 시트 구분선, 고객 포털에 모두 반영됩니다)`,
                    'prompt',
                    (newNameInput) => {
                        const nextCleanName = cleanDisplayTabName(newNameInput);
                        if (!nextCleanName || nextCleanName === oldCleanName) return;

                        const oldTabKey = '주문_' + oldCleanName;
                        const newTabKey = '주문_' + nextCleanName;

                        // 1) 로컬 방송 창고(localBroadcastStore)에서 키 이동 및 방송명 업데이트
                        setLocalBroadcastStore(prev => {
                            const nextStore = { ...prev };
                            const existingBlk = nextStore[oldTabKey] || nextStore[baseTab] || {
                                broadcastName: nextCleanName,
                                freeShipThreshold,
                                defaultShipping,
                                cardFeeRate,
                                groups: customerGroups
                            };
                            delete nextStore[oldTabKey];
                            if (baseTab !== oldTabKey) delete nextStore[baseTab];
                            nextStore[newTabKey] = {
                                ...existingBlk,
                                broadcastName: nextCleanName,
                                updatedAt: Date.now(),
                                groups: (selectedTab === oldTabKey || selectedTab === baseTab) ? customerGroups : (existingBlk.groups || [])
                            };
                            localBroadcastStoreRef.current = nextStore;
                            try {
                                localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(nextStore));
                                localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                            } catch (e) {}
                            return nextStore;
                        });

                        // 2) 좌측 방송 탭 목록 업데이트 및 날짜순 재정렬
                        setOrderTabs(prev => {
                            const replaced = prev.map(t => (t === oldTabKey || t === baseTab) ? newTabKey : t);
                            if (!replaced.includes(newTabKey)) replaced.unshift(newTabKey);
                            return Array.from(new Set(replaced)).sort((a, b) => {
                                const scoreA = extractBroadcastDateScore(a);
                                const scoreB = extractBroadcastDateScore(b);
                                if (scoreA !== scoreB) return scoreB - scoreA;
                                return b.localeCompare(a, 'ko');
                            });
                        });

                        // 3) 현재 보고 있던 방송이면 선택 상태도 새 이름으로 즉시 전환
                        if (selectedTab === oldTabKey || selectedTab === baseTab || cleanDisplayTabName(broadcastName) === oldCleanName) {
                            setSelectedTab(newTabKey);
                            setBroadcastName(nextCleanName);
                        }

                        // 4) 미송/교환/반품 CS 목록 중 이 방송에서 복사된 내역의 원본방송명도 함께 변경
                        const updatedCs = (csGroupsRef.current || []).map(c =>
                            cleanDisplayTabName(c.sourceBroadcast) === oldCleanName
                                ? { ...c, sourceBroadcast: nextCleanName }
                                : c
                        );
                        setCsGroups(updatedCs);
                        saveCsOrdersToSheetImmediate(updatedCs);

                        // 5) 고객 포털 실시간 클라우드(Firebase)에서 이전 방송키 데이터를 새 방송키로 이동
                        const targetGroups = (selectedTab === oldTabKey || selectedTab === baseTab)
                            ? customerGroups
                            : (localBroadcastStore[oldTabKey]?.groups || []);
                        if (staffFbDb) {
                            const oldSafeKey = oldCleanName.replace(/[.#$\[\]\/]/g, '_');
                            if (oldSafeKey) {
                                staffFbDb.ref(`ember_live_data/_portal_orders/${oldSafeKey}`).remove().catch(() => {});
                            }
                            syncBroadcastGroupsToFirebase(nextCleanName, targetGroups, freeShipThreshold, cardFeeRate, customerCredits, 'staff');
                        }

                        saveUpdatedGroupsImmediately(targetGroups, `✏️ 방송 이름이 '${oldCleanName}' ➔ '${nextCleanName}'(으)로 변경되어 시트에 즉시 저장되었습니다!`);
                    },
                    oldCleanName,
                    '방송 이름 변경'
                );
            }, [selectedTab, broadcastName, freeShipThreshold, defaultShipping, cardFeeRate, customerGroups, customerCredits, localBroadcastStore, openModal, saveCsOrdersToSheetImmediate, saveUpdatedGroupsImmediately]);

            // ✨ 테스트로 생성된 방송이나 잘못 만든 방송 블록을 시트 + 로컬 + 고객 포털 클라우드에서 완전히 삭제하는 함수
            const handleDeleteBroadcastBlock = useCallback((targetTabToDelete) => {
                const cleanTarget = cleanDisplayTabName(targetTabToDelete);
                if (!cleanTarget) return;
                const tabKey = '주문_' + cleanTarget;

                openModal(
                    `[${cleanTarget}] 방송 전체 주문 내역을 완전히 삭제하시겠습니까?\n(삭제 즉시 직원용 시트와 고객용 주문확인 포털에서도 흔적 없이 사라집니다)`,
                    'confirm',
                    () => {
                        const nextStore = { ...localBroadcastStoreRef.current };
                        delete nextStore[tabKey];
                        delete nextStore[targetTabToDelete];
                        localBroadcastStoreRef.current = nextStore;
                        setLocalBroadcastStore(nextStore);
                        try {
                            localStorage.setItem(STAFF_LOCAL_STORE_KEY, JSON.stringify(nextStore));
                            localStorage.setItem(STAFF_LOCAL_DIRTY_TIME_KEY, String(Date.now()));
                        } catch (e) {}

                        // 고객 포털 클라우드(Firebase)에서도 해당 방송 방과 임시 생방송 방 즉시 삭제!
                        if (staffFbDb) {
                            const safeBKey = cleanTarget.replace(/[.#$\[\]\/]/g, '_');
                            if (safeBKey) {
                                staffFbDb.ref(`ember_live_data/_portal_orders/${safeBKey}`).remove().catch(() => {});
                                staffFbDb.ref(`ember_live_data/_portal_broadcast_addresses/${safeBKey}`).remove().catch(() => {});
                            }
                            staffFbDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').remove().catch(() => {});
                            staffFbDb.ref('ember_live_data/_portal_live_mode').set({
                                isLive: false,
                                updatedAt: Date.now()
                            }).catch(() => {});
                        }

                        const remainingTabs = orderTabs.filter(t => t !== tabKey && t !== targetTabToDelete);
                        setOrderTabs(remainingTabs);

                        if (selectedTab === tabKey || selectedTab === targetTabToDelete) {
                            const nextTab = remainingTabs[0] || '';
                            setSelectedTab(nextTab);
                            if (nextTab && nextStore[nextTab]) {
                                setBroadcastName(nextStore[nextTab].broadcastName || cleanDisplayTabName(nextTab));
                                setCustomerGroups(nextStore[nextTab].groups || []);
                            } else {
                                setBroadcastName('');
                                setCustomerGroups([]);
                            }
                        }

                        // 남은 방송들만 모아서 직원용 구글 시트('메인주문')에 덮어쓰기 저장
                        const allCombinedRows = [];
                        Object.keys(nextStore)
                            .filter(k => k.startsWith('주문_') && !['주문_기본방송', '주문_주문', '주문_주문통합', '주문_메인주문'].includes(k))
                            .sort((a, b) => extractBroadcastDateScore(b) - extractBroadcastDateScore(a))
                            .forEach(tKey => {
                                const blk = nextStore[tKey];
                                if (blk && Array.isArray(blk.groups) && blk.groups.length > 0) {
                                    const bTitle = cleanDisplayTabName(blk.broadcastName || tKey);
                                    allCombinedRows.push({
                                        '닉네임': '___WORKSPACE_META___', '상품명': bTitle,
                                        '수량': Number(blk.freeShipThreshold) || 70000,
                                        '단가(제품금액)': Number(blk.defaultShipping) || 4000,
                                        '배송비': Number(blk.cardFeeRate) || 10, '입금액': 0
                                    });
                                    blk.groups.forEach(g => {
                                        const sum = getGroupSummary(g);
                                        const cleanPh = fixPhoneNumber(g.phone);
                                        const pinStr = normalizePin4(g.pin) || (cleanPh.length >= 4 ? cleanPh.slice(-4) : '');
                                        const depJson = Array.isArray(g.deposits) && g.deposits.length > 0 ? JSON.stringify(g.deposits) : '';
                                        (g.items || []).forEach((it, idx) => {
                                            allCombinedRows.push({
                                                '닉네임': g.nick, '상품명': it.product || '', '수량': Number(it.qty) || 1,
                                                '단가(제품금액)': Number(it.price) || 0, '배송비': sum.ship,
                                                '입금액': idx === 0 ? sum.dep : 0, '카드결제': '',
                                                '수령인명': g.realname || '', '연락처': cleanPh ? "'" + cleanPh : '',
                                                '주소': stripZipcode(g.address || ''), '요청사항': cleanMemoText(g.memo, g.address),
                                                'VIP여부': g.isVip ? 'O' : '', '노쇼여부': g.isNoShow ? 'O' : '',
                                                '대기여부': it.isWaitlist ? `대기${it.waitlistOrder || 1}번` : '',
                                                '비밀번호': pinStr ? "'" + pinStr : '', '주문확인': g.isConfirmed ? 'O' : '',
                                                '입금내역JSON': idx === 0 ? depJson : '',
                                                '송장번호': g.trackingNumber ? "'" + String(g.trackingNumber).replace(/^'+/, '') : ''
                                            });
                                        });
                                    });
                                }
                            });

                        pendingOrdersRowsRef.current = allCombinedRows;
                        flushOrdersQueueToSheet();
                        showToast(`🗑️ [${cleanTarget}] 방송 및 고객 포털 캐시가 완전히 삭제되었습니다!`);
                    }
                );
            }, [orderTabs, selectedTab, openModal, getGroupSummary, flushOrdersQueueToSheet, showToast]);

            const handleSingleAddOrder = (e) => {
                e.preventDefault();
                const cleanN = newNick.trim();
                const cleanP = newProd.trim();
                if (!cleanN || !cleanP) return openModal('닉네임과 상품명을 모두 입력해 주세요.');
                const q = Number(newQty) || 1;
                const unitP = Number(String(newPrice).replace(/,/g, '')) || 0;
                const totalP = (cleanP === '적립금' && unitP > 0) ? -Math.abs(unitP * q) : unitP * q;

                const matchedDictAddr = findMasterAddressMatch(cleanN);
                const isCustomerVip = Boolean(
                    vipNickMap[normalizeString(cleanN)] ||
                    (normalizeHandleNick(cleanN) && vipNickMap[normalizeHandleNick(cleanN)])
                );

                const idx = customerGroups.findIndex(g => normalizeString(g.nick) === normalizeString(cleanN));
                let nextGroups = [];
                if (idx !== -1) {
                    nextGroups = [...customerGroups];
                    nextGroups[idx] = {
                        ...nextGroups[idx],
                        isVip: nextGroups[idx].isVip || isCustomerVip,
                        realname: nextGroups[idx].realname || matchedDictAddr?.realname || '',
                        phone: nextGroups[idx].phone || matchedDictAddr?.phone || '',
                        address: nextGroups[idx].address || stripZipcode(matchedDictAddr?.address || ''),
                        memo: nextGroups[idx].memo || matchedDictAddr?.memo || '',
                        items: [...nextGroups[idx].items, { id: `item_${Date.now()}`, product: cleanP, qty: q, price: totalP, isWaitlist: false, waitlistOrder: 0 }]
                    };
                } else {
                    const cleanPh = matchedDictAddr ? fixPhoneNumber(matchedDictAddr.phone) : '';
                    nextGroups = [{
                        nick: cleanN,
                        realname: matchedDictAddr?.realname || '',
                        phone: cleanPh,
                        address: stripZipcode(matchedDictAddr?.address || ''),
                        memo: matchedDictAddr?.memo || '',
                        shipping: isCustomerVip ? 0 : defaultShipping,
                        deposit: 0,
                        cardMode: 'none',
                        cashReceiptMode: 'none',
                        isVip: isCustomerVip,
                        isNoShow: false,
                        isConfirmed: false,
                        pin: cleanPh.length >= 4 ? cleanPh.slice(-4) : '',
                        trackingNumber: '',
                        deposits: [],
                        showDeposits: false,
                        items: [{ id: `item_${Date.now()}`, product: cleanP, qty: q, price: totalP, isWaitlist: false, waitlistOrder: 0 }]
                    }, ...customerGroups];
                }

                setCustomerGroups(nextGroups);
                setNewProd('');
                setNewQty(1);
                setNewPrice('');
                setShowNewNickSuggest(false);

                // ✨ 단일 주문 추가 즉시 직원용 시트('메인주문')와 고객 포털(Firebase)에 자동 저장!
                const msg = matchedDictAddr
                    ? `✅ '${cleanN}' 님 주문 + 📗찐고객사전 주소(${matchedDictAddr.realname})가 시트 및 고객 포털에 즉시 저장되었습니다!`
                    : `✅ '${cleanN}' 님 주문이 직원용 시트 및 고객 포털에 즉시 저장되었습니다!`;
                saveUpdatedGroupsImmediately(nextGroups, msg);
            };

            const newNickSuggestions = useMemo(() => {
                const kw = normalizeString(newNick);
                if (!kw || masterAddresses.length === 0) return [];
                return masterAddresses.filter(a => {
                    const nNorm = normalizeString(a.nickname);
                    const rNorm = normalizeString(a.realname);
                    return nNorm.includes(kw) || (rNorm && rNorm.includes(kw));
                }).slice(0, 6);
            }, [newNick, masterAddresses]);

            const handleConfirmCopyToCs = (group, bName, taggedItems, extraInfo = {}) => {
                const isObj = extraInfo && typeof extraInfo === 'object';
                const memoStr = isObj ? (extraInfo.csMemo || '') : String(extraInfo || '');
                const accStr = isObj ? (extraInfo.refundAccount || '') : '';
                const refAmt = isObj ? (Number(extraInfo.refundAmount) || 0) : 0;
                const refDone = isObj ? Boolean(extraInfo.refundCompleted) : false;
                const credConv = isObj ? Boolean(extraInfo.convertedToCredit) : false;
                const feeNum = isObj ? (Number(extraInfo.csFee) || 0) : 0;
                const feePaid = isObj ? Boolean(extraInfo.csFeePaid) : false;

                if (credConv && refAmt > 0) {
                    const prevCredit = getCustomerCreditAmount(group.nick);
                    const nextCredit = prevCredit + refAmt;
                    handleUpdateCustomerCredit(group.nick, nextCredit, `[${(bName || selectedTab || '').replace(/^주문_/, '')}] 반품 환불금 적립전환 (+${refAmt.toLocaleString()}원)`);
                }

                const newCsEntry = {
                    id: `cs_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                    createdAt: new Date().toLocaleString('ko-KR'),
                    sourceBroadcast: (bName || selectedTab || '').replace(/^주문_/, ''),
                    csStatus: credConv ? '처리완료' : '접수',
                    nick: group.nick,
                    realname: group.realname || '',
                    phone: group.phone || '',
                    address: stripZipcode(group.address || ''),
                    origTracking: group.trackingNumber || '',
                    csTracking: '',
                    csMemo: memoStr,
                    refundAccount: accStr,
                    refundAmount: refAmt,
                    refundCompleted: refDone || credConv,
                    convertedToCredit: credConv,
                    shipping: feeNum,
                    deposit: feePaid ? feeNum : 0,
                    csFeePaid: feePaid,
                    cardMode: group.cardMode || 'none',
                    items: taggedItems
                };

                const nextCsList = [newCsEntry, ...csGroups];
                setCsGroups(nextCsList);
                setActiveMainTab('cs');
                // ✨ 미송/교환/반품으로 복사하는 즉시 직원용 구글 시트('교환반품CS' 탭)와 고객 포털에 자동 저장!
                saveCsOrdersToSheetImmediate(
                    nextCsList,
                    credConv && refAmt > 0
                        ? `💰 '${group.nick}' 님의 환불금 ${refAmt.toLocaleString()}원이 적립금으로 전환되어 CS 및 시트에 즉시 저장되었습니다!`
                        : `✅ '${group.nick}' 님의 미송/교환/반품 내역이 직원용 시트 및 고객 포털에 즉시 저장되었습니다!`
                );
            };

            const handleTrackingExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        // 1행이 제목줄이 아닌 롯데택배 양식도 모두 읽을 수 있도록 2차원 배열로 먼저 스캔
                        const rawAoA = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                        let headerRowIdx = 0;
                        for (let r = 0; r < Math.min(rawAoA.length, 10); r++) {
                            const rowStr = (rawAoA[r] || []).map(c => String(c || '').replace(/\s+/g, '')).join('|');
                            if ((rowStr.includes('송장') || rowStr.includes('화물번호') || rowStr.includes('등기')) &&
                                (rowStr.includes('성명') || rowStr.includes('이름') || rowStr.includes('받는') || rowStr.includes('수하인') || rowStr.includes('수령인') || rowStr.includes('닉네임') || rowStr.includes('고객'))) {
                                headerRowIdx = r;
                                break;
                            }
                        }

                        const headers = (rawAoA[headerRowIdx] || []).map((h, idx) => String(h || '').trim() || `col_${idx}`);
                        const rows = rawAoA.slice(headerRowIdx + 1).map(rowArr => {
                            const obj = {};
                            headers.forEach((h, idx) => { obj[h] = rowArr[idx] !== undefined ? rowArr[idx] : ''; });
                            return obj;
                        });

                        const cleanPersonName = (str) => {
                            return String(str || '')
                                .replace(/^\[.*?\]\s*/, '')
                                .replace(/\(.*?\)/g, '')
                                .replace(/님$/g, '')
                                .replace(/[★☆♡♥]/g, '')
                                .trim();
                        };

                        const matchedByNick = {};
                        const duplicateWarnings = [];
                        const unmatchedRows = [];

                        rows.forEach(r => {
                            let nick = '', realname = '', phone = '', trk = '';
                            Object.keys(r).forEach(k => {
                                const ck = k.replace(/\s+/g, '');
                                const val = String(r[k] ?? '').trim();
                                if (!val) return;
                                if (ck.includes('닉네임') || ck.includes('주문자') || ck.includes('주문자명')) {
                                    nick = cleanPersonName(val);
                                } else if (ck.includes('수하인') || ck.includes('수령인') || ck.includes('받는분') || ck.includes('받는사람') || ck.includes('성명') || ck === '이름' || ck === '고객명' || ck.includes('수취인')) {
                                    if (!ck.includes('전화') && !ck.includes('연락처') && !ck.includes('핸드폰') && !ck.includes('휴대폰') && !ck.includes('주소')) {
                                        realname = cleanPersonName(val);
                                    }
                                } else if (ck.includes('전화') || ck.includes('연락처') || ck.includes('핸드폰') || ck.includes('휴대폰') || ck.includes('모바일')) {
                                    const digits = val.replace(/[^0-9]/g, '');
                                    if (digits.length >= 4 && digits.length > phone.length) phone = digits;
                                } else if (ck.includes('운송장') || ck.includes('송장') || ck.includes('등기') || ck.includes('화물번호')) {
                                    const cleanTrk = val.replace(/[^0-9-]/g, '').replace(/^-+|-+$/g, '');
                                    if (cleanTrk.replace(/[^0-9]/g, '').length >= 10) trk = cleanTrk;
                                }
                            });

                            if (!trk || (!nick && !realname && !phone)) return;

                            const inPhoneFull = fixPhoneNumber(phone);
                            const inPhoneLast4 = phone.length >= 4 ? phone.slice(-4) : '';
                            const inNickNorm = normalizeString(nick);
                            const inNickHandle = normalizeHandleNick(nick);
                            const inRealNorm = normalizeString(realname);
                            const inRealHandle = normalizeHandleNick(realname);

                            let candidates = [];

                            // 1순위: 휴대폰 전체 번호 일치 (가장 정확)
                            if (inPhoneFull.length >= 10) {
                                candidates = customerGroups.filter(g => fixPhoneNumber(g.phone) === inPhoneFull);
                            }
                            // 2순위: 닉네임(핸들 제거 포함) 정확히 일치
                            if (candidates.length !== 1 && inNickNorm) {
                                const byNick = customerGroups.filter(g =>
                                    normalizeString(g.nick) === inNickNorm ||
                                    (inNickHandle && normalizeHandleNick(g.nick) === inNickHandle)
                                );
                                if (byNick.length > 0) candidates = byNick;
                            }
                            // 3순위: 수령인 성함 + 전화번호 뒷 4자리 동시 일치 (동명이인 완벽 구분)
                            if (candidates.length !== 1 && inRealNorm && inPhoneLast4) {
                                const byNameAndLast4 = customerGroups.filter(g => {
                                    const gReal = normalizeString(cleanPersonName(g.realname));
                                    const gNick = normalizeHandleNick(g.nick);
                                    const gLast4 = g.phone && g.phone.length >= 4 ? g.phone.slice(-4) : normalizePin4(g.pin);
                                    return (gReal === inRealNorm || gNick === inRealNorm) && gLast4 === inPhoneLast4;
                                });
                                if (byNameAndLast4.length > 0) candidates = byNameAndLast4;
                            }
                            // 4순위: 수령인 성함(또는 닉네임)이 일치하는 경우
                            if (candidates.length === 0 && (inRealNorm || inNickNorm)) {
                                const targetNorm = inRealNorm || inNickNorm;
                                candidates = customerGroups.filter(g => {
                                    const gReal = normalizeString(cleanPersonName(g.realname));
                                    const gNick = normalizeString(g.nick);
                                    const gNickH = normalizeHandleNick(g.nick);
                                    return gReal === targetNorm || gNick === targetNorm || (gNickH && gNickH === (inRealHandle || inNickHandle));
                                });
                            }

                            if (candidates.length === 1) {
                                const targetNick = candidates[0].nick;
                                if (matchedByNick[targetNick] && !matchedByNick[targetNick].includes(trk)) {
                                    matchedByNick[targetNick] = `${matchedByNick[targetNick]}, ${trk}`;
                                } else {
                                    matchedByNick[targetNick] = trk;
                                }
                            } else if (candidates.length > 1) {
                                duplicateWarnings.push(`• 수령인 '${realname || nick}' (${trk}) ➔ 동명이인: [${candidates.map(m => m.nick).join(', ')}]`);
                            } else {
                                unmatchedRows.push(`• ${realname || nick}${phone ? ` (${phone})` : ''} : ${trk}`);
                            }
                        });

                        const matchedCount = Object.keys(matchedByNick).length;
                        if (matchedCount > 0) {
                            const nextGroups = customerGroups.map(g => {
                                if (matchedByNick[g.nick]) {
                                    return { ...g, trackingNumber: matchedByNick[g.nick] };
                                }
                                return g;
                            });
                            setCustomerGroups(nextGroups);

                            // ✨ 엑셀 업로드 즉시 시트와 고객 포털에 자동 저장!
                            await saveUpdatedGroupsImmediately(nextGroups, `✅ 총 ${matchedCount}명의 송장번호가 시트 및 고객 포털에 즉시 저장되었습니다!`);

                            let msg = `✅ [${cleanDisplayTabName(broadcastName || selectedTab)}] 방송에 총 ${matchedCount}명의 롯데택배 송장번호가 매칭되어 시트와 고객 포털에 즉시 자동 저장되었습니다!`;
                            if (duplicateWarnings.length > 0) {
                                msg += `\n\n⚠️ [동명이인 보류 ${duplicateWarnings.length}건 - 개별 송장입력으로 넣어주세요]\n` + duplicateWarnings.slice(0, 10).join('\n');
                            }
                            if (unmatchedRows.length > 0) {
                                msg += `\n\n❓ [현재 방송 명단에 없는 수령인 ${unmatchedRows.length}건]\n(다른 날짜 방송인지 좌측 방송 탭을 확인해 주세요)\n` + unmatchedRows.slice(0, 8).join('\n') + (unmatchedRows.length > 8 ? `\n...외 ${unmatchedRows.length - 8}건` : '');
                            }
                            openModal(msg);
                        } else {
                            let failMsg = `[${cleanDisplayTabName(broadcastName || selectedTab)}] 방송 주문서에서 일치하는 고객(수령인명/닉네임/연락처)을 찾지 못했습니다.\n\n1) 좌측에서 송장을 넣을 올바른 방송 날짜가 선택되어 있는지 확인해 주세요.\n2) 엑셀 파일에 [받는분/수령인/닉네임] 열과 [운송장번호/송장번호] 열이 있는지 확인해 주세요.`;
                            if (unmatchedRows.length > 0) {
                                failMsg += `\n\n[엑셀에서 읽힌 수령인 예시]\n` + unmatchedRows.slice(0, 5).join('\n');
                            }
                            openModal(failMsg);
                        }
                    } catch (err) {
                        openModal('송장 엑셀 파일 처리 중 오류가 발생했습니다.');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            const handleExportProductsExcel = () => {
                const summary = {};
                const paidSummary = {};
                customerGroups.forEach(g => {
                    if (g.isNoShow) return;
                    const sum = getGroupSummary(g);
                    const isPaidOrCard = sum.isPaid || g.cardMode === 'requested' || g.cardMode === 'completed';
                    sum.activeItems.forEach(it => {
                        const p = it.product || '(상품명없음)';
                        const q = Number(it.qty) || 1;
                        const uPrice = q > 0 ? Math.round((Number(it.price) || 0) / q) : 0;
                        if (!summary[p]) summary[p] = { total: 0, price: uPrice };
                        if (!paidSummary[p]) paidSummary[p] = 0;
                        summary[p].total += q;
                        if (isPaidOrCard) paidSummary[p] += q;
                    });
                });

                const rows = Object.keys(summary).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true })).map(p => ({
                    '상품명': p,
                    '제품단가': summary[p].price,
                    '입금/카드 수량': paidSummary[p] || 0,
                    '미입금 수량': summary[p].total - (paidSummary[p] || 0),
                    '총 수량': summary[p].total
                }));
                downloadExcel(rows, `${broadcastName || '방송'}_발주용품목집계`);
            };

            const handleExportCustomersExcel = () => {
                const excelRows = [];
                customerGroups.forEach(g => {
                    const sum = getGroupSummary(g);
                    if (sum.activeItems.length === 0 && sum.waitItems.length === 0) return;
                    let statusStr = '완납';
                    if (g.isNoShow) statusStr = '노쇼';
                    else if (g.cardMode === 'completed') statusStr = `카드완료(${sum.finalBal.toLocaleString()})`;
                    else if (g.cardMode === 'requested') statusStr = `카드요청(${sum.finalBal.toLocaleString()})`;
                    else if (sum.baseBal > 0) statusStr = `미입금(미수 ${sum.baseBal.toLocaleString()})`;
                    else if (sum.baseBal < 0) statusStr = `과납(${Math.abs(sum.baseBal).toLocaleString()})`;

                    if (g.cashReceiptMode === 'completed') statusStr += ` / 현영완료(${sum.dep.toLocaleString()})`;
                    else if (g.cashReceiptMode === 'requested') statusStr += ` / 현영요청(${sum.dep.toLocaleString()})`;

                    const makeRow = (prodStr) => ({
                        '방송명': broadcastName,
                        '결제상태': statusStr,
                        '닉네임': g.isVip ? `[VIP] ${g.nick}` : g.nick,
                        '주문상품(수량)': prodStr,
                        '수령인명': g.realname || '',
                        '연락처': g.phone || '',
                        '주소': stripZipcode(g.address || ''),
                        '배송메모': g.memo || '',
                        '송장번호': g.trackingNumber || ''
                    });

                    excelRows.push(makeRow(`[ ${g.nick} ]`));
                    sum.activeItems.forEach(it => {
                        excelRows.push(makeRow(`${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                    sum.waitItems.forEach(it => {
                        const rankBadge = it.waitlistOrder ? `[대기${it.waitlistOrder}번] ` : '[대기] ';
                        excelRows.push(makeRow(`${rankBadge}${it.product}${it.qty > 1 ? ` ★${it.qty}개` : ''}`));
                    });
                });
                downloadExcel(excelRows, `${broadcastName || '방송'}_배송용고객리스트`);
            };

            const stats = useMemo(() => {
                let totalCustomers = 0, totalQty = 0, paidCount = 0, unpaidCount = 0, cardReqCount = 0, cardCompCount = 0, cashReqCount = 0, cashCompCount = 0, noAddrCount = 0, waitCount = 0;
                customerGroups.forEach(g => {
                    const sum = getGroupSummary(g);
                    if (sum.waitItems.length > 0) waitCount++;
                    if (sum.activeItems.length === 0) return;
                    totalCustomers++;
                    totalQty += sum.activeItems.reduce((acc, it) => acc + (Number(it.qty) || 1), 0);
                    if (!g.address) noAddrCount++;
                    if (g.cashReceiptMode === 'completed') cashCompCount++;
                    else if (g.cashReceiptMode === 'requested') cashReqCount++;
                    if (g.cardMode === 'completed') cardCompCount++;
                    else if (g.cardMode === 'requested') cardReqCount++;
                    else if (sum.isPaid) paidCount++;
                    else unpaidCount++;
                });
                return { totalCustomers, totalQty, paidCount, unpaidCount, cardReqCount, cardCompCount, cashReqCount, cashCompCount, noAddrCount, waitCount };
            }, [customerGroups, getGroupSummary]);

            const filteredGroups = useMemo(() => {
                const kw = normalizeString(localSearchTerm);
                return customerGroups.filter(g => {
                    const sum = getGroupSummary(g);
                    if (statusFilter === 'paid' && !(sum.isPaid && g.cardMode === 'none')) return false;
                    if (statusFilter === 'unpaid' && !(sum.baseBal > 0 && g.cardMode === 'none' && sum.activeItems.length > 0)) return false;
                    if (statusFilter === 'card_req' && g.cardMode !== 'requested') return false;
                    if (statusFilter === 'card_comp' && g.cardMode !== 'completed') return false;
                    if (statusFilter === 'cash_req' && g.cashReceiptMode !== 'requested') return false;
                    if (statusFilter === 'cash_comp' && g.cashReceiptMode !== 'completed') return false;
                    if (statusFilter === 'no_addr' && g.address) return false;
                    if (statusFilter === 'waitlist' && sum.waitItems.length === 0) return false;

                    if (!kw) return true;
                    const hay = normalizeString([
                        g.nick, g.realname, g.phone, g.address, g.trackingNumber,
                        (g.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [customerGroups, statusFilter, localSearchTerm, getGroupSummary]);

            const filteredCsGroups = useMemo(() => {
                const kw = normalizeString(csSearchTerm);
                return csGroups.filter(c => {
                    const hasMisong = (c.items || []).some(it => it.csTag === '미송');
                    const hasExRet = (c.items || []).some(it => it.csTag && it.csTag !== '정상' && it.csTag !== '미송');
                    if (csStatusFilter === 'active' && c.csStatus === '처리완료') return false;
                    if (csStatusFilter === 'misong' && (!hasMisong || c.csStatus === '처리완료')) return false;
                    if (csStatusFilter === 'exret' && (!hasExRet || c.csStatus === '처리완료')) return false;
                    if (csStatusFilter === 'completed' && c.csStatus !== '처리완료') return false;
                    if (!kw) return true;
                    const hay = normalizeString([
                        c.sourceBroadcast, c.nick, c.realname, c.phone, c.address, c.origTracking, c.csTracking, c.csMemo, c.refundAccount,
                        (c.items || []).map(it => it.product).join(' ')
                    ].join(' '));
                    return hay.includes(kw);
                });
            }, [csGroups, csSearchTerm, csStatusFilter]);

            if (!isAuthenticated) {
                return (
                    <div className="h-screen w-full bg-slate-900 flex items-center justify-center p-4 select-none">
                        <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 p-6 w-full max-w-sm text-center">
                            <div className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-3 shadow-sm">
                                <Icon name="lock-key" weight="fill" size={26} />
